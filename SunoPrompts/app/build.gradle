plugins { id 'com.android.application' }

android {
    namespace 'com.dennis.sunoprompts'
    compileSdk 35
    defaultConfig {
        applicationId 'com.dennis.sunoprompts'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '0.4.0'
    }
    buildTypes {
        release { minifyEnabled false }
        debug { debuggable true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
