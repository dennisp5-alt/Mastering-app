name: Build AutoFix True Colour Lab v0.6.0 TEST

on:
  workflow_dispatch:
  push:
    paths:
      - 'AutoFix-True-Colour-Lab-v0.6.0-TEST-GitHubBuildSource.zip'
      - '.github/workflows/build-true-colour-lab.yml'

permissions:
  contents: read

jobs:
  build:
    name: True Colour Lab v0.6.0 TEST
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="AutoFix-True-Colour-Lab-v0.6.0-TEST-GitHubBuildSource.zip"
          test -f "$ZIP" || { echo "::error::Missing $ZIP"; exit 1; }
          unzip -t "$ZIP"
          rm -rf true-colour-build
          mkdir true-colour-build
          unzip -q "$ZIP" -d true-colour-build

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="$(find true-colour-build -type f -name settings.gradle | head -n 1 || true)"
          test -n "$SETTINGS" || { echo "::error::settings.gradle not found"; exit 1; }
          PROJECT="$(dirname "$SETTINGS")"
          test -f "$PROJECT/app/build.gradle" || { echo "::error::app/build.gradle not found"; exit 1; }
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1 || true)"
          fi

          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || {
            echo "::error::sdkmanager not found in preinstalled Android SDK."
            exit 1
          }

          echo "Using SDK: $SDK"
          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Run deterministic engine tests
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x run-tests.sh
          ./run-tests.sh

      - name: Build and sign TEST APK with existing app key
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build-apk.sh
          ./build-apk.sh

      - name: Collect APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.project.outputs.project }}"
          APK="$PROJECT/release/AutoFix-True-Colour-Lab-v0.6.0-TEST.apk"
          test -f "$APK" || { echo "::error::Signed TEST APK not found"; exit 1; }

          rm -rf artifact
          mkdir artifact
          cp "$APK" artifact/AutoFix-True-Colour-Lab-v0.6.0-TEST.apk
          sha256sum artifact/AutoFix-True-Colour-Lab-v0.6.0-TEST.apk \
            > artifact/AutoFix-True-Colour-Lab-v0.6.0-TEST-SHA256.txt

          echo "Signed APK ready:"
          ls -lh artifact

      - name: Upload TEST APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoFix-True-Colour-Lab-v0.6.0-TEST
          path: |
            artifact/AutoFix-True-Colour-Lab-v0.6.0-TEST.apk
            artifact/AutoFix-True-Colour-Lab-v0.6.0-TEST-SHA256.txt
          if-no-files-found: error
          retention-days: 30
