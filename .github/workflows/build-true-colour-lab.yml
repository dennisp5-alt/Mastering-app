name: Build AutoFix True Colour Lab v0.4.0 TEST

on:
  workflow_dispatch:
  push:
    paths:
      - 'AutoFix-True-Colour-Lab-v0.4.0-TEST-source.zip'
      - '.github/workflows/build-true-colour-lab.yml'

permissions:
  contents: read

jobs:
  build:
    name: True Colour Lab v0.4.0 TEST
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP="AutoFix-True-Colour-Lab-v0.4.0-TEST-source.zip"
          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "::error::Missing $SOURCE_ZIP at repository root."
            exit 1
          fi
          unzip -t "$SOURCE_ZIP"
          echo "Source ZIP verified."

      - name: Extract True Colour Lab source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf true-colour-build
          mkdir -p true-colour-build
          unzip -q "AutoFix-True-Colour-Lab-v0.4.0-TEST-source.zip" -d true-colour-build
          echo "Source extracted."

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find true-colour-build -maxdepth 5 -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            | head -n 1 || true)"

          if [ -n "$SETTINGS" ]; then
            PROJECT="$(dirname "$SETTINGS")"
          else
            WRAPPER="$(find true-colour-build -maxdepth 5 -type f -name 'gradlew' \
              | head -n 1 || true)"
            if [ -z "$WRAPPER" ]; then
              echo "::error::No Gradle Android project found inside source ZIP."
              find true-colour-build -maxdepth 3 -type f | sort | head -n 100
              exit 1
            fi
            PROJECT="$(dirname "$WRAPPER")"
          fi

          if [ ! -f "$PROJECT/gradlew" ]; then
            echo "::error::Gradle project found at '$PROJECT' but gradlew is missing."
            exit 1
          fi

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Gradle project: $PROJECT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare Gradle wrapper
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --version

      - name: Run unit tests
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build TEST APK
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --stacktrace

      - name: Collect and rename APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.project.outputs.project }}"

          APK="$(find "$PROJECT" -type f -path '*/build/outputs/apk/debug/*.apk' \
            | head -n 1 || true)"

          if [ -z "$APK" ]; then
            echo "::error::Gradle finished but no debug APK was found."
            find "$PROJECT" -path '*/build/outputs/*' -type f -print || true
            exit 1
          fi

          rm -rf artifact
          mkdir -p artifact
          cp "$APK" "artifact/AutoFix-True-Colour-Lab-v0.4.0-TEST.apk"

          sha256sum "artifact/AutoFix-True-Colour-Lab-v0.4.0-TEST.apk" \
            > "artifact/AutoFix-True-Colour-Lab-v0.4.0-TEST-SHA256.txt"

          ls -lh artifact/

      - name: Upload TEST APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoFix-True-Colour-Lab-v0.4.0-TEST
          path: |
            artifact/AutoFix-True-Colour-Lab-v0.4.0-TEST.apk
            artifact/AutoFix-True-Colour-Lab-v0.4.0-TEST-SHA256.txt
          if-no-files-found: error
          retention-days: 30
