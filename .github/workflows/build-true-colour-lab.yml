name: Build AutoFix True Colour Lab v0.4.0 TEST

on:
  workflow_dispatch:
  push:
    paths:
      - 'AutoFix-True-Colour-Lab-v0.4.0-TEST-GitHubBuildSource.zip'
      - '.github/workflows/build-true-colour-lab.yml'

permissions:
  contents: read

jobs:
  build:
    name: True Colour Lab v0.4.0 TEST
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="AutoFix-True-Colour-Lab-v0.4.0-TEST-GitHubBuildSource.zip"
          test -f "$ZIP" || { echo "::error::Missing $ZIP"; exit 1; }
          unzip -t "$ZIP"
          rm -rf true-colour-build
          mkdir true-colour-build
          unzip -q "$ZIP" -d true-colour-build

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="$(find true-colour-build -type f -name settings.gradle | head -n 1 || true)"
          test -n "$SETTINGS" || { echo "::error::settings.gradle not found"; exit 1; }
          PROJECT="$(dirname "$SETTINGS")"
          test -f "$PROJECT/app/build.gradle" || { echo "::error::app/build.gradle not found"; exit 1; }
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Run deterministic engine tests
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x run-tests.sh
          ./run-tests.sh

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleDebug --stacktrace

      - name: Collect APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.project.outputs.project }}"
          APK="$(find "$PROJECT/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n 1 || true)"
          test -n "$APK" || { echo "::error::No debug APK found"; exit 1; }

          rm -rf artifact
          mkdir artifact
          cp "$APK" artifact/AutoFix-True-Colour-Lab-v0.4.0-TEST.apk
          sha256sum artifact/AutoFix-True-Colour-Lab-v0.4.0-TEST.apk \
            > artifact/AutoFix-True-Colour-Lab-v0.4.0-TEST-SHA256.txt
          ls -lh artifact

      - name: Upload TEST APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoFix-True-Colour-Lab-v0.4.0-TEST
          path: |
            artifact/AutoFix-True-Colour-Lab-v0.4.0-TEST.apk
            artifact/AutoFix-True-Colour-Lab-v0.4.0-TEST-SHA256.txt
          if-no-files-found: error
          retention-days: 30
