                                  0.43,
                                  0.43,
                                  0.0022,
                                  0.0022,
                                  0.0093,
                                  0.0093);

                  require(
                          !worseExcess,
                          "candidate with increased isolated fringe "
                                  + "excess must be rejected");

                  boolean cleanImprovement =
                          OpticalFringePolicy.outputSafe(
                                  0.0153,
                                  0.0045,
                                  8.2,
                                  7.9,
                                  0.064,
                                  0.064,
                                  0.010,
