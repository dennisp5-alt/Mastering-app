          echo "v0.4.20 APK and continuation notes prepared"

      - name: Upload APK and continuation notes
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMasterAI-v0.4.20-OPTICS-SAFETY-BACKGROUND
          path: |
            artifact/PhotoMasterAI-v0.4.20-OPTICS-SAFETY-BACKGROUND.apk
            artifact/PhotoMasterAI-v0.4.20-OPTICS-SAFETY-BACKGROUND-SHA256.txt
            artifact/PhotoMasterAI-v0.4.20-Notes.txt
          if-no-files-found: error
