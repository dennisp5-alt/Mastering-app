                                  0.30,
                                  0.0003,
                                  0.0003,
                                  0.0002,
                                  0.0002);

                  require(
                          cleanImprovement,
                          "clean fringe improvement should remain "
                                  + "accepted");

                  System.out.println(
                          "Optical strict-excess host checks passed");
              }

              private static void require(
                      boolean condition,
                      String message) {

                  if (!condition) {
                      throw new AssertionError(
                              message);
                  }
              }
          }
          JAVA

          rm -rf host-checks
          mkdir host-checks

          javac -d host-checks \
