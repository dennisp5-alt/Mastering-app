          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          project = Path(
              os.environ["PROJECT"]
          )

          main_file = project / (
              "app/src/main/java/com/dennis/"
              "photomasterai/MainActivity.java"
          )

          source = main_file.read_text()

          if "ProcessingKeepAliveService.start(" in source:
              raise RuntimeError(
                  "Background service start already present"
              )

          master_at = source.find(
              "PhotoMasterEngine.master("
          )

          if master_at < 0:
              raise RuntimeError(
                  "PhotoMasterEngine.master call not found"
              )

          executor_pattern = re.compile(
              r'(?m)^'
              r'(?P<indent>[ \t]*)'
              r'(?P<call>[^\n]*?'
              r'\.execute\s*'
              r'\(\s*\(\s*\)\s*->\s*\{)'
              r'[ \t]*$'
          )

          executor_matches = [
              match
              for match
              in executor_pattern.finditer(
                  source,
                  0,
                  master_at)
          ]

          if not executor_matches:
              raise RuntimeError(
                  "Processing executor containing master call "
                  "could not be located"
              )

          executor_match = (
              executor_matches[-1]
          )

          call_text = (
              executor_match.group(
                  "call")
          )

          relative_open = (
              call_text.rfind(
                  "{")
          )

          if relative_open < 0:
              raise RuntimeError(
                  "Executor opening brace not found"
              )

          open_brace = (
              executor_match.start(
                  "call")
              + relative_open
          )

          def matching_brace(
                  text,
                  opening):

              depth = 1

              i = opening + 1

              state = "normal"

              while i < len(text):

                  ch = text[i]

                  nxt = (
                      text[i + 1]
                      if i + 1 < len(text)
                      else ""
                  )

                  if state == "normal":

                      if ch == '"':
                          state = "string"

                      elif ch == "'":
                          state = "char"

                      elif ch == "/" and nxt == "/":
                          state = "line_comment"
                          i += 1

                      elif ch == "/" and nxt == "*":
                          state = "block_comment"
                          i += 1

                      elif ch == "{":
                          depth += 1

                      elif ch == "}":

                          depth -= 1

                          if depth == 0:
                              return i

                  elif state == "string":

                      if ch == "\\":
                          i += 1

                      elif ch == '"':
                          state = "normal"

                  elif state == "char":

                      if ch == "\\":
                          i += 1

                      elif ch == "'":
                          state = "normal"

                  elif state == "line_comment":

                      if ch == "\n":
                          state = "normal"

                  elif state == "block_comment":

                      if ch == "*" and nxt == "/":
                          state = "normal"
                          i += 1

                  i += 1

              raise RuntimeError(
                  "Matching executor closing brace not found"
              )

          close_brace = matching_brace(
              source,
              open_brace
          )

          if close_brace < master_at:
              raise RuntimeError(
                  "Located executor does not contain "
                  "PhotoMasterEngine.master"
              )

          executor_indent = (
              executor_match.group(
                  "indent")
          )

          inner_indent = (
              executor_indent
              + "    "
          )

          close_line_start = (
              source.rfind(
                  "\n",
                  0,
                  close_brace)
              + 1
          )

          finally_block = "\n".join([
              inner_indent + "} finally {",
              inner_indent
                      + "    ProcessingKeepAliveService.stop("
                      + "MainActivity.this);",
              inner_indent + "}",
              "",
          ])

          # Apply insertions from highest source offset to lowest
          # so original indices remain valid.

          source = (
              source[:close_line_start]
              + finally_block
              + source[close_line_start:]
          )

          try_block = (
              "\n"
              + inner_indent
              + "try {"
          )

          source = (
              source[:open_brace + 1]
              + try_block
              + source[open_brace + 1:]
          )

          start_block = "\n".join([
              executor_indent
                      + "ProcessingKeepAliveService.start("
                      + "MainActivity.this);",
              "",
          ])

          source = (
              source[:executor_match.start()]
              + start_block
              + source[executor_match.start():]
          )

          if source.count(
                  "ProcessingKeepAliveService.start("
          ) != 1:

              raise RuntimeError(
                  "Expected exactly one background-service start"
              )

          if source.count(
                  "ProcessingKeepAliveService.stop("
          ) != 1:

              raise RuntimeError(
                  "Expected exactly one background-service stop"
              )

          main_file.write_text(
              source
          )

          print(
              "Processing executor wrapped with foreground "
              "service try/finally"
          )
