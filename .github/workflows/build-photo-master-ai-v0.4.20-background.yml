name: Build Photo Master AI v0.4.20 Optics Safety + Background

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-photo-master-ai-v0.4.20-background.yml'

permissions:
  contents: read

jobs:
  build:
    name: Photo Master AI v0.4.20 Optics Safety + Background
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover exact successful v0.4.19 source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          V0419_COMMIT="6913b046380822a50bf838974a17721cfe978df9"

          git cat-file -e "${V0419_COMMIT}^{commit}" || {
            echo "::error::Successful v0.4.19 commit unavailable"
            exit 1
          }

          git show \
            "${V0419_COMMIT}:.github/workflows/build-photo-master-ai-v0.4.19-optics.yml" \
            > /tmp/v0419.yml

          python3 - <<'PY'
          from pathlib import Path

          lines = Path("/tmp/v0419.yml").read_text().splitlines()

          def extract_step(name, destination):
              step = None

              for i, line in enumerate(lines):
                  if line.strip() == "- name: " + name:
                      step = i
                      break

              if step is None:
                  raise RuntimeError(
                      "Workflow step not found: " + name
                  )

              run = None

              for i in range(step, len(lines)):
                  if lines[i].strip() == "run: |":
                      run = i
                      break

                  if (
                      i > step
                      and lines[i].startswith("      - name:")
                  ):
                      break

              if run is None:
                  raise RuntimeError(
                      "Run block not found: " + name
                  )

              body = []

              for line in lines[run + 1:]:
                  if line.startswith("      - name:"):
                      break

                  if not line.strip():
                      body.append("")

                  elif line.startswith("          "):
                      body.append(line[10:])

                  else:
                      raise RuntimeError(
                          "Unexpected indentation while extracting: "
                          + name
                      )

              Path(destination).write_text(
                  "\n".join(body) + "\n"
              )

          extract_step(
              "Recover exact successful v0.4.18 integrity source",
              "/tmp/recover-v0418.sh"
          )

          extract_step(
              "Apply v0.4.19 optics fringe guard",
              "/tmp/apply-v0419.sh"
          )

          print(
              "Extracted successful v0.4.19 source construction"
          )
          PY

          bash /tmp/recover-v0418.sh

          PROJECT="$(
            find photomaster-v044-build \
              -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -printf '%h\n' \
              | head -n 1
          )"

          test -n "$PROJECT" || {
            echo "::error::Recovered project not found"
            exit 1
          }

          export PROJECT

          bash /tmp/apply-v0419.sh

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          grep -q \
            "versionCode 28" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "versionName '0.4.19'" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "class OpticalFringePolicy" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/OpticalFringePolicy.java"

          grep -q \
            "class OpticalDefectRepair" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/OpticalDefectRepair.java"

          grep -q \
            "class NeuralIntegrityGuard" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralIntegrityGuard.java"

          grep -q \
            "Final shadow-integrity guard: ROLLBACK" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

          echo "Exact successful v0.4.19 source recovered"

      - name: Apply v0.4.20 optics safety and background support
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          project = Path(
              os.environ["PROJECT"]
          )

          # =====================================================
          # VERSION
          # =====================================================

          build_file = (
              project / "app/build.gradle"
          )

          build = build_file.read_text()

          if "versionCode 28" not in build:
              raise RuntimeError(
                  "v0.4.19 versionCode not found"
              )

          if "versionName '0.4.19'" not in build:
              raise RuntimeError(
                  "v0.4.19 versionName not found"
              )

          build = build.replace(
              "versionCode 28",
              "versionCode 29",
              1
          )

          build = build.replace(
              "versionName '0.4.19'",
              "versionName '0.4.20'",
              1
          )

          build_file.write_text(build)

          # =====================================================
          # OPTICAL QC:
          # ISOLATED FRINGE EXCESS MUST NOT INCREASE
          # =====================================================

          policy_file = project / (
              "app/src/main/java/com/dennis/"
              "photomasterai/OpticalFringePolicy.java"
          )

          policy = policy_file.read_text()

          detail_anchor = (
              "                  double detailLossAllowance ="
          )

          excess_guard = "\n".join([
              "                  boolean excessSafe =",
              "                          meanExcessAfter",
              "                                  <= meanExcessBefore + 1.0e-9;",
              "",
              "                  double detailLossAllowance =",
          ])

          if detail_anchor not in policy:
              raise RuntimeError(
                  "Optical excess-safety insertion anchor not found"
              )

          policy = policy.replace(
              detail_anchor,
              excess_guard,
              1
          )

          old_return = "\n".join([
              "                  return fringeImproved",
              "                          && detailSafe",
          ])

          new_return = "\n".join([
              "                  return fringeImproved",
              "                          && excessSafe",
              "                          && detailSafe",
          ])

          if old_return not in policy:
              raise RuntimeError(
                  "Optical outputSafe return anchor not found"
              )

          policy = policy.replace(
              old_return,
              new_return,
              1
          )

          policy_file.write_text(policy)

          # =====================================================
          # OPTICS ARGB_8888 NORMALISATION
          # =====================================================

          repair_file = project / (
              "app/src/main/java/com/dennis/"
              "photomasterai/OpticalDefectRepair.java"
          )

          repair = repair_file.read_text()

          old_config_guard = "\n".join([
              "                  if (source.getConfig()",
              "                          != Bitmap.Config.ARGB_8888) {",
              "",
              "                      return new Result(",
              "                              source,",
              "                              sourceAnalysis,",
              "                              false,",
              "                              false,",
              "                              \"• CA/fringe correction withheld — \"",
              "                                      + \"working bitmap is not ARGB_8888\");",
              "                  }",
              "",
              "                  int width = source.getWidth();",
              "                  int height = source.getHeight();",
          ])

          new_config_guard = "\n".join([
              "                  Bitmap opticsSource = source;",
              "                  boolean temporaryArgbSource = false;",
              "",
              "                  if (source.getConfig()",
              "                          != Bitmap.Config.ARGB_8888) {",
              "",
              "                      opticsSource =",
              "                              source.copy(",
              "                                      Bitmap.Config.ARGB_8888,",
              "                                      false);",
              "",
              "                      if (opticsSource == null) {",
              "",
              "                          return new Result(",
              "                                  source,",
              "                                  sourceAnalysis,",
              "                                  false,",
              "                                  false,",
              "                                  \"• CA/fringe scan unavailable — \"",
              "                                          + \"ARGB_8888 working copy could not be created\");",
              "                      }",
              "",
              "                      temporaryArgbSource = true;",
              "                  }",
              "",
              "                  final String formatNote =",
              "                          temporaryArgbSource",
              "                                  ? \"\\n• Optics analysis used temporary ARGB_8888 working copy; source checkpoint preserved\"",
              "                                  : \"\";",
              "",
              "                  try {",
              "",
              "                  int width = opticsSource.getWidth();",
              "                  int height = opticsSource.getHeight();",
          ])

          if old_config_guard not in repair:
              raise RuntimeError(
                  "ARGB_8888 optics guard anchor not found"
              )

          repair = repair.replace(
              old_config_guard,
              new_config_guard,
              1
          )

          source_pixels = "\n".join([
              "                  source.getPixels(",
              "                          pixels,",
          ])

          optics_pixels = "\n".join([
              "                  opticsSource.getPixels(",
              "                          pixels,",
          ])

          source_pixels_count = repair.count(
              source_pixels
          )

          if source_pixels_count != 1:
              raise RuntimeError(
                  "Expected one initial source.getPixels anchor, found "
                  + str(source_pixels_count)
              )

          repair = repair.replace(
              source_pixels,
              optics_pixels,
              1
          )

          old_candidate = "\n".join([
              "                  Bitmap candidate =",
              "                          source.copy(",
              "                                  Bitmap.Config.ARGB_8888,",
              "                                  true);",
          ])

          new_candidate = "\n".join([
              "                  Bitmap candidate =",
              "                          opticsSource.copy(",
              "                                  Bitmap.Config.ARGB_8888,",
              "                                  true);",
          ])

          if old_candidate not in repair:
              raise RuntimeError(
                  "Optics candidate-copy anchor not found"
              )

          repair = repair.replace(
              old_candidate,
              new_candidate,
              1
          )

          no_evidence = "\n".join([
              "                      return new Result(",
              "                              source,",
              "                              sourceAnalysis,",
              "                              false,",
              "                              false,",
              "                              report);",
          ])

          no_evidence_new = "\n".join([
              "                      return new Result(",
              "                              source,",
              "                              sourceAnalysis,",
              "                              false,",
              "                              false,",
              "                              report + formatNote);",
          ])

          if no_evidence not in repair:
              raise RuntimeError(
                  "No-evidence optics report anchor not found"
              )

          repair = repair.replace(
              no_evidence,
              no_evidence_new,
              1
          )

          rollback_tail = "\n".join([
              "                              \"• CA/fringe candidate: ROLLED BACK — \"",
              "                                      + \"optical QC did not confirm a safe improvement\\n\"",
              "                                      + metrics",
              "                                      + \"\\n• Original mastered pixels retained\");",
          ])

          rollback_tail_new = "\n".join([
              "                              \"• CA/fringe candidate: ROLLED BACK — \"",
              "                                      + \"optical QC did not confirm a safe improvement\\n\"",
              "                                      + metrics",
              "                                      + \"\\n• Original mastered pixels retained\"",
              "                                      + formatNote);",
          ])

          if rollback_tail not in repair:
              raise RuntimeError(
                  "Optics rollback report anchor not found"
              )

          repair = repair.replace(
              rollback_tail,
              rollback_tail_new,
              1
          )

          final_tail = "\n".join([
              "                  return new Result(",
              "                          candidate,",
              "                          candidateAnalysis,",
              "                          true,",
              "                          true,",
              "                          \"• Chromatic-aberration / colour-fringe repair: APPLIED\\n\"",
              "                                  + metrics",
              "                                  + \"\\n• Optical QC: ACCEPTED\");",
              "              }",
              "",
              "              private static FringeStats measure(",
          ])

          final_tail_new = "\n".join([
              "                  return new Result(",
              "                          candidate,",
              "                          candidateAnalysis,",
              "                          true,",
              "                          true,",
              "                          \"• Chromatic-aberration / colour-fringe repair: APPLIED\\n\"",
              "                                  + metrics",
              "                                  + \"\\n• Optical QC: ACCEPTED\"",
              "                                  + formatNote);",
              "",
              "                  } finally {",
              "",
              "                      if (temporaryArgbSource",
              "                              && opticsSource != null",
              "                              && !opticsSource.isRecycled()) {",
              "",
              "                          opticsSource.recycle();",
              "                      }",
              "                  }",
              "              }",
              "",
              "              private static FringeStats measure(",
          ])

          if final_tail not in repair:
              raise RuntimeError(
                  "Optics final-return anchor not found"
              )

          repair = repair.replace(
              final_tail,
              final_tail_new,
              1
          )

          repair_file.write_text(repair)

          # =====================================================
          # BACKGROUND PROCESSING FOREGROUND SERVICE
          # =====================================================

          service_file = project / (
              "app/src/main/java/com/dennis/"
              "photomasterai/ProcessingKeepAliveService.java"
          )

          service_file.write_text(
          """package com.dennis.photomasterai;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;

          public final class ProcessingKeepAliveService
                  extends Service {

              private static final String CHANNEL_ID =
                      "photo_master_processing";

              private static final int NOTIFICATION_ID =
                      42020;

              private static final long MAX_RUNTIME_MS =
                      12L * 60L * 1000L;

              private final Handler handler =
                      new Handler(
                              Looper.getMainLooper());

              private final Runnable timeoutStop =
                      this::stopSelf;

              private PowerManager.WakeLock wakeLock;

              public static void start(
                      Context context) {

                  if (context == null) {
                      return;
                  }

                  Intent intent =
                          new Intent(
                                  context,
                                  ProcessingKeepAliveService.class);

                  if (Build.VERSION.SDK_INT
                          >= Build.VERSION_CODES.O) {

                      context.startForegroundService(
                              intent);

                  } else {

                      context.startService(
                              intent);
                  }
              }

              public static void stop(
                      Context context) {

                  if (context == null) {
                      return;
                  }

                  context.stopService(
                          new Intent(
                                  context,
                                  ProcessingKeepAliveService.class));
              }

              @Override
              public void onCreate() {

                  super.onCreate();

                  ensureNotificationChannel();
              }

              @Override
              public int onStartCommand(
                      Intent intent,
                      int flags,
                      int startId) {

                  startForeground(
                          NOTIFICATION_ID,
                          buildNotification());

                  acquireWakeLock();

                  handler.removeCallbacks(
                          timeoutStop);

                  handler.postDelayed(
                          timeoutStop,
                          MAX_RUNTIME_MS);

                  return START_NOT_STICKY;
              }

              private void acquireWakeLock() {

                  if (wakeLock != null
                          && wakeLock.isHeld()) {

                      return;
                  }

                  PowerManager manager =
                          (PowerManager)
                                  getSystemService(
                                          POWER_SERVICE);

                  if (manager == null) {
                      return;
                  }

                  wakeLock =
                          manager.newWakeLock(
                                  PowerManager.PARTIAL_WAKE_LOCK,
                                  "PhotoMasterAI:Processing");

                  wakeLock.setReferenceCounted(
                          false);

                  wakeLock.acquire(
                          MAX_RUNTIME_MS);
              }

              private void ensureNotificationChannel() {

                  if (Build.VERSION.SDK_INT
                          < Build.VERSION_CODES.O) {

                      return;
                  }

                  NotificationManager manager =
                          getSystemService(
                                  NotificationManager.class);

                  if (manager == null) {
                      return;
                  }

                  NotificationChannel channel =
                          new NotificationChannel(
                                  CHANNEL_ID,
                                  "Photo processing",
                                  NotificationManager.IMPORTANCE_LOW);

                  channel.setDescription(
                          "Keeps Photo Master AI processing active "
                                  + "while the app is in the background.");

                  manager.createNotificationChannel(
                          channel);
              }

              private Notification buildNotification() {

                  Intent launchIntent =
                          new Intent(
                                  this,
                                  MainActivity.class);

                  launchIntent.addFlags(
                          Intent.FLAG_ACTIVITY_SINGLE_TOP);

                  PendingIntent pendingIntent =
                          PendingIntent.getActivity(
                                  this,
                                  0,
                                  launchIntent,
                                  PendingIntent.FLAG_UPDATE_CURRENT
                                          | PendingIntent.FLAG_IMMUTABLE);

                  Notification.Builder builder =
                          Build.VERSION.SDK_INT
                                  >= Build.VERSION_CODES.O
                                  ? new Notification.Builder(
                                          this,
                                          CHANNEL_ID)
                                  : new Notification.Builder(
                                          this);

                  return builder
                          .setSmallIcon(
                                  android.R.drawable.ic_menu_gallery)
                          .setContentTitle(
                                  "Photo Master AI is processing")
                          .setContentText(
                                  "Background processing protected")
                          .setContentIntent(
                                  pendingIntent)
                          .setOngoing(
                                  true)
                          .setOnlyAlertOnce(
                                  true)
                          .setCategory(
                                  Notification.CATEGORY_PROGRESS)
                          .build();
              }

              @Override
              public void onDestroy() {

                  handler.removeCallbacks(
                          timeoutStop);

                  if (wakeLock != null
                          && wakeLock.isHeld()) {

                      wakeLock.release();
                  }

                  wakeLock = null;

                  if (Build.VERSION.SDK_INT
                          >= Build.VERSION_CODES.N) {

                      stopForeground(
                              STOP_FOREGROUND_REMOVE);

                  } else {

                      stopForeground(
                              true);
                  }

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(
                      Intent intent) {

                  return null;
              }
          }
          """)

          # =====================================================
          # MANIFEST
          # =====================================================

          manifest_file = (
              project
              / "app/src/main/AndroidManifest.xml"
          )

          manifest = manifest_file.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />',
              '<uses-permission android:name="android.permission.WAKE_LOCK" />',
          ]

          app_at = manifest.find(
              "<application"
          )

          if app_at < 0:
              raise RuntimeError(
                  "Manifest application element not found"
              )

          missing = [
              permission
              for permission in permissions
              if permission not in manifest
          ]

          if missing:

              manifest = (
                  manifest[:app_at]
                  + "\n".join(missing)
                  + "\n\n    "
                  + manifest[app_at:]
              )

          service_decl = """        <service
              android:name=".ProcessingKeepAliveService"
              android:exported="false"
              android:stopWithTask="false"
              android:foregroundServiceType="dataSync" />
          """

          if ".ProcessingKeepAliveService" not in manifest:

              close_at = manifest.rfind(
                  "</application>"
              )

              if close_at < 0:
                  raise RuntimeError(
                      "Manifest application closing element not found"
                  )

              manifest = (
                  manifest[:close_at]
                  + service_decl
                  + manifest[close_at:]
              )

          manifest_file.write_text(
              manifest
          )

          # =====================================================
          # MAIN ACTIVITY:
          # START FOREGROUND SERVICE BEFORE PROCESSING,
          # STOP AFTER RESULT IS COMMITTED
          # =====================================================

          main_file = project / (
              "app/src/main/java/com/dennis/"
              "photomasterai/MainActivity.java"
          )

          main = main_file.read_text()

          master_at = main.find(
              "PhotoMasterEngine.master("
          )

          if master_at < 0:
              raise RuntimeError(
                  "PhotoMasterEngine.master call not found"
              )

          execute_pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*).*'
              r'\.execute\(\(\) -> \{\s*$'
          )

          execute_matches = [
              match
              for match
              in execute_pattern.finditer(
                  main,
                  0,
                  master_at)
          ]

          if not execute_matches:
              raise RuntimeError(
                  "Processing executor launch anchor not found"
              )

          execute_match = (
              execute_matches[-1]
          )

          start_indent = (
              execute_match.group(
                  "indent")
          )

          start_line = (
              start_indent
              + "ProcessingKeepAliveService.start("
              + "MainActivity.this);\n\n"
          )

          main = (
              main[:execute_match.start()]
              + start_line
              + main[execute_match.start():]
          )

          master_at = main.find(
              "PhotoMasterEngine.master("
          )

          commit_pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)'
              r'masterBitmap\s*=\s*result\.bitmap;\s*$'
          )

          commit_match = (
              commit_pattern.search(
                  main,
                  master_at)
          )

          if commit_match is None:
              raise RuntimeError(
                  "masterBitmap result commit anchor not found"
              )

          stop_indent = (
              commit_match.group(
                  "indent")
          )

          stop_line = (
              "\n"
              + stop_indent
              + "ProcessingKeepAliveService.stop("
              + "MainActivity.this);"
          )

          main = (
              main[:commit_match.end()]
              + stop_line
              + main[commit_match.end():]
          )

          main_file.write_text(
              main
          )

          print(
              "v0.4.20 optics safety + background support applied"
          )
          PY

          grep -q \
            "versionCode 29" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "versionName '0.4.20'" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "boolean excessSafe" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/OpticalFringePolicy.java"

          grep -q \
            "temporaryArgbSource" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/OpticalDefectRepair.java"

          grep -q \
            "Optics analysis used temporary ARGB_8888 working copy" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/OpticalDefectRepair.java"

          grep -q \
            "class ProcessingKeepAliveService" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/ProcessingKeepAliveService.java"

          grep -q \
            "FOREGROUND_SERVICE_DATA_SYNC" \
            "$PROJECT/app/src/main/AndroidManifest.xml"

          grep -q \
            'android:foregroundServiceType="dataSync"' \
            "$PROJECT/app/src/main/AndroidManifest.xml"

          grep -q \
            "ProcessingKeepAliveService.start" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

          grep -q \
            "ProcessingKeepAliveService.stop" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

          # Frozen neural/integrity baseline checks.
          grep -q \
            "localized tile/shadow integrity failure" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

          grep -q \
            "Final shadow-integrity guard: ROLLBACK" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

          grep -q \
            "ring allowance +0.025" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "GpuBackend.OPENCL" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiserRuntime.kt"

          if grep -q \
            "new NeuralDenoiserRuntime(context, true)" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"
          then
            echo "::error::CPU neural fallback detected"
            exit 1
          fi

          echo "v0.4.20 source verification passed"

      - name: Fetch pinned NAFNet-SIDD model
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"
          ASSETS="$PROJECT/app/src/main/assets"
          MODEL="$ASSETS/nafnet_sidd_width32_fp16.tflite"

          mkdir -p "$ASSETS"

          URL='https://huggingface.co/litert-community/NAFNet-SIDD-width32-LiteRT/resolve/main/nafnet_sidd_width32_fp16.tflite?download=true'

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --output "$MODEL.tmp" \
            "$URL"

          mv "$MODEL.tmp" "$MODEL"

          test "$(stat -c%s "$MODEL")" -eq 62454048 || {
            echo "::error::Unexpected NAFNet model size"
            exit 1
          }

          echo \
          'f8fbaa422411683c53e802cf7cc7cf9be0a0de00886ad4af057232e26b172a0c  '"$MODEL" \
          | sha256sum -c -

          echo "Pinned NAFNet-SIDD model verified"

      - name: Set up Java 17
