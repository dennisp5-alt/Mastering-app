          cat > \
          tools/OpticalStrictExcessHostChecks.java \
          <<'JAVA'
          package com.dennis.photomasterai;

          public final class OpticalStrictExcessHostChecks {

              public static void main(String[] args) {

                  boolean worseExcess =
                          OpticalFringePolicy.outputSafe(
                                  0.0190,
                                  0.0093,
                                  8.7,
                                  9.1,
                                  0.064,
                                  0.064,
                                  0.010,
                                  0.010,
                                  0.022,
