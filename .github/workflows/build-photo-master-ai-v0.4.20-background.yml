          - FP32 neural runtime
          - no CPU neural fallback
          - 8-second per-tile hard guard
          - 90-second soft total warning
          - 240-second hard neural limit
          - adaptive neural blend
          - smooth-scene 5% high-ring cap
          - smooth ring allowance +0.025
          - authoritative-original checkpoint
          - v0.4.18 local neural-integrity guard
          - v0.4.18 final shadow-integrity rollback
          - v0.4.19 optics maximum channel delta 10/255
          - v0.4.19 optics correction-density ceiling 1.50%

          v0.4.20 OPTICS SAFETY

          Isolated fringe severity must not increase.

