          cat > \
          "$PROJECT/app/src/main/java/com/dennis/photomasterai/ProcessingKeepAliveService.java" \
          <<'JAVA'
          package com.dennis.photomasterai;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;

          public final class ProcessingKeepAliveService
                  extends Service {

              private static final String CHANNEL_ID =
                      "photo_master_processing";

              private static final int NOTIFICATION_ID =
                      42020;

              private static final long MAX_RUNTIME_MS =
                      12L
                              * 60L
                              * 1000L;

              private final Handler handler =
                      new Handler(
                              Looper.getMainLooper());

              private final Runnable timeoutStop =
                      this::stopSelf;

              private PowerManager.WakeLock wakeLock;

              public static void start(
                      Context context) {

                  if (context == null) {
                      return;
                  }

                  try {

                      Intent intent =
                              new Intent(
                                      context,
                                      ProcessingKeepAliveService.class);

                      if (Build.VERSION.SDK_INT
                              >= Build.VERSION_CODES.O) {

                          context.startForegroundService(
                                  intent);

                      } else {

                          context.startService(
                                  intent);
                      }

                  } catch (RuntimeException ignored) {
                  }
              }

              public static void stop(
                      Context context) {

                  if (context == null) {
                      return;
                  }

                  try {

                      context.stopService(
                              new Intent(
                                      context,
                                      ProcessingKeepAliveService.class));

                  } catch (RuntimeException ignored) {
                  }
              }

              @Override
              public void onCreate() {

                  super.onCreate();

                  ensureNotificationChannel();
              }

              @Override
              public int onStartCommand(
                      Intent intent,
                      int flags,
                      int startId) {

                  startForeground(
                          NOTIFICATION_ID,
                          buildNotification());

                  acquireWakeLock();

                  handler.removeCallbacks(
                          timeoutStop);

                  handler.postDelayed(
                          timeoutStop,
                          MAX_RUNTIME_MS);

                  return START_NOT_STICKY;
              }

              private void acquireWakeLock() {

                  if (wakeLock != null
                          && wakeLock.isHeld()) {
                      return;
                  }

                  PowerManager manager =
                          (PowerManager)
                                  getSystemService(
                                          POWER_SERVICE);

                  if (manager == null) {
                      return;
                  }

                  wakeLock =
                          manager.newWakeLock(
                                  PowerManager.PARTIAL_WAKE_LOCK,
                                  "PhotoMasterAI:Processing");

                  wakeLock.setReferenceCounted(
                          false);

                  wakeLock.acquire(
                          MAX_RUNTIME_MS);
              }

              private void ensureNotificationChannel() {

                  if (Build.VERSION.SDK_INT
                          < Build.VERSION_CODES.O) {
                      return;
                  }

                  NotificationManager manager =
                          getSystemService(
                                  NotificationManager.class);

                  if (manager == null) {
                      return;
                  }

                  NotificationChannel channel =
                          new NotificationChannel(
                                  CHANNEL_ID,
                                  "Photo processing",
                                  NotificationManager.IMPORTANCE_LOW);

                  channel.setDescription(
                          "Keeps Photo Master AI processing "
                                  + "while the app is in the background.");

                  manager.createNotificationChannel(
                          channel);
              }

              private Notification buildNotification() {

                  Intent launchIntent =
                          new Intent(
                                  this,
                                  MainActivity.class);

                  launchIntent.addFlags(
                          Intent.FLAG_ACTIVITY_SINGLE_TOP);

                  PendingIntent pendingIntent =
                          PendingIntent.getActivity(
                                  this,
                                  0,
                                  launchIntent,
                                  PendingIntent.FLAG_UPDATE_CURRENT
                                          | PendingIntent.FLAG_IMMUTABLE);

                  Notification.Builder builder =
                          Build.VERSION.SDK_INT
                                  >= Build.VERSION_CODES.O
                                  ? new Notification.Builder(
                                          this,
                                          CHANNEL_ID)
                                  : new Notification.Builder(
                                          this);

                  return builder
                          .setSmallIcon(
                                  android.R.drawable.ic_menu_gallery)
                          .setContentTitle(
                                  "Photo Master AI is processing")
                          .setContentText(
                                  "Background processing active")
                          .setContentIntent(
                                  pendingIntent)
                          .setOnlyAlertOnce(
                                  true)
                          .setOngoing(
                                  true)
                          .setCategory(
                                  Notification.CATEGORY_PROGRESS)
                          .build();
              }

              @Override
              public void onDestroy() {

                  handler.removeCallbacks(
                          timeoutStop);

                  if (wakeLock != null
                          && wakeLock.isHeld()) {

                      wakeLock.release();
                  }

                  wakeLock =
                          null;

                  if (Build.VERSION.SDK_INT
                          >= Build.VERSION_CODES.N) {

                      stopForeground(
                              STOP_FOREGROUND_REMOVE);

                  } else {

                      stopForeground(
                              true);
                  }

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(
                      Intent intent) {

                  return null;
              }
          }
