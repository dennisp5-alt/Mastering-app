name: Build Photo Master AI v0.4.20 Optics Safety + Background

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-photo-master-ai-v0.4.20-background.yml'

permissions:
  contents: read

jobs:
  build:
    name: Photo Master AI v0.4.20 Optics Safety + Background
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover exact successful v0.4.19 source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          V0419_COMMIT="6913b046380822a50bf838974a17721cfe978df9"

          git cat-file -e "${V0419_COMMIT}^{commit}" || {
            echo "::error::Successful v0.4.19 commit unavailable"
            exit 1
          }

          git show \
            "${V0419_COMMIT}:.github/workflows/build-photo-master-ai-v0.4.19-optics.yml" \
            > /tmp/v0419.yml

          python3 - <<'PY'
          from pathlib import Path

          lines = Path(
              "/tmp/v0419.yml"
          ).read_text().splitlines()

          def extract_step(name, destination):

              step = None

              for i, line in enumerate(lines):
                  if line.strip() == "- name: " + name:
                      step = i
                      break

              if step is None:
                  raise RuntimeError(
                      "Workflow step not found: " + name
                  )

              run = None

              for i in range(step, len(lines)):

                  if lines[i].strip() == "run: |":
                      run = i
                      break

                  if (
                      i > step
                      and lines[i].startswith("      - name:")
                  ):
                      break

              if run is None:
                  raise RuntimeError(
                      "Run block not found: " + name
                  )

              body = []

              for line in lines[run + 1:]:

                  if line.startswith("      - name:"):
                      break

                  if not line.strip():
                      body.append("")

                  elif line.startswith("          "):
                      body.append(
                          line[10:]
                      )

                  else:
                      raise RuntimeError(
                          "Unexpected indentation while extracting: "
                          + name
                      )

              Path(
                  destination
              ).write_text(
                  "\n".join(body)
                  + "\n"
              )

          extract_step(
              "Recover exact successful v0.4.18 integrity source",
              "/tmp/recover-v0418.sh"
          )

          extract_step(
              "Apply v0.4.19 optics fringe guard",
              "/tmp/apply-v0419.sh"
          )

          print(
              "Extracted successful v0.4.19 source construction"
          )
          PY

          bash /tmp/recover-v0418.sh

          PROJECT="$(
            find photomaster-v044-build \
              -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -printf '%h\n' \
              | head -n 1
          )"

          test -n "$PROJECT" || {
            echo "::error::Recovered project not found"
            exit 1
          }

          export PROJECT

          bash /tmp/apply-v0419.sh

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          grep -q \
            "versionCode 28" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "versionName '0.4.19'" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "class OpticalFringePolicy" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/OpticalFringePolicy.java"

          grep -q \
            "class OpticalDefectRepair" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/OpticalDefectRepair.java"

          grep -q \
            "class NeuralIntegrityGuard" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralIntegrityGuard.java"

          grep -q \
            "Final shadow-integrity guard: ROLLBACK" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

          grep -q \
            "GpuBackend.OPENCL" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiserRuntime.kt"

          echo "Exact successful v0.4.19 source recovered"

      - name: Apply v0.4.20 optics safety and background support
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail

          # =====================================================
          # VERSION
          # =====================================================

          python3 - <<'PY'
          from pathlib import Path
          import os

          project = Path(
              os.environ["PROJECT"]
          )

          build_file = (
              project
              / "app/build.gradle"
          )

          build = build_file.read_text()

          if "versionCode 28" not in build:
              raise RuntimeError(
                  "v0.4.19 versionCode not found"
              )

          if "versionName '0.4.19'" not in build:
              raise RuntimeError(
                  "v0.4.19 versionName not found"
              )

          build = build.replace(
              "versionCode 28",
              "versionCode 29",
              1
          )

          build = build.replace(
              "versionName '0.4.19'",
              "versionName '0.4.20'",
              1
          )

          build_file.write_text(
              build
          )

          print(
              "Version promoted to v0.4.20 / code 29"
          )
          PY

          # =====================================================
          # COMPLETE v0.4.20 OPTICAL POLICY
          # =====================================================

          cat > \
          "$PROJECT/app/src/main/java/com/dennis/photomasterai/OpticalFringePolicy.java" \
          <<'JAVA'
          package com.dennis.photomasterai;

          public final class OpticalFringePolicy {

              private OpticalFringePolicy() {
              }

              public static boolean shouldActivate(
                      int edgeSamples,
                      int fringeSamples,
                      double meanExcess,
                      double fringeRatio) {

                  if (edgeSamples < 200) {
                      return false;
                  }

                  if (fringeSamples < 24) {
                      return false;
                  }

                  if (fringeRatio < 0.004) {
                      return false;
                  }

                  /*
                   * Very large ratios are more likely to be
                   * legitimate saturated/stylised colour than
                   * narrow optical chromatic aberration.
                   */
                  if (fringeRatio > 0.18) {
                      return false;
                  }

                  return meanExcess >= 7.0;
              }

              public static double correctionStrength(
                      double excess,
                      double radius) {

                  double severity =
                          clamp(
                                  (excess - 7.0) / 45.0,
                                  0.0,
                                  1.0);

                  double radial =
                          clamp(
                                  radius,
                                  0.0,
                                  1.0);

                  double strength =
                          (0.24 + 0.20 * severity)
                                  * (0.82 + 0.18 * radial);

                  return clamp(
                          strength,
                          0.18,
                          0.44);
              }

              public static boolean outputSafe(
                      double fringeRatioBefore,
                      double fringeRatioAfter,
                      double meanExcessBefore,
                      double meanExcessAfter,
                      double detailBefore,
                      double detailAfter,
                      double noiseBefore,
                      double noiseAfter,
                      double chromaBefore,
                      double chromaAfter,
                      double ringingBefore,
                      double ringingAfter,
                      double medianBefore,
                      double medianAfter,
                      double satBefore,
                      double satAfter,
                      double shadowClipBefore,
                      double shadowClipAfter,
                      double highlightClipBefore,
                      double highlightClipAfter) {

                  if (fringeRatioBefore <= 0.0) {
                      return false;
                  }

                  boolean fringeImproved =
                          fringeRatioAfter
                                  <= fringeRatioBefore * 0.94
                                  || meanExcessAfter
                                  <= meanExcessBefore * 0.90;

                  /*
                   * v0.4.20:
                   *
                   * Overall fringe area is not sufficient.
                   *
                   * Isolated fringe severity must also stay
                   * flat or improve.
                   */
                  boolean excessSafe =
                          meanExcessAfter
                                  <= meanExcessBefore
                                  + 1.0e-9;

                  double detailLossAllowance =
                          Math.max(
                                  0.0015,
                                  detailBefore * 0.025);

                  boolean detailSafe =
                          detailAfter
                                  >= detailBefore
                                  - detailLossAllowance;

                  boolean noiseSafe =
                          noiseAfter
                                  <= noiseBefore
                                  + 0.0008;

                  boolean chromaSafe =
                          chromaAfter
                                  <= chromaBefore
                                  + 0.0010;

                  boolean ringingSafe =
                          ringingAfter
                                  <= Math.min(
                                          1.0,
                                          ringingBefore
                                                  + 0.0105);

                  boolean medianSafe =
                          Math.abs(
                                  medianAfter
                                          - medianBefore)
                                  <= 0.004;

                  boolean saturationSafe =
                          Math.abs(
                                  satAfter
                                          - satBefore)
                                  <= 0.010;

                  boolean shadowSafe =
                          shadowClipAfter
                                  <= shadowClipBefore
                                  + 0.002;

                  boolean highlightSafe =
                          highlightClipAfter
                                  <= highlightClipBefore
                                  + 0.002;

                  return fringeImproved
                          && excessSafe
                          && detailSafe
                          && noiseSafe
                          && chromaSafe
                          && ringingSafe
                          && medianSafe
                          && saturationSafe
                          && shadowSafe
                          && highlightSafe;
              }

              private static double clamp(
                      double value,
                      double minimum,
                      double maximum) {

                  return Math.max(
                          minimum,
                          Math.min(
                                  maximum,
                                  value));
              }
          }
          JAVA

          # =====================================================
          # COMPLETE v0.4.20 OPTICAL REPAIR
          # =====================================================

          cat > \
          "$PROJECT/app/src/main/java/com/dennis/photomasterai/OpticalDefectRepair.java" \
          <<'JAVA'
          package com.dennis.photomasterai;

          import android.graphics.Bitmap;
          import android.graphics.Color;

          import java.util.Locale;

          public final class OpticalDefectRepair {

              private static final int EDGE_THRESHOLD =
                      24;

              private static final double MIN_RADIUS =
                      0.22;

              private static final int EDGE_FRINGE_THRESHOLD =
                      18;

              private static final int CENTRE_EXTRA_THRESHOLD =
                      8;

              private static final double MIN_ISOLATED_EXCESS =
                      7.0;

              private static final int MAX_CHANNEL_DELTA =
                      10;

              private static final double MAX_CORRECTED_FRACTION =
                      0.015;

              private OpticalDefectRepair() {
              }

              public static final class Result {

                  public final Bitmap bitmap;

                  public final PhotoAnalysis analysis;

                  public final boolean attempted;

                  public final boolean accepted;

                  public final String report;

                  Result(
                          Bitmap bitmap,
                          PhotoAnalysis analysis,
                          boolean attempted,
                          boolean accepted,
                          String report) {

                      this.bitmap =
                              bitmap;

                      this.analysis =
                              analysis;

                      this.attempted =
                              attempted;

                      this.accepted =
                              accepted;

                      this.report =
                              report;
                  }
              }

              private static final class FringeStats {

                  final int edgeSamples;

                  final int fringeSamples;

                  final double ratio;

                  final double meanExcess;

                  FringeStats(
                          int edgeSamples,
                          int fringeSamples,
                          double ratio,
                          double meanExcess) {

                      this.edgeSamples =
                              edgeSamples;

                      this.fringeSamples =
                              fringeSamples;

                      this.ratio =
                              ratio;

                      this.meanExcess =
                              meanExcess;
                  }
              }

              public static Result apply(
                      Bitmap source,
                      PhotoAnalysis sourceAnalysis) {

                  if (source == null
                          || source.isRecycled()
                          || sourceAnalysis == null) {

                      return new Result(
                              source,
                              sourceAnalysis,
                              false,
                              false,
                              "• CA/fringe scan unavailable");
                  }

                  Bitmap opticsSource =
                          source;

                  boolean temporaryArgbSource =
                          false;

                  if (source.getConfig()
                          != Bitmap.Config.ARGB_8888) {

                      opticsSource =
                              source.copy(
                                      Bitmap.Config.ARGB_8888,
                                      false);

                      if (opticsSource == null) {

                          return new Result(
                                  source,
                                  sourceAnalysis,
                                  false,
                                  false,
                                  "• CA/fringe scan unavailable — "
                                          + "ARGB_8888 working copy "
                                          + "could not be created");
                      }

                      temporaryArgbSource =
                              true;
                  }

                  final String formatNote =
                          temporaryArgbSource
                                  ? "\n• Optics analysis used temporary "
                                          + "ARGB_8888 working copy; "
                                          + "source checkpoint preserved"
                                  : "";

                  try {

                      PhotoAnalysis opticsBaselineAnalysis =
                              temporaryArgbSource
                                      ? PhotoAnalysis.analyse(
                                              opticsSource)
                                      : sourceAnalysis;

                      int width =
                              opticsSource.getWidth();

                      int height =
                              opticsSource.getHeight();

                      if (width < 64
                              || height < 64) {

                          return new Result(
                                  source,
                                  sourceAnalysis,
                                  false,
                                  false,
                                  "• CA/fringe scan withheld — "
                                          + "image too small for reliable "
                                          + "optics analysis"
                                          + formatNote);
                      }

                      long pixelCountLong =
                              (long) width
                                      * (long) height;

                      if (pixelCountLong
                              > Integer.MAX_VALUE) {

                          return new Result(
                                  source,
                                  sourceAnalysis,
                                  false,
                                  false,
                                  "• CA/fringe scan withheld — "
                                          + "working image exceeds safe "
                                          + "analysis size"
                                          + formatNote);
                      }

                      int pixelCount =
                              (int) pixelCountLong;

                      int[] pixels =
                              new int[pixelCount];

                      opticsSource.getPixels(
                              pixels,
                              0,
                              width,
                              0,
                              0,
                              width,
                              height);

                      int sampleStep;

                      if (pixelCount > 8_000_000) {
                          sampleStep = 3;

                      } else if (pixelCount > 3_000_000) {
                          sampleStep = 2;

                      } else {
                          sampleStep = 1;
                      }

                      FringeStats before =
                              measure(
                                      pixels,
                                      width,
                                      height,
                                      sampleStep);

                      if (!OpticalFringePolicy.shouldActivate(
                              before.edgeSamples,
                              before.fringeSamples,
                              before.meanExcess,
                              before.ratio)) {

                          String report =
                                  String.format(
                                          Locale.US,
                                          "• CA/fringe scan: no significant "
                                                  + "optical colour-fringe evidence\n"
                                                  + "• Edge fringe %.2f%% | "
                                                  + "isolated excess %.1f | "
                                                  + "%d candidate samples\n"
                                                  + "• No optical pixels changed",
                                          before.ratio * 100.0,
                                          before.meanExcess,
                                          before.fringeSamples);

                          return new Result(
                                  source,
                                  sourceAnalysis,
                                  false,
                                  false,
                                  report
                                          + formatNote);
                      }

                      Bitmap candidate =
                              opticsSource.copy(
                                      Bitmap.Config.ARGB_8888,
                                      true);

                      if (candidate == null) {

                          return new Result(
                                  source,
                                  sourceAnalysis,
                                  true,
                                  false,
                                  "• CA/fringe repair attempted but "
                                          + "working correction copy could "
                                          + "not be created"
                                          + formatNote);
                      }

                      int correctedPixels =
                              0;

                      for (int y = 2;
                           y < height - 2;
                           y++) {

                          for (int x = 2;
                               x < width - 2;
                               x++) {

                              double excess =
                                      candidateExcess(
                                              pixels,
                                              width,
                                              height,
                                              x,
                                              y);

                              if (excess
                                      < MIN_ISOLATED_EXCESS) {
                                  continue;
                              }

                              int index =
                                      y * width
                                              + x;

                              int current =
                                      pixels[index];

                              int left =
                                      pixels[
                                              index - 1];

                              int right =
                                      pixels[
                                              index + 1];

                              int up =
                                      pixels[
                                              index - width];

                              int down =
                                      pixels[
                                              index + width];

                              int yLeft =
                                      luminance(left);

                              int yRight =
                                      luminance(right);

                              int yUp =
                                      luminance(up);

                              int yDown =
                                      luminance(down);

                              int gx =
                                      Math.abs(
                                              yRight
                                                      - yLeft);

                              int gy =
                                      Math.abs(
                                              yDown
                                                      - yUp);

                              int sideA;
                              int sideB;

                              if (gx >= gy) {
                                  sideA = left;
                                  sideB = right;

                              } else {
                                  sideA = up;
                                  sideB = down;
                              }

                              int currentY =
                                      luminance(
                                              current);

                              int sideAY =
                                      luminance(
                                              sideA);

                              int sideBY =
                                      luminance(
                                              sideB);

                              int target =
                                      Math.abs(
                                              currentY
                                                      - sideAY)
                                              <= Math.abs(
                                                      currentY
                                                              - sideBY)
                                              ? sideA
                                              : sideB;

                              double radius =
                                      radius(
                                              x,
                                              y,
                                              width,
                                              height);

                              double strength =
                                      OpticalFringePolicy
                                              .correctionStrength(
                                                      excess,
                                                      radius);

                              int corrected =
                                      chromaMoveToward(
                                              current,
                                              target,
                                              strength);

                              if (corrected
                                      != current) {

                                  candidate.setPixel(
                                          x,
                                          y,
                                          corrected);

                                  correctedPixels++;
                              }
                          }
                      }

                      if (correctedPixels == 0) {

                          candidate.recycle();

                          return new Result(
                                  source,
                                  sourceAnalysis,
                                  true,
                                  false,
                                  "• CA/fringe evidence measured, "
                                          + "but no safe local correction "
                                          + "pixels remained\n"
                                          + "• Original mastered pixels retained"
                                          + formatNote);
                      }

                      double correctedFraction =
                              correctedPixels
                                      / (double) pixelCount;

                      if (correctedFraction
                              > MAX_CORRECTED_FRACTION) {

                          candidate.recycle();

                          return new Result(
                                  source,
                                  sourceAnalysis,
                                  true,
                                  false,
                                  String.format(
                                          Locale.US,
                                          "• CA/fringe candidate: "
                                                  + "ROLLED BACK — correction "
                                                  + "density %.2f%% exceeds "
                                                  + "1.50%% safety ceiling\n"
                                                  + "• Broad colour structure "
                                                  + "protected; original "
                                                  + "mastered pixels retained",
                                          correctedFraction
                                                  * 100.0)
                                          + formatNote);
                      }

                      candidate.getPixels(
                              pixels,
                              0,
                              width,
                              0,
                              0,
                              width,
                              height);

                      FringeStats after =
                              measure(
                                      pixels,
                                      width,
                                      height,
                                      sampleStep);

                      PhotoAnalysis candidateAnalysis =
                              PhotoAnalysis.analyse(
                                      candidate);

                      boolean accepted =
                              OpticalFringePolicy.outputSafe(
                                      before.ratio,
                                      after.ratio,
                                      before.meanExcess,
                                      after.meanExcess,
                                      opticsBaselineAnalysis.detail,
                                      candidateAnalysis.detail,
                                      opticsBaselineAnalysis.noise,
                                      candidateAnalysis.noise,
                                      opticsBaselineAnalysis.flatChromaNoise,
                                      candidateAnalysis.flatChromaNoise,
                                      opticsBaselineAnalysis.ringing,
                                      candidateAnalysis.ringing,
                                      opticsBaselineAnalysis.medianLum,
                                      candidateAnalysis.medianLum,
                                      opticsBaselineAnalysis.avgSat,
                                      candidateAnalysis.avgSat,
                                      opticsBaselineAnalysis.shadowClip,
                                      candidateAnalysis.shadowClip,
                                      opticsBaselineAnalysis.highlightClip,
                                      candidateAnalysis.highlightClip);

                      String metrics =
                              String.format(
                                      Locale.US,
                                      "• Fringe evidence %.2f%% -> %.2f%%\n"
                                              + "• Isolated fringe excess "
                                              + "%.1f -> %.1f\n"
                                              + "• Corrected %d pixels | "
                                              + "luminance-preserving local "
                                              + "chroma repair\n"
                                              + "• Maximum channel correction "
                                              + "%d/255",
                                      before.ratio
                                              * 100.0,
                                      after.ratio
                                              * 100.0,
                                      before.meanExcess,
                                      after.meanExcess,
                                      correctedPixels,
                                      MAX_CHANNEL_DELTA);

                      if (!accepted) {

                          candidate.recycle();

                          return new Result(
                                  source,
                                  sourceAnalysis,
                                  true,
                                  false,
                                  "• CA/fringe candidate: ROLLED BACK — "
                                          + "optical QC did not confirm "
                                          + "a safe improvement\n"
                                          + metrics
                                          + "\n• Original mastered pixels retained"
                                          + formatNote);
                      }

                      return new Result(
                              candidate,
                              candidateAnalysis,
                              true,
                              true,
                              "• Chromatic-aberration / "
                                      + "colour-fringe repair: APPLIED\n"
                                      + metrics
                                      + "\n• Optical QC: ACCEPTED"
                                      + formatNote);

                  } finally {

                      if (temporaryArgbSource
                              && opticsSource != null
                              && !opticsSource.isRecycled()) {

                          opticsSource.recycle();
                      }
                  }
              }

              private static FringeStats measure(
                      int[] pixels,
                      int width,
                      int height,
                      int step) {

                  int edgeSamples =
                          0;

                  int fringeSamples =
                          0;

                  double excessSum =
                          0.0;

                  for (int y = 2;
                       y < height - 2;
                       y += step) {

                      for (int x = 2;
                           x < width - 2;
                           x += step) {

                          int index =
                                  y * width
                                          + x;

                          int left =
                                  pixels[
                                          index - 1];

                          int right =
                                  pixels[
                                          index + 1];

                          int up =
                                  pixels[
                                          index - width];

                          int down =
                                  pixels[
                                          index + width];

                          int gx =
                                  Math.abs(
                                          luminance(right)
                                                  - luminance(left));

                          int gy =
                                  Math.abs(
                                          luminance(down)
                                                  - luminance(up));

                          if (Math.max(
                                  gx,
                                  gy)
                                  < EDGE_THRESHOLD) {
                              continue;
                          }

                          edgeSamples++;

                          double excess =
                                  candidateExcess(
                                          pixels,
                                          width,
                                          height,
                                          x,
                                          y);

                          if (excess
                                  >= MIN_ISOLATED_EXCESS) {

                              fringeSamples++;
                              excessSum += excess;
                          }
                      }
                  }

                  double ratio =
                          edgeSamples > 0
                                  ? (double) fringeSamples
                                          / (double) edgeSamples
                                  : 0.0;

                  double meanExcess =
                          fringeSamples > 0
                                  ? excessSum
                                          / (double) fringeSamples
                                  : 0.0;

                  return new FringeStats(
                          edgeSamples,
                          fringeSamples,
                          ratio,
                          meanExcess);
              }

              private static double candidateExcess(
                      int[] pixels,
                      int width,
                      int height,
                      int x,
                      int y) {

                  int index =
                          y * width
                                  + x;

                  int current =
                          pixels[index];

                  int left =
                          pixels[
                                  index - 1];

                  int right =
                          pixels[
                                  index + 1];

                  int up =
                          pixels[
                                  index - width];

                  int down =
                          pixels[
                                  index + width];

                  int yLeft =
                          luminance(left);

                  int yRight =
                          luminance(right);

                  int yUp =
                          luminance(up);

                  int yDown =
                          luminance(down);

                  int gx =
                          Math.abs(
                                  yRight
                                          - yLeft);

                  int gy =
                          Math.abs(
                                  yDown
                                          - yUp);

                  int edgeStrength =
                          Math.max(
                                  gx,
                                  gy);

                  if (edgeStrength
                          < EDGE_THRESHOLD) {
                      return 0.0;
                  }

                  double radius =
                          radius(
                                  x,
                                  y,
                                  width,
                                  height);

                  if (radius
                          < MIN_RADIUS) {
                      return 0.0;
                  }

                  int packed =
                          dominantAxis(
                                  current);

                  int axis =
                          packed >>> 16;

                  int score =
                          packed
                                  & 0xffff;

                  int threshold =
                          (int) Math.round(
                                  EDGE_FRINGE_THRESHOLD
                                          + (1.0 - radius)
                                          * CENTRE_EXTRA_THRESHOLD);

                  if (score
                          < threshold) {
                      return 0.0;
                  }

                  int sideA;
                  int sideB;

                  if (gx >= gy) {
                      sideA = left;
                      sideB = right;

                  } else {
                      sideA = up;
                      sideB = down;
                  }

                  double neighbourAxis =
                          0.5
                                  * (
                                  Math.max(
                                          0,
                                          axisValue(
                                                  sideA,
                                                  axis))
                                          + Math.max(
                                          0,
                                          axisValue(
                                                  sideB,
                                                  axis))
                          );

                  double excess =
                          score
                                  - neighbourAxis;

                  return excess
                                  >= MIN_ISOLATED_EXCESS
                          ? excess
                          : 0.0;
              }

              private static int dominantAxis(
                      int color) {

                  int r =
                          Color.red(
                                  color);

                  int g =
                          Color.green(
                                  color);

                  int b =
                          Color.blue(
                                  color);

                  int rb =
                          (r + b + 1)
                                  / 2;

                  int gb =
                          (g + b + 1)
                                  / 2;

                  int[] values =
                          new int[] {
                                  rb - g,
                                  g - rb,
                                  r - gb,
                                  gb - r
                          };

                  int bestAxis =
                          0;

                  int best =
                          values[0];

                  for (int i = 1;
                       i < values.length;
                       i++) {

                      if (values[i]
                              > best) {

                          best =
                                  values[i];

                          bestAxis =
                                  i;
                      }
                  }

                  return (
                          bestAxis << 16)
                          | (
                          Math.max(
                                  0,
                                  best)
                                  & 0xffff
                  );
              }

              private static int axisValue(
                      int color,
                      int axis) {

                  int r =
                          Color.red(
                                  color);

                  int g =
                          Color.green(
                                  color);

                  int b =
                          Color.blue(
                                  color);

                  int rb =
                          (r + b + 1)
                                  / 2;

                  int gb =
                          (g + b + 1)
                                  / 2;

                  switch (axis) {

                      case 0:
                          return rb - g;

                      case 1:
                          return g - rb;

                      case 2:
                          return r - gb;

                      case 3:
                          return gb - r;

                      default:
                          return 0;
                  }
              }

              private static int chromaMoveToward(
                      int current,
                      int target,
                      double strength) {

                  int alpha =
                          Color.alpha(
                                  current);

                  int r =
                          Color.red(
                                  current);

                  int g =
                          Color.green(
                                  current);

                  int b =
                          Color.blue(
                                  current);

                  int tr =
                          Color.red(
                                  target);

                  int tg =
                          Color.green(
                                  target);

                  int tb =
                          Color.blue(
                                  target);

                  double y =
                          0.299 * r
                                  + 0.587 * g
                                  + 0.114 * b;

                  double ty =
                          0.299 * tr
                                  + 0.587 * tg
                                  + 0.114 * tb;

                  double cb =
                          b - y;

                  double cr =
                          r - y;

                  double targetCb =
                          tb - ty;

                  double targetCr =
                          tr - ty;

                  double newCb =
                          cb
                                  + strength
                                  * (targetCb - cb);

                  double newCr =
                          cr
                                  + strength
                                  * (targetCr - cr);

                  int nr =
                          clamp255(
                                  (int) Math.round(
                                          y + newCr));

                  int nb =
                          clamp255(
                                  (int) Math.round(
                                          y + newCb));

                  int ng =
                          clamp255(
                                  (int) Math.round(
                                          (
                                                  y
                                                          - 0.299 * nr
                                                          - 0.114 * nb
                                          ) / 0.587));

                  nr =
                          limitDelta(
                                  r,
                                  nr,
                                  MAX_CHANNEL_DELTA);

                  ng =
                          limitDelta(
                                  g,
                                  ng,
                                  MAX_CHANNEL_DELTA);

                  nb =
                          limitDelta(
                                  b,
                                  nb,
                                  MAX_CHANNEL_DELTA);

                  return Color.argb(
                          alpha,
                          nr,
                          ng,
                          nb);
              }

              private static int limitDelta(
                      int original,
                      int candidate,
                      int maximumDelta) {

                  int low =
                          Math.max(
                                  0,
                                  original
                                          - maximumDelta);

                  int high =
                          Math.min(
                                  255,
                                  original
                                          + maximumDelta);

                  return Math.max(
                          low,
                          Math.min(
                                  high,
                                  candidate));
              }

              private static int luminance(
                      int color) {

                  int r =
                          Color.red(
                                  color);

                  int g =
                          Color.green(
                                  color);

                  int b =
                          Color.blue(
                                  color);

                  return (
                          77 * r
                                  + 150 * g
                                  + 29 * b
                                  + 128
                  ) >> 8;
              }

              private static double radius(
                      int x,
                      int y,
                      int width,
                      int height) {

                  double cx =
                          (width - 1)
                                  * 0.5;

                  double cy =
                          (height - 1)
                                  * 0.5;

                  double nx =
                          (x - cx)
                                  / Math.max(
                                          1.0,
                                          cx);

                  double ny =
                          (y - cy)
                                  / Math.max(
                                          1.0,
                                          cy);

                  return Math.min(
                          1.0,
                          Math.sqrt(
                                  nx * nx
                                          + ny * ny));
              }

              private static int clamp255(
                      int value) {

                  return Math.max(
                          0,
                          Math.min(
                                  255,
                                  value));
              }
          }
