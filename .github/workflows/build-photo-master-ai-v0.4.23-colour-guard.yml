      - name: Upload APK and continuation notes
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMasterAI-v0.4.23-COLOUR-HIGH-RING-GUARD
          path: |
            artifact/PhotoMasterAI-v0.4.23-COLOUR-HIGH-RING-GUARD.apk
            artifact/PhotoMasterAI-v0.4.23-COLOUR-HIGH-RING-GUARD-SHA256.txt
            artifact/PhotoMasterAI-v0.4.23-Notes.txt
