name: Build Photo Master AI v0.4.23 Colour Space + High-Ring Guard

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-photo-master-ai-v0.4.23-colour-guard.yml'

permissions:
  contents: read

jobs:
  build:
    name: Photo Master AI v0.4.23 Colour Space + High-Ring Guard
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover exact successful v0.4.21 source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          V0421_COMMIT="02dbde94de2d4b136832cb913a483e0b1a30eb2c"

          git cat-file -e "${V0421_COMMIT}^{commit}" || {
            echo "::error::Successful v0.4.21 commit unavailable"
            exit 1
          }

          git show \
            "${V0421_COMMIT}:.github/workflows/build-photo-master-ai-v0.4.21-vignetting.yml" \
            > /tmp/v0421.yml

          python3 - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/v0421.yml').read_text().splitlines()

          def extract_step(name, destination):
              step = None
              for i, line in enumerate(lines):
                  if line.strip() == '- name: ' + name:
                      step = i
                      break
              if step is None:
                  raise RuntimeError('Workflow step not found: ' + name)

              run = None
              for i in range(step, len(lines)):
                  if lines[i].strip() == 'run: |':
                      run = i
                      break
                  if i > step and lines[i].startswith('      - name:'):
                      break
              if run is None:
                  raise RuntimeError('Run block not found: ' + name)

              body = []
              for line in lines[run + 1:]:
                  if line.startswith('      - name:'):
                      break
                  if not line.strip():
                      body.append('')
                  elif line.startswith('          '):
                      body.append(line[10:])
                  else:
                      raise RuntimeError('Unexpected indentation while extracting: ' + name)

              Path(destination).write_text('\n'.join(body) + '\n')

          extract_step(
              'Recover exact successful v0.4.20 source',
              '/tmp/recover-v0420.sh'
          )
          extract_step(
              'Apply v0.4.21 measured vignetting guard',
              '/tmp/apply-v0421.sh'
          )
          PY

          bash /tmp/recover-v0420.sh

          PROJECT="$(
            find photomaster-v044-build \
              -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -printf '%h\n' \
              | head -n 1
          )"

          test -n "$PROJECT" || {
            echo "::error::Recovered project not found"
            exit 1
          }

          export PROJECT
          bash /tmp/apply-v0421.sh

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          grep -q "versionCode 30" "$PROJECT/app/build.gradle"
          grep -q "versionName '0.4.21'" "$PROJECT/app/build.gradle"
          grep -q "class VignettingPolicy" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/VignettingPolicy.java"
          grep -q "Final shadow-integrity guard: ROLLBACK" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"
          grep -q "class ProcessingKeepAliveService" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/ProcessingKeepAliveService.java"

          echo "Exact successful v0.4.21 source recovered"

      - name: Apply v0.4.22 person evidence and high-blend detail guards
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          project = Path(os.environ['PROJECT'])

          # VERSION
          build_file = project / 'app/build.gradle'
          build = build_file.read_text()
          if 'versionCode 30' not in build:
              raise RuntimeError('v0.4.21 versionCode not found')
          if "versionName '0.4.21'" not in build:
              raise RuntimeError('v0.4.21 versionName not found')
          build = build.replace('versionCode 30', 'versionCode 31', 1)
          build = build.replace("versionName '0.4.21'", "versionName '0.4.22'", 1)
          build_file.write_text(build)

          # PERSON EVIDENCE POLICY
          policy_file = project / 'app/src/main/java/com/dennis/photomasterai/PersonEvidencePolicy.java'
          policy_file.write_text('''package com.dennis.photomasterai;
          
          public final class PersonEvidencePolicy {
          
              private PersonEvidencePolicy() {
              }
          
              public static boolean shouldTrustPerson(
            boolean faceDetected,
            boolean personLabel,
            boolean strongPersonLabel,
            boolean strongObjectConflict,
            double personMaskCoverage) {
          
                  if (faceDetected) {
            return true;
                  }
          
                  if (!personLabel) {
            return false;
                  }
          
                  if (!strongObjectConflict) {
            return true;
                  }
          
                  return strongPersonLabel
                && personMaskCoverage >= 0.10;
              }
          }
          ''')

          ai_file = project / 'app/src/main/java/com/dennis/photomasterai/AiVisionAnalyzer.java'
          ai = ai_file.read_text()

          person_pattern = re.compile(
              r'            boolean personLabel = hasAny\(labels, 0\.55f,\s*'
              r'"person", "people", "human",\s*'
              r'"portrait", "face", "selfie",\s*'
              r'"skin", "smile"\);\s*'
              r'            boolean person = !faces\.isEmpty\(\) \|\| personLabel;',
              re.MULTILINE
          )

          person_replacement = '''            boolean personLabel = hasAny(labels, 0.55f,
                    "person", "people", "human",
                    "portrait", "face", "selfie",
                    "skin", "smile");
            boolean strongPersonLabel = hasAny(labels, 0.80f,
                    "person", "people", "human",
                    "portrait", "face", "selfie");
            boolean strongObjectConflict = hasAny(labels, 0.80f,
                    "airplane", "aircraft", "aviation", "vehicle",
                    "car", "truck", "bus", "train",
                    "boat", "ship", "motorcycle", "bicycle");
            boolean person = PersonEvidencePolicy.shouldTrustPerson(
                    !faces.isEmpty(),
                    personLabel,
                    strongPersonLabel,
                    strongObjectConflict,
                    coverage);'''

          ai, person_count = person_pattern.subn(person_replacement, ai, count=1)
          if person_count != 1:
              raise RuntimeError('Person evidence anchor not found')
          ai_file.write_text(ai)

          # HIGH-BLEND DETAIL GUARD
          neural_policy_file = project / 'app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java'
          neural_policy = neural_policy_file.read_text()

          evaluate_anchor = '    public static Quality evaluate('
          if evaluate_anchor not in neural_policy:
              raise RuntimeError('Neural evaluate anchor not found')

          helper = '''    public static boolean highBlendDetailSafe(
            double blend,
            double beforeDetail,
            double afterDetail,
            boolean lowDetailRecoverySafe) {
          
                  if (blend <= 0.50 || lowDetailRecoverySafe) {
            return true;
                  }
          
                  double base = Math.max(1.0e-9, beforeDetail);
                  double ratio = afterDetail / base;
          
                  return ratio >= 0.94;
              }
          
          '''
          neural_policy = neural_policy.replace(evaluate_anchor, helper + evaluate_anchor, 1)

          detail_old = (
              '        boolean detailSafe = detailRatio >= minDetail '
              '|| lowDetailRecoverySafe;'
          )
          detail_new = (
              '        boolean highBlendGuardSafe = highBlendDetailSafe(\n'
              '                decision.blend,\n'
              '                beforeDetail,\n'
              '                afterDetail,\n'
              '                lowDetailRecoverySafe);\n'
              '        boolean detailSafe = (detailRatio >= minDetail '
              '|| lowDetailRecoverySafe)\n'
              '                && highBlendGuardSafe;'
          )
          if detail_old not in neural_policy:
              raise RuntimeError('Neural detail QC anchor not found')
          neural_policy = neural_policy.replace(detail_old, detail_new, 1)
          neural_policy_file.write_text(neural_policy)

          # HOST CHECKS
          person_host = project / 'tools/PersonEvidencePolicyHostChecks.java'
          person_host.write_text('''package com.dennis.photomasterai;
          
          public final class PersonEvidencePolicyHostChecks {
          
              public static void main(String[] args) {
                  require(PersonEvidencePolicy.shouldTrustPerson(
                true, false, false, true, 0.01),
                "face evidence must remain authoritative");
          
                  require(PersonEvidencePolicy.shouldTrustPerson(
                false, true, true, false, 0.03),
                "ordinary strong person scene should remain trusted");
          
                  require(!PersonEvidencePolicy.shouldTrustPerson(
                false, true, true, true, 0.086),
                "aircraft-style conflicting object false person must be withheld");
          
                  require(PersonEvidencePolicy.shouldTrustPerson(
                false, true, true, true, 0.15),
                "well-supported person mask may override object conflict");
          
                  require(!PersonEvidencePolicy.shouldTrustPerson(
                false, false, false, false, 0.40),
                "segmentation alone must not create a person scene");
          
                  System.out.println("PersonEvidencePolicyHostChecks passed");
              }
          
              private static void require(boolean condition, String message) {
                  if (!condition) {
            throw new AssertionError(message);
                  }
              }
          }
          ''')

          neural_host = project / 'tools/HighBlendDetailGuardHostChecks.java'
          neural_host.write_text('''package com.dennis.photomasterai;
          
          public final class HighBlendDetailGuardHostChecks {
          
              public static void main(String[] args) {
                  require(NeuralDenoisePolicy.highBlendDetailSafe(
                0.62, 0.037, 0.035, false),
                "observed 62% blend / 94.6% detail retention should pass");
          
                  require(!NeuralDenoisePolicy.highBlendDetailSafe(
                0.62, 0.037, 0.034, false),
                "high blend with material detail loss must fail");
          
                  require(NeuralDenoisePolicy.highBlendDetailSafe(
                0.45, 0.037, 0.033, false),
                "guard must not alter <=50% blend policy");
          
                  require(NeuralDenoisePolicy.highBlendDetailSafe(
                0.70, 0.014, 0.0129, true),
                "existing low-detail absolute-loss recovery must remain valid");
          
                  System.out.println("HighBlendDetailGuardHostChecks passed");
              }
          
              private static void require(boolean condition, String message) {
                  if (!condition) {
            throw new AssertionError(message);
                  }
              }
          }
          ''')

          print('v0.4.22 safety refinement applied')
          print('Person Evidence Guard: active')
          print('High-blend detail retention guard: active at >50% blend')
          print('v0.4.21 vignetting / optics / shadow / background logic unchanged')
          PY

          grep -q "versionCode 31" "$PROJECT/app/build.gradle"
          grep -q "versionName '0.4.22'" "$PROJECT/app/build.gradle"
          grep -q "class PersonEvidencePolicy" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/PersonEvidencePolicy.java"
          grep -q "strongObjectConflict" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/AiVisionAnalyzer.java"
          grep -q "highBlendDetailSafe" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java"
          grep -q "class VignettingPolicy" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/VignettingPolicy.java"
          grep -q "Final shadow-integrity guard: ROLLBACK" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"
          grep -q "class ProcessingKeepAliveService" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/ProcessingKeepAliveService.java"

      - name: Apply v0.4.23 colour-space compatibility and high-ring finishing guard
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          project = Path(os.environ['PROJECT'])

          # VERSION
          build_file = project / 'app/build.gradle'
          build = build_file.read_text()
          if 'versionCode 31' not in build:
              raise RuntimeError('v0.4.22 versionCode not found')
          if "versionName '0.4.22'" not in build:
              raise RuntimeError('v0.4.22 versionName not found')
          build = build.replace('versionCode 31', 'versionCode 32', 1)
          build = build.replace("versionName '0.4.22'", "versionName '0.4.23'", 1)
          build_file.write_text(build)

          # HIGH-RING FINISHING POLICY
          high_ring_policy = project / (
              'app/src/main/java/com/dennis/'
              'photomasterai/HighRingFinishingPolicy.java'
          )
          high_ring_policy.write_text('''package com.dennis.photomasterai;

          public final class HighRingFinishingPolicy {
              private HighRingFinishingPolicy() {
              }

              public static final class Caps {
                  public final boolean active;
                  public final double sharpenCap;
                  public final double microContrastCap;
                  public final double subjectSharpenCap;

                  Caps(boolean active,
             double sharpenCap,
             double microContrastCap,
             double subjectSharpenCap) {
            this.active = active;
            this.sharpenCap = sharpenCap;
            this.microContrastCap = microContrastCap;
            this.subjectSharpenCap = subjectSharpenCap;
                  }
              }

              public static Caps caps(double sourceRinging) {
                  if (sourceRinging >= 0.98) {
            return new Caps(true, 0.060, 0.120, 0.025);
                  }
                  if (sourceRinging >= 0.90) {
            return new Caps(true, 0.070, 0.140, 0.030);
                  }
                  return new Caps(false, 1.0, 1.0, 1.0);
              }
          }
          ''')

          # COLOUR SPACE GUARD
          colour_guard = project / (
              'app/src/main/java/com/dennis/'
              'photomasterai/ColorSpaceGuard.java'
          )
          colour_guard.write_text('''package com.dennis.photomasterai;

          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.ColorSpace;
          import android.graphics.Paint;
          import android.os.Build;

          public final class ColorSpaceGuard {
              private ColorSpaceGuard() {
              }

              public static ColorSpace sourceSpace(Bitmap source) {
                  if (Build.VERSION.SDK_INT >= 26 && source != null) {
            ColorSpace cs = source.getColorSpace();
            if (cs != null) {
                return cs;
            }
                  }
                  return ColorSpace.get(ColorSpace.Named.SRGB);
              }

              public static Bitmap createLike(Bitmap source, int width, int height) {
                  if (Build.VERSION.SDK_INT >= 26) {
            ColorSpace cs = sourceSpace(source);
            boolean hasAlpha = source != null && source.hasAlpha();
            return Bitmap.createBitmap(
                    width,
                    height,
                    Bitmap.Config.ARGB_8888,
                    hasAlpha,
                    cs);
                  }
                  return Bitmap.createBitmap(
                width,
                height,
                Bitmap.Config.ARGB_8888);
              }

              public static Bitmap ensureLike(Bitmap reference, Bitmap candidate) {
                  if (candidate == null || reference == null) {
            return candidate;
                  }
                  if (Build.VERSION.SDK_INT < 26) {
            return candidate;
                  }

                  ColorSpace target = sourceSpace(reference);
                  ColorSpace current = candidate.getColorSpace();
                  if (current != null && current.equals(target)) {
            return candidate;
                  }

                  Bitmap converted = createLike(
                reference,
                candidate.getWidth(),
                candidate.getHeight());

                  Canvas canvas = new Canvas(converted);
                  Paint paint = new Paint(
                Paint.ANTI_ALIAS_FLAG
                        | Paint.FILTER_BITMAP_FLAG
                        | Paint.DITHER_FLAG);
                  canvas.drawBitmap(candidate, 0.0f, 0.0f, paint);
                  return converted;
              }

              public static String describe(Bitmap bitmap) {
                  if (Build.VERSION.SDK_INT < 26 || bitmap == null) {
            return "sRGB / legacy";
                  }
                  ColorSpace cs = bitmap.getColorSpace();
                  if (cs == null) {
            return "sRGB / untagged fallback";
                  }
                  return cs.getName()
                + (cs.isWideGamut() ? " (wide gamut)" : "");
              }

              public static boolean isWideGamut(Bitmap bitmap) {
                  if (Build.VERSION.SDK_INT < 26 || bitmap == null) {
            return false;
                  }
                  ColorSpace cs = bitmap.getColorSpace();
                  return cs != null && cs.isWideGamut();
              }
          }
          ''')

          # PHOTO MASTER ENGINE
          engine_file = project / (
              'app/src/main/java/com/dennis/'
              'photomasterai/PhotoMasterEngine.java'
          )
          engine = engine_file.read_text()

          create_pattern = re.compile(
              r'out = Bitmap\.createBitmap\(\s*'
              r'source\.getWidth\(\),\s*'
              r'source\.getHeight\(\),\s*'
              r'Bitmap\.Config\.ARGB_8888\);',
              re.MULTILINE
          )
          engine, create_count = create_pattern.subn(
              'out = ColorSpaceGuard.createLike(\n'
              '                    source,\n'
              '                    source.getWidth(),\n'
              '                    source.getHeight());',
              engine,
              count=1
          )
          if create_count != 1:
              raise RuntimeError('PhotoMasterEngine output allocation anchor not found')

          build_params_anchor = '    private static Params buildParams('
          build_params_start = engine.find(build_params_anchor)
          if build_params_start < 0:
              raise RuntimeError('buildParams method not found')

          helper = '''    private static void applyHighRingFinishingGuard(
            Params p,
            PhotoAnalysis sourceAnalysis) {

                  if (p == null || sourceAnalysis == null) {
            return;
                  }

                  HighRingFinishingPolicy.Caps caps =
                HighRingFinishingPolicy.caps(
                        sourceAnalysis.ringing);

                  if (!caps.active) {
            return;
                  }

                  p.sharpen = Math.min(p.sharpen, caps.sharpenCap);
                  p.microContrast = Math.min(
                p.microContrast,
                caps.microContrastCap);
                  p.aiSubjectSharpen = Math.min(
                p.aiSubjectSharpen,
                caps.subjectSharpenCap);

                  p.sharpenActive =
                p.sharpen > 0.035
                        || p.microContrast > 0.02
                        || p.aiSubjectSharpen > 0.01;
              }

          '''
          engine = engine.replace(
              build_params_anchor,
              helper + build_params_anchor,
              1
          )

          # Brace-match buildParams and inject the cap immediately before return p.
          build_params_start = engine.find(build_params_anchor)
          open_brace = engine.find('{', build_params_start)
          if open_brace < 0:
              raise RuntimeError('buildParams opening brace not found')
          depth = 0
          build_params_end = None
          for i in range(open_brace, len(engine)):
              ch = engine[i]
              if ch == '{':
                  depth += 1
              elif ch == '}':
                  depth -= 1
                  if depth == 0:
                      build_params_end = i
                      break
          if build_params_end is None:
              raise RuntimeError('buildParams closing brace not found')

          method_text = engine[build_params_start:build_params_end + 1]
          return_at = method_text.rfind('        return p;')
          if return_at < 0:
              raise RuntimeError('buildParams return p anchor not found')
          absolute_return = build_params_start + return_at
          engine = (
              engine[:absolute_return]
              + '        applyHighRingFinishingGuard(p, a);\n\n'
              + engine[absolute_return:]
          )
          engine_file.write_text(engine)

          # NEURAL BLEND OUTPUT
          neural_file = project / (
              'app/src/main/java/com/dennis/'
              'photomasterai/NeuralDenoiser.java'
          )
          neural = neural_file.read_text()
          neural_create_pattern = re.compile(
              r'Bitmap out = Bitmap\.createBitmap\(\s*'
              r'w,\s*h,\s*Bitmap\.Config\.ARGB_8888\);',
              re.MULTILINE
          )
          neural, neural_create_count = neural_create_pattern.subn(
              'Bitmap out = ColorSpaceGuard.createLike(\n'
              '                source,\n'
              '                w,\n'
              '                h);',
              neural,
              count=1
          )
          if neural_create_count != 1:
              raise RuntimeError('Neural blend output allocation anchor not found')
          neural_file.write_text(neural)

          # FINAL COLOUR-SPACE MATCH + REPORTING
          main_file = project / (
              'app/src/main/java/com/dennis/'
              'photomasterai/MainActivity.java'
          )
          main = main_file.read_text()

          old_flow = '''                final PhotoMasterEngine.Result result =
                        applyVignettingIntelligence(
                                opticsResult,
                                originalBitmap);'''
          new_flow = '''                PhotoMasterEngine.Result vignetteResult =
                        applyVignettingIntelligence(
                                opticsResult,
                                originalBitmap);

                final PhotoMasterEngine.Result result =
                        applyColourSpaceGuard(
                                vignetteResult,
                                originalBitmap);'''
          if old_flow not in main:
              raise RuntimeError('v0.4.22 final vignetting result flow not found')
          main = main.replace(old_flow, new_flow, 1)

          helper_anchor = (
              '    private PhotoMasterEngine.Result '
              'applyVignettingIntelligence('
          )
          if helper_anchor not in main:
              raise RuntimeError('Vignetting helper anchor not found')

          colour_helper = '''    private PhotoMasterEngine.Result applyColourSpaceGuard(
            PhotoMasterEngine.Result result,
            Bitmap authoritativeOriginal) {

                  if (result == null
                || result.bitmap == null
                || result.bitmap.isRecycled()
                || authoritativeOriginal == null
                || authoritativeOriginal.isRecycled()) {
            return result;
                  }

                  Bitmap matched = ColorSpaceGuard.ensureLike(
                authoritativeOriginal,
                result.bitmap);

                  PhotoAnalysis sourceAnalysis =
                PhotoAnalysis.analyse(authoritativeOriginal);

                  HighRingFinishingPolicy.Caps caps =
                HighRingFinishingPolicy.caps(
                        sourceAnalysis.ringing);

                  StringBuilder colourSection = new StringBuilder();
                  colourSection.append(
                "• AUTO / preserve-source colour space: ACTIVE\\n");
                  colourSection.append("• Source colour space: ")
                .append(ColorSpaceGuard.describe(authoritativeOriginal))
                .append("\\n");
                  colourSection.append("• Output colour space: ")
                .append(ColorSpaceGuard.describe(matched))
                .append("\\n");
                  colourSection.append("• Wide-gamut source: ")
                .append(ColorSpaceGuard.isWideGamut(authoritativeOriginal)
                        ? "YES" : "NO");

                  if (caps.active) {
            colourSection.append(
                    "\\n\\nHIGH-RING FINISHING GUARD\\n");
            colourSection.append(String.format(
                    java.util.Locale.US,
                    "• Source ring %.3f — pre-render finishing caps active\\n",
                    sourceAnalysis.ringing));
            colourSection.append(String.format(
                    java.util.Locale.US,
                    "• Detail/sharpen cap %.0f%% | local micro-contrast cap %.0f%%",
                    caps.sharpenCap * 100.0,
                    caps.microContrastCap * 100.0));
                  }

                  String updatedReport =
                insertColourManagementReport(
                        result.report,
                        colourSection.toString());

                  PhotoAnalysis matchedAnalysis =
                PhotoAnalysis.analyse(matched);

                  if (matched != result.bitmap) {
            Bitmap previous = result.bitmap;
            if (previous != authoritativeOriginal
                    && !previous.isRecycled()) {
                previous.recycle();
            }
                  }

                  return new PhotoMasterEngine.Result(
                matched,
                updatedReport,
                matchedAnalysis);
              }

              private String insertColourManagementReport(
            String sourceReport,
            String colourReport) {

                  if (sourceReport == null) {
            return "COLOUR MANAGEMENT\\n" + colourReport;
                  }

                  String marker = "\\nOUTPUT QC\\n";
                  int markerAt = sourceReport.indexOf(marker);
                  String section =
                "\\nCOLOUR MANAGEMENT\\n"
                        + colourReport
                        + "\\n";

                  if (markerAt < 0) {
            return sourceReport + section;
                  }

                  return sourceReport.substring(0, markerAt)
                + section
                + sourceReport.substring(markerAt);
              }

          '''
          main = main.replace(
              helper_anchor,
              colour_helper + helper_anchor,
              1
          )
          main_file.write_text(main)

          # WIDE-GAMUT PREVIEW OPT-IN
          manifest_file = project / 'app/src/main/AndroidManifest.xml'
          manifest = manifest_file.read_text()
          if 'android:colorMode="wideColorGamut"' not in manifest:
              activity_pattern = re.compile(
                  r'<activity\b([^>]*android:name="[^"]*MainActivity"[^>]*)>',
                  re.MULTILINE | re.DOTALL
              )
              manifest, activity_count = activity_pattern.subn(
                  r'<activity android:colorMode="wideColorGamut"\1>',
                  manifest,
                  count=1
              )
              if activity_count != 1:
                  raise RuntimeError(
                      'MainActivity manifest entry not found for wide-gamut preview'
                  )
          manifest_file.write_text(manifest)

          # HOST CHECK
          high_ring_host = project / 'tools/HighRingFinishingPolicyHostChecks.java'
          high_ring_host.write_text('''package com.dennis.photomasterai;

          public final class HighRingFinishingPolicyHostChecks {
              public static void main(String[] args) {
                  HighRingFinishingPolicy.Caps normal =
                HighRingFinishingPolicy.caps(0.82);
                  require(!normal.active,
                "normal ringing source must remain uncapped");

                  HighRingFinishingPolicy.Caps aircraft =
                HighRingFinishingPolicy.caps(0.97);
                  require(aircraft.active,
                "aircraft reference should activate high-ring guard");
                  require(Math.abs(aircraft.sharpenCap - 0.070) < 1.0e-9,
                "aircraft sharpen cap mismatch");
                  require(Math.abs(aircraft.microContrastCap - 0.140) < 1.0e-9,
                "aircraft micro-contrast cap mismatch");

                  HighRingFinishingPolicy.Caps extreme =
                HighRingFinishingPolicy.caps(1.00);
                  require(extreme.active,
                "extreme ringing source should activate guard");
                  require(extreme.sharpenCap < aircraft.sharpenCap,
                "extreme ringing must use tighter sharpen cap");
                  require(extreme.microContrastCap < aircraft.microContrastCap,
                "extreme ringing must use tighter micro-contrast cap");

                  System.out.println(
                "HighRingFinishingPolicyHostChecks passed");
              }

              private static void require(boolean condition, String message) {
                  if (!condition) {
            throw new AssertionError(message);
                  }
              }
          }
          ''')

          print('v0.4.23 colour-space compatibility guard applied')
          print('AUTO source-space matching: sRGB / Display P3')
          print('Wide-gamut preview opt-in enabled')
          print('High-ring finishing caps enabled at source ring >= 0.90')
          print('v0.4.22 neural/person/vignetting/optics/shadow logic unchanged')
          PY

          grep -q "versionCode 32" "$PROJECT/app/build.gradle"
          grep -q "versionName '0.4.23'" "$PROJECT/app/build.gradle"
          grep -q "class ColorSpaceGuard" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/ColorSpaceGuard.java"
