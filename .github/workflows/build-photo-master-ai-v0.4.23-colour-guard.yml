          Expected v0.4.23: guard active, <=7% detail and <=14% micro.

          FIRST TESTS
          1. Samsung Display P3 aircraft original — output report should say Display P3.
          2. Samsung Display P3 playground original — output should remain Display P3.
          3. Known sRGB photo — output should remain sRGB.
          4. Aircraft regression — no false person relighting.
          5. Playground neural regression — 62% may fail and 50% may recover.
          6. Duck / waterfall regressions.
          7. Background / screen-off processing.
