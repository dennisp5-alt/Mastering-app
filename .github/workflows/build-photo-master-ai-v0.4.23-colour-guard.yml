      - name: Restore stable Photo Master debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photo-master-ai-debug-keystore-v1

      - name: Create signing key on first build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Photo Master AI,O=Dennis Photo Master,C=AU" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name 'sdkmanager' | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER" || { echo "::error::sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build v0.4.23 APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace

      - name: Verify package and prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.source.outputs.project }}"
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "::error::APK not found"; exit 1; }
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK/build-tools/35.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='com.dennis.photomasterai'"
          echo "$BADGING" | grep -q "versionCode='32'"
          echo "$BADGING" | grep -q "versionName='0.4.23'"
          unzip -l "$APK" | grep -q 'assets/nafnet_sidd_width32_fp16.tflite'
          rm -rf artifact
          mkdir artifact
          OUT="artifact/PhotoMasterAI-v0.4.23-COLOUR-HIGH-RING-GUARD.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "artifact/PhotoMasterAI-v0.4.23-COLOUR-HIGH-RING-GUARD-SHA256.txt"
          cat > "artifact/PhotoMasterAI-v0.4.23-Notes.txt" <<'EOF'
          Photo Master AI — v0.4.23 Colour Space + High-Ring Guard

          Version: 0.4.23
          versionCode: 32

          BASELINE
          Exact v0.4.22 safety source rebuilt from the same deterministic chain.
          v0.4.22 successful run: 37575369183.

          RETAINED UNCHANGED
          - NAFNet-SIDD width32 / Classic LiteRT OpenCL GPU / FP32
          - no CPU neural fallback
          - v0.4.22 Person Evidence Guard
          - v0.4.22 >50% high-blend detail-retention guard
          - adaptive neural blend recovery
          - smooth-surface protection
          - local neural integrity guard
          - final shadow-integrity rollback
          - chromatic-aberration/fringe QC and rollback
          - measured vignetting intelligence and thresholds
          - background / screen-off processing
          - full-resolution output / JPEG quality 100

          NEW 1 — AUTO COLOUR-SPACE COMPATIBILITY
          - Detects the Android bitmap source colour space automatically.
          - sRGB source stays sRGB.
          - Display P3 source receives Display-P3-matched neural/master output bitmaps.
          - Final post-optics/post-vignetting output is converted back to the authoritative
            source colour space before JPEG save if any intermediate stage changed it.
          - MainActivity opts into wideColorGamut preview on compatible displays.
          - Report shows source/output colour spaces and whether the source is wide gamut.

          IMPORTANT COLOUR LIMIT
          Existing packed getPixel/getPixels/setPixel/setPixels processing uses Android
          ColorInt semantics, which are sRGB. Therefore v0.4.23 fixes accidental
          colour-space/profile loss and display/export matching, but it is NOT yet a
          full native-Display-P3 per-pixel processing rewrite. It preserves appearance
