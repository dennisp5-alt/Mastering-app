            app/src/main/java/com/dennis/photomasterai/PersonEvidencePolicy.java \
            app/src/main/java/com/dennis/photomasterai/HighRingFinishingPolicy.java \
            tools/DeepPixelRepairHostChecks.java \
            tools/RepairSafetyPolicyHostChecks.java \
            tools/NeuralDenoisePolicyHostChecks.java \
            tools/SocialSourcePolicyHostChecks.java \
            tools/SmoothSurfaceGuardHostChecks.java \
