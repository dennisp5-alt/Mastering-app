name: Build Photo Master AI v0.4.35 Night Light Adaptive Safe Strength

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-photo-master-ai-v0.4.35-night-light-adaptive-safe-strength.yml'
      - 'tools/apply_v0434_night_texture.py'
      - 'tools/apply_v0435_night_adaptive_backoff.py'

permissions:
  contents: write

jobs:
  build:
    name: Photo Master AI v0.4.35 Night Light Adaptive Safe Strength
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover exact successful v0.4.32 source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          V0432_COMMIT="736bb4bcb7dc3efe7dec8143cbb1a822affa97ce"

          git cat-file -e "${V0432_COMMIT}^{commit}" || {
            echo "::error::Successful v0.4.32 commit unavailable"
            exit 1
          }

          git show \
            "${V0432_COMMIT}:.github/workflows/build-photo-master-ai-v0.4.32-night-light-detail-guard.yml" \
            > /tmp/v0432.yml

          python3 - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/v0432.yml').read_text().splitlines()

          def extract_step(name, destination):
              start = None

              for i, line in enumerate(lines):
                  if line.strip() == '- name: ' + name:
                      start = i
                      break

              if start is None:
                  raise RuntimeError(
                      'Workflow step not found: ' + name
                  )

              run = None

              for i in range(start, len(lines)):
                  if lines[i].strip() == 'run: |':
                      run = i
                      break

                  if (
                      i > start
                      and lines[i].startswith('      - name:')
                  ):
                      break

              if run is None:
                  raise RuntimeError(
                      'Run block not found: ' + name
                  )

              body = []

              for line in lines[run + 1:]:
                  if line.startswith('      - name:'):
                      break

                  if not line.strip():
                      body.append('')

                  elif line.startswith('          '):
                      body.append(line[10:])

                  else:
                      raise RuntimeError(
                          'Unexpected indentation while extracting: '
                          + name
                      )

              Path(destination).write_text(
                  '\n'.join(body) + '\n'
              )

          extract_step(
              'Recover exact successful v0.4.31 source',
              '/tmp/recover-v0431.sh'
          )

          extract_step(
              'Apply v0.4.32 Night Light Detail Guard',
              '/tmp/apply-v0432.sh'
          )
          PY

          bash /tmp/recover-v0431.sh

          PROJECT="$(
            find photomaster-v044-build \
              -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -printf '%h\n' \
              | head -n 1
          )"

          test -n "$PROJECT" || {
            echo "::error::Recovered project not found"
            exit 1
          }

          export PROJECT

          bash /tmp/apply-v0432.sh

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          grep -q "versionCode 41" \
            "$PROJECT/app/build.gradle"

          grep -q "versionName '0.4.32'" \
            "$PROJECT/app/build.gradle"

          grep -q "effectiveStrength" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

          grep -q "edgeProtection" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

          grep -q "localEdgeStrength" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"

          grep -q "protectedEdgePixels" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"

          grep -q "MAX_MEAN_CHANNEL_DELTA = 0.0080" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

          grep -q "MAX_CHANNEL_CODE_DELTA = 8" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"

          echo "Exact successful v0.4.32 source recovered"

      - name: Apply v0.4.33 Night Light QC Accounting Fix
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          project = Path(os.environ['PROJECT'])

          # -------------------------------------------------------
          # VERSION
          # -------------------------------------------------------

          build_file = project / 'app/build.gradle'
          build = build_file.read_text()

          if 'versionCode 41' not in build:
              raise RuntimeError(
                  'v0.4.32 versionCode not found'
              )

          if "versionName '0.4.32'" not in build:
              raise RuntimeError(
                  'v0.4.32 versionName not found'
              )

          build = build.replace(
              'versionCode 41',
              'versionCode 42',
              1
          )

          build = build.replace(
              "versionName '0.4.32'",
              "versionName '0.4.33'",
              1
          )

          build_file.write_text(build)

          # -------------------------------------------------------
          # POLICY ACCOUNTING HELPERS
          # -------------------------------------------------------

          policy_file = project / (
              'app/src/main/java/com/dennis/'
              'photomasterai/NightLightControlPolicy.java'
          )

          policy = policy_file.read_text()

          if 'MAX_MEAN_CHANNEL_DELTA = 0.0080' not in policy:
              raise RuntimeError(
                  'Night Light mean-delta safety ceiling changed unexpectedly'
              )

          helper_anchor = (
              '    private static void add('
          )

          if helper_anchor not in policy:
              raise RuntimeError(
                  'Night Light policy helper anchor not found'
              )

          accounting_helpers = r'''
              public static double globalMeanChannelDelta(
                      double channelDeltaSum,
                      long totalPixels) {

                  if (
                      totalPixels <= 0
                              || !Double.isFinite(
                                      channelDeltaSum)
                              || channelDeltaSum <= 0.0) {

                      return 0.0;
                  }

                  return channelDeltaSum
                          / (double)
                          totalPixels;
              }

              public static double activeMeanChannelDelta(
                      double channelDeltaSum,
                      long activePixels) {

                  if (
                      activePixels <= 0
                              || !Double.isFinite(
                                      channelDeltaSum)
                              || channelDeltaSum <= 0.0) {

                      return 0.0;
                  }

                  return channelDeltaSum
                          / (double)
                          activePixels;
              }

          '''

          policy = policy.replace(
              helper_anchor,
              accounting_helpers + helper_anchor,
              1
          )

          policy, rename_count = re.subn(
              r'\bmeanChannelDelta\b',
              'globalMeanChannelDelta',
              policy
          )

          if rename_count < 3:
              raise RuntimeError(
                  'Night Light policy mean-delta rename incomplete'
              )

          old_reason = (
              '"mean channel delta %.4f > %.4f"'
          )

          new_reason = (
              '"global mean channel delta %.4f > %.4f"'
          )

          if old_reason not in policy:
              raise RuntimeError(
                  'Night Light QC reason anchor not found'
              )

          policy = policy.replace(
              old_reason,
              new_reason,
              1
          )

          policy_file.write_text(policy)

          # -------------------------------------------------------
          # ENGINE ACCOUNTING FIX
          # -------------------------------------------------------

          engine_file = project / (
              'app/src/main/java/com/dennis/'
              'photomasterai/NightLightControlIntelligence.java'
          )

          engine = engine_file.read_text()

          old_mean_pattern = re.compile(
              r'double\s+meanChannelDelta\s*=\s*'
              r'summary\.channelDeltaCount\s*>\s*0\s*'
              r'\?\s*summary\.channelDeltaSum\s*'
              r'/\s*summary\.channelDeltaCount\s*'
              r':\s*0\.0\s*;'
          )

          new_mean_block = r'''double globalMeanChannelDelta =
                          NightLightControlPolicy
                                  .globalMeanChannelDelta(
                                          summary.channelDeltaSum,
                                          summary.totalPixels);

                  double activeMeanChannelDelta =
                          NightLightControlPolicy
                                  .activeMeanChannelDelta(
                                          summary.channelDeltaSum,
                                          summary.activePixels);'''

          engine, mean_count = old_mean_pattern.subn(
              new_mean_block,
              engine,
              count=1
          )

          if mean_count != 1:
              raise RuntimeError(
                  'Night Light mean-delta accounting replacement failed'
              )

          # -------------------------------------------------------
          # QC MUST USE GLOBAL MEAN
          # -------------------------------------------------------

          qc_pattern = re.compile(
              r'(hotspotReduction,\s*'
              r'darkSkyMeanDelta,\s*'
              r'activeFraction,\s*)'
              r'meanChannelDelta'
              r'(\s*,\s*'
              r'summary\.maxChannelDelta\s*'
              r'\)\s*;)'
          )

          engine, qc_count = qc_pattern.subn(
              r'\1globalMeanChannelDelta\2',
              engine,
              count=1
          )

          if qc_count != 1:
              raise RuntimeError(
                  'Night Light QC global-mean routing failed'
              )

          # -------------------------------------------------------
          # REPORT GLOBAL + ACTIVE MEAN SEPARATELY
          # -------------------------------------------------------

          old_report_literal = (
              '"• Active pixels %.1f%% | dark-sky movement %.5f '
              '| mean channel delta %.4f | max channel delta %.4f%n"'
          )

          new_report_literal = (
              '"• Active pixels %.1f%% | dark-sky movement %.5f '
              '| global mean channel delta %.4f '
              '| active mean channel delta %.4f '
              '| max channel delta %.4f%n"'
          )

          if old_report_literal not in engine:
              raise RuntimeError(
                  'Night Light mean-delta report anchor not found'
              )

          engine = engine.replace(
              old_report_literal,
              new_report_literal,
              1
          )

          report_args_pattern = re.compile(
              r'(activeFraction\s*\*\s*100\.0,\s*'
              r'darkSkyMeanDelta,\s*)'
              r'meanChannelDelta'
              r'(\s*,\s*'
              r'summary\.maxChannelDelta\s*'
              r'\)\s*\);)'
          )

          report_args_replacement = (
              r'\1globalMeanChannelDelta,'
              '\n'
              '                                  '
              'activeMeanChannelDelta'
              r'\2'
          )

          engine, report_count = report_args_pattern.subn(
              report_args_replacement,
              engine,
              count=1
          )

          if report_count != 1:
              raise RuntimeError(
                  'Night Light global/active report routing failed'
              )

          engine_file.write_text(engine)

          # -------------------------------------------------------
          # ACCOUNTING HOST CHECKS
          # -------------------------------------------------------

          host_file = project / (
              'tools/'
              'NightLightQcAccountingHostChecks.java'
          )

          host_file.write_text(r'''package com.dennis.photomasterai;

          public final class NightLightQcAccountingHostChecks {

              public static void main(
                      String[] args) {

                  long totalPixels =
                          1000;

                  long activePixels =
                          229;

                  double activeMeanTarget =
                          0.0239;

                  double channelDeltaSum =
                          activeMeanTarget
                                  * activePixels;

                  double globalMean =
                          NightLightControlPolicy
                                  .globalMeanChannelDelta(
                                          channelDeltaSum,
                                          totalPixels);

                  double activeMean =
                          NightLightControlPolicy
                                  .activeMeanChannelDelta(
                                          channelDeltaSum,
                                          activePixels);

                  require(
                          Math.abs(
                                  globalMean
                                          - 0.0054731)
                                  < 0.0000001,
                          "global mean accounting incorrect");

                  require(
                          Math.abs(
                                  activeMean
                                          - 0.0239)
                                  < 0.0000001,
                          "active mean accounting incorrect");

                  require(
                          globalMean
                                  < NightLightControlPolicy
                                          .MAX_MEAN_CHANNEL_DELTA,
                          "global movement should remain below existing QC ceiling");

                  require(
                          activeMean
                                  > NightLightControlPolicy
                                          .MAX_MEAN_CHANNEL_DELTA,
                          "regression setup must distinguish active from global mean");

                  NightLightControlPolicy.QcResult correctBasis =
                          NightLightControlPolicy.evaluateCandidate(
                                  0.0403,
                                  0.0397,
                                  0.0081,
                                  0.0081,
                                  0.0169,
                                  0.0169,
                                  0.844,
                                  0.813,
                                  0.194,
                                  0.194,
                                  0.000,
                                  0.000,
                                  0.000,
                                  0.000,
                                  0.0248,
                                  0.0000,
                                  0.229,
                                  globalMean,
                                  0.0314);

                  require(
                          correctBasis.accepted,
                          "safe representative candidate should pass on global accounting");

                  NightLightControlPolicy.QcResult wrongBasis =
                          NightLightControlPolicy.evaluateCandidate(
                                  0.0403,
                                  0.0397,
                                  0.0081,
                                  0.0081,
                                  0.0169,
                                  0.0169,
                                  0.844,
                                  0.813,
                                  0.194,
                                  0.194,
                                  0.000,
                                  0.000,
                                  0.000,
                                  0.000,
                                  0.0248,
                                  0.0000,
                                  0.229,
                                  activeMean,
                                  0.0314);

                  require(
                          !wrongBasis.accepted,
                          "active-pixel mean must not masquerade as global mean");

                  require(
                          wrongBasis.reason.contains(
                                  "global mean channel delta"),
                          "QC accounting rejection label missing");

                  require(
                          NightLightControlPolicy
                                  .globalMeanChannelDelta(
                                          1.0,
                                          0)
                                  == 0.0,
                          "zero total-pixel denominator must return zero");

                  require(
                          NightLightControlPolicy
                                  .activeMeanChannelDelta(
                                          1.0,
                                          0)
                                  == 0.0,
                          "zero active-pixel denominator must return zero");

                  System.out.println(
                          "NightLightQcAccountingHostChecks passed");
              }

              private static void require(
                      boolean condition,
                      String message) {

                  if (!condition)
                      throw new AssertionError(
                              message);
              }
          }
          ''')

          print(
              'v0.4.33 applied: Night Light QC accounting now uses '
              'image-wide mean channel movement while retaining '
              'active-pixel movement as a diagnostic; '
              'all safety ceilings remain unchanged'
          )
          PY

          grep -q "versionCode 42" \
            "$PROJECT/app/build.gradle"

          grep -q "versionName '0.4.33'" \
            "$PROJECT/app/build.gradle"

          grep -q "MAX_MEAN_CHANNEL_DELTA = 0.0080" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

          grep -q "MAX_CHANNEL_DELTA = 0.0320" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

          grep -q "globalMeanChannelDelta" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

          grep -q "activeMeanChannelDelta" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

          grep -q "global mean channel delta" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

          grep -q "globalMeanChannelDelta" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"

          grep -q "activeMeanChannelDelta" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"

          grep -q "global mean channel delta" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"

          grep -q "active mean channel delta" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"

          grep -q "NightLightQcAccountingHostChecks" \
            "$PROJECT/tools/NightLightQcAccountingHostChecks.java"

          grep -q "MAX_CHANNEL_CODE_DELTA = 8" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"

      - name: Apply v0.4.34 Night Light Texture Preservation
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail

          python3             tools/apply_v0434_night_texture.py             "$PROJECT"

          grep -q "versionCode 43"             "$PROJECT/app/build.gradle"

          grep -q "versionName '0.4.34'"             "$PROJECT/app/build.gradle"

          grep -q "textureProtection"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

          grep -q "cap = 0.225"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

          grep -q "localTextureStrength"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"

          grep -q "MAX_MEAN_CHANNEL_DELTA = 0.0080"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

      - name: Apply v0.4.35 Night Light Adaptive Safe Strength
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail

          python3             tools/apply_v0435_night_adaptive_backoff.py             "$PROJECT"

          grep -q "versionCode 44"             "$PROJECT/app/build.gradle"

          grep -q "versionName '0.4.35'"             "$PROJECT/app/build.gradle"

          grep -q "MAX_ADAPTIVE_ATTEMPTS"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

          grep -q "adaptiveStrengthFactor"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

          grep -q "adaptive safe-strength search exhausted"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"

          grep -q "Night-light control ACCEPTED — adaptive strength"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"

      - name: Fetch pinned NAFNet-SIDD model
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"

          ASSETS="$PROJECT/app/src/main/assets"
          MODEL="$ASSETS/nafnet_sidd_width32_fp16.tflite"

          mkdir -p "$ASSETS"

          URL='https://huggingface.co/litert-community/NAFNet-SIDD-width32-LiteRT/resolve/main/nafnet_sidd_width32_fp16.tflite?download=true'

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --output "$MODEL.tmp" \
            "$URL"

          mv "$MODEL.tmp" "$MODEL"

          test "$(stat -c%s "$MODEL")" -eq 62454048 || {
            echo "::error::Unexpected NAFNet model size"
            exit 1
          }

          echo \
            'f8fbaa422411683c53e802cf7cc7cf9be0a0de00886ad4af057232e26b172a0c  '"$MODEL" \
            | sha256sum -c -

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run all safety host checks
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf host-checks
          mkdir host-checks

          javac -d host-checks \
            app/src/main/java/com/dennis/photomasterai/DeepPixelRepair.java \
            app/src/main/java/com/dennis/photomasterai/RepairSafetyPolicy.java \
            app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java \
            app/src/main/java/com/dennis/photomasterai/SocialSourcePolicy.java \
            app/src/main/java/com/dennis/photomasterai/NeuralIntegrityPolicy.java \
            app/src/main/java/com/dennis/photomasterai/OpticalFringePolicy.java \
            app/src/main/java/com/dennis/photomasterai/VignettingPolicy.java \
            app/src/main/java/com/dennis/photomasterai/PersonEvidencePolicy.java \
            app/src/main/java/com/dennis/photomasterai/HighRingFinishingPolicy.java \
            app/src/main/java/com/dennis/photomasterai/GeometryPolicy.java \
            app/src/main/java/com/dennis/photomasterai/LocalTonePolicy.java \
            app/src/main/java/com/dennis/photomasterai/MixedLightColourPolicy.java \
            app/src/main/java/com/dennis/photomasterai/PerceptualImprovementPolicy.java \
            app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java \
            tools/DeepPixelRepairHostChecks.java \
            tools/RepairSafetyPolicyHostChecks.java \
            tools/NeuralDenoisePolicyHostChecks.java \
            tools/SocialSourcePolicyHostChecks.java \
            tools/SmoothSurfaceGuardHostChecks.java \
            tools/NeuralIntegrityPolicyHostChecks.java \
            tools/OpticalFringePolicyHostChecks.java \
            tools/VignettingPolicyHostChecks.java \
            tools/PersonEvidencePolicyHostChecks.java \
            tools/HighBlendDetailGuardHostChecks.java \
            tools/HighRingFinishingPolicyHostChecks.java \
            tools/GeometryPolicyHostChecks.java \
            tools/LocalTonePolicyHostChecks.java \
            tools/MixedLightColourPolicyHostChecks.java \
            tools/MixedLightContinuityPolicyHostChecks.java \
            tools/PerceptualImprovementPolicyHostChecks.java \
            tools/NightLightControlPolicyHostChecks.java \
            tools/NightLightDetailGuardHostChecks.java \
            tools/NightLightQcAccountingHostChecks.java

          for C in \
            DeepPixelRepairHostChecks \
            RepairSafetyPolicyHostChecks \
            NeuralDenoisePolicyHostChecks \
            SocialSourcePolicyHostChecks \
            SmoothSurfaceGuardHostChecks \
            NeuralIntegrityPolicyHostChecks \
            OpticalFringePolicyHostChecks \
            VignettingPolicyHostChecks \
            PersonEvidencePolicyHostChecks \
            HighBlendDetailGuardHostChecks \
            HighRingFinishingPolicyHostChecks \
            GeometryPolicyHostChecks \
            LocalTonePolicyHostChecks \
            MixedLightColourPolicyHostChecks \
            MixedLightContinuityPolicyHostChecks \
            PerceptualImprovementPolicyHostChecks \
            NightLightControlPolicyHostChecks \
            NightLightDetailGuardHostChecks \
            NightLightQcAccountingHostChecks
          do
            java \
              -cp host-checks \
              "com.dennis.photomasterai.$C"
          done

      - name: Run v0.4.34 texture preservation host check
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf host-checks-v0434
          mkdir host-checks-v0434

          javac -d host-checks-v0434             app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java             tools/NightLightTexturePreservationHostChecks.java

          java             -cp host-checks-v0434             com.dennis.photomasterai.NightLightTexturePreservationHostChecks

      - name: Run v0.4.35 adaptive backoff host check
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf host-checks-v0435
          mkdir host-checks-v0435

          javac -d host-checks-v0435             app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java             tools/NightLightAdaptiveBackoffHostChecks.java

          java             -cp host-checks-v0435             com.dennis.photomasterai.NightLightAdaptiveBackoffHostChecks

      - name: Restore stable Photo Master debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photo-master-ai-debug-keystore-v1

      - name: Create signing key on first build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then

            keytool \
              -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Photo Master AI,O=Dennis Photo Master,C=AU" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then

            SDKMANAGER="$(
              find "$SDK/cmdline-tools" \
                -type f \
                -name 'sdkmanager' \
                | sort -V \
                | tail -n 1
            )"
          fi

          test -n "$SDKMANAGER" || {
            echo "::error::sdkmanager not found"
            exit 1
          }

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build v0.4.35 APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:assembleDebug \
            --stacktrace

      - name: Verify package and prepare artifact
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "::error::APK not found"
            exit 1
          }

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK/build-tools/35.0.0/aapt"

          BADGING="$(
            "$AAPT" dump badging "$APK" \
              | head -n 1
          )"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -q \
            "package: name='com.dennis.photomasterai'"

          echo "$BADGING" \
            | grep -q \
            "versionCode='44'"

          echo "$BADGING" \
            | grep -q \
            "versionName='0.4.35'"

          unzip -l "$APK" \
            | grep -q \
            'assets/nafnet_sidd_width32_fp16.tflite'

          rm -rf artifact
          mkdir artifact

          OUT="artifact/PhotoMasterAI-v0.4.35-NIGHT-LIGHT-ADAPTIVE-SAFE-STRENGTH.apk"

          cp \
            "$APK" \
            "$OUT"

          sha256sum "$OUT" \
            > "artifact/PhotoMasterAI-v0.4.35-NIGHT-LIGHT-ADAPTIVE-SAFE-STRENGTH-SHA256.txt"

          cat > "artifact/PhotoMasterAI-v0.4.35-Notes.txt" <<'EOF'
          Photo Master AI — v0.4.35 Night Light Adaptive Safe Strength

          Version: 0.4.35
          versionCode: 44

          BASELINE
          Exact successful v0.4.32 source reconstructed from
          commit 736bb4bcb7dc3efe7dec8143cbb1a822affa97ce.

          PURPOSE
          v0.4.32 successfully added Night Light Detail Guard and
          substantially improved detail preservation.

          The remaining Night Light rollback exposed an accounting
          mismatch: channel movement was averaged over correction-
          eligible pixels but compared with an image-wide safety limit.

          FIX
          - Night Light global mean channel movement now uses:
              channelDeltaSum / totalPixels
          - Night Light active-pixel mean is separately reported using:
              channelDeltaSum / activePixels
          - QC uses global image-wide mean only
          - active mean remains diagnostic only
          - existing MAX_MEAN_CHANNEL_DELTA remains 0.0080
          - existing MAX_CHANNEL_DELTA remains 0.0320
          - existing 98.5% detail-retention requirement is unchanged
          - no safety threshold has been loosened
          - no Night Light rendering strength has been increased

          V0.4.34 ADDITIONS
          - 3x3 low-contrast micro-texture protection
          - protects grass, concrete, tyre/deck and fine mechanical detail
          - high-ring Night Light cap reduced from 0.240 to 0.225
          - 98.5% detail QC remains unchanged
          - no safety threshold has been relaxed

          V0.4.35 ADDITIONS
          - adaptive safe-strength search after a Night Light QC rejection
          - attempts 100%, 85%, 72%, 60%, then 50% of guarded strength
          - accepts the strongest candidate that passes every existing QC gate
          - rejected candidates are recycled before the next attempt
          - full rollback remains if no attempt passes
          - no QC threshold has been relaxed

          RETAINED
          - v0.4.32 Night Light Detail Guard
          - ring-aware Night Light strength cap
          - edge/texture preservation
          - 8/255 Night Light channel movement cap
          - v0.4.31 Night Light classifier
          - v0.4.30 Perceptual Improvement Controller
          - v0.4.29 Mixed-Light Continuity Guard
          - v0.4.27 Local Tone safeguards
          - v0.4.25 Geometry structural override
          - preserve-source sRGB / Display P3
          - NAFNet-SIDD safeguards
          - optics / vignetting safeguards
          - shadow-integrity rollback
          - background / screen-off processing
          - JPEG quality 100
          EOF

      - name: Validate APK installability
        shell: bash
        run: |
          set -euo pipefail

          APK="artifact/PhotoMasterAI-v0.4.35-NIGHT-LIGHT-ADAPTIVE-SAFE-STRENGTH.apk"
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"

          test -f "$APK"

          echo "Testing APK ZIP/container integrity"
          unzip -t "$APK"

          echo "Checking 4-byte ZIP alignment"
          "$BT/zipalign" -c -v 4 "$APK"

          echo "Checking Android APK signature"
          "$BT/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo "APK passed container, alignment and signature verification"

      - name: Publish raw APK GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="photo-master-ai-v0.4.35-r1"
          APK="artifact/PhotoMasterAI-v0.4.35-NIGHT-LIGHT-ADAPTIVE-SAFE-STRENGTH.apk"
          SHA="artifact/PhotoMasterAI-v0.4.35-NIGHT-LIGHT-ADAPTIVE-SAFE-STRENGTH-SHA256.txt"
          NOTES="artifact/PhotoMasterAI-v0.4.35-Notes.txt"

          if gh release view "$TAG" \
            --repo "${{ github.repository }}" >/dev/null 2>&1
          then
            gh release upload "$TAG" \
              --repo "${{ github.repository }}" \
              --clobber \
              "$APK" "$SHA" "$NOTES"
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "Photo Master AI v0.4.35" \
              --notes "Raw APK release. APK container, ZIP alignment and signing are verified in GitHub Actions before publishing." \
              "$APK" "$SHA" "$NOTES"
          fi

          echo "Raw installable APK published to GitHub Releases"

      - name: Upload APK and continuation notes
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMasterAI-v0.4.35-NIGHT-LIGHT-ADAPTIVE-SAFE-STRENGTH
          path: |
            artifact/PhotoMasterAI-v0.4.35-NIGHT-LIGHT-ADAPTIVE-SAFE-STRENGTH.apk
            artifact/PhotoMasterAI-v0.4.35-NIGHT-LIGHT-ADAPTIVE-SAFE-STRENGTH-SHA256.txt
            artifact/PhotoMasterAI-v0.4.35-Notes.txt
          if-no-files-found: error
          retention-days: 30
