      - name: Validate APK installability
        shell: bash
        run: |
          set -euo pipefail

          APK="artifact/PhotoMasterAI-v0.4.44-PERFORMANCE-FASTPATH.apk"
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"

          test -f "$APK"

          echo "Testing APK ZIP/container integrity"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'assets/lut_classifier.onnx'
          unzip -l "$APK" | grep -q 'assets/lut_basis_33.bin'

          echo "Checking 4-byte ZIP alignment"
          "$BT/zipalign" -c -v 4 "$APK"

          echo "Checking Android APK signature"
          "$BT/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"

          # Separate lab package: do not require the expired production
          # signing cache. Verify the APK was signed by THIS build's
          # explicit keystore and report the certificate fingerprint.
          EXPECTED_CERT="$(keytool -exportcert -alias androiddebugkey \
            -keystore "$HOME/.android/debug.keystore" -storepass android \
            | sha256sum | cut -d ' ' -f1)"
          CERT="$("$BT/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          test "$CERT" = "$EXPECTED_CERT" || {
            echo "::error::APK signing certificate changed: $CERT"
            exit 1
          }
          test "$CERT" = "3a8e9c9ec8d94c6b7ac4d37d71310e94724cd263ef7b78c799993e0265b1edd3" || {
            echo "::error::Installer certificate incompatible with installed v0.4.40 Studio Lab"
            exit 1
          }
          echo "Photo Master AI Studio Lab signer matches v0.4.40 installed package"


          echo "APK passed container, alignment and signature verification"

      - name: Publish raw APK GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="photo-master-ai-v0.4.44-performance-fastpath-r1"
          APK="artifact/PhotoMasterAI-v0.4.44-PERFORMANCE-FASTPATH.apk"
          SHA="artifact/PhotoMasterAI-v0.4.44-PERFORMANCE-FASTPATH-SHA256.txt"
          NOTES="artifact/PhotoMasterAI-v0.4.44-Performance-Notes.txt"

          if gh release view "$TAG" \
            --repo "${{ github.repository }}" >/dev/null 2>&1
          then
            gh release upload "$TAG" \
              --repo "${{ github.repository }}" \
              --clobber \
              "$APK" "$SHA" "$NOTES"
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "Photo Master AI v0.4.44 Quality-Preserving Fast Path" \
              --notes "Standalone independently signed Neural Colour Lab experiment. Normal Photo Master AI remains untouched. Model, ZIP, alignment and APK signing verified." \
              "$APK" "$SHA" "$NOTES"
          fi

          echo "Raw installable APK published to GitHub Releases"

      - name: Upload APK and continuation notes
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMasterAI-v0.4.44-PERFORMANCE-FASTPATH
          path: |
            artifact/PhotoMasterAI-v0.4.44-PERFORMANCE-FASTPATH.apk
            artifact/PhotoMasterAI-v0.4.44-PERFORMANCE-FASTPATH-SHA256.txt
            artifact/PhotoMasterAI-v0.4.44-Performance-Notes.txt
          if-no-files-found: error
          retention-days: 30
