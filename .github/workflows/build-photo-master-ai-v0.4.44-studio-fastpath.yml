name: Build Photo Master AI v0.4.44 Performance Fast Path

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-photo-master-ai-v0.4.44-studio-fastpath.yml'
      - 'tools/apply_v0444_studio_performance.py'
      - 'tools/apply_v0443_cumulative_colour_guard.py'
      - 'tools/studio/CumulativeColourGuard.java'
      - 'tools/studio/SelectiveColourPolicy.java'
      - 'tools/studio/SelectiveColourPolicyHostChecks.java'
      - 'tools/apply_v0442_auto_light_wb.py'
      - 'tools/studio/AutoTonePolicy.java'
      - 'tools/studio/IntelligentAuto.java'
      - 'tools/studio/AutoTonePolicyHostChecks.java'
      - 'tools/apply_v0441_neural_formatter_fix.py'
      - 'tools/studio/NeuralFormatRegressionHostChecks.java'
      - 'tools/apply_v0440_studio_lab.py'
      - 'tools/studio/StudioFinish.java'
      - 'tools/studio/StudioFinishPolicy.java'
      - 'tools/apply_v0439_p3_neural_lab.py'
      - 'tools/neural_colour/DisplayP3RenderMethod.txt'
      - 'tools/apply_v0438_neural_colour_experiment.py'
      - 'tools/neural_colour/AdaptiveNeuralColour.java'
      - 'tools/apply_v0437_distributed_streetlights.py'
      - 'tools/apply_v0436_night_spatial_continuity.py'
      - 'tools/apply_stable_signing.py'
      - 'tools/apply_v0434_night_texture.py'
      - 'tools/apply_v0435_night_adaptive_backoff.py'

permissions:
  contents: write

jobs:
  build:
    name: Photo Master AI v0.4.44 Studio Fast Path
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover exact successful v0.4.32 source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          V0432_COMMIT="736bb4bcb7dc3efe7dec8143cbb1a822affa97ce"

          git cat-file -e "${V0432_COMMIT}^{commit}" || {
            echo "::error::Successful v0.4.32 commit unavailable"
            exit 1
          }

          git show \
            "${V0432_COMMIT}:.github/workflows/build-photo-master-ai-v0.4.32-night-light-detail-guard.yml" \
            > /tmp/v0432.yml

          python3 - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/v0432.yml').read_text().splitlines()

          def extract_step(name, destination):
              start = None

              for i, line in enumerate(lines):
                  if line.strip() == '- name: ' + name:
                      start = i
                      break

              if start is None:
                  raise RuntimeError(
                      'Workflow step not found: ' + name
                  )

              run = None

              for i in range(start, len(lines)):
                  if lines[i].strip() == 'run: |':
                      run = i
                      break

                  if (
                      i > start
                      and lines[i].startswith('      - name:')
                  ):
                      break

              if run is None:
                  raise RuntimeError(
                      'Run block not found: ' + name
                  )

              body = []

              for line in lines[run + 1:]:
                  if line.startswith('      - name:'):
                      break

                  if not line.strip():
                      body.append('')

                  elif line.startswith('          '):
                      body.append(line[10:])

                  else:
                      raise RuntimeError(
                          'Unexpected indentation while extracting: '
                          + name
                      )

              Path(destination).write_text(
                  '\n'.join(body) + '\n'
              )

          extract_step(
              'Recover exact successful v0.4.31 source',
              '/tmp/recover-v0431.sh'
          )

          extract_step(
              'Apply v0.4.32 Night Light Detail Guard',
              '/tmp/apply-v0432.sh'
          )
          PY

          bash /tmp/recover-v0431.sh

          PROJECT="$(
            find photomaster-v044-build \
              -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -printf '%h\n' \
              | head -n 1
          )"

          test -n "$PROJECT" || {
            echo "::error::Recovered project not found"
            exit 1
          }

          export PROJECT

          bash /tmp/apply-v0432.sh

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          grep -q "versionCode 41" \
            "$PROJECT/app/build.gradle"

          grep -q "versionName '0.4.32'" \
            "$PROJECT/app/build.gradle"

          grep -q "effectiveStrength" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

          grep -q "edgeProtection" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

          grep -q "localEdgeStrength" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"

          grep -q "protectedEdgePixels" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"

          grep -q "MAX_MEAN_CHANNEL_DELTA = 0.0080" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

          grep -q "MAX_CHANNEL_CODE_DELTA = 8" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"

          echo "Exact successful v0.4.32 source recovered"

      - name: Apply v0.4.33 Night Light QC Accounting Fix
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          project = Path(os.environ['PROJECT'])

          # -------------------------------------------------------
          # VERSION
          # -------------------------------------------------------

          build_file = project / 'app/build.gradle'
          build = build_file.read_text()

          if 'versionCode 41' not in build:
              raise RuntimeError(
                  'v0.4.32 versionCode not found'
              )

          if "versionName '0.4.32'" not in build:
              raise RuntimeError(
                  'v0.4.32 versionName not found'
              )

          build = build.replace(
              'versionCode 41',
              'versionCode 42',
              1
          )

          build = build.replace(
              "versionName '0.4.32'",
              "versionName '0.4.33'",
              1
          )

          build_file.write_text(build)

          # -------------------------------------------------------
          # POLICY ACCOUNTING HELPERS
          # -------------------------------------------------------

          policy_file = project / (
              'app/src/main/java/com/dennis/'
              'photomasterai/NightLightControlPolicy.java'
          )

          policy = policy_file.read_text()

          if 'MAX_MEAN_CHANNEL_DELTA = 0.0080' not in policy:
              raise RuntimeError(
                  'Night Light mean-delta safety ceiling changed unexpectedly'
              )

          helper_anchor = (
              '    private static void add('
          )

          if helper_anchor not in policy:
              raise RuntimeError(
                  'Night Light policy helper anchor not found'
              )

          accounting_helpers = r'''
              public static double globalMeanChannelDelta(
                      double channelDeltaSum,
                      long totalPixels) {

                  if (
                      totalPixels <= 0
                              || !Double.isFinite(
                                      channelDeltaSum)
                              || channelDeltaSum <= 0.0) {

                      return 0.0;
                  }

                  return channelDeltaSum
                          / (double)
                          totalPixels;
              }

              public static double activeMeanChannelDelta(
                      double channelDeltaSum,
                      long activePixels) {

                  if (
                      activePixels <= 0
                              || !Double.isFinite(
                                      channelDeltaSum)
                              || channelDeltaSum <= 0.0) {

                      return 0.0;
                  }

                  return channelDeltaSum
                          / (double)
                          activePixels;
              }

          '''

          policy = policy.replace(
              helper_anchor,
              accounting_helpers + helper_anchor,
              1
          )

          policy, rename_count = re.subn(
              r'\bmeanChannelDelta\b',
              'globalMeanChannelDelta',
              policy
          )

          if rename_count < 3:
              raise RuntimeError(
                  'Night Light policy mean-delta rename incomplete'
              )

          old_reason = (
              '"mean channel delta %.4f > %.4f"'
          )

          new_reason = (
              '"global mean channel delta %.4f > %.4f"'
          )

          if old_reason not in policy:
              raise RuntimeError(
                  'Night Light QC reason anchor not found'
              )

          policy = policy.replace(
              old_reason,
              new_reason,
              1
          )

          policy_file.write_text(policy)

          # -------------------------------------------------------
          # ENGINE ACCOUNTING FIX
          # -------------------------------------------------------

          engine_file = project / (
              'app/src/main/java/com/dennis/'
              'photomasterai/NightLightControlIntelligence.java'
          )

          engine = engine_file.read_text()

          old_mean_pattern = re.compile(
              r'double\s+meanChannelDelta\s*=\s*'
              r'summary\.channelDeltaCount\s*>\s*0\s*'
              r'\?\s*summary\.channelDeltaSum\s*'
              r'/\s*summary\.channelDeltaCount\s*'
              r':\s*0\.0\s*;'
          )

          new_mean_block = r'''double globalMeanChannelDelta =
                          NightLightControlPolicy
                                  .globalMeanChannelDelta(
                                          summary.channelDeltaSum,
                                          summary.totalPixels);

                  double activeMeanChannelDelta =
                          NightLightControlPolicy
                                  .activeMeanChannelDelta(
                                          summary.channelDeltaSum,
                                          summary.activePixels);'''

          engine, mean_count = old_mean_pattern.subn(
              new_mean_block,
              engine,
              count=1
          )

          if mean_count != 1:
              raise RuntimeError(
                  'Night Light mean-delta accounting replacement failed'
              )

          # -------------------------------------------------------
          # QC MUST USE GLOBAL MEAN
          # -------------------------------------------------------

          qc_pattern = re.compile(
              r'(hotspotReduction,\s*'
              r'darkSkyMeanDelta,\s*'
              r'activeFraction,\s*)'
              r'meanChannelDelta'
              r'(\s*,\s*'
              r'summary\.maxChannelDelta\s*'
              r'\)\s*;)'
          )

          engine, qc_count = qc_pattern.subn(
              r'\1globalMeanChannelDelta\2',
              engine,
              count=1
          )

          if qc_count != 1:
              raise RuntimeError(
                  'Night Light QC global-mean routing failed'
              )

          # -------------------------------------------------------
          # REPORT GLOBAL + ACTIVE MEAN SEPARATELY
          # -------------------------------------------------------

          old_report_literal = (
              '"• Active pixels %.1f%% | dark-sky movement %.5f '
              '| mean channel delta %.4f | max channel delta %.4f%n"'
          )

          new_report_literal = (
              '"• Active pixels %.1f%% | dark-sky movement %.5f '
              '| global mean channel delta %.4f '
              '| active mean channel delta %.4f '
              '| max channel delta %.4f%n"'
          )

          if old_report_literal not in engine:
              raise RuntimeError(
                  'Night Light mean-delta report anchor not found'
              )

          engine = engine.replace(
              old_report_literal,
              new_report_literal,
              1
          )

          report_args_pattern = re.compile(
              r'(activeFraction\s*\*\s*100\.0,\s*'
              r'darkSkyMeanDelta,\s*)'
              r'meanChannelDelta'
              r'(\s*,\s*'
              r'summary\.maxChannelDelta\s*'
              r'\)\s*\);)'
          )

          report_args_replacement = (
              r'\1globalMeanChannelDelta,'
              '\n'
              '                                  '
              'activeMeanChannelDelta'
              r'\2'
          )

          engine, report_count = report_args_pattern.subn(
              report_args_replacement,
              engine,
              count=1
          )

          if report_count != 1:
              raise RuntimeError(
                  'Night Light global/active report routing failed'
              )

          engine_file.write_text(engine)

          # -------------------------------------------------------
          # ACCOUNTING HOST CHECKS
          # -------------------------------------------------------

          host_file = project / (
              'tools/'
              'NightLightQcAccountingHostChecks.java'
          )

          host_file.write_text(r'''package com.dennis.photomasterai;

          public final class NightLightQcAccountingHostChecks {

              public static void main(
                      String[] args) {

                  long totalPixels =
                          1000;

                  long activePixels =
                          229;

                  double activeMeanTarget =
                          0.0239;

                  double channelDeltaSum =
                          activeMeanTarget
                                  * activePixels;

                  double globalMean =
                          NightLightControlPolicy
                                  .globalMeanChannelDelta(
                                          channelDeltaSum,
                                          totalPixels);

                  double activeMean =
                          NightLightControlPolicy
                                  .activeMeanChannelDelta(
                                          channelDeltaSum,
                                          activePixels);

                  require(
                          Math.abs(
                                  globalMean
                                          - 0.0054731)
                                  < 0.0000001,
                          "global mean accounting incorrect");

                  require(
                          Math.abs(
                                  activeMean
                                          - 0.0239)
                                  < 0.0000001,
                          "active mean accounting incorrect");

                  require(
                          globalMean
                                  < NightLightControlPolicy
                                          .MAX_MEAN_CHANNEL_DELTA,
                          "global movement should remain below existing QC ceiling");

                  require(
                          activeMean
                                  > NightLightControlPolicy
                                          .MAX_MEAN_CHANNEL_DELTA,
                          "regression setup must distinguish active from global mean");

                  NightLightControlPolicy.QcResult correctBasis =
                          NightLightControlPolicy.evaluateCandidate(
                                  0.0403,
                                  0.0397,
                                  0.0081,
                                  0.0081,
                                  0.0169,
                                  0.0169,
                                  0.844,
                                  0.813,
                                  0.194,
                                  0.194,
                                  0.000,
                                  0.000,
                                  0.000,
                                  0.000,
                                  0.0248,
                                  0.0000,
                                  0.229,
                                  globalMean,
                                  0.0314);

                  require(
                          correctBasis.accepted,
                          "safe representative candidate should pass on global accounting");

                  NightLightControlPolicy.QcResult wrongBasis =
                          NightLightControlPolicy.evaluateCandidate(
                                  0.0403,
                                  0.0397,
                                  0.0081,
                                  0.0081,
                                  0.0169,
                                  0.0169,
                                  0.844,
                                  0.813,
                                  0.194,
                                  0.194,
                                  0.000,
                                  0.000,
                                  0.000,
                                  0.000,
                                  0.0248,
                                  0.0000,
                                  0.229,
                                  activeMean,
                                  0.0314);

                  require(
                          !wrongBasis.accepted,
                          "active-pixel mean must not masquerade as global mean");

                  require(
                          wrongBasis.reason.contains(
                                  "global mean channel delta"),
                          "QC accounting rejection label missing");

                  require(
                          NightLightControlPolicy
                                  .globalMeanChannelDelta(
                                          1.0,
                                          0)
                                  == 0.0,
                          "zero total-pixel denominator must return zero");

                  require(
                          NightLightControlPolicy
                                  .activeMeanChannelDelta(
                                          1.0,
                                          0)
                                  == 0.0,
                          "zero active-pixel denominator must return zero");

                  System.out.println(
                          "NightLightQcAccountingHostChecks passed");
              }

              private static void require(
                      boolean condition,
                      String message) {

                  if (!condition)
                      throw new AssertionError(
                              message);
              }
          }
          ''')

          print(
              'v0.4.33 applied: Night Light QC accounting now uses '
              'image-wide mean channel movement while retaining '
              'active-pixel movement as a diagnostic; '
              'all safety ceilings remain unchanged'
          )
          PY

          grep -q "versionCode 42" \
            "$PROJECT/app/build.gradle"

          grep -q "versionName '0.4.33'" \
            "$PROJECT/app/build.gradle"

          grep -q "MAX_MEAN_CHANNEL_DELTA = 0.0080" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

          grep -q "MAX_CHANNEL_DELTA = 0.0320" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

          grep -q "globalMeanChannelDelta" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

          grep -q "activeMeanChannelDelta" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

          grep -q "global mean channel delta" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

          grep -q "globalMeanChannelDelta" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"

          grep -q "activeMeanChannelDelta" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"

          grep -q "global mean channel delta" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"

          grep -q "active mean channel delta" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"

          grep -q "NightLightQcAccountingHostChecks" \
            "$PROJECT/tools/NightLightQcAccountingHostChecks.java"

          grep -q "MAX_CHANNEL_CODE_DELTA = 8" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"

      - name: Apply v0.4.34 Night Light Texture Preservation
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail

          python3             tools/apply_v0434_night_texture.py             "$PROJECT"

          grep -q "versionCode 43"             "$PROJECT/app/build.gradle"

          grep -q "versionName '0.4.34'"             "$PROJECT/app/build.gradle"

          grep -q "textureProtection"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

          grep -q "cap = 0.225"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

          grep -q "localTextureStrength"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"

          grep -q "MAX_MEAN_CHANNEL_DELTA = 0.0080"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

      - name: Apply v0.4.35 Night Light Adaptive Safe Strength
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail

          python3             tools/apply_v0435_night_adaptive_backoff.py             "$PROJECT"

          grep -q "versionCode 44"             "$PROJECT/app/build.gradle"

          grep -q "versionName '0.4.35'"             "$PROJECT/app/build.gradle"

          grep -q "MAX_ADAPTIVE_ATTEMPTS"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

          grep -q "adaptiveStrengthFactor"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

          grep -q "adaptive safe-strength search exhausted"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"

          grep -q "Night-light control ACCEPTED — adaptive strength"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"

      - name: Apply v0.4.36 Night Light Spatial Continuity
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail

          python3 tools/apply_v0436_night_spatial_continuity.py "$PROJECT"

          grep -q "versionCode 45" "$PROJECT/app/build.gradle"
          grep -q "versionName '0.4.36'" "$PROJECT/app/build.gradle"
          grep -q "cellFeather" "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"
          grep -q "haloPixels" "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"
          grep -q "localMeanLuma" "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"
          grep -q "NightLightSpatialContinuityHostChecks" "$PROJECT/tools/NightLightSpatialContinuityHostChecks.java"
          grep -q "MAX_MEAN_CHANNEL_DELTA = 0.0080" "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"
          grep -q "MAX_CHANNEL_DELTA = 0.0320" "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

      - name: Apply v0.4.37 distributed streetlight detection
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail

          python3 tools/apply_v0437_distributed_streetlights.py "$PROJECT"

          grep -q "versionCode 46" "$PROJECT/app/build.gradle"
          grep -q "versionName '0.4.37'" "$PROJECT/app/build.gradle"
          grep -q "distributedStreetlightPlan" "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"
          grep -q "distributedLampCells" "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"
          grep -q "NightLightDistributedStreetlightHostChecks" "$PROJECT/tools/NightLightDistributedStreetlightHostChecks.java"
          grep -q "MAX_MEAN_CHANNEL_DELTA = 0.0080" "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"
          grep -q "MAX_CHANNEL_DELTA = 0.0320" "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

      - name: Create isolated Neural Colour Lab source
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail
          python3 tools/apply_v0438_neural_colour_experiment.py "$PROJECT"
          grep -q "versionCode 47" "$PROJECT/app/build.gradle"
          grep -q "versionName '0.4.38-neural-lab'" "$PROJECT/app/build.gradle"
          grep -q "applicationId 'com.dennis.photomasterai.neurallab'" "$PROJECT/app/build.gradle"
          grep -q "AI MAX + LUT" "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"
          grep -q "AdaptiveNeuralColour.apply(this, originalBitmap, result)" "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"
          grep -q "MAX_MEAN_CHANNEL_DELTA = 0.0080" "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

      - name: Add native Display P3 neural delta and profile safeguards
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail
          python3 tools/apply_v0439_p3_neural_lab.py "$PROJECT"
          grep -q "versionCode 48" "$PROJECT/app/build.gradle"
          grep -q "versionName '0.4.39-p3-neural-lab'" "$PROJECT/app/build.gradle"
          grep -q "applicationId 'com.dennis.photomasterai.neurallab.p3'" "$PROJECT/app/build.gradle"
          grep -q "AI MAX + LUT" "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"
          grep -q "P3-safe additive neural correction" "$PROJECT/app/src/main/java/com/dennis/photomasterai/AdaptiveNeuralColour.java"
          grep -q "MIN_DETAIL_RETAINED = .985" "$PROJECT/app/src/main/java/com/dennis/photomasterai/AdaptiveNeuralColour.java"
          grep -q "MAX_RING_INCREASE = .006" "$PROJECT/app/src/main/java/com/dennis/photomasterai/AdaptiveNeuralColour.java"
          grep -q "MAX_MEAN_CHANNEL_DELTA = 0.0080" "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"
          grep -q "MAX_CHANNEL_DELTA = 0.0320" "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

      - name: Apply v0.4.40 unified studio finish, neural diagnostics and QC
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail
          python3 tools/apply_v0440_studio_lab.py "$PROJECT"
          grep -q "versionCode 49" "$PROJECT/app/build.gradle"
          grep -q "versionName '0.4.40-studio-lab'" "$PROJECT/app/build.gradle"
          grep -q "applicationId 'com.dennis.photomasterai.studiolab'" "$PROJECT/app/build.gradle"
          grep -q "AI MAX + STUDIO" "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"
          grep -q "StudioFinish.apply(originalBitmap, neuralOrBaseline)" "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"
