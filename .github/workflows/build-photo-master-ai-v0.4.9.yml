name: Build Photo Master AI v0.4.9 Extended Adaptive Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-photo-master-ai-v0.4.9.yml'

permissions:
  contents: read

jobs:
  build:
    name: Photo Master AI v0.4.9 Extended Adaptive Recovery
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild exact v0.4.8 source baseline
        id: source
        shell: bash
        run: |
          set -euo pipefail

          BASE=".github/workflows/build-photo-master-ai-v0.4.8.yml"

          test -f "$BASE" || {
            echo "::error::Known-good v0.4.8 workflow missing"
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path

          source = Path(
              ".github/workflows/build-photo-master-ai-v0.4.8.yml"
          )

          lines = source.read_text().splitlines()

          def extract_step(name, destination):
              step = None

              for i, line in enumerate(lines):
                  if line.strip() == "- name: " + name:
                      step = i
                      break

              if step is None:
                  raise RuntimeError(
                      "Workflow step not found: " + name
                  )

              run = None

              for i in range(step, len(lines)):
                  if lines[i].strip() == "run: |":
                      run = i
                      break

                  if (
                      i > step
                      and lines[i].startswith("      - name:")
                  ):
                      break

              if run is None:
                  raise RuntimeError(
                      "Run block not found: " + name
                  )

              body = []

              for line in lines[run + 1:]:
                  if line.startswith("      - name:"):
                      break

                  if not line.strip():
                      body.append("")
                  elif line.startswith("          "):
                      body.append(line[10:])
                  else:
                      raise RuntimeError(
                          "Unexpected indentation in: " + name
                      )

              Path(destination).write_text(
                  "\n".join(body) + "\n"
              )

          extract_step(
              "Rebuild exact v0.4.7 source baseline",
              "/tmp/v047-baseline.sh"
          )

          extract_step(
              "Apply v0.4.8 adaptive QC diagnostics",
              "/tmp/v048-diagnostics.sh"
          )

          print(
              "Extracted exact v0.4.8 construction steps"
          )
          PY

          bash /tmp/v047-baseline.sh

          SETTINGS="$(
            find photomaster-v044-build \
              -type f \
              -name 'settings.gradle' \
              | head -n 1
          )"

          if [ -z "$SETTINGS" ]; then
            SETTINGS="$(
              find photomaster-v044-build \
                -type f \
                -name 'settings.gradle.kts' \
                | head -n 1
            )"
          fi

          test -n "$SETTINGS" || {
            echo "::error::Generated project not found"
            exit 1
          }

          PROJECT="$(dirname "$SETTINGS")"

          export PROJECT

          bash /tmp/v048-diagnostics.sh

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          grep -q \
            "versionCode 17" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "versionName '0.4.8'" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "appendAdaptiveDiagnostic" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "lowDetailRecoverySafe" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java"

          grep -q \
            "GpuBackend.OPENCL" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiserRuntime.kt"

          echo "Exact v0.4.8 source baseline reconstructed"

      - name: Apply v0.4.9 extended adaptive recovery
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os

          project = Path(os.environ["PROJECT"])

          # =====================================================
          # VERSION
          # =====================================================

          build_file = project / "app/build.gradle"
          build = build_file.read_text()

          if "versionCode 17" not in build:
              raise RuntimeError(
                  "v0.4.8 versionCode 17 not found"
              )

          if "versionName '0.4.8'" not in build:
              raise RuntimeError(
                  "v0.4.8 versionName not found"
              )

          build = build.replace(
              "versionCode 17",
              "versionCode 18",
              1
          )

          build = build.replace(
              "versionName '0.4.8'",
              "versionName '0.4.9'",
              1
          )

          build_file.write_text(build)

          # =====================================================
          # EXTEND ADAPTIVE RECOVERY LADDER
          #
          # Existing:
          # 80%, 65%, 50%, 38%
          #
          # Added:
          # 30%, 24%
          #
          # For an initial 64% blend this gives about:
          # 51%, 42%, 32%, 24%, 19%, 15%.
          #
          # QC thresholds are NOT changed.
          # No second NAFNet inference is performed.
          # =====================================================

          neural_file = project / (
              "app/src/main/java/com/dennis/"
              "photomasterai/NeuralDenoiser.java"
          )

          neural = neural_file.read_text()

          old_ladder = "\n".join([
              "            double[] adaptiveScales = {",
              "                    0.80, 0.65, 0.50, 0.38",
              "            };",
          ])

          new_ladder = "\n".join([
              "            double[] adaptiveScales = {",
              "                    0.80, 0.65, 0.50, 0.38,",
              "                    0.30, 0.24",
              "            };",
          ])

          if old_ladder not in neural:
              raise RuntimeError(
                  "v0.4.8 adaptive scale ladder not found"
              )

          neural = neural.replace(
              old_ladder,
              new_ladder,
              1
          )

          neural_file.write_text(neural)

          print(
              "v0.4.9 extended adaptive ladder applied"
          )
          print(
              "Added recovery scales: 0.30 and 0.24"
          )
          print(
              "No QC thresholds changed"
          )
          print(
              "No NAFNet settings changed"
          )
          print(
              "No normal blend strengths changed"
          )
          print(
              "No extra NAFNet inference added"
          )
          PY

          grep -q \
            "versionCode 18" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "versionName '0.4.9'" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "0.80, 0.65, 0.50, 0.38," \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "0.30, 0.24" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "appendAdaptiveDiagnostic" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "lowDetailRecoverySafe" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java"

          grep -q \
            "MAX_TOTAL_NEURAL_MS = 90_000L" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "GpuBackend.OPENCL" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiserRuntime.kt"

          if grep -q \
            "new NeuralDenoiserRuntime(context, true)" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"
          then
            echo "::error::CPU neural fallback detected"
            exit 1
          fi

          echo "v0.4.9 source verification passed"

      - name: Fetch pinned NAFNet-SIDD model
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"

          ASSETS="$PROJECT/app/src/main/assets"

          MODEL="$ASSETS/nafnet_sidd_width32_fp16.tflite"

          mkdir -p "$ASSETS"

          URL='https://huggingface.co/litert-community/NAFNet-SIDD-width32-LiteRT/resolve/main/nafnet_sidd_width32_fp16.tflite?download=true'

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --output "$MODEL.tmp" \
            "$URL"

          mv "$MODEL.tmp" "$MODEL"

          test "$(stat -c%s "$MODEL")" -eq 62454048 || {
            echo "::error::Unexpected NAFNet model size"
            exit 1
          }

          echo \
          'f8fbaa422411683c53e802cf7cc7cf9be0a0de00886ad4af057232e26b172a0c  '"$MODEL" \
          | sha256sum -c -

          echo "Pinned NAFNet-SIDD model verified"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run restoration safety host checks
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf host-checks
          mkdir host-checks

          javac -d host-checks \
            app/src/main/java/com/dennis/photomasterai/DeepPixelRepair.java \
            app/src/main/java/com/dennis/photomasterai/RepairSafetyPolicy.java \
            app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java \
            app/src/main/java/com/dennis/photomasterai/SocialSourcePolicy.java \
            tools/DeepPixelRepairHostChecks.java \
            tools/RepairSafetyPolicyHostChecks.java \
            tools/NeuralDenoisePolicyHostChecks.java \
            tools/SocialSourcePolicyHostChecks.java

          java -cp host-checks \
            com.dennis.photomasterai.DeepPixelRepairHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.RepairSafetyPolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.NeuralDenoisePolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.SocialSourcePolicyHostChecks

      - name: Restore stable Photo Master debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photo-master-ai-debug-keystore-v1

      - name: Create signing key on first build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Photo Master AI,O=Dennis Photo Master,C=AU" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$SDK/cmdline-tools" \
                -type f \
                -name 'sdkmanager' \
                | sort -V \
                | tail -n 1
            )"
          fi

          test -n "$SDKMANAGER" || {
            echo "::error::sdkmanager not found"
            exit 1
          }

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build v0.4.9 APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:assembleDebug \
            --stacktrace

      - name: Verify package and collect APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "::error::APK not found"
            exit 1
          }

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          AAPT="$SDK/build-tools/35.0.0/aapt"

          BADGING="$(
            "$AAPT" dump badging "$APK" \
              | head -n 1
          )"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -q \
            "package: name='com.dennis.photomasterai'"

          echo "$BADGING" \
            | grep -q \
            "versionCode='18'"

          echo "$BADGING" \
            | grep -q \
            "versionName='0.4.9'"

          unzip -l "$APK" \
            | grep -q \
            'assets/nafnet_sidd_width32_fp16.tflite'

          rm -rf artifact
          mkdir artifact

          OUT="artifact/PhotoMasterAI-v0.4.9-EXTENDED-ADAPTIVE-RECOVERY.apk"

          cp "$APK" "$OUT"

          sha256sum "$OUT" \
            > "artifact/PhotoMasterAI-v0.4.9-EXTENDED-ADAPTIVE-RECOVERY-SHA256.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMasterAI-v0.4.9-EXTENDED-ADAPTIVE-RECOVERY
          path: |
            artifact/PhotoMasterAI-v0.4.9-EXTENDED-ADAPTIVE-RECOVERY.apk
            artifact/PhotoMasterAI-v0.4.9-EXTENDED-ADAPTIVE-RECOVERY-SHA256.txt
          if-no-files-found: error
          retention-days: 30
