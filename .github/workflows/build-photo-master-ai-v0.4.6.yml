name: Build Photo Master AI v0.4.6 Runtime Stability Guard

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-photo-master-ai-v0.4.6.yml'

permissions:
  contents: read

jobs:
  build:
    name: Photo Master AI v0.4.6 Runtime Stability Guard
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build v0.4.5 baseline and apply v0.4.6 stability fixes
        id: source
        shell: bash
        run: |
          set -euo pipefail

          BASE=".github/workflows/build-photo-master-ai-v0.4.5.yml"

          test -f "$BASE" || {
            echo "::error::Known-good v0.4.5 workflow missing"
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              ".github/workflows/build-photo-master-ai-v0.4.5.yml"
          )

          lines = p.read_text().splitlines()

          step = None

          for i, line in enumerate(lines):
              if "Build proven v0.4.4 source baseline" in line:
                  step = i
                  break

          if step is None:
              raise RuntimeError(
                  "Known-good v0.4.5 source step not found"
              )

          run = None

          for i in range(step, len(lines)):
              if lines[i].strip() == "run: |":
                  run = i
                  break

          if run is None:
              raise RuntimeError(
                  "Known-good v0.4.5 run block not found"
              )

          body = []

          for line in lines[run + 1:]:
              if line.startswith("      - name:"):
                  break

              if not line.strip():
                  body.append("")
              elif line.startswith("          "):
                  body.append(line[10:])
              else:
                  raise RuntimeError(
                      "Unexpected v0.4.5 workflow indentation"
                  )

          Path("/tmp/v045-source.sh").write_text(
              "\n".join(body) + "\n"
          )

          print(
              "Extracted known-good v0.4.5 source builder"
          )
          PY

          bash /tmp/v045-source.sh

          SETTINGS="$(
            find photomaster-v044-build \
              -type f \
              -name 'settings.gradle' \
              | head -n 1
          )"

          if [ -z "$SETTINGS" ]; then
            SETTINGS="$(
              find photomaster-v044-build \
                -type f \
                -name 'settings.gradle.kts' \
                | head -n 1
            )"
          fi

          test -n "$SETTINGS" || {
            echo "::error::Generated project not found"
            exit 1
          }

          PROJECT="$(dirname "$SETTINGS")"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          export PROJECT

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          project = Path(os.environ["PROJECT"])

          # ==============================================
          # VERSION
          # ==============================================

          build_file = project / "app/build.gradle"

          build = build_file.read_text()

          if "versionCode 14" not in build:
              raise RuntimeError(
                  "v0.4.5 versionCode 14 not found"
              )

          if "versionName '0.4.5'" not in build:
              raise RuntimeError(
                  "v0.4.5 versionName not found"
              )

          build = build.replace(
              "versionCode 14",
              "versionCode 15",
              1
          )

          build = build.replace(
              "versionName '0.4.5'",
              "versionName '0.4.6'",
              1
          )

          build_file.write_text(build)

          # ==============================================
          # GPU RUNTIME DIAGNOSTICS
          # ==============================================

          neural = project / (
              "app/src/main/java/com/dennis/"
              "photomasterai/NeuralDenoiser.java"
          )

          s = neural.read_text()

          old = (
              '        int tiles = 0;\n'
              '        String accelerator = "LiteRT GPU";\n'
              '        NeuralDenoiserRuntime runtime = null;'
          )

          new = (
              '        int tiles = 0;\n'
              '        String accelerator = "LiteRT GPU";\n'
              '        long selfTestMs = 0L;\n'
              '        boolean slowSelfTestWarning = false;\n'
              '        long maxTileMs = 0L;\n'
              '        int slowestTile = -1;\n'
              '        int slowestTileX = -1;\n'
              '        int slowestTileY = -1;\n'
              '        NeuralDenoiserRuntime runtime = null;'
          )

          if old not in s:
              raise RuntimeError(
                  "Neural timing declaration point not found"
              )

          s = s.replace(
              old,
              new,
              1
          )

          if (
              "            long selfTestMs = Math.max("
              not in s
          ):
              raise RuntimeError(
                  "Self-test timing assignment not found"
              )

          s = s.replace(
              "            long selfTestMs = Math.max(",
              "            selfTestMs = Math.max(",
              1
          )

          pattern = re.compile(
              r'\n\s*if '
              r'\(selfTestMs > MAX_SELF_TEST_MS\) '
              r'\{\s*'
              r'throw new IllegalStateException\(\s*'
              r'"Classic GPU self-test exceeded '
              r'performance guard: "\s*'
              r'\+ selfTestMs \+ " ms"\);\s*'
              r'\}',
              re.MULTILINE
          )

          s, count = pattern.subn(
              '\n'
              '            slowSelfTestWarning = '
              'selfTestMs > MAX_SELF_TEST_MS;',
              s,
              count=1
          )

          if count != 1:
              raise RuntimeError(
                  "Fatal self-test timing block not found"
              )

          # ==============================================
          # EXACT TILE STALL DIAGNOSTICS
          # ==============================================

          pattern = re.compile(
              r'\s*if '
              r'\(tileMs > MAX_TILE_MS\) '
              r'\{\s*'
              r'throw new IllegalStateException\(\s*'
              r'"Classic GPU tile exceeded '
              r'performance guard: "\s*'
              r'\+ tileMs \+ " ms"\);\s*'
              r'\}',
              re.MULTILINE
          )

          replacement = '''
                    int currentTile = tiles + 1;

                    if (tileMs > maxTileMs) {
                        maxTileMs = tileMs;
                        slowestTile = currentTile;
                        slowestTileX = writeX;
                        slowestTileY = writeY;
                    }

                    if (tileMs > MAX_TILE_MS) {
                        throw new IllegalStateException(
                                "Classic GPU tile #"
                                        + currentTile
                                        + " at ("
                                        + writeX
                                        + ","
                                        + writeY
                                        + ") exceeded performance guard: "
                                        + tileMs
                                        + " ms");
                    }'''

          s, count = pattern.subn(
              replacement,
              s,
              count=1
          )

          if count != 1:
              raise RuntimeError(
                  "Tile performance guard not found"
              )

          timing_anchor = (
              '                before.ringing,\n'
              '                after.ringing);\n\n'
              '        String adaptiveLine;'
          )

          timing_insert = (
              '                before.ringing,\n'
              '                after.ringing);\n\n'
              '        metrics += String.format(\n'
              '                Locale.US,\n'
              '                "\\n• GPU timing: '
              'self-test %.1fs%s | '
              'slowest tile #%d %d ms '
              'at (%d,%d)",\n'
              '                selfTestMs / 1000.0,\n'
              '                slowSelfTestWarning '
              '? " (slow but valid)" : "",\n'
              '                slowestTile,\n'
              '                maxTileMs,\n'
              '                slowestTileX,\n'
              '                slowestTileY);\n\n'
              '        String adaptiveLine;'
          )

          if timing_anchor not in s:
              raise RuntimeError(
                  "Adaptive metrics anchor not found"
              )

          s = s.replace(
              timing_anchor,
              timing_insert,
              1
          )

          neural.write_text(s)

          # ==============================================
          # PERSON-MASK TRUST
          # Segmentation alone no longer means person.
          # ==============================================

          ai_file = project / (
              "app/src/main/java/com/dennis/"
              "photomasterai/AiVisionAnalyzer.java"
          )

          ai = ai_file.read_text()

          old = (
              '            boolean person = '
              '!faces.isEmpty() || coverage > 0.025 '
              '|| hasAny(labels, 0.45f, '
              '"person", "people", "human", '
              '"portrait", "face", "selfie");'
          )

          new = (
              '            boolean personLabel = '
              'hasAny(labels, 0.55f, '
              '"person", "people", "human", '
              '"portrait", "face", "selfie", '
              '"skin", "smile");\n'
              '            boolean person = '
              '!faces.isEmpty() || personLabel;'
          )

          if old not in ai:
              raise RuntimeError(
                  "Original person trust rule not found"
              )

          ai = ai.replace(
              old,
              new,
              1
          )

          ai_file.write_text(ai)

          # ==============================================
          # PERSON FINISHING SAFETY
          # ==============================================

          engine = project / (
              "app/src/main/java/com/dennis/"
              "photomasterai/PhotoMasterEngine.java"
          )

          e = engine.read_text()

          old = (
              '                    float subject = '
              '(p.neuralMode && p.ai != null '
              '&& p.ai.available)\n'
              '                            ? '
              'p.ai.subjectAt(x, sy, width, height) '
              ': 0f;'
          )

          new = (
              '                    float subject = '
              '(p.neuralMode && p.ai != null '
              '&& p.ai.available && p.ai.personLike)\n'
              '                            ? '
              'p.ai.subjectAt(x, sy, width, height) '
              ': 0f;'
          )

          if old not in e:
              raise RuntimeError(
                  "Subject mask use point not found"
              )

          e = e.replace(
              old,
              new,
              1
          )

          old = '''        if (ai.personLike && ai.personCoverage > 0.012) {
            p.aiSubjectLiftEv = max ? 0.12 : 0.065;
            p.aiSubjectSharpen = max ? 0.055 : 0.030;
            p.aiBackgroundDepthEv = max ? 0.035 : 0.015;
            p.sharpen = Math.min(p.sharpen, max ? 0.16 : 0.13);
            p.microContrast = Math.min(p.microContrast, max ? 0.14 : 0.09);
        }'''

          new = '''        if (ai.personLike && ai.personCoverage > 0.012) {
            double personCoverage =
                    clamp(ai.personCoverage, 0.0, 1.0);

            if (personCoverage >= 0.65) {
                p.aiSubjectLiftEv =
                        max ? 0.070 : 0.045;
                p.aiBackgroundDepthEv =
                        max ? 0.012 : 0.007;
            } else if (personCoverage >= 0.40) {
                p.aiSubjectLiftEv =
                        max ? 0.090 : 0.055;
                p.aiBackgroundDepthEv =
                        max ? 0.022 : 0.010;
            } else {
                p.aiSubjectLiftEv =
                        max ? 0.12 : 0.065;
                p.aiBackgroundDepthEv =
                        max ? 0.035 : 0.015;
            }

            p.aiSubjectSharpen =
                    max ? 0.055 : 0.030;

            p.sharpen =
                    Math.min(
                            p.sharpen,
                            max ? 0.16 : 0.13);

            p.microContrast =
                    Math.min(
                            p.microContrast,
                            max ? 0.14 : 0.09);
        }'''

          if old not in e:
              raise RuntimeError(
                  "Person finishing profile not found"
              )

          e = e.replace(
              old,
              new,
              1
          )

          engine.write_text(e)

          print(
              "Photo Master AI v0.4.6 patch applied"
          )

          print(
              "NAFNet/OpenCL/blend/QC unchanged"
          )

          print(
              "Slow valid self-test is warning-only"
          )

          print(
              "Tile timing diagnostics enabled"
          )

          print(
              "Person-mask semantic trust enabled"
          )

          print(
              "Large portraits use gentler relighting"
          )
          PY

          grep -q \
            "versionCode 15" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "versionName '0.4.6'" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "MAX_TOTAL_NEURAL_MS = 90_000L" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "slowSelfTestWarning" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "Classic GPU tile #" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "GPU timing: self-test" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "boolean person = !faces.isEmpty() || personLabel" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/AiVisionAnalyzer.java"

          grep -q \
            "p.ai.available && p.ai.personLike" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/PhotoMasterEngine.java"

          grep -q \
            "personCoverage >= 0.65" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/PhotoMasterEngine.java"

          grep -q \
            "Adaptive blend recovery" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "GpuBackend.OPENCL" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiserRuntime.kt"

          if grep -q \
            "new NeuralDenoiserRuntime(context, true)" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"
          then
            echo "::error::CPU NAFNet fallback detected"
            exit 1
          fi

          echo "v0.4.6 source verification passed"

      - name: Fetch pinned NAFNet-SIDD model
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"

          ASSETS="$PROJECT/app/src/main/assets"

          MODEL="$ASSETS/nafnet_sidd_width32_fp16.tflite"

          mkdir -p "$ASSETS"

          URL='https://huggingface.co/litert-community/NAFNet-SIDD-width32-LiteRT/resolve/main/nafnet_sidd_width32_fp16.tflite?download=true'

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --output "$MODEL.tmp" \
            "$URL"

          mv "$MODEL.tmp" "$MODEL"

          test "$(stat -c%s "$MODEL")" -eq 62454048 || {
            echo "::error::Unexpected NAFNet model size"
            exit 1
          }

          echo \
          'f8fbaa422411683c53e802cf7cc7cf9be0a0de00886ad4af057232e26b172a0c  '"$MODEL" \
          | sha256sum -c -

          echo "Pinned NAFNet-SIDD model verified"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run restoration safety host checks
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf host-checks
          mkdir host-checks

          javac -d host-checks \
            app/src/main/java/com/dennis/photomasterai/DeepPixelRepair.java \
            app/src/main/java/com/dennis/photomasterai/RepairSafetyPolicy.java \
            app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java \
            app/src/main/java/com/dennis/photomasterai/SocialSourcePolicy.java \
            tools/DeepPixelRepairHostChecks.java \
            tools/RepairSafetyPolicyHostChecks.java \
            tools/NeuralDenoisePolicyHostChecks.java \
            tools/SocialSourcePolicyHostChecks.java

          java -cp host-checks \
            com.dennis.photomasterai.DeepPixelRepairHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.RepairSafetyPolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.NeuralDenoisePolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.SocialSourcePolicyHostChecks

      - name: Restore stable Photo Master debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photo-master-ai-debug-keystore-v1

      - name: Create signing key on first build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Photo Master AI,O=Dennis Photo Master,C=AU" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$SDK/cmdline-tools" \
                -type f \
                -name 'sdkmanager' \
                | sort -V \
                | tail -n 1
            )"
          fi

          test -n "$SDKMANAGER" || {
            echo "::error::sdkmanager not found"
            exit 1
          }

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build v0.4.6 APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:assembleDebug \
            --stacktrace

      - name: Verify package and collect APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "::error::APK not found"
            exit 1
          }

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          AAPT="$SDK/build-tools/35.0.0/aapt"

          BADGING="$(
            "$AAPT" dump badging "$APK" \
              | head -n 1
          )"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -q \
            "package: name='com.dennis.photomasterai'"

          echo "$BADGING" \
            | grep -q \
            "versionCode='15'"

          echo "$BADGING" \
            | grep -q \
            "versionName='0.4.6'"

          unzip -l "$APK" \
            | grep -q \
            'assets/nafnet_sidd_width32_fp16.tflite'

          rm -rf artifact
          mkdir artifact

          OUT="artifact/PhotoMasterAI-v0.4.6-RUNTIME-STABILITY-GUARD.apk"

          cp "$APK" "$OUT"

          sha256sum "$OUT" \
            > "artifact/PhotoMasterAI-v0.4.6-RUNTIME-STABILITY-GUARD-SHA256.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMasterAI-v0.4.6-RUNTIME-STABILITY-GUARD
          path: |
            artifact/PhotoMasterAI-v0.4.6-RUNTIME-STABILITY-GUARD.apk
            artifact/PhotoMasterAI-v0.4.6-RUNTIME-STABILITY-GUARD-SHA256.txt
          if-no-files-found: error
          retention-days: 30
