              "                                originalBitmap);",
          ])

          if old_flow not in main:
              raise RuntimeError(
                  "v0.4.20 final optics result flow not found"
              )

          main = main.replace(
              old_flow,
              new_flow,
              1
          )

          helper_anchor = (
              "    private PhotoMasterEngine.Result "
              "applyOpticsIntelligence("
          )

          if helper_anchor not in main:
              raise RuntimeError(
                  "Optics helper anchor not found"
              )

          helper = """    private PhotoMasterEngine.Result applyVignettingIntelligence(
                  PhotoMasterEngine.Result result,
                  Bitmap authoritativeOriginal) {

              if (result == null
                      || result.bitmap == null
                      || result.bitmap.isRecycled()) {

                  return result;
              }

              PhotoAnalysis currentAnalysis =
                      PhotoAnalysis.analyse(
                              result.bitmap);

              boolean exactOriginalRetention =
                      result.report != null
                              && (result.report.contains(
                                      "Smooth-scene terminal protection: ORIGINAL RETAINED")
                              || result.report.contains(
                                      "Authoritative-original checkpoint: VERIFIED"));

              if (exactOriginalRetention) {

                  String retainedReport =
                          insertVignettingReport(
                                  result.report,
                                  "• Vignetting correction withheld — "
                                          + "exact original-retention checkpoint active\\n"
                                          + "• No vignetting pixels changed");

                  return new PhotoMasterEngine.Result(
                          result.bitmap,
                          retainedReport,
                          currentAnalysis);
              }

              VignettingCorrection.Result vignette =
                      VignettingCorrection.apply(
                              result.bitmap,
                              currentAnalysis);

              String updatedReport =
                      insertVignettingReport(
                              result.report,
                              vignette.report);

              if (!vignette.accepted
                      || vignette.bitmap == result.bitmap) {

                  return new PhotoMasterEngine.Result(
                          result.bitmap,
                          updatedReport,
                          currentAnalysis);
              }

              updatedReport =
                      replaceOutputQcMetrics(
                              updatedReport,
                              vignette.analysis);

              Bitmap previous =
                      result.bitmap;

              PhotoMasterEngine.Result vignetteResult =
                      new PhotoMasterEngine.Result(
                              vignette.bitmap,
                              updatedReport,
                              vignette.analysis);

              if (previous != null
                      && previous != authoritativeOriginal
                      && previous != vignette.bitmap
                      && !previous.isRecycled()) {

                  previous.recycle();
              }

              return vignetteResult;
          }

          private String insertVignettingReport(
                  String sourceReport,
                  String vignetteReport) {

              if (sourceReport == null) {
                  return vignetteReport;
              }

              if (vignetteReport == null
                      || vignetteReport.trim().isEmpty()) {
                  return sourceReport;
              }

              String marker =
                      "\\nOUTPUT QC\\n";

              int markerAt =
                      sourceReport.indexOf(
                              marker);

              String section =
                      "\\nVIGNETTING INTELLIGENCE\\n"
                              + vignetteReport
                              + "\\n";

              if (markerAt < 0) {
                  return sourceReport
                          + section;
              }

              return sourceReport.substring(
                      0,
                      markerAt)
                      + section
                      + sourceReport.substring(
                              markerAt);
          }

          """

          main = main.replace(
              helper_anchor,
              helper + helper_anchor,
              1
          )

          main_file.write_text(main)

          print(
              "v0.4.21 measured vignetting correction integrated"
          )
