name: Build Photo Master AI v0.4.21 Vignetting Guard

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-photo-master-ai-v0.4.21-vignetting.yml'

permissions:
  contents: read

jobs:
  build:
    name: Photo Master AI v0.4.21 Vignetting Guard
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover exact successful v0.4.20 source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          V0420_COMMIT="f075a67e469cf0eb6a34e595d641176824ad6fd2"

          git cat-file -e "${V0420_COMMIT}^{commit}" || {
            echo "::error::Successful v0.4.20 commit unavailable"
            exit 1
          }

          git show \
            "${V0420_COMMIT}:.github/workflows/build-photo-master-ai-v0.4.20-background.yml" \
            > /tmp/v0420.yml

          python3 - <<'PY'
          from pathlib import Path

          lines = Path("/tmp/v0420.yml").read_text().splitlines()

          def extract_step(name, destination):
              step = None
              for i, line in enumerate(lines):
                  if line.strip() == "- name: " + name:
                      step = i
                      break
              if step is None:
                  raise RuntimeError("Workflow step not found: " + name)

              run = None
              for i in range(step, len(lines)):
                  if lines[i].strip() == "run: |":
                      run = i
                      break
                  if i > step and lines[i].startswith("      - name:"):
                      break
              if run is None:
                  raise RuntimeError("Run block not found: " + name)

              body = []
              for line in lines[run + 1:]:
                  if line.startswith("      - name:"):
                      break
                  if not line.strip():
                      body.append("")
                  elif line.startswith("          "):
                      body.append(line[10:])
                  else:
                      raise RuntimeError(
                          "Unexpected indentation while extracting: " + name
                      )

              Path(destination).write_text("\n".join(body) + "\n")

          extract_step(
              "Recover exact successful v0.4.19 source",
              "/tmp/recover-v0419.sh"
          )
          extract_step(
              "Apply v0.4.20 optics safety and background support",
              "/tmp/apply-v0420.sh"
          )

          print("Extracted exact successful v0.4.20 source construction")
          PY

          bash /tmp/recover-v0419.sh

          PROJECT="$(
            find photomaster-v044-build \
              -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -printf '%h\n' \
              | head -n 1
          )"

          test -n "$PROJECT" || {
            echo "::error::Recovered project not found"
            exit 1
          }

          export PROJECT
          bash /tmp/apply-v0420.sh

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          grep -q "versionCode 29" "$PROJECT/app/build.gradle"
          grep -q "versionName '0.4.20'" "$PROJECT/app/build.gradle"
          grep -q "boolean excessSafe" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/OpticalFringePolicy.java"
          grep -q "temporaryArgbSource" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/OpticalDefectRepair.java"
          grep -q "class ProcessingKeepAliveService" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/ProcessingKeepAliveService.java"
          grep -q "ProcessingKeepAliveService.start" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"
          grep -q "Final shadow-integrity guard: ROLLBACK" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

          echo "Exact successful v0.4.20 source recovered"

      - name: Apply v0.4.21 measured vignetting guard
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os

          project = Path(os.environ["PROJECT"])
          build_file = project / "app/build.gradle"
          build = build_file.read_text()

          if "versionCode 29" not in build:
              raise RuntimeError("v0.4.20 versionCode not found")
          if "versionName '0.4.20'" not in build:
              raise RuntimeError("v0.4.20 versionName not found")

          build = build.replace("versionCode 29", "versionCode 30", 1)
          build = build.replace(
              "versionName '0.4.20'",
              "versionName '0.4.21'",
              1
          )

          build_file.write_text(build)
          print("Version promoted to v0.4.21 / code 30")
          PY

          cat > \
          "$PROJECT/app/src/main/java/com/dennis/photomasterai/VignettingPolicy.java" \
          <<'JAVA'
          package com.dennis.photomasterai;

          public final class VignettingPolicy {

              private VignettingPolicy() {
              }

              public static boolean shouldActivate(
                      double center,
                      double mid,
                      double outer,
                      double corner,
                      int quadrantConsensus,
                      double quadrantSpread,
                      int centerSamples,
                      int outerSamples) {

                  if (centerSamples < 100
                          || outerSamples < 200) {
                      return false;
                  }

                  if (center < 0.18
                          || center > 0.86) {
                      return false;
                  }

                  if (mid <= 0.0
                          || outer <= 0.0
                          || corner <= 0.0) {
                      return false;
                  }

                  double falloff =
                          (center - outer)
                                  / Math.max(
                                          0.01,
                                          center);

                  double cornerFalloff =
                          (center - corner)
                                  / Math.max(
                                          0.01,
                                          center);

                  boolean radialShape =
                          center - mid >= 0.015
                                  && mid - outer >= 0.012
                                  && corner <= outer + 0.015;

                  boolean strongEnough =
                          falloff >= 0.12
                                  && cornerFalloff >= 0.14;

                  boolean symmetricEnough =
                          quadrantConsensus == 4
                                  && quadrantSpread <= 0.10;

                  return radialShape
                          && strongEnough
                          && symmetricEnough;
              }

              public static double cornerGain(
                      double falloff) {

                  double severity =
                          clamp(
                                  (falloff - 0.10)
                                          / 0.25,
                                  0.0,
                                  1.0);

                  return 1.025
                          + 0.055 * severity;
              }

              public static boolean outputSafe(
                      double falloffBefore,
                      double falloffAfter,
                      double cornerFalloffBefore,
                      double cornerFalloffAfter,
                      double quadrantSpreadBefore,
                      double quadrantSpreadAfter,
                      double detailBefore,
                      double detailAfter,
                      double noiseBefore,
                      double noiseAfter,
                      double chromaBefore,
                      double chromaAfter,
                      double ringingBefore,
                      double ringingAfter,
                      double medianBefore,
                      double medianAfter,
                      double satBefore,
                      double satAfter,
                      double shadowClipBefore,
                      double shadowClipAfter,
                      double highlightClipBefore,
                      double highlightClipAfter) {

                  boolean radialImprovement =
                          falloffAfter
                                  <= falloffBefore - 0.006
                                  && cornerFalloffAfter
                                  <= cornerFalloffBefore - 0.010;

                  boolean symmetrySafe =
                          quadrantSpreadAfter
                                  <= quadrantSpreadBefore + 0.015;

                  double detailAllowance =
                          Math.max(
                                  0.0015,
                                  detailBefore * 0.025);

                  boolean detailSafe =
                          detailAfter
                                  >= detailBefore
                                  - detailAllowance;

                  boolean noiseSafe =
                          noiseAfter
                                  <= noiseBefore
                                  + 0.0015;

                  boolean chromaSafe =
                          chromaAfter
                                  <= chromaBefore
                                  + 0.0015;

                  boolean ringingSafe =
                          ringingAfter
                                  <= Math.min(
                                          1.0,
                                          ringingBefore + 0.010);

                  boolean medianSafe =
                          Math.abs(
                                  medianAfter
                                          - medianBefore)
                                  <= 0.015;

                  boolean saturationSafe =
                          Math.abs(
                                  satAfter
                                          - satBefore)
                                  <= 0.010;

                  boolean shadowSafe =
                          shadowClipAfter
                                  <= shadowClipBefore
                                  + 0.001;

                  boolean highlightSafe =
                          highlightClipAfter
                                  <= highlightClipBefore
                                  + 0.002;

                  return radialImprovement
                          && symmetrySafe
                          && detailSafe
                          && noiseSafe
                          && chromaSafe
                          && ringingSafe
                          && medianSafe
                          && saturationSafe
                          && shadowSafe
                          && highlightSafe;
              }

              private static double clamp(
                      double value,
                      double minimum,
                      double maximum) {

                  return Math.max(
                          minimum,
                          Math.min(
                                  maximum,
                                  value));
              }
          }
          JAVA

          cat > \
          "$PROJECT/app/src/main/java/com/dennis/photomasterai/VignettingCorrection.java" \
          <<'JAVA'
          package com.dennis.photomasterai;

          import android.graphics.Bitmap;
          import android.graphics.Color;

          import java.util.Locale;

          public final class VignettingCorrection {

              private static final double CORRECTION_START_RADIUS =
                      0.50;

              private VignettingCorrection() {
              }

              public static final class Result {

                  public final Bitmap bitmap;
                  public final PhotoAnalysis analysis;
                  public final boolean attempted;
                  public final boolean accepted;
                  public final String report;

                  Result(
                          Bitmap bitmap,
                          PhotoAnalysis analysis,
                          boolean attempted,
                          boolean accepted,
                          String report) {

                      this.bitmap = bitmap;
                      this.analysis = analysis;
                      this.attempted = attempted;
                      this.accepted = accepted;
                      this.report = report;
                  }
              }

              private static final class Histogram {

                  final int[] bins =
                          new int[256];

                  int count;

                  void add(int value) {

                      int v =
                              Math.max(
                                      0,
                                      Math.min(
                                              255,
                                              value));

                      bins[v]++;
                      count++;
                  }

                  double median01() {

                      if (count <= 0) {
                          return 0.0;
                      }

                      int target =
                              (count + 1) / 2;

                      int running =
                              0;

                      for (int i = 0;
                           i < bins.length;
                           i++) {

                          running += bins[i];

                          if (running >= target) {
                              return i / 255.0;
                          }
                      }

                      return 1.0;
                  }
              }

              private static final class Stats {

                  final double center;
                  final double mid;
                  final double outer;
                  final double corner;
                  final double falloff;
                  final double cornerFalloff;
                  final double quadrantSpread;
                  final int quadrantConsensus;
                  final int centerSamples;
                  final int outerSamples;
                  final boolean valid;

                  Stats(
                          double center,
                          double mid,
                          double outer,
                          double corner,
                          double falloff,
                          double cornerFalloff,
                          double quadrantSpread,
                          int quadrantConsensus,
                          int centerSamples,
                          int outerSamples,
                          boolean valid) {

                      this.center = center;
                      this.mid = mid;
                      this.outer = outer;
                      this.corner = corner;
                      this.falloff = falloff;
                      this.cornerFalloff = cornerFalloff;
                      this.quadrantSpread = quadrantSpread;
                      this.quadrantConsensus = quadrantConsensus;
                      this.centerSamples = centerSamples;
                      this.outerSamples = outerSamples;
                      this.valid = valid;
                  }
              }

              public static Result apply(
                      Bitmap source,
                      PhotoAnalysis sourceAnalysis) {

                  if (source == null
                          || source.isRecycled()
                          || sourceAnalysis == null) {

                      return new Result(
                              source,
                              sourceAnalysis,
                              false,
                              false,
                              "• Vignetting scan unavailable");
                  }

                  Bitmap workingSource =
                          source;

                  boolean temporaryArgb =
                          false;

                  if (source.getConfig()
                          != Bitmap.Config.ARGB_8888) {

                      workingSource =
                              source.copy(
                                      Bitmap.Config.ARGB_8888,
                                      false);

                      if (workingSource == null) {

                          return new Result(
                                  source,
                                  sourceAnalysis,
                                  false,
                                  false,
                                  "• Vignetting scan unavailable — "
                                          + "ARGB_8888 working copy "
                                          + "could not be created");
                      }

                      temporaryArgb =
                              true;
                  }

                  final String formatNote =
                          temporaryArgb
                                  ? "\n• Vignetting analysis used temporary "
                                          + "ARGB_8888 working copy; "
                                          + "source checkpoint preserved"
                                  : "";

                  try {

                      int width =
                              workingSource.getWidth();

                      int height =
                              workingSource.getHeight();

                      if (width < 128
                              || height < 128) {

                          return new Result(
                                  source,
                                  sourceAnalysis,
                                  false,
                                  false,
                                  "• Vignetting scan withheld — "
                                          + "image too small for reliable "
                                          + "radial analysis"
                                          + formatNote);
                      }

                      long pixelCountLong =
                              (long) width
                                      * (long) height;

                      if (pixelCountLong
                              > Integer.MAX_VALUE) {

                          return new Result(
                                  source,
                                  sourceAnalysis,
                                  false,
                                  false,
                                  "• Vignetting scan withheld — "
                                          + "working image exceeds safe "
                                          + "analysis size"
                                          + formatNote);
                      }

                      int pixelCount =
                              (int) pixelCountLong;

                      int[] pixels =
                              new int[pixelCount];

                      workingSource.getPixels(
                              pixels,
                              0,
                              width,
                              0,
                              0,
                              width,
                              height);

                      int sampleStep;

                      if (pixelCount > 12_000_000) {
                          sampleStep = 6;
                      } else if (pixelCount > 8_000_000) {
                          sampleStep = 5;
                      } else if (pixelCount > 4_000_000) {
                          sampleStep = 4;
                      } else {
                          sampleStep = 3;
                      }

                      Stats before =
                              measure(
                                      pixels,
                                      width,
                                      height,
                                      sampleStep);

                      if (!before.valid) {

                          return new Result(
                                  source,
                                  sourceAnalysis,
                                  false,
                                  false,
                                  "• Vignetting scan withheld — "
                                          + "insufficient radial sample evidence"
                                          + formatNote);
                      }

                      boolean activate =
                              VignettingPolicy.shouldActivate(
                                      before.center,
                                      before.mid,
                                      before.outer,
                                      before.corner,
                                      before.quadrantConsensus,
                                      before.quadrantSpread,
                                      before.centerSamples,
                                      before.outerSamples);

                      if (!activate) {

                          String report =
                                  String.format(
                                          Locale.US,
                                          "• Radial falloff scan: no reliable "
                                                  + "optical vignetting evidence\n"
                                                  + "• Centre %.3f | mid %.3f | "
                                                  + "outer %.3f | corner %.3f\n"
                                                  + "• Outer falloff %.1f%% | "
                                                  + "corner falloff %.1f%% | "
                                                  + "quadrant consensus %d/4 | "
                                                  + "spread %.1f%%\n"
                                                  + "• No vignetting pixels changed",
                                          before.center,
                                          before.mid,
                                          before.outer,
                                          before.corner,
                                          before.falloff * 100.0,
                                          before.cornerFalloff * 100.0,
                                          before.quadrantConsensus,
                                          before.quadrantSpread * 100.0);

                          return new Result(
                                  source,
                                  sourceAnalysis,
                                  false,
                                  false,
                                  report + formatNote);
                      }

                      double cornerGain =
                              VignettingPolicy.cornerGain(
                                      before.falloff);

                      int correctedPixels =
                              0;

                      for (int y = 0;
                           y < height;
                           y++) {

                          for (int x = 0;
                               x < width;
                               x++) {

                              double radius =
                                      radius(
                                              x,
                                              y,
                                              width,
                                              height);

                              if (radius
                                      <= CORRECTION_START_RADIUS) {
                                  continue;
                              }

                              double t =
                                      (radius
                                              - CORRECTION_START_RADIUS)
                                              / (1.0
                                              - CORRECTION_START_RADIUS);

                              t =
                                      Math.max(
                                              0.0,
                                              Math.min(
                                                      1.0,
                                                      t));

                              double radial =
                                      t * t;

                              double gain =
                                      1.0
                                              + (cornerGain - 1.0)
                                              * radial;

                              int index =
                                      y * width
                                              + x;

                              int color =
                                      pixels[index];

                              int a =
                                      Color.alpha(color);

                              int r =
                                      Color.red(color);

                              int g =
                                      Color.green(color);

                              int b =
                                      Color.blue(color);

                              int lum =
                                      luminance(color);

                              if (lum <= 6) {
                                  continue;
                              }

                              double darkTaper =
                                      lum >= 24
                                              ? 1.0
                                              : (lum - 6.0)
                                              / 18.0;

                              double localGain =
                                      1.0
                                              + (gain - 1.0)
                                              * darkTaper;

                              int maxChannel =
                                      Math.max(
                                              r,
                                              Math.max(
                                                      g,
                                                      b));

                              if (maxChannel > 0) {

                                  double clipSafeGain =
                                          255.0
                                                  / maxChannel;

                                  localGain =
                                          Math.min(
                                                  localGain,
                                                  clipSafeGain);
                              }

                              int nr =
                                      clamp255(
                                              (int) Math.round(
                                                      r * localGain));

                              int ng =
                                      clamp255(
                                              (int) Math.round(
                                                      g * localGain));

                              int nb =
                                      clamp255(
                                              (int) Math.round(
                                                      b * localGain));

                              if (nr == r
                                      && ng == g
                                      && nb == b) {
                                  continue;
                              }

                              pixels[index] =
                                      Color.argb(
                                              a,
                                              nr,
                                              ng,
                                              nb);

                              correctedPixels++;
                          }
                      }

                      if (correctedPixels == 0) {

                          return new Result(
                                  source,
                                  sourceAnalysis,
                                  true,
                                  false,
                                  "• Vignetting evidence measured, "
                                          + "but no safe radial correction "
                                          + "pixels remained\n"
                                          + "• Original mastered pixels retained"
                                          + formatNote);
                      }

                      Stats after =
                              measure(
                                      pixels,
                                      width,
                                      height,
                                      sampleStep);

                      if (!after.valid) {

                          return new Result(
                                  source,
                                  sourceAnalysis,
                                  true,
                                  false,
                                  "• Vignetting candidate: ROLLED BACK — "
                                          + "post-correction radial analysis "
                                          + "became unreliable\n"
                                          + "• Original mastered pixels retained"
                                          + formatNote);
                      }

                      Bitmap candidate =
                              workingSource.copy(
                                      Bitmap.Config.ARGB_8888,
                                      true);

                      if (candidate == null) {

                          return new Result(
                                  source,
                                  sourceAnalysis,
                                  true,
                                  false,
                                  "• Vignetting correction attempted but "
                                          + "working correction copy could "
                                          + "not be created"
                                          + formatNote);
                      }

                      candidate.setPixels(
                              pixels,
                              0,
                              width,
                              0,
                              0,
                              width,
                              height);

                      PhotoAnalysis baselineAnalysis =
                              temporaryArgb
                                      ? PhotoAnalysis.analyse(
                                              workingSource)
                                      : sourceAnalysis;

                      PhotoAnalysis candidateAnalysis =
                              PhotoAnalysis.analyse(
                                      candidate);

                      boolean accepted =
                              VignettingPolicy.outputSafe(
                                      before.falloff,
                                      after.falloff,
                                      before.cornerFalloff,
                                      after.cornerFalloff,
                                      before.quadrantSpread,
                                      after.quadrantSpread,
                                      baselineAnalysis.detail,
                                      candidateAnalysis.detail,
                                      baselineAnalysis.noise,
                                      candidateAnalysis.noise,
                                      baselineAnalysis.flatChromaNoise,
                                      candidateAnalysis.flatChromaNoise,
                                      baselineAnalysis.ringing,
                                      candidateAnalysis.ringing,
                                      baselineAnalysis.medianLum,
                                      candidateAnalysis.medianLum,
                                      baselineAnalysis.avgSat,
                                      candidateAnalysis.avgSat,
                                      baselineAnalysis.shadowClip,
                                      candidateAnalysis.shadowClip,
                                      baselineAnalysis.highlightClip,
                                      candidateAnalysis.highlightClip);

                      String metrics =
                              String.format(
                                      Locale.US,
                                      "• Outer falloff %.1f%% -> %.1f%% | "
                                              + "corner %.1f%% -> %.1f%%\n"
                                              + "• Quadrant spread %.1f%% -> %.1f%% | "
                                              + "consensus %d/4 -> %d/4\n"
                                              + "• Maximum corner gain %.3fx | "
                                              + "corrected %d pixels\n"
                                              + "• Radial RGB-ratio-preserving "
                                              + "luminance lift; no crop or resize",
                                      before.falloff * 100.0,
                                      after.falloff * 100.0,
                                      before.cornerFalloff * 100.0,
                                      after.cornerFalloff * 100.0,
                                      before.quadrantSpread * 100.0,
                                      after.quadrantSpread * 100.0,
                                      before.quadrantConsensus,
                                      after.quadrantConsensus,
                                      cornerGain,
                                      correctedPixels);

                      if (!accepted) {

                          candidate.recycle();

                          return new Result(
                                  source,
                                  sourceAnalysis,
                                  true,
                                  false,
                                  "• Vignetting candidate: ROLLED BACK — "
                                          + "radial/output QC did not confirm "
                                          + "a safe improvement\n"
                                          + metrics
                                          + "\n• Original mastered pixels retained"
                                          + formatNote);
                      }

                      return new Result(
                              candidate,
                              candidateAnalysis,
                              true,
                              true,
                              "• Measured vignetting correction: APPLIED\n"
                                      + metrics
                                      + "\n• Vignetting QC: ACCEPTED"
                                      + formatNote);

                  } finally {

                      if (temporaryArgb
                              && workingSource != null
                              && !workingSource.isRecycled()) {

                          workingSource.recycle();
                      }
                  }
              }

              private static Stats measure(
                      int[] pixels,
                      int width,
                      int height,
                      int step) {

                  Histogram center =
                          new Histogram();

                  Histogram mid =
                          new Histogram();

                  Histogram outer =
                          new Histogram();

                  Histogram corner =
                          new Histogram();

                  Histogram[] quadrants =
                          new Histogram[] {
                                  new Histogram(),
                                  new Histogram(),
                                  new Histogram(),
                                  new Histogram()
                          };

                  double cx =
                          (width - 1) * 0.5;

                  double cy =
                          (height - 1) * 0.5;

                  for (int y = 0;
                       y < height;
                       y += step) {

                      for (int x = 0;
                           x < width;
                           x += step) {

                          double r =
                                  radius(
                                          x,
                                          y,
                                          width,
                                          height);

                          int lum =
                                  luminance(
                                          pixels[
                                                  y * width
                                                          + x]);

                          if (r <= 0.25) {

                              center.add(lum);

                          } else if (r >= 0.35
                                  && r <= 0.55) {

                              mid.add(lum);

                          } else if (r >= 0.65
                                  && r <= 0.82) {

                              outer.add(lum);

                          } else if (r >= 0.84) {

                              corner.add(lum);
                          }

                          if (r >= 0.65) {

                              int quadrant;

                              if (x < cx) {
                                  quadrant =
                                          y < cy
                                                  ? 0
                                                  : 2;
                              } else {
                                  quadrant =
                                          y < cy
                                                  ? 1
                                                  : 3;
                              }

                              quadrants[
                                      quadrant].add(
                                              lum);
                          }
                      }
                  }

                  double c =
                          center.median01();

                  double m =
                          mid.median01();

                  double o =
                          outer.median01();

                  double k =
                          corner.median01();

                  boolean valid =
                          center.count >= 100
                                  && mid.count >= 100
                                  && outer.count >= 200
                                  && corner.count >= 100;

                  for (Histogram quadrant
                          : quadrants) {

                      valid =
                              valid
                                      && quadrant.count
                                      >= 50;
                  }

                  if (!valid
                          || c <= 0.0) {

                      return new Stats(
                              c,
                              m,
                              o,
                              k,
                              0.0,
                              0.0,
                              1.0,
                              0,
                              center.count,
                              outer.count,
                              false);
                  }

                  double falloff =
                          (c - o) / c;

                  double cornerFalloff =
                          (c - k) / c;

                  double minQuadrant =
                          1.0;

                  double maxQuadrant =
                          0.0;

                  int consensus =
                          0;

                  for (Histogram quadrant
                          : quadrants) {

                      double q =
                              quadrant.median01();

                      minQuadrant =
                              Math.min(
                                      minQuadrant,
                                      q);

                      maxQuadrant =
                              Math.max(
                                      maxQuadrant,
                                      q);

                      if (q
                              <= c * 0.94) {

                          consensus++;
                      }
                  }

                  double spread =
                          (maxQuadrant
                                  - minQuadrant)
                                  / Math.max(
                                          0.01,
                                          c);

                  return new Stats(
                          c,
                          m,
                          o,
                          k,
                          falloff,
                          cornerFalloff,
                          spread,
                          consensus,
                          center.count,
                          outer.count,
                          true);
              }

              private static double radius(
                      int x,
                      int y,
                      int width,
                      int height) {

                  double cx =
                          (width - 1) * 0.5;

                  double cy =
                          (height - 1) * 0.5;

                  double nx =
                          (x - cx)
                                  / Math.max(
                                          1.0,
                                          cx);

                  double ny =
                          (y - cy)
                                  / Math.max(
                                          1.0,
                                          cy);

                  return Math.min(
                          1.0,
                          Math.sqrt(
                                  nx * nx
                                          + ny * ny)
                                  / Math.sqrt(2.0));
              }

              private static int luminance(
                      int color) {

                  int r =
                          Color.red(color);

                  int g =
                          Color.green(color);

                  int b =
                          Color.blue(color);

                  return (
                          77 * r
                                  + 150 * g
                                  + 29 * b
                                  + 128
                  ) >> 8;
              }

              private static int clamp255(
                      int value) {

                  return Math.max(
                          0,
                          Math.min(
                                  255,
                                  value));
              }
          }
