name: Build Photo Master AI v0.4.15 Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-photo-master-ai-v0.4.15-recovery.yml'

permissions:
  contents: read

jobs:
  build:
    name: Photo Master AI v0.4.15 Runtime Resilience Guard
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover exact successful v0.4.14 source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          V0414_COMMIT="f04155ea114947557f1e9482379c69e99dd12c97"

          git cat-file -e "${V0414_COMMIT}^{commit}" || {
            echo "::error::Successful v0.4.14 commit unavailable"
            exit 1
          }

          git show \
            "${V0414_COMMIT}:.github/workflows/build-photo-master-ai-v0.4.14-recovery.yml" \
            > /tmp/v0414-recovery.yml

          python3 - <<'PY'
          from pathlib import Path

          lines = Path(
              "/tmp/v0414-recovery.yml"
          ).read_text().splitlines()

          def extract_step(name, destination):
              step = None

              for i, line in enumerate(lines):
                  if line.strip() == "- name: " + name:
                      step = i
                      break

              if step is None:
                  raise RuntimeError(
                      "Workflow step not found: " + name
                  )

              run = None

              for i in range(step, len(lines)):
                  if lines[i].strip() == "run: |":
                      run = i
                      break

                  if (
                      i > step
                      and lines[i].startswith("      - name:")
                  ):
                      break

              if run is None:
                  raise RuntimeError(
                      "Run block not found: " + name
                  )

              body = []

              for line in lines[run + 1:]:
                  if line.startswith("      - name:"):
                      break

                  if not line.strip():
                      body.append("")

                  elif line.startswith("          "):
                      body.append(line[10:])

                  else:
                      raise RuntimeError(
                          "Unexpected indentation while extracting: "
                          + name
                      )

              Path(destination).write_text(
                  "\n".join(body) + "\n"
              )

          extract_step(
              "Recover exact successful v0.4.13 source",
              "/tmp/recover-v0413-source.sh"
          )

          extract_step(
              "Apply v0.4.14 authoritative-original checkpoint",
              "/tmp/apply-v0414-checkpoint.sh"
          )

          print(
              "Extracted successful v0.4.14 source construction"
          )
          PY

          bash /tmp/recover-v0413-source.sh

          PROJECT="$(
            find photomaster-v044-build \
              -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -printf '%h\n' \
              | head -n 1
          )"

          test -n "$PROJECT" || {
            echo "::error::Recovered project not found"
            exit 1
          }

          export PROJECT

          bash /tmp/apply-v0414-checkpoint.sh

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          grep -q \
            "versionCode 23" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "versionName '0.4.14'" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "enforceAuthoritativeOriginalCheckpoint" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

          grep -q \
            "Authoritative-original checkpoint: VERIFIED" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

          grep -q \
            "smoothSurfaceTerminalGuard" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/PhotoMasterEngine.java"

          grep -q \
            "smooth metric floor; lower blends skipped" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "MAX_TOTAL_NEURAL_MS = 90_000L" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "GpuBackend.OPENCL" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiserRuntime.kt"

          if grep -q \
            "new NeuralDenoiserRuntime(context, true)" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"
          then
            echo "::error::CPU neural fallback detected"
            exit 1
          fi

          echo "Exact successful v0.4.14 source recovered"

      - name: Apply v0.4.15 runtime resilience guard
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os

          project = Path(os.environ["PROJECT"])

          # =====================================================
          # VERSION
          # =====================================================

          build_file = project / "app/build.gradle"
          build = build_file.read_text()

          if "versionCode 23" not in build:
              raise RuntimeError(
                  "v0.4.14 versionCode not found"
              )

          if "versionName '0.4.14'" not in build:
              raise RuntimeError(
                  "v0.4.14 versionName not found"
              )

          build = build.replace(
              "versionCode 23",
              "versionCode 24",
              1
          )

          build = build.replace(
              "versionName '0.4.14'",
              "versionName '0.4.15'",
              1
          )

          build_file.write_text(build)

          # =====================================================
          # NEURAL RUNTIME RESILIENCE
          #
          # IMAGE PROCESSING IS FROZEN.
          #
          # Keep:
          # - NAFNet-SIDD width32
          # - Classic LiteRT OpenCL GPU
          # - FP32 behaviour
          # - NCHW input/output
          # - 8 second per-tile stall protection
          # - neural blend/QC
          # - adaptive recovery
          # - smooth-scene policy
          # - no CPU neural fallback
          #
          # Only change:
          # 90 sec total = warning
          # 240 sec total = hard ceiling
          # =====================================================

          neural_file = project / (
              "app/src/main/java/com/dennis/"
              "photomasterai/NeuralDenoiser.java"
          )

          neural = neural_file.read_text()

          old_constant = (
              "    private static final long "
              "MAX_TOTAL_NEURAL_MS = 90_000L;"
          )

          new_constants = "\n".join([
              "    private static final long SOFT_TOTAL_NEURAL_MS = 90_000L;",
              "    private static final long MAX_TOTAL_NEURAL_MS = 240_000L;",
          ])

          if old_constant not in neural:
              raise RuntimeError(
                  "90-second neural total guard not found"
              )

          neural = neural.replace(
              old_constant,
              new_constants,
              1
          )

          old_declarations = "\n".join([
              "        long selfTestMs = 0L;",
              "        boolean slowSelfTestWarning = false;",
              "        long maxTileMs = 0L;",
          ])

          new_declarations = "\n".join([
              "        long selfTestMs = 0L;",
              "        boolean slowSelfTestWarning = false;",
              "        boolean slowTotalWarning = false;",
              "        long maxTileMs = 0L;",
          ])

          if old_declarations not in neural:
              raise RuntimeError(
                  "Neural timing declaration anchor not found"
              )

          neural = neural.replace(
              old_declarations,
              new_declarations,
              1
          )

          old_guard = "\n".join([
              "                    if (tiles > 0",
              "                            && elapsedBeforeTileMs > MAX_TOTAL_NEURAL_MS) {",
              "                        throw new IllegalStateException(",
              "                                \"Classic GPU neural pass exceeded total performance guard after \"",
              "                                        + tiles + \" tiles: \"",
              "                                        + elapsedBeforeTileMs + \" ms\");",
              "                    }",
          ])

          new_guard = "\n".join([
              "                    if (tiles > 0",
              "                            && elapsedBeforeTileMs > SOFT_TOTAL_NEURAL_MS) {",
              "                        slowTotalWarning = true;",
              "                    }",
              "",
              "                    if (tiles > 0",
              "                            && elapsedBeforeTileMs > MAX_TOTAL_NEURAL_MS) {",
              "                        throw new IllegalStateException(",
              "                                \"Classic GPU neural pass exceeded hard total performance guard after \"",
              "                                        + tiles + \" tiles: \"",
              "                                        + elapsedBeforeTileMs + \" ms\");",
              "                    }",
          ])

          if old_guard not in neural:
              raise RuntimeError(
                  "Whole-pass performance guard block not found"
              )

          neural = neural.replace(
              old_guard,
              new_guard,
              1
          )

          adaptive_anchor = "        String adaptiveLine;"

          if adaptive_anchor not in neural:
              raise RuntimeError(
                  "Neural report insertion anchor not found"
              )

          warning_report = "\n".join([
              "        if (slowTotalWarning) {",
              "            metrics += String.format(",
              "                    Locale.US,",
              "                    \"\\n• GPU total-time warning: exceeded %.0fs soft guard; run allowed to continue (hard limit %.0fs)\",",
              "                    SOFT_TOTAL_NEURAL_MS / 1000.0,",
              "                    MAX_TOTAL_NEURAL_MS / 1000.0);",
              "        }",
              "",
          ])

          neural = neural.replace(
              adaptive_anchor,
              warning_report + adaptive_anchor,
              1
          )

          neural_file.write_text(neural)

          print(
              "v0.4.15 runtime resilience guard applied"
          )

          print(
              "90-second total timeout is warning-only"
          )

          print(
              "240-second hard runaway ceiling enabled"
          )

          print(
              "8-second individual tile guard unchanged"
          )

          print(
              "NAFNet/OpenCL/NCHW/blend/QC unchanged"
          )
          PY

          grep -q \
            "versionCode 24" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "versionName '0.4.15'" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "SOFT_TOTAL_NEURAL_MS = 90_000L" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "MAX_TOTAL_NEURAL_MS = 240_000L" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "slowTotalWarning" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "GPU total-time warning" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "MAX_TILE_MS = 8_000L" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "smooth metric floor; lower blends skipped" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "enforceAuthoritativeOriginalCheckpoint" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

          grep -q \
            "smoothSurfaceTerminalGuard" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/PhotoMasterEngine.java"

          grep -q \
            "GpuBackend.OPENCL" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiserRuntime.kt"

          if grep -q \
            "new NeuralDenoiserRuntime(context, true)" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"
          then
            echo "::error::CPU neural fallback detected"
            exit 1
          fi

          echo "v0.4.15 source verification passed"

      - name: Fetch pinned NAFNet-SIDD model
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"
          ASSETS="$PROJECT/app/src/main/assets"
          MODEL="$ASSETS/nafnet_sidd_width32_fp16.tflite"

          mkdir -p "$ASSETS"

          URL='https://huggingface.co/litert-community/NAFNet-SIDD-width32-LiteRT/resolve/main/nafnet_sidd_width32_fp16.tflite?download=true'

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --output "$MODEL.tmp" \
            "$URL"

          mv "$MODEL.tmp" "$MODEL"

          test "$(stat -c%s "$MODEL")" -eq 62454048 || {
            echo "::error::Unexpected NAFNet model size"
            exit 1
          }

          echo \
          'f8fbaa422411683c53e802cf7cc7cf9be0a0de00886ad4af057232e26b172a0c  '"$MODEL" \
          | sha256sum -c -

          echo "Pinned NAFNet-SIDD model verified"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run all safety host checks
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf host-checks
          mkdir host-checks

          javac -d host-checks \
            app/src/main/java/com/dennis/photomasterai/DeepPixelRepair.java \
            app/src/main/java/com/dennis/photomasterai/RepairSafetyPolicy.java \
            app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java \
            app/src/main/java/com/dennis/photomasterai/SocialSourcePolicy.java \
            tools/DeepPixelRepairHostChecks.java \
            tools/RepairSafetyPolicyHostChecks.java \
            tools/NeuralDenoisePolicyHostChecks.java \
            tools/SocialSourcePolicyHostChecks.java \
            tools/SmoothSurfaceGuardHostChecks.java

          java -cp host-checks \
            com.dennis.photomasterai.DeepPixelRepairHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.RepairSafetyPolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.NeuralDenoisePolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.SocialSourcePolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.SmoothSurfaceGuardHostChecks

      - name: Restore stable Photo Master debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photo-master-ai-debug-keystore-v1

      - name: Create signing key on first build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Photo Master AI,O=Dennis Photo Master,C=AU" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$SDK/cmdline-tools" \
                -type f \
                -name 'sdkmanager' \
                | sort -V \
                | tail -n 1
            )"
          fi

          test -n "$SDKMANAGER" || {
            echo "::error::sdkmanager not found"
            exit 1
          }

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build v0.4.15 APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:assembleDebug \
            --stacktrace

      - name: Verify package and prepare artifact
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "::error::APK not found"
            exit 1
          }

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK/build-tools/35.0.0/aapt"

          BADGING="$(
            "$AAPT" dump badging "$APK" \
              | head -n 1
          )"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -q "package: name='com.dennis.photomasterai'"

          echo "$BADGING" \
            | grep -q "versionCode='24'"

          echo "$BADGING" \
            | grep -q "versionName='0.4.15'"

          unzip -l "$APK" \
            | grep -q 'assets/nafnet_sidd_width32_fp16.tflite'

          rm -rf artifact
          mkdir artifact

          OUT="artifact/PhotoMasterAI-v0.4.15-RUNTIME-RESILIENCE-GUARD.apk"

          cp "$APK" "$OUT"

          sha256sum "$OUT" \
            > "artifact/PhotoMasterAI-v0.4.15-RUNTIME-RESILIENCE-GUARD-SHA256.txt"

          cat > "artifact/PhotoMasterAI-v0.4.15-Notes.txt" <<EOF
          Photo Master AI — v0.4.15 Continuation Notes

          Version:
          v0.4.15

          versionCode:
          24

          BASELINE
          Exact successful v0.4.14 source.
          Commit:
          f04155ea114947557f1e9482379c69e99dd12c97

          PURPOSE
          Runtime-resilience-only build.
          No image-quality tuning changed.

          FROZEN
          - NAFNet-SIDD width32
          - Classic LiteRT OpenCL GPU
          - FP32 behaviour
          - NCHW FLOAT32 [1,3,256,256]
          - No CPU neural fallback
          - 8-second per-tile stall guard
          - Neural blend/QC/adaptive ladder
          - Smooth-scene 5% cap
          - Smooth-scene +0.015 ringing allowance
          - Smooth metric-floor early stop
          - v0.4.13 terminal smooth-scene decision
          - v0.4.14 authoritative-original checkpoint
          - PhotoMasterEngine processing logic

          PROBLEM FOUND
          The old 90-second whole-pass limit was producing false
          neural failures even though individual GPU tiles were
          still completing normally.

          Examples:
          Pond:
          239/252 tiles at 90.041 seconds.

          Duck slow run:
          235 tiles at approximately 197.985 seconds.

          Known healthy runs:
          approximately 67–71 seconds for 252 tiles.

          v0.4.15 POLICY
          - 90 seconds is now a SOFT WARNING.
          - Processing continues past 90 seconds.
          - 240 seconds is the HARD runaway ceiling.
          - Any individual tile above 8 seconds still aborts.
          - No CPU neural retry or fallback.

          EXPECTED REPORT ON A SLOW SUCCESSFUL RUN
          GPU total-time warning: exceeded 90s soft guard;
          run allowed to continue (hard limit 240s)

          FIRST RETESTS
          1. Exact pond photo that stopped at tile 239.
          2. Exact duck photo.
          3. Then portrait.
          4. Then flower.
          5. Then detailed landscape.

          IMPORTANT
          Do not change denoise strength based on this build.
          This version only removes the false 90-second timeout
          so current v0.4.14 neural/QC behaviour can be tested.
          EOF

          echo "v0.4.15 APK and continuation notes prepared"

      - name: Upload APK and continuation notes
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMasterAI-v0.4.15-RUNTIME-RESILIENCE-GUARD
          path: |
            artifact/PhotoMasterAI-v0.4.15-RUNTIME-RESILIENCE-GUARD.apk
            artifact/PhotoMasterAI-v0.4.15-RUNTIME-RESILIENCE-GUARD-SHA256.txt
            artifact/PhotoMasterAI-v0.4.15-Notes.txt
          if-no-files-found: error
          retention-days: 30
