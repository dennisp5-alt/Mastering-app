name: Build Photo Master AI v0.4.1 Neural Tensor Fix + Social Guard v2

on:
  workflow_dispatch:
  push:
    paths:
      - 'PhotoMasterAI-v0.4.1*.zip'
      - '.github/workflows/build-photo-master-ai-v0.4.1.yml'

permissions:
  contents: read

jobs:
  build:
    name: Photo Master AI v0.4.1 Neural Tensor Fix + Social Guard v2
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'PhotoMasterAI-v0.4.1*.zip' -printf '%f\n' | sort -V | tail -n 1 || true)"
          test -n "$ZIP" || { echo "::error::No PhotoMasterAI v0.4.1 source ZIP found in repository root"; exit 1; }
          echo "Using source ZIP: $ZIP"
          unzip -t "$ZIP"

          rm -rf photomaster-v041-build
          mkdir photomaster-v041-build
          unzip -q "$ZIP" -d photomaster-v041-build

          SETTINGS="$(find photomaster-v041-build -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1 || true)"
          test -n "$SETTINGS" || { echo "::error::settings.gradle not found"; exit 1; }
          PROJECT="$(dirname "$SETTINGS")"
          BUILD_FILE="$PROJECT/app/build.gradle"

          test -f "$BUILD_FILE" || { echo "::error::app/build.gradle not found"; exit 1; }
          grep -q "versionCode 10" "$BUILD_FILE" || { echo "::error::versionCode 10 missing"; exit 1; }
          grep -q "versionName '0.4.1'" "$BUILD_FILE" || { echo "::error::versionName 0.4.1 missing"; exit 1; }
          grep -q "com.google.ai.edge.litert:litert:2.2.0" "$BUILD_FILE" || { echo "::error::LiteRT 2.2.0 dependency missing"; exit 1; }
          test -f "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiserRuntime.kt" || exit 1
          test -f "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java" || exit 1
          test -f "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java" || exit 1
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Fetch pinned NAFNet-SIDD neural denoise model
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.source.outputs.project }}"
          ASSETS="$PROJECT/app/src/main/assets"
          MODEL="$ASSETS/nafnet_sidd_width32_fp16.tflite"
          mkdir -p "$ASSETS"

          URL='https://huggingface.co/litert-community/NAFNet-SIDD-width32-LiteRT/resolve/main/nafnet_sidd_width32_fp16.tflite?download=true'
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            --output "$MODEL.tmp" "$URL"
          mv "$MODEL.tmp" "$MODEL"

          test "$(stat -c%s "$MODEL")" -eq 62454048 || {
            echo "::error::Unexpected NAFNet model size: $(stat -c%s "$MODEL")"; exit 1;
          }
          echo 'f8fbaa422411683c53e802cf7cc7cf9be0a0de00886ad4af057232e26b172a0c  '"$MODEL" | sha256sum -c -
          echo "Pinned NAFNet-SIDD model verified."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run restoration safety host checks
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf host-checks
          mkdir host-checks
          javac -d host-checks \
            app/src/main/java/com/dennis/photomasterai/DeepPixelRepair.java \
            app/src/main/java/com/dennis/photomasterai/RepairSafetyPolicy.java \
            app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java \
            app/src/main/java/com/dennis/photomasterai/SocialSourcePolicy.java \
            tools/DeepPixelRepairHostChecks.java \
            tools/RepairSafetyPolicyHostChecks.java \
            tools/NeuralDenoisePolicyHostChecks.java \
            tools/SocialSourcePolicyHostChecks.java
          java -cp host-checks com.dennis.photomasterai.DeepPixelRepairHostChecks
          java -cp host-checks com.dennis.photomasterai.RepairSafetyPolicyHostChecks
          java -cp host-checks com.dennis.photomasterai.NeuralDenoisePolicyHostChecks
          java -cp host-checks com.dennis.photomasterai.SocialSourcePolicyHostChecks

      - name: Restore stable Photo Master debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photo-master-ai-debug-keystore-v1

      - name: Create signing key on first build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Photo Master AI,O=Dennis Photo Master,C=AU" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1 || true)"
          fi

          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo "::error::sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace

      - name: Verify package, neural model and collect APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.source.outputs.project }}"
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "::error::APK not found"; exit 1; }

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK/build-tools/35.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$BADGING"

          echo "$BADGING" | grep -q "package: name='com.dennis.photomasterai'" || exit 1
          echo "$BADGING" | grep -q "versionCode='10'" || exit 1
          echo "$BADGING" | grep -q "versionName='0.4.1'" || exit 1
          unzip -l "$APK" | grep -q 'assets/nafnet_sidd_width32_fp16.tflite' || {
            echo "::error::NAFNet model missing from APK"; exit 1;
          }

          rm -rf artifact
          mkdir artifact
          OUT="artifact/PhotoMasterAI-v0.4.1-NEURAL-TENSOR-SOCIAL-GUARD.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "artifact/PhotoMasterAI-v0.4.1-NEURAL-TENSOR-SOCIAL-GUARD-SHA256.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMasterAI-v0.4.1-NEURAL-TENSOR-SOCIAL-GUARD
          path: |
            artifact/PhotoMasterAI-v0.4.1-NEURAL-TENSOR-SOCIAL-GUARD.apk
            artifact/PhotoMasterAI-v0.4.1-NEURAL-TENSOR-SOCIAL-GUARD-SHA256.txt
          if-no-files-found: error
          retention-days: 30
