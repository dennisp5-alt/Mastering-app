            tools/GeometryPolicyHostChecks.java \
            tools/LocalTonePolicyHostChecks.java \
            tools/MixedLightColourPolicyHostChecks.java \
            tools/MixedLightContinuityPolicyHostChecks.java \
            tools/PerceptualImprovementPolicyHostChecks.java \
            tools/NightLightControlPolicyHostChecks.java

          for C in \
            DeepPixelRepairHostChecks \
            RepairSafetyPolicyHostChecks \
            NeuralDenoisePolicyHostChecks \
            SocialSourcePolicyHostChecks \
            SmoothSurfaceGuardHostChecks \
            NeuralIntegrityPolicyHostChecks \
            OpticalFringePolicyHostChecks \
            VignettingPolicyHostChecks \
            PersonEvidencePolicyHostChecks \
            HighBlendDetailGuardHostChecks \
            HighRingFinishingPolicyHostChecks \
            GeometryPolicyHostChecks \
            LocalTonePolicyHostChecks \
            MixedLightColourPolicyHostChecks \
            MixedLightContinuityPolicyHostChecks \
            PerceptualImprovementPolicyHostChecks \
            NightLightControlPolicyHostChecks
          do
            java \
              -cp host-checks \
              "com.dennis.photomasterai.$C"
          done

      - name: Restore stable Photo Master debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photo-master-ai-debug-keystore-v1

      - name: Create signing key on first build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then

            keytool \
              -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Photo Master AI,O=Dennis Photo Master,C=AU" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then

            SDKMANAGER="$(
              find "$SDK/cmdline-tools" \
                -type f \
                -name 'sdkmanager' \
                | sort -V \
                | tail -n 1
            )"
          fi

          test -n "$SDKMANAGER" || {
            echo "::error::sdkmanager not found"
            exit 1
          }

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build v0.4.31 APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:assembleDebug \
            --stacktrace

      - name: Verify package and prepare artifact
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "::error::APK not found"
            exit 1
          }

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          AAPT="$SDK/build-tools/35.0.0/aapt"

          BADGING="$(
            "$AAPT" dump badging "$APK" \
              | head -n 1
          )"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -q \
            "package: name='com.dennis.photomasterai'"

          echo "$BADGING" \
            | grep -q \
            "versionCode='40'"

          echo "$BADGING" \
            | grep -q \
            "versionName='0.4.31'"

          unzip -l "$APK" \
            | grep -q \
            'assets/nafnet_sidd_width32_fp16.tflite'

          rm -rf artifact
          mkdir artifact

          OUT="artifact/PhotoMasterAI-v0.4.31-NIGHT-LIGHT-CONTROL.apk"

          cp \
            "$APK" \
            "$OUT"

          sha256sum "$OUT" \
            > "artifact/PhotoMasterAI-v0.4.31-NIGHT-LIGHT-CONTROL-SHA256.txt"

          cat > "artifact/PhotoMasterAI-v0.4.31-Notes.txt" <<'EOF'
          Photo Master AI — v0.4.31 Night Light Control

          Version: 0.4.31
          versionCode: 40

          BASELINE
          Exact successful v0.4.30 source reconstructed from
          commit 92ca5f176916d0b150166734050b1cc717cb52b4.

          v0.4.30 remains the frozen Natural/AI baseline.

          NEW
          - Night Light Control
          - runs after Mixed-Light Colour
          - runs before Perceptual Improvement
          - detects dark-upper / bright-lower / hotspot lighting structure
          - darkness alone never activates Night Light Control
          - dark sky regions are explicitly protected
          - saturated light sources are protected
          - low-saturation hotspot and flash-spill regions are compressed
          - nearby low-saturation bloom is moderately contained
          - maximum channel change capped to 8/255
          - active-area limit prevents global darkening
          - candidate rolls back if detail/noise/chroma/ringing/clipping
            or dark-sky integrity worsens

          TARGET
          Night scooter regression:
          - retain black night background
          - preserve saturated red tail lamp
          - reduce bright concrete / flash spill
          - improve scooter/background separation through highlight control
          - avoid fake HDR or global shadow lifting

          RETAINED
          - v0.4.30 Perceptual Improvement Controller
          - v0.4.29 Mixed-Light Continuity Guard
          - v0.4.27 Local Tone safeguards
          - v0.4.25 Geometry structural override
          - preserve-source sRGB / Display P3
          - high-ring finishing guard
          - NAFNet-SIDD safeguards
          - optics and vignetting safeguards
          - shadow-integrity rollback
          - background / screen-off processing
          - JPEG quality 100
          EOF

      - name: Upload APK and continuation notes
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMasterAI-v0.4.31-NIGHT-LIGHT-CONTROL
          path: |
            artifact/PhotoMasterAI-v0.4.31-NIGHT-LIGHT-CONTROL.apk
            artifact/PhotoMasterAI-v0.4.31-NIGHT-LIGHT-CONTROL-SHA256.txt
            artifact/PhotoMasterAI-v0.4.31-Notes.txt
          if-no-files-found: error
          retention-days: 30