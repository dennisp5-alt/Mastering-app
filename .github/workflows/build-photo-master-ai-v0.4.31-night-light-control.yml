name: Build Photo Master AI v0.4.31 Night Light Control

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-photo-master-ai-v0.4.31-night-light-control.yml'

permissions:
  contents: read

jobs:
  build:
    name: Photo Master AI v0.4.31 Night Light Control
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover exact successful v0.4.30 source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          V0430_COMMIT="92ca5f176916d0b150166734050b1cc717cb52b4"

          git cat-file -e "${V0430_COMMIT}^{commit}" || {
            echo "::error::Successful v0.4.30 commit unavailable"
            exit 1
          }

          git show \
            "${V0430_COMMIT}:.github/workflows/build-photo-master-ai-v0.4.30-perceptual-improvement.yml" \
            > /tmp/v0430.yml

          python3 - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/v0430.yml').read_text().splitlines()

          def extract_step(name, destination):
              start = None

              for i, line in enumerate(lines):
                  if line.strip() == '- name: ' + name:
                      start = i
                      break

              if start is None:
                  raise RuntimeError(
                      'Workflow step not found: ' + name
                  )

              run = None

              for i in range(start, len(lines)):
                  if lines[i].strip() == 'run: |':
                      run = i
                      break

                  if (
                      i > start
                      and lines[i].startswith('      - name:')
                  ):
                      break

              if run is None:
                  raise RuntimeError(
                      'Run block not found: ' + name
                  )

              body = []

              for line in lines[run + 1:]:
                  if line.startswith('      - name:'):
                      break

                  if not line.strip():
                      body.append('')

                  elif line.startswith('          '):
                      body.append(line[10:])

                  else:
                      raise RuntimeError(
                          'Unexpected indentation while extracting: '
                          + name
                      )

              Path(destination).write_text(
                  '\n'.join(body) + '\n'
              )

          extract_step(
              'Recover exact successful v0.4.29 source',
              '/tmp/recover-v0429.sh'
          )

          extract_step(
              'Apply v0.4.30 Perceptual Improvement Controller',
              '/tmp/apply-v0430.sh'
          )
          PY

          bash /tmp/recover-v0429.sh

          PROJECT="$(
            find photomaster-v044-build \
              -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -printf '%h\n' \
              | head -n 1
          )"

          test -n "$PROJECT" || {
            echo "::error::Recovered project not found"
            exit 1
          }

          export PROJECT

          bash /tmp/apply-v0430.sh

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          grep -q "versionCode 39" \
            "$PROJECT/app/build.gradle"

          grep -q "versionName '0.4.30'" \
            "$PROJECT/app/build.gradle"

          grep -q "class PerceptualImprovementPolicy" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/PerceptualImprovementPolicy.java"

          grep -q "applyPerceptualImprovementController" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

          grep -q "MAX_ADJACENT_GAIN_STEP = 0.045" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MixedLightColourIntelligence.java"

          grep -q "MAX_FINAL_CHANNEL_CODE_DELTA = 9" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MixedLightColourIntelligence.java"

          echo "Exact successful v0.4.30 source recovered"

      - name: Restore v0.4.31 Night Light source
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail

          FAILED_V0431_COMMIT="db4f6369a3ddf5e5a4c41157b1e2495675b880d5"

          git show \
            "${FAILED_V0431_COMMIT}:.github/workflows/build-photo-master-ai-v0.4.31-night-light-control.yml" \
            > /tmp/v0431-original.yml

          python3 - <<'PY'
          from pathlib import Path
          import os

          project = Path(os.environ['PROJECT'])

          lines = Path(
              '/tmp/v0431-original.yml'
          ).read_text().splitlines()

          specs = [
              (
                  'JAVA_POLICY',
                  project / (
                      'app/src/main/java/com/dennis/'
                      'photomasterai/NightLightControlPolicy.java'
                  )
              ),
              (
                  'JAVA_ENGINE',
                  project / (
                      'app/src/main/java/com/dennis/'
                      'photomasterai/NightLightControlIntelligence.java'
                  )
              ),
              (
                  'JAVA_HOST',
                  project / (
                      'tools/NightLightControlPolicyHostChecks.java'
                  )
              ),
          ]

          for marker, destination in specs:
              start = None

              for i, line in enumerate(lines):
                  if (
                      "<<'" + marker + "'"
                      in line
                  ):
                      start = i + 1
                      break

              if start is None:
                  raise RuntimeError(
                      'Missing source block: ' + marker
                  )

              body = []
              found_end = False

              for line in lines[start:]:
                  if line.strip() == marker:
                      found_end = True
                      break

                  if not line.strip():
                      body.append('')

                  elif line.startswith('          '):
                      body.append(line[10:])

                  else:
                      raise RuntimeError(
                          'Unexpected source indentation in '
                          + marker
                      )

              if not found_end:
                  raise RuntimeError(
                      'Missing end marker: ' + marker
                  )

              destination.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              destination.write_text(
                  '\n'.join(body) + '\n'
              )

              print(
                  'Restored',
                  destination
              )
          PY

          grep -q "class NightLightControlPolicy" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java"

          grep -q "class NightLightControlIntelligence" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"

          grep -q "MAX_CHANNEL_CODE_DELTA = 8" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"

          grep -q "NightLightControlPolicyHostChecks" \
            "$PROJECT/tools/NightLightControlPolicyHostChecks.java"

      - name: Apply corrected v0.4.31 pipeline
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          project = Path(
              os.environ['PROJECT']
          )

          # -------------------------------------------------------
          # VERSION
          # -------------------------------------------------------

          build_file = project / 'app/build.gradle'
          build = build_file.read_text()

          if 'versionCode 39' not in build:
              raise RuntimeError(
                  'v0.4.30 versionCode not found'
              )

          if "versionName '0.4.30'" not in build:
              raise RuntimeError(
                  'v0.4.30 versionName not found'
              )

          build = build.replace(
              'versionCode 39',
              'versionCode 40',
              1
          )

          build = build.replace(
              "versionName '0.4.30'",
              "versionName '0.4.31'",
              1
          )

          build_file.write_text(
              build
          )

          # -------------------------------------------------------
          # MAIN PIPELINE
          #
          # v0.4.30:
          # Mixed Light -> Perceptual -> Colour Management
          #
          # v0.4.31:
          # Mixed Light -> Night Light -> Perceptual ->
          # Colour Management
          # -------------------------------------------------------

          main_file = project / (
              'app/src/main/java/com/dennis/'
              'photomasterai/MainActivity.java'
          )

          main = main_file.read_text()

          pattern = re.compile(
              r'(?ms)^'
              r'(?P<i>[ \t]*)'
              r'PhotoMasterEngine\.Result[ \t]+'
              r'v0430PerceptualResult[ \t]*=[ \t\r\n]*'
              r'applyPerceptualImprovementController'
              r'\([ \t\r\n]*'
              r'v0428MixedLightResult[ \t]*,[ \t\r\n]*'
              r'originalBitmap[ \t\r\n]*\);'
          )

          match = pattern.search(
              main
          )

          if match is None:
              at = main.find(
                  'v0430PerceptualResult'
              )

              if at >= 0:
                  print(
                      main[
                          max(
                              0,
                              at - 1200
                          ):
                          at + 2400
                      ]
                  )

              raise RuntimeError(
                  'v0.4.30 Mixed-Light -> '
                  'Perceptual flow not found'
              )

          indentation = match.group('i')

          replacement = (
              indentation
              + 'PhotoMasterEngine.Result '
              + 'v0431NightLightResult =\n'

              + indentation
              + '        applyNightLightControl(\n'

              + indentation
              + '                v0428MixedLightResult,\n'

              + indentation
              + '                originalBitmap);\n\n'

              + indentation
              + 'PhotoMasterEngine.Result '
              + 'v0430PerceptualResult =\n'

              + indentation
              + '        '
              + 'applyPerceptualImprovementController(\n'

              + indentation
              + '                v0431NightLightResult,\n'

              + indentation
              + '                originalBitmap);'
          )

          main, count = pattern.subn(
              lambda _: replacement,
              main,
              count=1
          )

          if count != 1:
              raise RuntimeError(
                  'Unexpected Night Light pipeline '
                  'replacement count'
              )

          # -------------------------------------------------------
          # ADD MAINACTIVITY NIGHT-LIGHT HELPER
          # -------------------------------------------------------

          anchor = (
              '    private PhotoMasterEngine.Result '
              'applyPerceptualImprovementController('
          )

          if anchor not in main:
              raise RuntimeError(
                  'Perceptual helper anchor not found'
              )

          helper_lines = [
              '    private PhotoMasterEngine.Result '
              'applyNightLightControl(',

              '            PhotoMasterEngine.Result result,',

              '            Bitmap authoritativeOriginal) {',

              '        if (result == null '
              '|| result.bitmap == null '
              '|| result.bitmap.isRecycled()',

              '                || authoritativeOriginal == null '
              '|| authoritativeOriginal.isRecycled()) '
              'return result;',

              '        NightLightControlIntelligence.Outcome '
              'controlled =',

              '                '
              'NightLightControlIntelligence.process(',

              '                        result.bitmap,',

              '                        authoritativeOriginal,',

              '                        result.report);',

              '        String report = '
              'insertNightLightControlReport(',

              '                result.report,',

              '                controlled.report);',

              '        if (controlled.analysis != null)',

              '            report = replaceOutputQcMetrics(',

              '                    report,',

              '                    controlled.analysis);',

              '        if (controlled.bitmap != result.bitmap) {',

              '            Bitmap previous = result.bitmap;',

              '            if (previous != authoritativeOriginal '
              '&& !previous.isRecycled())',

              '                previous.recycle();',

              '        }',

              '        return new PhotoMasterEngine.Result(',

              '                controlled.bitmap,',

              '                report,',

              '                controlled.analysis != null',

              '                        ? controlled.analysis',

              '                        : PhotoAnalysis.analyse('
              'controlled.bitmap));',

              '    }',

              '',

              '    private String insertNightLightControlReport(',

              '            String sourceReport,',

              '            String nightReport) {',

              '        String section = '
              '"\\nNIGHT LIGHT CONTROL\\n"',

              '                + nightReport + "\\n";',

              '        if (sourceReport == null)',

              '            return section.trim();',

              '        String marker = "\\nOUTPUT QC\\n";',

              '        int at = sourceReport.indexOf(marker);',

              '        if (at < 0)',

              '            return sourceReport + section;',

              '        return sourceReport.substring(0, at)',

              '                + section',

              '                + sourceReport.substring(at);',

              '    }',

              '',
          ]

          helper = '\n'.join(
              helper_lines
          )

          main = main.replace(
              anchor,
              helper + anchor,
              1
          )

          main_file.write_text(
              main
          )

          # -------------------------------------------------------
          # PERCEPTUAL CONTROLLER
          #
          # Recognise an accepted Night Light result as an
          # approved correction direction.
          # -------------------------------------------------------

          perceptual_file = project / (
              'app/src/main/java/com/dennis/'
              'photomasterai/'
              'PerceptualImprovementIntelligence.java'
          )

          perceptual = perceptual_file.read_text()

          signal_pattern = re.compile(
              r'(?P<i>[ \t]*)'
              r'return report\.contains\(\s*'
              r'"Local tone ACCEPTED"\)'
          )

          signal_match = signal_pattern.search(
              perceptual
          )

          if signal_match is None:
              raise RuntimeError(
                  'Perceptual accepted-signal anchor '
                  'not found'
              )

          i = signal_match.group('i')

          signal_replacement = (
              i
              + 'return report.contains(\n'
              + i
              + '        "Night-light control ACCEPTED")\n\n'
              + i
              + '        || report.contains(\n'
              + i
              + '        "Local tone ACCEPTED")'
          )

          perceptual, signal_count = signal_pattern.subn(
              lambda _: signal_replacement,
              perceptual,
              count=1
          )

          if signal_count != 1:
              raise RuntimeError(
                  'Unexpected accepted-signal '
                  'replacement count'
              )

          perceptual_file.write_text(
              perceptual
          )

          print(
              'v0.4.31 pipeline applied: '
              'Local Tone -> Mixed-Light -> '
              'Night Light Control -> '
              'Perceptual Improvement -> '
              'Colour Management -> Geometry'
          )
          PY

          grep -q "versionCode 40" \
            "$PROJECT/app/build.gradle"

          grep -q "versionName '0.4.31'" \
            "$PROJECT/app/build.gradle"

          grep -q "applyNightLightControl" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

          grep -q "NIGHT LIGHT CONTROL" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

          grep -q "v0431NightLightResult" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

          grep -q "Night-light control ACCEPTED" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/PerceptualImprovementIntelligence.java"

          grep -q "MAX_CHANNEL_CODE_DELTA = 8" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java"

          grep -q "MAX_ADJACENT_GAIN_STEP = 0.045" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MixedLightColourIntelligence.java"

          grep -q "MAX_FINAL_CHANNEL_CODE_DELTA = 9" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MixedLightColourIntelligence.java"

      - name: Fetch pinned NAFNet-SIDD model
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"

          ASSETS="$PROJECT/app/src/main/assets"
          MODEL="$ASSETS/nafnet_sidd_width32_fp16.tflite"

          mkdir -p "$ASSETS"

          URL='https://huggingface.co/litert-community/NAFNet-SIDD-width32-LiteRT/resolve/main/nafnet_sidd_width32_fp16.tflite?download=true'

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --output "$MODEL.tmp" \
            "$URL"

          mv "$MODEL.tmp" "$MODEL"

          test "$(stat -c%s "$MODEL")" -eq 62454048 || {
            echo "::error::Unexpected NAFNet model size"
            exit 1
          }

          echo \
            'f8fbaa422411683c53e802cf7cc7cf9be0a0de00886ad4af057232e26b172a0c  '"$MODEL" \
            | sha256sum -c -

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run all safety host checks
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf host-checks
          mkdir host-checks

          javac -d host-checks \
            app/src/main/java/com/dennis/photomasterai/DeepPixelRepair.java \
            app/src/main/java/com/dennis/photomasterai/RepairSafetyPolicy.java \
            app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java \
            app/src/main/java/com/dennis/photomasterai/SocialSourcePolicy.java \
            app/src/main/java/com/dennis/photomasterai/NeuralIntegrityPolicy.java \
            app/src/main/java/com/dennis/photomasterai/OpticalFringePolicy.java \
            app/src/main/java/com/dennis/photomasterai/VignettingPolicy.java \
            app/src/main/java/com/dennis/photomasterai/PersonEvidencePolicy.java \
            app/src/main/java/com/dennis/photomasterai/HighRingFinishingPolicy.java \
            app/src/main/java/com/dennis/photomasterai/GeometryPolicy.java \
            app/src/main/java/com/dennis/photomasterai/LocalTonePolicy.java \
            app/src/main/java/com/dennis/photomasterai/MixedLightColourPolicy.java \
            app/src/main/java/com/dennis/photomasterai/PerceptualImprovementPolicy.java \
            app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java \
            tools/DeepPixelRepairHostChecks.java \
            tools/RepairSafetyPolicyHostChecks.java \
            tools/NeuralDenoisePolicyHostChecks.java \
            tools/SocialSourcePolicyHostChecks.java \
            tools/SmoothSurfaceGuardHostChecks.java \
            tools/NeuralIntegrityPolicyHostChecks.java \
            tools/OpticalFringePolicyHostChecks.java \
            tools/VignettingPolicyHostChecks.java \
            tools/PersonEvidencePolicyHostChecks.java \
            tools/HighBlendDetailGuardHostChecks.java \
            tools/HighRingFinishingPolicyHostChecks.java \
            tools/GeometryPolicyHostChecks.java \
            tools/LocalTonePolicyHostChecks.java \
            tools/MixedLightColourPolicyHostChecks.java \
            tools/MixedLightContinuityPolicyHostChecks.java \
            tools/PerceptualImprovementPolicyHostChecks.java \
            tools/NightLightControlPolicyHostChecks.java

          for C in \
            DeepPixelRepairHostChecks \
            RepairSafetyPolicyHostChecks \
            NeuralDenoisePolicyHostChecks \
            SocialSourcePolicyHostChecks \
            SmoothSurfaceGuardHostChecks \
            NeuralIntegrityPolicyHostChecks \
            OpticalFringePolicyHostChecks \
            VignettingPolicyHostChecks \
            PersonEvidencePolicyHostChecks \
            HighBlendDetailGuardHostChecks \
            HighRingFinishingPolicyHostChecks \
            GeometryPolicyHostChecks \
            LocalTonePolicyHostChecks \
            MixedLightColourPolicyHostChecks \
            MixedLightContinuityPolicyHostChecks \
            PerceptualImprovementPolicyHostChecks \
            NightLightControlPolicyHostChecks
          do
            java \
              -cp host-checks \
              "com.dennis.photomasterai.$C"
          done

      - name: Restore stable Photo Master debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photo-master-ai-debug-keystore-v1

      - name: Create signing key on first build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool \
              -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Photo Master AI,O=Dennis Photo Master,C=AU" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$SDK/cmdline-tools" \
                -type f \
                -name 'sdkmanager' \
                | sort -V \
                | tail -n 1
            )"
          fi

          test -n "$SDKMANAGER" || {
            echo "::error::sdkmanager not found"
            exit 1
          }

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build v0.4.31 APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:assembleDebug \
            --stacktrace

      - name: Verify package and prepare artifact
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "::error::APK not found"
            exit 1
          }

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          AAPT="$SDK/build-tools/35.0.0/aapt"

          BADGING="$(
            "$AAPT" dump badging "$APK" \
              | head -n 1
          )"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -q \
            "package: name='com.dennis.photomasterai'"

          echo "$BADGING" \
            | grep -q \
            "versionCode='40'"

          echo "$BADGING" \
            | grep -q \
            "versionName='0.4.31'"

          unzip -l "$APK" \
            | grep -q \
            'assets/nafnet_sidd_width32_fp16.tflite'

          rm -rf artifact
          mkdir artifact

          OUT="artifact/PhotoMasterAI-v0.4.31-NIGHT-LIGHT-CONTROL.apk"

          cp \
            "$APK" \
            "$OUT"

          sha256sum "$OUT" \
            > "artifact/PhotoMasterAI-v0.4.31-NIGHT-LIGHT-CONTROL-SHA256.txt"

          cat > "artifact/PhotoMasterAI-v0.4.31-Notes.txt" <<'EOF'
          Photo Master AI — v0.4.31 Night Light Control

          Version: 0.4.31
          versionCode: 40

          BASELINE
          Exact successful v0.4.30 source reconstructed from
          commit 92ca5f176916d0b150166734050b1cc717cb52b4.

          v0.4.30 remains the frozen known-good Natural/AI baseline.

          NEW
          - Night Light Control
          - runs after Mixed-Light Colour
          - runs before Perceptual Improvement
          - detects dark-upper / bright-lower / hotspot structure
          - darkness alone cannot activate Night Light Control
          - dark sky is explicitly protected
          - saturated light sources are protected
          - low-saturation hotspot / flash spill is contained
          - nearby low-saturation bloom is moderately controlled
          - maximum new Night-Light channel movement: 8/255
          - active-area ceiling prevents global darkening
          - candidate rollback protects detail/noise/chroma/ringing/
            saturation/clipping/dark-sky integrity
          - Perceptual Improvement can recognise an accepted
            Night-Light result as an approved correction direction

          TARGET
          Night scooter:
          - preserve black background
          - preserve saturated red rear light
          - reduce excessive concrete / flash spill
          - improve subject/background separation
          - avoid fake HDR
          - avoid global shadow lifting

          RETAINED
          - v0.4.30 Perceptual Improvement Controller
          - v0.4.29 Mixed-Light Continuity Guard
          - v0.4.27 Local Tone safeguards
          - v0.4.25 Geometry structural override
          - preserve-source sRGB / Display P3
          - high-ring finishing guard
          - NAFNet-SIDD safeguards
          - optics / vignetting safeguards
          - shadow-integrity rollback
          - background / screen-off processing
          - JPEG quality 100
          EOF

      - name: Upload APK and continuation notes
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMasterAI-v0.4.31-NIGHT-LIGHT-CONTROL
          path: |
            artifact/PhotoMasterAI-v0.4.31-NIGHT-LIGHT-CONTROL.apk
            artifact/PhotoMasterAI-v0.4.31-NIGHT-LIGHT-CONTROL-SHA256.txt
            artifact/PhotoMasterAI-v0.4.31-Notes.txt
          if-no-files-found: error
          retention-days: 30