name: Build Photo Master AI v0.4.31 Night Light Control

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-photo-master-ai-v0.4.31-night-light-control.yml'

permissions:
  contents: read

jobs:
  build:
    name: Photo Master AI v0.4.31 Night Light Control
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover exact successful v0.4.30 source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          V0430_COMMIT="92ca5f176916d0b150166734050b1cc717cb52b4"

          git cat-file -e "${V0430_COMMIT}^{commit}" || {
            echo "::error::Successful v0.4.30 commit unavailable"
            exit 1
          }

          git show \
            "${V0430_COMMIT}:.github/workflows/build-photo-master-ai-v0.4.30-perceptual-improvement.yml" \
            > /tmp/v0430.yml

          python3 - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/v0430.yml').read_text().splitlines()

          def extract_step(name, destination):
              start = None

              for i, line in enumerate(lines):
                  if line.strip() == '- name: ' + name:
                      start = i
                      break

              if start is None:
                  raise RuntimeError(
                      'Workflow step not found: ' + name
                  )

              run = None

              for i in range(start, len(lines)):
                  if lines[i].strip() == 'run: |':
                      run = i
                      break

                  if (
                      i > start
                      and lines[i].startswith('      - name:')
                  ):
                      break

              if run is None:
                  raise RuntimeError(
                      'Run block not found: ' + name
                  )

              body = []

              for line in lines[run + 1:]:
                  if line.startswith('      - name:'):
                      break

                  if not line.strip():
                      body.append('')

                  elif line.startswith('          '):
                      body.append(line[10:])

                  else:
                      raise RuntimeError(
                          'Unexpected indentation while extracting: '
                          + name
                      )

              Path(destination).write_text(
                  '\n'.join(body) + '\n'
              )

          extract_step(
              'Recover exact successful v0.4.29 source',
              '/tmp/recover-v0429.sh'
          )

          extract_step(
              'Apply v0.4.30 Perceptual Improvement Controller',
              '/tmp/apply-v0430.sh'
          )
          PY

          bash /tmp/recover-v0429.sh

          PROJECT="$(
            find photomaster-v044-build \
              -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -printf '%h\n' \
              | head -n 1
          )"

          test -n "$PROJECT" || {
            echo "::error::Recovered project not found"
            exit 1
          }

          export PROJECT

          bash /tmp/apply-v0430.sh

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          grep -q "versionCode 39" \
            "$PROJECT/app/build.gradle"

          grep -q "versionName '0.4.30'" \
            "$PROJECT/app/build.gradle"

          grep -q "class PerceptualImprovementPolicy" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/PerceptualImprovementPolicy.java"

          grep -q "applyPerceptualImprovementController" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

          grep -q "MAX_ADJACENT_GAIN_STEP = 0.045" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MixedLightColourIntelligence.java"

          grep -q "MAX_FINAL_CHANNEL_CODE_DELTA = 9" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MixedLightColourIntelligence.java"

          echo "Exact successful v0.4.30 source recovered"

      - name: Apply v0.4.31 Night Light Control
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail

          cat > "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlPolicy.java" <<'JAVA_POLICY'
          package com.dennis.photomasterai;

          import java.util.Locale;

          public final class NightLightControlPolicy {

              public static final double
                      MAX_MEAN_CHANNEL_DELTA = 0.0080;

              public static final double
                      MAX_CHANNEL_DELTA = 0.0320;

              public static final double
                      MAX_ACTIVE_FRACTION = 0.45;

              private NightLightControlPolicy() {}

              public static final class Plan {

                  public final boolean apply;
                  public final double strength;
                  public final double confidence;
                  public final String reason;

                  Plan(
                          boolean apply,
                          double strength,
                          double confidence,
                          String reason) {

                      this.apply = apply;
                      this.strength = strength;
                      this.confidence = confidence;
                      this.reason = reason;
                  }
              }

              public static final class QcResult {

                  public final boolean accepted;
                  public final String reason;

                  QcResult(
                          boolean accepted,
                          String reason) {

                      this.accepted = accepted;
                      this.reason = reason;
                  }
              }

              public static Plan plan(
                      boolean semanticExcluded,
                      double upperDarkFraction,
                      double lowerBrightFraction,
                      int veryDarkZones,
                      int brightZones,
                      int hotspotZones,
                      double luminanceSpread,
                      double hotspotPixelFraction) {

                  if (semanticExcluded) {

                      return new Plan(
                              false,
                              0.0,
                              0.0,
                              "scene content not appropriate for night-light control");
                  }

                  if (upperDarkFraction < 0.42) {

                      return new Plan(
                              false,
                              0.0,
                              0.0,
                              "insufficient dark-upper-frame evidence");
                  }

                  if (lowerBrightFraction < 0.12) {

                      return new Plan(
                              false,
                              0.0,
                              0.0,
                              "insufficient bright-lower-frame evidence");
                  }

                  if (veryDarkZones < 6) {

                      return new Plan(
                              false,
                              0.0,
                              0.0,
                              "insufficient dark regional evidence");
                  }

                  if (brightZones < 5) {

                      return new Plan(
                              false,
                              0.0,
                              0.0,
                              "insufficient bright regional evidence");
                  }

                  if (hotspotZones < 2) {

                      return new Plan(
                              false,
                              0.0,
                              0.0,
                              "insufficient hotspot evidence");
                  }

                  if (luminanceSpread < 0.48) {

                      return new Plan(
                              false,
                              0.0,
                              0.0,
                              "regional luminance spread below night-light threshold");
                  }

                  if (hotspotPixelFraction < 0.003) {

                      return new Plan(
                              false,
                              0.0,
                              0.0,
                              "insufficient highlight-source evidence");
                  }

                  double darkEvidence =
                          clamp01(
                                  (upperDarkFraction - 0.42)
                                          / 0.38);

                  double brightEvidence =
                          clamp01(
                                  (lowerBrightFraction - 0.12)
                                          / 0.32);

                  double spreadEvidence =
                          clamp01(
                                  (luminanceSpread - 0.48)
                                          / 0.42);

                  double hotspotEvidence =
                          clamp01(
                                  hotspotPixelFraction
                                          / 0.08);

                  double confidence =
                          0.34 * darkEvidence
                                  + 0.24 * brightEvidence
                                  + 0.24 * spreadEvidence
                                  + 0.18 * hotspotEvidence;

                  confidence =
                          clamp01(confidence);

                  double strength =
                          0.20
                                  + 0.12 * confidence;

                  strength =
                          clamp(
                                  strength,
                                  0.20,
                                  0.32);

                  return new Plan(
                          true,
                          strength,
                          confidence,
                          String.format(
                                  Locale.US,
                                  "night-light structure confidence %.1f%%",
                                  confidence * 100.0));
              }

              public static QcResult evaluateCandidate(
                      double beforeDetail,
                      double afterDetail,
                      double beforeNoise,
                      double afterNoise,
                      double beforeChromaNoise,
                      double afterChromaNoise,
                      double beforeRinging,
                      double afterRinging,
                      double beforeSaturation,
                      double afterSaturation,
                      double beforeShadowClip,
                      double afterShadowClip,
                      double beforeHighlightClip,
                      double afterHighlightClip,
                      double hotspotReduction,
                      double darkSkyMeanDelta,
                      double activeFraction,
                      double meanChannelDelta,
                      double maxChannelDelta) {

                  StringBuilder fail =
                          new StringBuilder();

                  if (
                      hotspotReduction
                              < 0.0020) {

                      add(
                              fail,
                              String.format(
                                      Locale.US,
                                      "hotspot/spill reduction %.4f < 0.0020",
                                      hotspotReduction));
                  }

                  if (
                      hotspotReduction
                              > 0.0500) {

                      add(
                              fail,
                              String.format(
                                      Locale.US,
                                      "hotspot/spill reduction %.4f > 0.0500",
                                      hotspotReduction));
                  }

                  if (
                      darkSkyMeanDelta
                              > 0.0020) {

                      add(
                              fail,
                              String.format(
                                      Locale.US,
                                      "dark-sky movement %.4f > 0.0020",
                                      darkSkyMeanDelta));
                  }

                  if (
                      activeFraction
                              < 0.005) {

                      add(
                              fail,
                              String.format(
                                      Locale.US,
                                      "active pixels %.2f%% < 0.50%%",
                                      activeFraction * 100.0));
                  }

                  if (
                      activeFraction
                              > MAX_ACTIVE_FRACTION) {

                      add(
                              fail,
                              String.format(
                                      Locale.US,
                                      "active pixels %.2f%% > %.1f%%",
                                      activeFraction * 100.0,
                                      MAX_ACTIVE_FRACTION * 100.0));
                  }

                  if (
                      afterDetail
                              < beforeDetail * 0.985) {

                      add(
                              fail,
                              String.format(
                                      Locale.US,
                                      "detail %.4f -> %.4f below 98.5%% retention",
                                      beforeDetail,
                                      afterDetail));
                  }

                  if (
                      afterNoise
                              > beforeNoise + 0.0010) {

                      add(
                              fail,
                              String.format(
                                      Locale.US,
                                      "noise %.4f -> %.4f exceeds +0.0010",
                                      beforeNoise,
                                      afterNoise));
                  }

                  if (
                      afterChromaNoise
                              > beforeChromaNoise + 0.0010) {

                      add(
                              fail,
                              String.format(
                                      Locale.US,
                                      "chroma noise %.4f -> %.4f exceeds +0.0010",
                                      beforeChromaNoise,
                                      afterChromaNoise));
                  }

                  if (
                      afterRinging
                              > Math.min(
                                      1.0,
                                      beforeRinging + 0.0060)) {

                      add(
                              fail,
                              String.format(
                                      Locale.US,
                                      "ringing %.4f -> %.4f exceeds allowance",
                                      beforeRinging,
                                      afterRinging));
                  }

                  if (
                      Math.abs(
                              afterSaturation
                                      - beforeSaturation)
                              > 0.0080) {

                      add(
                              fail,
                              String.format(
                                      Locale.US,
                                      "saturation delta %.4f > 0.0080",
                                      Math.abs(
                                              afterSaturation
                                                      - beforeSaturation)));
                  }

                  if (
                      afterShadowClip
                              > beforeShadowClip + 0.0010) {

                      add(
                              fail,
                              String.format(
                                      Locale.US,
                                      "shadow clip %.4f -> %.4f exceeds +0.0010",
                                      beforeShadowClip,
                                      afterShadowClip));
                  }

                  if (
                      afterHighlightClip
                              > beforeHighlightClip + 0.0010) {

                      add(
                              fail,
                              String.format(
                                      Locale.US,
                                      "highlight clip %.4f -> %.4f exceeds +0.0010",
                                      beforeHighlightClip,
                                      afterHighlightClip));
                  }

                  if (
                      meanChannelDelta
                              > MAX_MEAN_CHANNEL_DELTA) {

                      add(
                              fail,
                              String.format(
                                      Locale.US,
                                      "mean channel delta %.4f > %.4f",
                                      meanChannelDelta,
                                      MAX_MEAN_CHANNEL_DELTA));
                  }

                  if (
                      maxChannelDelta
                              > MAX_CHANNEL_DELTA) {

                      add(
                              fail,
                              String.format(
                                      Locale.US,
                                      "max channel delta %.4f > %.4f",
                                      maxChannelDelta,
                                      MAX_CHANNEL_DELTA));
                  }

                  return fail.length() == 0
                          ? new QcResult(
                                  true,
                                  "night-light control QC passed")
                          : new QcResult(
                                  false,
                                  fail.toString());
              }

              private static void add(
                      StringBuilder out,
                      String value) {

                  if (out.length() > 0)
                      out.append("; ");

                  out.append(value);
              }

              private static double clamp01(
                      double value) {

                  return clamp(
                          value,
                          0.0,
                          1.0);
              }

              private static double clamp(
                      double value,
                      double low,
                      double high) {

                  return Math.max(
                          low,
                          Math.min(
                                  high,
                                  value));
              }
          }
          JAVA_POLICY

          cat > "$PROJECT/app/src/main/java/com/dennis/photomasterai/NightLightControlIntelligence.java" <<'JAVA_ENGINE'
          package com.dennis.photomasterai;

          import android.graphics.Bitmap;

          import java.util.Locale;

          public final class NightLightControlIntelligence {

              private static final int GX = 8;
              private static final int GY = 8;
              private static final int MAX_EDGE = 640;
              private static final int CHUNK = 128;

              /*
               * 8/255 = 0.03137.
               * Remains below policy ceiling 0.032.
               */

              private static final int
                      MAX_CHANNEL_CODE_DELTA = 8;

              private NightLightControlIntelligence() {}

              public static final class Outcome {

                  public final Bitmap bitmap;
                  public final PhotoAnalysis analysis;
                  public final boolean changed;
                  public final String report;

                  Outcome(
                          Bitmap bitmap,
                          PhotoAnalysis analysis,
                          boolean changed,
                          String report) {

                      this.bitmap = bitmap;
                      this.analysis = analysis;
                      this.changed = changed;
                      this.report = report;
                  }
              }

              private static final class Cell {

                  double meanLuma;
                  double darkFraction;
                  double brightFraction;
                  double nearClipFraction;
                  double meanSaturation;
              }

              private static final class Evidence {

                  final Cell[][] cells =
                          new Cell[GY][GX];

                  double upperDarkFraction;
                  double lowerBrightFraction;
                  double hotspotPixelFraction;
                  double luminanceSpread;

                  int veryDarkZones;
                  int brightZones;
                  int hotspotZones;

                  boolean semanticExcluded;
              }

              private static final class RenderSummary {

                  double hotspotBeforeSum;
                  double hotspotAfterSum;

                  double darkSkyDeltaSum;

                  double channelDeltaSum;
                  double maxChannelDelta;

                  long hotspotCount;
                  long darkSkyCount;

                  long channelDeltaCount;

                  long activePixels;
                  long totalPixels;

                  long protectedDarkPixels;
                  long protectedSaturatedPixels;
              }

              public static Outcome process(
                      Bitmap mastered,
                      Bitmap authoritativeOriginal,
                      String sourceReport) {

                  if (
                      mastered == null
                              || mastered.isRecycled()
                              || authoritativeOriginal == null
                              || authoritativeOriginal.isRecycled()) {

                      return new Outcome(
                              mastered,
                              mastered == null
                                      || mastered.isRecycled()
                                      ? null
                                      : PhotoAnalysis.analyse(
                                              mastered),
                              false,
                              "• Night-light control skipped — invalid input");
                  }

                  if (
                      mastered.getWidth()
                              != authoritativeOriginal.getWidth()
                              || mastered.getHeight()
                              != authoritativeOriginal.getHeight()) {

                      return new Outcome(
                              mastered,
                              PhotoAnalysis.analyse(
                                      mastered),
                              false,
                              "• Night-light control withheld — source/master dimensions differ");
                  }

                  PhotoAnalysis before =
                          PhotoAnalysis.analyse(
                                  mastered);

                  Evidence evidence =
                          analyse(
                                  mastered,
                                  sourceReport);

                  NightLightControlPolicy.Plan plan =
                          NightLightControlPolicy.plan(
                                  evidence.semanticExcluded,
                                  evidence.upperDarkFraction,
                                  evidence.lowerBrightFraction,
                                  evidence.veryDarkZones,
                                  evidence.brightZones,
                                  evidence.hotspotZones,
                                  evidence.luminanceSpread,
                                  evidence.hotspotPixelFraction);

                  StringBuilder report =
                          new StringBuilder();

                  report.append(
                          String.format(
                                  Locale.US,
                                  "• Evidence upper-dark %.1f%% | lower-bright %.1f%% | dark zones %d | bright zones %d | hotspot zones %d%n",
                                  evidence.upperDarkFraction * 100.0,
                                  evidence.lowerBrightFraction * 100.0,
                                  evidence.veryDarkZones,
                                  evidence.brightZones,
                                  evidence.hotspotZones));

                  report.append(
                          String.format(
                                  Locale.US,
                                  "• Luminance spread %.4f | hotspot pixels %.2f%% | confidence %.1f%% | compression strength %.3f%n",
                                  evidence.luminanceSpread,
                                  evidence.hotspotPixelFraction * 100.0,
                                  plan.confidence * 100.0,
                                  plan.strength));

                  report.append(
                          "• Night classification requires dark-upper + bright-lower + hotspot structure; darkness alone is insufficient\n");

                  report.append(
                          "• Protections: dark sky | saturated light sources | colour density | channel-delta cap\n");

                  if (!plan.apply) {

                      report.append(
                              "• Night-light control WITHHELD — ")
                              .append(
                                      plan.reason)
                              .append(
                                      "\n");

                      return new Outcome(
                              mastered,
                              before,
                              false,
                              report.toString());
                  }

                  RenderSummary summary =
                          new RenderSummary();

                  Bitmap candidate =
                          render(
                                  mastered,
                                  evidence,
                                  plan,
                                  summary);

                  if (candidate == null) {

                      report.append(
                              "• Night-light control WITHHELD — candidate render unavailable\n");

                      return new Outcome(
                              mastered,
                              before,
                              false,
                              report.toString());
                  }

                  PhotoAnalysis after =
                          PhotoAnalysis.analyse(
                                  candidate);

                  double hotspotBefore =
                          summary.hotspotCount > 0
                                  ? summary.hotspotBeforeSum
                                  / summary.hotspotCount
                                  : 0.0;

                  double hotspotAfter =
                          summary.hotspotCount > 0
                                  ? summary.hotspotAfterSum
                                  / summary.hotspotCount
                                  : 0.0;

                  double hotspotReduction =
                          hotspotBefore
                                  - hotspotAfter;

                  double darkSkyMeanDelta =
                          summary.darkSkyCount > 0
                                  ? summary.darkSkyDeltaSum
                                  / summary.darkSkyCount
                                  : 0.0;

                  double activeFraction =
                          summary.totalPixels > 0
                                  ? summary.activePixels
                                  / (double)
                                  summary.totalPixels
                                  : 0.0;

                  double meanChannelDelta =
                          summary.channelDeltaCount > 0
                                  ? summary.channelDeltaSum
                                  / summary.channelDeltaCount
                                  : 0.0;

                  NightLightControlPolicy.QcResult qc =
                          NightLightControlPolicy
                                  .evaluateCandidate(
                                          before.detail,
                                          after.detail,

                                          before.noise,
                                          after.noise,

                                          before.flatChromaNoise,
                                          after.flatChromaNoise,

                                          before.ringing,
                                          after.ringing,

                                          before.avgSat,
                                          after.avgSat,

                                          before.shadowClip,
                                          after.shadowClip,

                                          before.highlightClip,
                                          after.highlightClip,

                                          hotspotReduction,
                                          darkSkyMeanDelta,
                                          activeFraction,
                                          meanChannelDelta,
                                          summary.maxChannelDelta);

                  report.append(
                          String.format(
                                  Locale.US,
                                  "• Hotspot/spill luma %.4f -> %.4f | reduction %.4f%n",
                                  hotspotBefore,
                                  hotspotAfter,
                                  hotspotReduction));

                  report.append(
                          String.format(
                                  Locale.US,
                                  "• Active pixels %.1f%% | dark-sky movement %.5f | mean channel delta %.4f | max channel delta %.4f%n",
                                  activeFraction * 100.0,
                                  darkSkyMeanDelta,
                                  meanChannelDelta,
                                  summary.maxChannelDelta));

                  report.append(
                          String.format(
                                  Locale.US,
                                  "• Protected dark pixels %d | protected saturated pixels %d%n",
                                  summary.protectedDarkPixels,
                                  summary.protectedSaturatedPixels));

                  report.append(
                          String.format(
                                  Locale.US,
                                  "• Detail %.4f -> %.4f | noise %.4f -> %.4f | ring %.4f -> %.4f | highlight clip %.4f -> %.4f%n",
                                  before.detail,
                                  after.detail,
                                  before.noise,
                                  after.noise,
                                  before.ringing,
                                  after.ringing,
                                  before.highlightClip,
                                  after.highlightClip));

                  if (!qc.accepted) {

                      if (!candidate.isRecycled())
                          candidate.recycle();

                      report.append(
                              "• Night-light control ROLLED BACK — ")
                              .append(
                                      qc.reason)
                              .append(
                                      "\n");

                      return new Outcome(
                              mastered,
                              before,
                              false,
                              report.toString());
                  }

                  report.append(
                          "• Night-light control ACCEPTED — hotspot/spill/dark-sky/detail/clipping QC passed\n");

                  return new Outcome(
                          candidate,
                          after,
                          true,
                          report.toString());
              }

              private static Evidence analyse(
                      Bitmap source,
                      String sourceReport) {

                  Evidence evidence =
                          new Evidence();

                  String text =
                          sourceReport == null
                                  ? ""
                                  : sourceReport.toLowerCase(
                                          Locale.US);

                  evidence.semanticExcluded =
                          text.contains(
                                  "ai scene tags: insect,plant")

                                  || text.contains(
                                          "ai scene tags: insect, plant")

                                  || text.contains(
                                          "flower 95%")

                                  || text.contains(
                                          "petal 95%");

                  Bitmap work =
                          analysisBitmap(
                                  source);

                  boolean recycle =
                          work != source;

                  int width =
                          work.getWidth();

                  int height =
                          work.getHeight();

                  int[] pixels =
                          new int[
                                  width
                                          * height];

                  work.getPixels(
                          pixels,
                          0,
                          width,
                          0,
                          0,
                          width,
                          height);

                  double[][] lumaSum =
                          new double[GY][GX];

                  double[][] satSum =
                          new double[GY][GX];

                  int[][] counts =
                          new int[GY][GX];

                  int[][] darkCounts =
                          new int[GY][GX];

                  int[][] brightCounts =
                          new int[GY][GX];

                  int[][] nearClipCounts =
                          new int[GY][GX];

                  long upperCount = 0;
                  long upperDark = 0;

                  long lowerCount = 0;
                  long lowerBright = 0;

                  long hotspotPixels = 0;

                  for (int y = 0; y < height; y++) {

                      int gy =
                              Math.min(
                                      GY - 1,
                                      y * GY
                                              / height);

                      for (int x = 0; x < width; x++) {

                          int gx =
                                  Math.min(
                                          GX - 1,
                                          x * GX
                                                  / width);

                          int pixel =
                                  pixels[
                                          y * width
                                                  + x];

                          int r =
                                  (pixel >>> 16)
                                          & 255;

                          int g =
                                  (pixel >>> 8)
                                          & 255;

                          int b =
                                  pixel
                                          & 255;

                          double lum =
                                  luma(
                                          r,
                                          g,
                                          b);

                          double sat =
                                  saturation(
                                          r,
                                          g,
                                          b);

                          lumaSum[gy][gx]
                                  += lum;

                          satSum[gy][gx]
                                  += sat;

                          counts[gy][gx]++;

                          if (lum < 0.12)
                              darkCounts[gy][gx]++;

                          if (lum > 0.65)
                              brightCounts[gy][gx]++;

                          if (lum > 0.93)
                              nearClipCounts[gy][gx]++;

                          if (y < height / 2) {

                              upperCount++;

                              if (lum < 0.12)
                                  upperDark++;

                          } else {

                              lowerCount++;

                              if (lum > 0.65)
                                  lowerBright++;
                          }

                          if (lum > 0.93)
                              hotspotPixels++;
                      }
                  }

                  evidence.upperDarkFraction =
                          upperCount > 0
                                  ? upperDark
                                  / (double)
                                  upperCount
                                  : 0.0;

                  evidence.lowerBrightFraction =
                          lowerCount > 0
                                  ? lowerBright
                                  / (double)
                                  lowerCount
                                  : 0.0;

                  evidence.hotspotPixelFraction =
                          pixels.length > 0
                                  ? hotspotPixels
                                  / (double)
                                  pixels.length
                                  : 0.0;

                  double minMean =
                          1.0;

                  double maxMean =
                          0.0;

                  for (int gy = 0; gy < GY; gy++) {

                      for (int gx = 0; gx < GX; gx++) {

                          Cell cell =
                                  new Cell();

                          evidence.cells[gy][gx] =
                                  cell;

                          int count =
                                  counts[gy][gx];

                          if (count <= 0)
                              continue;

                          cell.meanLuma =
                                  lumaSum[gy][gx]
                                          / count;

                          cell.meanSaturation =
                                  satSum[gy][gx]
                                          / count;

                          cell.darkFraction =
                                  darkCounts[gy][gx]
                                          / (double)
                                          count;

                          cell.brightFraction =
                                  brightCounts[gy][gx]
                                          / (double)
                                          count;

                          cell.nearClipFraction =
                                  nearClipCounts[gy][gx]
                                          / (double)
                                          count;

                          minMean =
                                  Math.min(
                                          minMean,
                                          cell.meanLuma);

                          maxMean =
                                  Math.max(
                                          maxMean,
                                          cell.meanLuma);

                          if (
                              cell.meanLuma < 0.16
                                      && cell.darkFraction
                                      > 0.55) {

                              evidence.veryDarkZones++;
                          }

                          if (
                              cell.meanLuma > 0.48
                                      && cell.brightFraction
                                      > 0.20) {

                              evidence.brightZones++;
                          }

                          if (
                              cell.nearClipFraction > 0.05

                                      || (
                                          cell.meanLuma > 0.68
                                                  && cell.meanSaturation
                                                  < 0.35
                                      )) {

                              evidence.hotspotZones++;
                          }
                      }
                  }

                  evidence.luminanceSpread =
                          Math.max(
                                  0.0,
                                  maxMean - minMean);

                  if (recycle)
                      work.recycle();

                  return evidence;
              }

              private static Bitmap render(
                      Bitmap source,
                      Evidence evidence,
                      NightLightControlPolicy.Plan plan,
                      RenderSummary summary) {

                  int width =
                          source.getWidth();

                  int height =
                          source.getHeight();

                  Bitmap output =
                          Bitmap.createBitmap(
                                  width,
                                  height,
                                  Bitmap.Config.ARGB_8888);

                  for (
                      int y0 = 0;
                      y0 < height;
                      y0 += CHUNK) {

                      int rows =
                              Math.min(
                                      CHUNK,
                                      height - y0);

                      int[] pixels =
                              new int[
                                      width
                                              * rows];

                      source.getPixels(
                              pixels,
                              0,
                              width,
                              0,
                              y0,
                              width,
                              rows);

                      for (
                          int localY = 0;
                          localY < rows;
                          localY++) {

                          int y =
                                  y0
                                          + localY;

                          int gy =
                                  Math.min(
                                          GY - 1,
                                          y * GY
                                                  / height);

                          for (
                              int x = 0;
                              x < width;
                              x++) {

                              int index =
                                      localY * width
                                              + x;

                              int pixel =
                                      pixels[index];

                              int alpha =
                                      (pixel >>> 24)
                                              & 255;

                              int r =
                                      (pixel >>> 16)
                                              & 255;

                              int g =
                                      (pixel >>> 8)
                                              & 255;

                              int b =
                                      pixel
                                              & 255;

                              double lum =
                                      luma(
                                              r,
                                              g,
                                              b);

                              double sat =
                                      saturation(
                                              r,
                                              g,
                                              b);

                              int gx =
                                      Math.min(
                                              GX - 1,
                                              x * GX
                                                      / width);

                              Cell cell =
                                      evidence.cells[gy][gx];

                              boolean darkSky =
                                      y < height * 0.72

                                              && cell != null

                                              && cell.meanLuma
                                              < 0.16

                                              && cell.darkFraction
                                              > 0.55;

                              boolean hotspotCell =
                                      cell != null

                                              && (
                                                  cell.nearClipFraction
                                                  > 0.025

                                                  || (
                                                      cell.meanLuma
                                                      > 0.66

                                                      && cell.meanSaturation
                                                      < 0.40
                                                  )
                                              );

                              boolean spillCell =
                                      cell != null

                                              && y
                                              > height * 0.32

                                              && cell.meanLuma
                                              > 0.42

                                              && cell.brightFraction
                                              > 0.16;

                              summary.totalPixels++;

                              if (darkSky) {

                                  summary.protectedDarkPixels++;

                                  summary.darkSkyCount++;

                                  /*
                                   * Explicitly unchanged.
                                   */

                                  pixels[index] =
                                          pixel;

                                  continue;
                              }

                              if (sat > 0.68) {

                                  summary.protectedSaturatedPixels++;

                                  pixels[index] =
                                          pixel;

                                  continue;
                              }

                              double weight =
                                      0.0;

                              if (
                                  hotspotCell
                                          && lum > 0.92
                                          && sat < 0.42) {

                                  weight =
                                          1.0;

                              } else if (
                                  hotspotCell
                                          && lum > 0.76
                                          && sat < 0.45) {

                                  weight =
                                          0.70;

                              } else if (
                                  spillCell
                                          && lum > 0.62
                                          && sat < 0.38) {

                                  weight =
                                          0.38;
                              }

                              if (weight <= 0.0) {

                                  pixels[index] =
                                          pixel;

                                  continue;
                              }

                              double compression =
                                      plan.strength
                                              * weight;

                              double targetLum =
                                      lum
                                              - compression
                                              * Math.max(
                                                      0.0,
                                                      lum - 0.55);

                              /*
                               * Never exceed a 4% luminance scale
                               * change before final code-value cap.
                               */

                              double scale =
                                      lum > 1e-9
                                              ? clamp(
                                                      targetLum
                                                              / lum,
                                                      0.96,
                                                      1.0)
                                              : 1.0;

                              double newR =
                                      r * scale;

                              double newG =
                                      g * scale;

                              double newB =
                                      b * scale;

                              newR =
                                      clamp(
                                              newR,
                                              r
                                                      - MAX_CHANNEL_CODE_DELTA,
                                              r
                                                      + MAX_CHANNEL_CODE_DELTA);

                              newG =
                                      clamp(
                                              newG,
                                              g
                                                      - MAX_CHANNEL_CODE_DELTA,
                                              g
                                                      + MAX_CHANNEL_CODE_DELTA);

                              newB =
                                      clamp(
                                              newB,
                                              b
                                                      - MAX_CHANNEL_CODE_DELTA,
                                              b
                                                      + MAX_CHANNEL_CODE_DELTA);

                              int outR =
                                      c255(
                                              (int)
                                              Math.round(
                                                      newR));

                              int outG =
                                      c255(
                                              (int)
                                              Math.round(
                                                      newG));

                              int outB =
                                      c255(
                                              (int)
                                              Math.round(
                                                      newB));

                              double outLum =
                                      luma(
                                              outR,
                                              outG,
                                              outB);

                              if (
                                  lum > 0.72
                                          && sat < 0.45) {

                                  summary.hotspotBeforeSum
                                          += lum;

                                  summary.hotspotAfterSum
                                          += outLum;

                                  summary.hotspotCount++;
                              }

                              double deltaR =
                                      Math.abs(
                                              outR - r)
                                              / 255.0;

                              double deltaG =
                                      Math.abs(
                                              outG - g)
                                              / 255.0;

                              double deltaB =
                                      Math.abs(
                                              outB - b)
                                              / 255.0;

                              double meanDelta =
                                      (
                                          deltaR
                                                  + deltaG
                                                  + deltaB
                                      )
                                              / 3.0;

                              summary.channelDeltaSum
                                      += meanDelta;

                              summary.channelDeltaCount++;

                              summary.maxChannelDelta =
                                      Math.max(
                                              summary.maxChannelDelta,
                                              Math.max(
                                                      deltaR,
                                                      Math.max(
                                                              deltaG,
                                                              deltaB)));

                              if (
                                  outR != r
                                          || outG != g
                                          || outB != b) {

                                  summary.activePixels++;
                              }

                              pixels[index] =
                                      (alpha << 24)
                                              | (outR << 16)
                                              | (outG << 8)
                                              | outB;
                          }
                      }

                      output.setPixels(
                              pixels,
                              0,
                              width,
                              0,
                              y0,
                              width,
                              rows);
                  }

                  return output;
              }

              private static Bitmap analysisBitmap(
                      Bitmap source) {

                  int width =
                          source.getWidth();

                  int height =
                          source.getHeight();

                  int longest =
                          Math.max(
                                  width,
                                  height);

                  if (longest <= MAX_EDGE)
                      return source;

                  double scale =
                          MAX_EDGE
                                  / (double)
                                  longest;

                  int newWidth =
                          Math.max(
                                  1,
                                  (int)
                                  Math.round(
                                          width
                                                  * scale));

                  int newHeight =
                          Math.max(
                                  1,
                                  (int)
                                  Math.round(
                                          height
                                                  * scale));

                  return Bitmap.createScaledBitmap(
                          source,
                          newWidth,
                          newHeight,
                          true);
              }

              private static double saturation(
                      int r,
                      int g,
                      int b) {

                  int max =
                          Math.max(
                                  r,
                                  Math.max(
                                          g,
                                          b));

                  int min =
                          Math.min(
                                  r,
                                  Math.min(
                                          g,
                                          b));

                  return max <= 0
                          ? 0.0
                          : (
                              max - min
                          )
                          / (double)
                          max;
              }

              private static double luma(
                      int r,
                      int g,
                      int b) {

                  return (
                      0.2126 * r
                              + 0.7152 * g
                              + 0.0722 * b
                  )
                          / 255.0;
              }

              private static double clamp(
                      double value,
                      double low,
                      double high) {

                  return Math.max(
                          low,
                          Math.min(
                                  high,
                                  value));
              }

              private static int c255(
                      int value) {

                  return Math.max(
                          0,
                          Math.min(
                                  255,
                                  value));
              }
          }
