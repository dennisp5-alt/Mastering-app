name: Build AutoFix True Colour Lab v0.4.0 TEST

on:
  workflow_dispatch:
  push:
    paths:
      - 'AutoFix-True-Colour-Lab/**'
      - '.github/workflows/build-true-colour-lab.yml'

permissions:
  contents: read

jobs:
  build:
    name: True Colour Lab v0.4.0 TEST
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Locate True Colour Lab project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          candidates=(
            "AutoFix-True-Colour-Lab"
            "AutoFix-True-Colour-Lab-v0.4.0-TEST-source"
            "true-colour-lab"
            "."
          )

          PROJECT=""
          for dir in "${candidates[@]}"; do
            if [ -f "$dir/gradlew" ] || [ -f "$dir/settings.gradle" ] || [ -f "$dir/settings.gradle.kts" ]; then
              PROJECT="$dir"
              break
            fi
          done

          if [ -z "$PROJECT" ]; then
            found="$(find . -maxdepth 4 -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path './.git/*' | head -n 1 || true)"
            if [ -n "$found" ]; then
              PROJECT="$(dirname "$found")"
            fi
          fi

          if [ -z "$PROJECT" ]; then
            echo "::error::Could not find the AutoFix True Colour Lab Gradle project."
            echo "Extract the v0.4.0 TEST source into AutoFix-True-Colour-Lab/ in this repository."
            exit 1
          fi

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Using project directory: $PROJECT"

      - name: Prepare Gradle
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "::error::gradlew is missing from the project."
            exit 1
          fi

      - name: Run unit tests
        working-directory: ${{ steps.project.outputs.project }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build TEST APK
        working-directory: ${{ steps.project.outputs.project }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Collect and rename APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.project.outputs.project }}"

          APK="$(find "$PROJECT" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1 || true)"
          if [ -z "$APK" ]; then
            echo "::error::Build completed but no debug APK was found."
            exit 1
          fi

          mkdir -p artifact
          cp "$APK" "artifact/AutoFix-True-Colour-Lab-v0.4.0-TEST.apk"

          sha256sum "artifact/AutoFix-True-Colour-Lab-v0.4.0-TEST.apk" \
            > "artifact/AutoFix-True-Colour-Lab-v0.4.0-TEST-SHA256.txt"

          echo "APK prepared:"
          ls -lh artifact/

      - name: Upload TEST APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoFix-True-Colour-Lab-v0.4.0-TEST
          path: |
            artifact/AutoFix-True-Colour-Lab-v0.4.0-TEST.apk
            artifact/AutoFix-True-Colour-Lab-v0.4.0-TEST-SHA256.txt
          if-no-files-found: error
          retention-days: 30
