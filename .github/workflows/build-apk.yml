name: Build Dennis AI Mastering Lab v0.14.2 TEST APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DennisAiMasteringLab-v0.14.2-GitHubBuildSource.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Unpack v0.14.2 source
        run: |
          rm -rf project
          mkdir -p project
          unzip -q DennisAiMasteringLab-v0.14.2-GitHubBuildSource.zip -d project

      - name: Make side-by-side TEST package
        run: |
          sed -i "s/applicationId 'com.dennis.aimasteringlab'/applicationId 'com.dennis.aimasteringlab.test142'/" project/app/build.gradle
          sed -i 's/android:label="Dennis AI Mastering Lab"/android:label="Dennis Mastering v0.14.2 TEST"/' project/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk DennisAiMasteringLab-v0.14.2-MeaningfulMastering-TEST.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DennisAiMasteringLab-v0.14.2-MeaningfulMastering-TEST
          path: DennisAiMasteringLab-v0.14.2-MeaningfulMastering-TEST.apk
          retention-days: 30
