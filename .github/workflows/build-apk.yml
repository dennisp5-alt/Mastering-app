name: Build Dennis AI Mastering Lab v0.15.4 Transient-Safe Tonal Audition TEST APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/DennisAiMasteringLab-v0.15.4.patch.gz'
      - 'tools/DennisAiMasteringLab-v0.15.3.patch.gz'
      - 'tools/DennisAiMasteringLab-v0.15.2.patch.gz'
      - 'tools/DennisAiMasteringLab-v0.15.1.patch.gz'
      - 'tools/DennisAiMasteringLab-v0.15.0.patch.gz'
      - 'tools/DennisAiMasteringLab-v0.14.9.patch.gz'
      - 'tools/DennisAiMasteringLab-v0.14.8.patch.gz'
      - 'tools/DennisAiMasteringLab-v0.14.7.patch.gz'
      - 'tools/DennisAiMasteringLab-v0.14.6.patch.gz'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Unpack v0.14.4 baseline source
        run: |
          rm -rf project
          mkdir -p project
          unzip -q DennisAiMasteringLab-v0.14.4-GitHubBuildSource.zip -d project

      - name: Apply v0.14.5 Adaptive Dynamics Preservation patch
        run: |
          gzip -dc tools/DennisAiMasteringLab-v0.14.5.patch.gz | patch --batch -p1 -d project
          grep -q "versionName '0.14.5'" project/app/build.gradle
          test -f project/app/src/main/java/com/dennis/aimasteringlab/AdaptiveDynamicsPreservation.java

      - name: Apply v0.14.6 Demand-Aware Objective Gate patch
        run: |
          gzip -dc tools/DennisAiMasteringLab-v0.14.6.patch.gz | patch --batch -p1 -d project
          grep -q "versionName '0.14.6'" project/app/build.gradle
          test -f project/app/src/main/java/com/dennis/aimasteringlab/DemandAwareObjectiveGate.java
          test -f project/tests/V0146DemandAwareObjectiveHarness.java

      - name: Apply v0.14.7 Honest QC Reporting patch
        run: |
          gzip -dc tools/DennisAiMasteringLab-v0.14.7.patch.gz | patch --batch -p1 -d project
          grep -q "versionName '0.14.7'" project/app/build.gradle
          test -f project/app/src/main/java/com/dennis/aimasteringlab/StudioQcReporting.java
          test -f project/tests/V0147QcReportingHarness.java

      - name: Apply v0.14.8 Performance and Profiling patch
        run: |
          gzip -dc tools/DennisAiMasteringLab-v0.14.8.patch.gz | patch --batch -p1 -d project
          grep -q "versionName '0.14.8'" project/app/build.gradle
          test -f project/app/src/main/java/com/dennis/aimasteringlab/StudioPerformance.java
          test -f project/tests/V0148StudioPassthroughHarness.java

      - name: Apply v0.14.9 Candidate Efficiency patch
        run: |
          gzip -dc tools/DennisAiMasteringLab-v0.14.9.patch.gz | patch --batch --fuzz=0 -p1 -d project
          grep -q "versionName '0.14.9'" project/app/build.gradle
          test -f project/tests/V0149CandidateEfficiencyHarness.java
          test -f project/tests/V0149QcReportingHarness.java

      - name: Apply v0.15.0 Guarded Vocal Auditions patch
        run: |
          gzip -dc tools/DennisAiMasteringLab-v0.15.0.patch.gz | patch --batch --fuzz=0 -p1 -d project
          grep -q "versionName '0.15.0'" project/app/build.gradle
          test -f project/tests/V0150SparseVocalHarness.java
          test -f project/tests/V0150QcReportingHarness.java

      - name: Apply v0.15.1 Bit-Exact DSP Hot-Loop patch
        run: |
          gzip -dc tools/DennisAiMasteringLab-v0.15.1.patch.gz | patch --batch --fuzz=0 -p1 -d project
          grep -q "versionName '0.15.1'" project/app/build.gradle
          test -f project/tests/V0151ExactHotLoopHarness.java
          test -f project/tests/LegacyTruePeakMeter.java
          test -f project/tests/LegacyLookaheadLimiter.java

      - name: Capture unmodified v0.15.1 core renderer for exact reference
        run: |
          sed 's/AutonomousMasteringRenderer/LegacyAutonomousMasteringRenderer/g' project/app/src/main/java/com/dennis/aimasteringlab/AutonomousMasteringRenderer.java > project/tests/LegacyAutonomousMasteringRenderer.java

      - name: Apply v0.15.2 Version Truth and No-Event Core patch
        run: |
          gzip -dc tools/DennisAiMasteringLab-v0.15.2.patch.gz | patch --batch --fuzz=0 -p1 -d project
          grep -q "versionName '0.15.2'" project/app/build.gradle
          grep -q "BuildConfig.VERSION_NAME" project/app/src/main/java/com/dennis/aimasteringlab/StudioQcReporting.java
          test -f project/tests/V0152RenderBypassHarness.java

      - name: Apply v0.15.3 Verified Peak-Safety Recovery patch
        run: |
          gzip -dc tools/DennisAiMasteringLab-v0.15.3.patch.gz | patch --batch --fuzz=0 -p1 -d project
          grep -q "versionName '0.15.3'" project/app/build.gradle
          test -f project/tests/V0153PeakFallbackHarness.java
          grep -q "recoverVerifiedFlatPeak" project/app/src/main/java/com/dennis/aimasteringlab/MasterRenderer.java

      - name: Apply v0.15.4 Transient-Safe Tonal Audition patch
        run: |
          gzip -dc tools/DennisAiMasteringLab-v0.15.4.patch.gz | patch --batch --fuzz=0 -p1 -d project
          grep -q "versionName '0.15.4'" project/app/build.gradle
          test -f project/tests/V0154TonalTransientHarness.java
          grep -q "transientSafeTonalEligible" project/app/src/main/java/com/dennis/aimasteringlab/AdaptiveBroadMastering.java

      - name: Run focused host regressions
        run: |
          rm -rf host-classes host-test-work
          mkdir -p host-classes host-test-work
          javac -encoding UTF-8 -d host-classes \
            -sourcepath project/app/src/main/java:project/tests \
            project/app/src/main/java/com/dennis/aimasteringlab/FullAiMasteringEngine.java \
            project/app/src/main/java/com/dennis/aimasteringlab/AdaptiveDynamicsPreservation.java \
            project/app/src/main/java/com/dennis/aimasteringlab/DemandAwareObjectiveGate.java \
            project/app/src/main/java/com/dennis/aimasteringlab/StudioQcReporting.java \
            project/app/src/main/java/com/dennis/aimasteringlab/StudioAudio.java \
            project/app/src/main/java/com/dennis/aimasteringlab/StudioPerformance.java \
            project/app/src/main/java/com/dennis/aimasteringlab/SincResampler.java \
            project/app/src/main/java/com/dennis/aimasteringlab/AdaptiveBroadMastering.java \
            project/app/src/main/java/com/dennis/aimasteringlab/PassagePreservation.java \
            project/tests/V0149CandidateEfficiencyHarness.java \
            project/tests/V0150SparseVocalHarness.java \
            project/tests/BuildConfig.java \
            project/tests/LegacyAutonomousMasteringRenderer.java \
            project/tests/V0154TonalTransientHarness.java \
            project/tests/V0153PeakFallbackHarness.java \
            project/tests/V0152RenderBypassHarness.java \
            project/tests/V0151ExactHotLoopHarness.java \
            project/tests/LegacyTruePeakMeter.java \
            project/tests/LegacyLookaheadLimiter.java \
            project/tests/V0150QcReportingHarness.java \
            project/tests/V0148StudioPassthroughHarness.java \
            project/tests/V0148TimingHarness.java \
            project/tests/V0146DemandAwareObjectiveHarness.java \
            project/tests/V0145DynamicsPreservationHarness.java \
            project/tests/V0145PassageEnvelopeHarness.java \
            project/tests/V0145AdaptiveAnchorHarness.java \
            project/tests/V0144AdaptiveLadderHarness.java \
            project/tests/V0144AdaptiveSelectionHarness.java \
            project/tests/V0143BroadMasteringNeedHarness.java \
            project/tests/V0143BroadAnchorHarness.java \
            project/tests/V0143BroadRetentionHarness.java \
            project/tests/org/json/*.java
          java -cp host-classes com.dennis.aimasteringlab.V0149CandidateEfficiencyHarness
          java -cp host-classes com.dennis.aimasteringlab.V0150SparseVocalHarness
          java -cp host-classes com.dennis.aimasteringlab.V0154TonalTransientHarness
          java -cp host-classes com.dennis.aimasteringlab.V0153PeakFallbackHarness host-test-work/peak-recovery
          java -cp host-classes com.dennis.aimasteringlab.V0152RenderBypassHarness host-test-work/v0152
          java -cp host-classes com.dennis.aimasteringlab.V0151ExactHotLoopHarness
          java -cp host-classes com.dennis.aimasteringlab.V0150QcReportingHarness
          java -cp host-classes com.dennis.aimasteringlab.V0148StudioPassthroughHarness host-test-work
          java -cp host-classes com.dennis.aimasteringlab.V0148TimingHarness
          java -cp host-classes com.dennis.aimasteringlab.V0146DemandAwareObjectiveHarness host-test-work/demand-gate
          java -cp host-classes com.dennis.aimasteringlab.V0145DynamicsPreservationHarness
          java -cp host-classes com.dennis.aimasteringlab.V0145PassageEnvelopeHarness
          java -cp host-classes com.dennis.aimasteringlab.V0145AdaptiveAnchorHarness host-test-work/adaptive-anchor
          java -cp host-classes com.dennis.aimasteringlab.V0144AdaptiveLadderHarness
          java -cp host-classes com.dennis.aimasteringlab.V0144AdaptiveSelectionHarness
          java -cp host-classes com.dennis.aimasteringlab.V0143BroadMasteringNeedHarness
          java -cp host-classes com.dennis.aimasteringlab.V0143BroadAnchorHarness host-test-work/broad-anchor
          java -cp host-classes com.dennis.aimasteringlab.V0143BroadRetentionHarness host-test-work/broad-retention

      - name: Package v0.15.4 source checkpoint
        run: |
          (cd project && zip -qr ../DennisAiMasteringLab-v0.15.4-GitHubBuildSource.zip . \
            -x '.gradle/*' 'build/*' 'app/build/*' '*.keystore' '*.jks' '*.apk')
          sha256sum DennisAiMasteringLab-v0.15.4-GitHubBuildSource.zip > DennisAiMasteringLab-v0.15.4-CHECKSUMS.sha256

      - name: Make safe side-by-side TEST package (temporary signing)
        run: |
          sed -i "s/applicationId 'com.dennis.aimasteringlab'/applicationId 'com.dennis.aimasteringlab.test154'/" project/app/build.gradle
          sed -i 's/android:label="Dennis AI Mastering Lab"/android:label="Dennis Mastering v0.15.4 TEST"/' project/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK and checksum
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk DennisAiMasteringLab-v0.15.4-TonalTransient-TEST.apk
          sha256sum DennisAiMasteringLab-v0.15.4-TonalTransient-TEST.apk >> DennisAiMasteringLab-v0.15.4-CHECKSUMS.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DennisAiMasteringLab-v0.15.4-TonalTransient-TEST
          path: DennisAiMasteringLab-v0.15.4-TonalTransient-TEST.apk
          retention-days: 30

      - name: Upload source checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: DennisAiMasteringLab-v0.15.4-Source
          path: |
            DennisAiMasteringLab-v0.15.4-GitHubBuildSource.zip
            DennisAiMasteringLab-v0.15.4-CHECKSUMS.sha256
          retention-days: 30
