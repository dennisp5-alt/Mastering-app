name: Build Photo Master AI v0.4.14 Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-photo-master-ai-v0.4.14-recovery.yml'

permissions:
  contents: read

jobs:
  build:
    name: Photo Master AI v0.4.14 Authoritative Original Checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover exact successful v0.4.13 source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          V0413_RECOVERY_COMMIT="ccc3abc5484c1557fa7de8b32f1cd51dacd0681a"

          git cat-file -e "${V0413_RECOVERY_COMMIT}^{commit}" || {
            echo "::error::Successful v0.4.13 recovery commit unavailable"
            exit 1
          }

          git show \
            "${V0413_RECOVERY_COMMIT}:.github/workflows/build-photo-master-ai-v0.4.13-recovery.yml" \
            > /tmp/v0413-recovery.yml

          python3 - <<'PY'
          from pathlib import Path

          lines = Path(
              "/tmp/v0413-recovery.yml"
          ).read_text().splitlines()

          def extract_step(name, destination):
              step = None

              for i, line in enumerate(lines):
                  if line.strip() == "- name: " + name:
                      step = i
                      break

              if step is None:
                  raise RuntimeError(
                      "Workflow step not found: " + name
                  )

              run = None

              for i in range(step, len(lines)):
                  if lines[i].strip() == "run: |":
                      run = i
                      break

                  if (
                      i > step
                      and lines[i].startswith("      - name:")
                  ):
                      break

              if run is None:
                  raise RuntimeError(
                      "Run block not found: " + name
                  )

              body = []

              for line in lines[run + 1:]:
                  if line.startswith("      - name:"):
                      break

                  if not line.strip():
                      body.append("")

                  elif line.startswith("          "):
                      body.append(line[10:])

                  else:
                      raise RuntimeError(
                          "Unexpected indentation while extracting: "
                          + name
                      )

              Path(destination).write_text(
                  "\n".join(body) + "\n"
              )

          extract_step(
              "Recover exact v0.4.12 source",
              "/tmp/v0413-recover-base.sh"
          )

          extract_step(
              "Apply known-good v0.4.13 patch",
              "/tmp/v0413-apply-patch.sh"
          )

          extract_step(
              "Enforce exact original-pixel terminal output",
              "/tmp/v0413-terminal-copy.sh"
          )

          print(
              "Extracted successful v0.4.13 source construction"
          )
          PY

          bash /tmp/v0413-recover-base.sh

          PROJECT="$(
            find photomaster-v044-build \
              -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -printf '%h\n' \
              | head -n 1
          )"

          test -n "$PROJECT" || {
            echo "::error::Recovered project not found"
            exit 1
          }

          export PROJECT

          bash /tmp/v0413-apply-patch.sh
          bash /tmp/v0413-terminal-copy.sh

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          grep -q \
            "versionCode 22" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "versionName '0.4.13'" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "smoothSurfaceTerminalGuard" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/PhotoMasterEngine.java"

          grep -q \
            "smooth metric floor; lower blends skipped" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "Unable to retain terminal original pixels" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/PhotoMasterEngine.java"

          grep -q \
            "GpuBackend.OPENCL" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiserRuntime.kt"

          if grep -q \
            "new NeuralDenoiserRuntime(context, true)" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"
          then
            echo "::error::CPU neural fallback detected"
            exit 1
          fi

          echo "Exact successful v0.4.13 source recovered"

      - name: Apply v0.4.14 authoritative-original checkpoint
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os

          project = Path(os.environ["PROJECT"])

          # =====================================================
          # VERSION
          # =====================================================

          build_file = project / "app/build.gradle"
          build = build_file.read_text()

          if "versionCode 22" not in build:
              raise RuntimeError(
                  "v0.4.13 versionCode not found"
              )

          if "versionName '0.4.13'" not in build:
              raise RuntimeError(
                  "v0.4.13 versionName not found"
              )

          build = build.replace(
              "versionCode 22",
              "versionCode 23",
              1
          )

          build = build.replace(
              "versionName '0.4.13'",
              "versionName '0.4.14'",
              1
          )

          build_file.write_text(build)

          # =====================================================
          # MAIN ACTIVITY
          #
          # Final authoritative-original checkpoint.
          #
          # v0.4.13 correctly detected the terminal smooth-scene
          # rollback, but the duck OUTPUT QC still contained the
          # rejected neural candidate measurements.
          #
          # v0.4.14 therefore makes originalBitmap authoritative
          # at the controller level after PhotoMasterEngine.
          # =====================================================

          main_file = project / (
              "app/src/main/java/com/dennis/"
              "photomasterai/MainActivity.java"
          )

          main = main_file.read_text()

          old_result_block = "\n".join([
              "                PhotoMasterEngine.Result result;",
              "                try {",
              "                    result = PhotoMasterEngine.master(",
              "                            processingBitmap,",
              "                            processingAnalysis,",
              "                            mode,",
              "                            ai,",
              "                            social,",
              "                            originalAnalysis,",
              "                            neuralResult != null",
              "                                    && neuralResult.accepted,",
              "                            neuralResult != null",
              "                                    && neuralResult.attempted",
              "                                    && !neuralResult.accepted",
              "                                    && neuralResult.report != null",
              '                                    && neuralResult.report.contains("Neural rollback:"));',
              "                } finally {",
          ])

          new_result_block = "\n".join([
              "                PhotoMasterEngine.Result rawResult;",
              "                try {",
              "                    rawResult = PhotoMasterEngine.master(",
              "                            processingBitmap,",
              "                            processingAnalysis,",
              "                            mode,",
              "                            ai,",
              "                            social,",
              "                            originalAnalysis,",
              "                            neuralResult != null",
              "                                    && neuralResult.accepted,",
              "                            neuralResult != null",
              "                                    && neuralResult.attempted",
              "                                    && !neuralResult.accepted",
              "                                    && neuralResult.report != null",
              '                                    && neuralResult.report.contains("Neural rollback:"));',
              "                } finally {",
          ])

          if old_result_block not in main:
              raise RuntimeError(
                  "v0.4.13 master-result block not found"
              )

          main = main.replace(
              old_result_block,
              new_result_block,
              1
          )

          old_after_finally = "\n".join([
              "                }",
              "                final String neuralReport = neuralResult == null ? null : neuralResult.report;",
          ])

          new_after_finally = "\n".join([
              "                }",
              "",
              "                PhotoMasterEngine.Result result =",
              "                        enforceAuthoritativeOriginalCheckpoint(",
              "                                rawResult,",
              "                                originalBitmap,",
              "                                originalAnalysis,",
              "                                neuralResult);",
              "",
              "                final String neuralReport = neuralResult == null ? null : neuralResult.report;",
          ])

          if old_after_finally not in main:
              raise RuntimeError(
                  "Post-master insertion anchor not found"
              )

          main = main.replace(
              old_after_finally,
              new_after_finally,
              1
          )

          helper_anchor = "\n".join([
              "    private void showOriginal() {",
          ])

          if helper_anchor not in main:
              raise RuntimeError(
                  "MainActivity helper insertion anchor not found"
              )

          helpers = "\n".join([
              "    private PhotoMasterEngine.Result enforceAuthoritativeOriginalCheckpoint(",
              "            PhotoMasterEngine.Result result,",
              "            Bitmap authoritativeOriginal,",
              "            PhotoAnalysis originalAnalysis,",
              "            NeuralDenoiser.Result neuralResult) {",
              "",
              "        boolean neuralQcRejected =",
              "                neuralResult != null",
              "                        && neuralResult.attempted",
              "                        && !neuralResult.accepted",
              "                        && neuralResult.report != null",
              '                        && neuralResult.report.contains("Neural rollback:");',
              "",
              "        boolean terminalOriginalRequired =",
              "                neuralQcRejected",
              "                        && result != null",
              "                        && result.report != null",
              '                        && result.report.contains(',
              '                                "Smooth-scene terminal protection: ORIGINAL RETAINED");',
              "",
              "        if (!terminalOriginalRequired) {",
              "            return result;",
              "        }",
              "",
              "        if (authoritativeOriginal == null",
              "                || authoritativeOriginal.isRecycled()",
              "                || originalAnalysis == null) {",
              "",
              "            throw new IllegalStateException(",
              '                    "Authoritative original checkpoint unavailable");',
              "        }",
              "",
              "        Bitmap exactOriginal = authoritativeOriginal.copy(",
              "                Bitmap.Config.ARGB_8888,",
              "                false);",
              "",
              "        if (exactOriginal == null) {",
              "            throw new IllegalStateException(",
              '                    "Unable to copy authoritative original bitmap");',
              "        }",
              "",
              "        PhotoAnalysis authoritativeCheck =",
              "                PhotoAnalysis.analyse(exactOriginal);",
              "",
              "        if (!authoritativeAnalysisMatches(",
              "                originalAnalysis,",
              "                authoritativeCheck)) {",
              "",
              "            exactOriginal.recycle();",
              "",
              "            throw new IllegalStateException(",
              '                    "Authoritative original checkpoint verification failed");',
              "        }",
              "",
              "        String correctedReport =",
              "                replaceOutputQcMetrics(",
              "                        result.report,",
              "                        authoritativeCheck);",
              "",
              "        String terminalMarker =",
              '                "Smooth-scene terminal protection: ORIGINAL RETAINED — no safe measurable improvement";',
              "",
              "        if (correctedReport.contains(terminalMarker)",
              "                && !correctedReport.contains(",
              '                        "Authoritative-original checkpoint: VERIFIED")) {',
              "",
              "            correctedReport = correctedReport.replace(",
              "                    terminalMarker,",
              "                    terminalMarker",
              '                            + "\\nAuthoritative-original checkpoint: VERIFIED — final bitmap/QC restored from pre-neural source");',
              "        }",
              "",
              "        Bitmap rejectedOutput = result.bitmap;",
              "",
              "        PhotoMasterEngine.Result authoritativeResult =",
              "                new PhotoMasterEngine.Result(",
              "                        exactOriginal,",
              "                        correctedReport,",
              "                        authoritativeCheck);",
              "",
              "        if (rejectedOutput != null",
              "                && rejectedOutput != authoritativeOriginal",
              "                && rejectedOutput != exactOriginal",
              "                && !rejectedOutput.isRecycled()) {",
              "",
              "            rejectedOutput.recycle();",
              "        }",
              "",
              "        return authoritativeResult;",
              "    }",
              "",
              "    private boolean authoritativeAnalysisMatches(",
              "            PhotoAnalysis expected,",
              "            PhotoAnalysis actual) {",
              "",
              "        if (expected == null || actual == null) {",
              "            return false;",
              "        }",
              "",
              "        double expectedDr =",
              "                expected.p95 - expected.p05;",
              "",
              "        double actualDr =",
              "                actual.p95 - actual.p05;",
              "",
              "        return Math.abs(",
              "                expected.medianLum",
              "                        - actual.medianLum) <= 0.0015",
              "",
              "                && Math.abs(",
              "                        expectedDr",
              "                                - actualDr) <= 0.0015",
              "",
              "                && Math.abs(",
              "                        expected.avgSat",
              "                                - actual.avgSat) <= 0.0015",
              "",
              "                && Math.abs(",
              "                        expected.noise",
              "                                - actual.noise) <= 0.0002",
              "",
              "                && Math.abs(",
              "                        expected.flatChromaNoise",
              "                                - actual.flatChromaNoise) <= 0.0002",
              "",
              "                && Math.abs(",
              "                        expected.detail",
              "                                - actual.detail) <= 0.0002",
              "",
              "                && Math.abs(",
              "                        expected.ringing",
              "                                - actual.ringing) <= 0.0015",
              "",
              "                && Math.abs(",
              "                        expected.shadowClip",
              "                                - actual.shadowClip) <= 0.0002",
              "",
              "                && Math.abs(",
              "                        expected.highlightClip",
              "                                - actual.highlightClip) <= 0.0002;",
              "    }",
              "",
              "    private String replaceOutputQcMetrics(",
              "            String sourceReport,",
              "            PhotoAnalysis authoritativeCheck) {",
              "",
              "        if (sourceReport == null",
              "                || authoritativeCheck == null) {",
              "",
              "            return sourceReport;",
              "        }",
              "",
              '        String marker = "\\nOUTPUT QC\\n";',
              "",
              "        int markerAt =",
              "                sourceReport.indexOf(marker);",
              "",
              "        if (markerAt < 0) {",
              "            return sourceReport;",
              "        }",
              "",
              "        int metricsStart =",
              "                markerAt + marker.length();",
              "",
              "        int metricsEnd = sourceReport.indexOf(",
              '                "\\n• Full-resolution render",',
              "                metricsStart);",
              "",
              "        if (metricsEnd < metricsStart) {",
              "            return sourceReport;",
              "        }",
              "",
              "        return sourceReport.substring(",
              "                0,",
              "                metricsStart)",
              "",
              "                + authoritativeCheck.compactMetrics()",
              "",
              "                + sourceReport.substring(",
              "                        metricsEnd);",
              "    }",
              "",
          ])

          main = main.replace(
              helper_anchor,
              helpers + helper_anchor,
              1
          )

          main_file.write_text(main)

          print(
              "v0.4.14 authoritative-original checkpoint applied"
          )
          PY

          grep -q \
            "versionCode 23" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "versionName '0.4.14'" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "enforceAuthoritativeOriginalCheckpoint" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

          grep -q \
            "Authoritative-original checkpoint: VERIFIED" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

          grep -q \
            "Authoritative original checkpoint verification failed" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

          grep -q \
            "smoothSurfaceTerminalGuard" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/PhotoMasterEngine.java"

          grep -q \
            "smooth metric floor; lower blends skipped" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "GpuBackend.OPENCL" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiserRuntime.kt"

          if grep -q \
            "new NeuralDenoiserRuntime(context, true)" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"
          then
            echo "::error::CPU neural fallback detected"
            exit 1
          fi

          echo "v0.4.14 source verification passed"

      - name: Fetch pinned NAFNet-SIDD model
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"

          ASSETS="$PROJECT/app/src/main/assets"
          MODEL="$ASSETS/nafnet_sidd_width32_fp16.tflite"

          mkdir -p "$ASSETS"

          URL='https://huggingface.co/litert-community/NAFNet-SIDD-width32-LiteRT/resolve/main/nafnet_sidd_width32_fp16.tflite?download=true'

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --output "$MODEL.tmp" \
            "$URL"

          mv "$MODEL.tmp" "$MODEL"

          test "$(stat -c%s "$MODEL")" -eq 62454048 || {
            echo "::error::Unexpected NAFNet model size"
            exit 1
          }

          echo \
          'f8fbaa422411683c53e802cf7cc7cf9be0a0de00886ad4af057232e26b172a0c  '"$MODEL" \
          | sha256sum -c -

          echo "Pinned NAFNet-SIDD model verified"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run all safety host checks
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf host-checks
          mkdir host-checks

          javac -d host-checks \
            app/src/main/java/com/dennis/photomasterai/DeepPixelRepair.java \
            app/src/main/java/com/dennis/photomasterai/RepairSafetyPolicy.java \
            app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java \
            app/src/main/java/com/dennis/photomasterai/SocialSourcePolicy.java \
            tools/DeepPixelRepairHostChecks.java \
            tools/RepairSafetyPolicyHostChecks.java \
            tools/NeuralDenoisePolicyHostChecks.java \
            tools/SocialSourcePolicyHostChecks.java \
            tools/SmoothSurfaceGuardHostChecks.java

          java -cp host-checks \
            com.dennis.photomasterai.DeepPixelRepairHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.RepairSafetyPolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.NeuralDenoisePolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.SocialSourcePolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.SmoothSurfaceGuardHostChecks

      - name: Restore stable Photo Master debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photo-master-ai-debug-keystore-v1

      - name: Create signing key on first build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Photo Master AI,O=Dennis Photo Master,C=AU" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$SDK/cmdline-tools" \
                -type f \
                -name 'sdkmanager' \
                | sort -V \
                | tail -n 1
            )"
          fi

          test -n "$SDKMANAGER" || {
            echo "::error::sdkmanager not found"
            exit 1
          }

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build v0.4.14 APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:assembleDebug \
            --stacktrace

      - name: Verify package and prepare artifact
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "::error::APK not found"
            exit 1
          }

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK/build-tools/35.0.0/aapt"

          BADGING="$(
            "$AAPT" dump badging "$APK" \
              | head -n 1
          )"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -q \
            "package: name='com.dennis.photomasterai'"

          echo "$BADGING" \
            | grep -q \
            "versionCode='23'"

          echo "$BADGING" \
            | grep -q \
            "versionName='0.4.14'"

          unzip -l "$APK" \
            | grep -q \
            'assets/nafnet_sidd_width32_fp16.tflite'

          rm -rf artifact
          mkdir artifact

          OUT="artifact/PhotoMasterAI-v0.4.14-AUTHORITATIVE-ORIGINAL-CHECKPOINT.apk"

          cp "$APK" "$OUT"

          sha256sum "$OUT" \
            > "artifact/PhotoMasterAI-v0.4.14-AUTHORITATIVE-ORIGINAL-CHECKPOINT-SHA256.txt"

          cat > "artifact/PhotoMasterAI-v0.4.14-Notes.txt" <<EOF
          Photo Master AI — v0.4.14 Continuation Notes

          Version: v0.4.14
          versionCode: 23

          BASELINE
          Exact successful v0.4.13 source.
          Git commit:
          ccc3abc5484c1557fa7de8b32f1cd51dacd0681a

          FROZEN NEURAL CORE
          - NAFNet-SIDD width32
          - Classic LiteRT / OpenCL GPU / FP32
          - NCHW FLOAT32 [1,3,256,256]
          - No CPU neural fallback
          - 5% smooth high-ring cap retained
          - +0.015 smooth-scene ringing allowance retained
          - metric-floor adaptive early stop retained
          - no extra NAFNet inference

          WHY v0.4.14 EXISTS
          Duck v0.4.13 correctly triggered:
          Smooth-scene terminal protection: ORIGINAL RETAINED

          However OUTPUT QC still resembled the rejected neural candidate:
          noise ~0.012
          flat chroma ~0.023
          ring ~0.75

          Original SCENE was:
          noise ~0.015
          flat chroma ~0.026
          detail ~0.014
          ring ~0.73

          v0.4.14 AUTHORITATIVE ORIGINAL CHECKPOINT
          After PhotoMasterEngine returns, when BOTH conditions apply:
          - neural was genuinely rejected by QC
          - terminal smooth-scene ORIGINAL RETAINED is active

          MainActivity now:
          - copies the untouched pre-neural originalBitmap
          - re-analyses that exact copied bitmap
          - verifies the measurements against originalAnalysis
          - throws an explicit error if verification fails
          - discards the previous terminal engine output
          - makes the authoritative copy the final master bitmap
          - rewrites OUTPUT QC from the authoritative re-analysis

          REPORT
          Expected:
          Authoritative-original checkpoint: VERIFIED —
          final bitmap/QC restored from pre-neural source

          EXPECTED DUCK OUTPUT QC
          Median ~0.68
          DR ~0.57
          sat ~0.06
          noise ~0.015
          flat chroma ~0.026
          detail ~0.014
          ring ~0.73

          NEXT REGRESSION TESTS
          1. Duck
          2. Portrait
          3. Flower
          4. Detailed landscape

          IMPORTANT
          Do not alter NAFNet/OpenCL/NCHW.
          Do not loosen neural QC.
          Do not add CPU neural fallback.
          Treat v0.4.13 as known-good terminal decision baseline.
          EOF

          echo "v0.4.14 APK and continuation notes prepared"

      - name: Upload APK and continuation notes
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMasterAI-v0.4.14-AUTHORITATIVE-ORIGINAL-CHECKPOINT
          path: |
            artifact/PhotoMasterAI-v0.4.14-AUTHORITATIVE-ORIGINAL-CHECKPOINT.apk
            artifact/PhotoMasterAI-v0.4.14-AUTHORITATIVE-ORIGINAL-CHECKPOINT-SHA256.txt
            artifact/PhotoMasterAI-v0.4.14-Notes.txt
          if-no-files-found: error
          retention-days: 30
