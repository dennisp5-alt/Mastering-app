name: Photo Master AI Signing Diagnosis

on:
  push:
    paths:
      - '.github/workflows/photo-master-ai-signing-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-diagnosis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore existing signing key cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photo-master-ai-debug-keystore-v1
          lookup-only: false
      - name: Compare restored certificate to installed v0.4.35
        shell: bash
        run: |
          set -euo pipefail
          KEY="$HOME/.android/debug.keystore"
          test -f "$KEY" || { echo "::error::Cached signing key is absent"; exit 1; }
          echo "Cached keystore fingerprint:"
          CERT="$(
            keytool -exportcert -alias androiddebugkey \
              -keystore "$KEY" -storepass android \
              | sha256sum | cut -d ' ' -f1
          )"
          echo "Cached SHA256: $CERT"
          echo "v0.4.35 installed APK certificate: bb70e242314ab8f822030fd5274adfdaf6671299418df31e2370c15a542747e0"
          echo "v0.4.36 invalid-update certificate: 5120e490b1c6864efa366aa952b24f0517e684681f1f21b79f9f73cdaba5bc3b"
          if [ "$CERT" = "bb70e242314ab8f822030fd5274adfdaf6671299418df31e2370c15a542747e0" ]; then
            echo "Cached key matches v0.4.35; signing can be explicitly pinned."
          else
            echo "::warning::Cached key does not match v0.4.35; investigate Gradle signingReport before publishing another APK."
          fi
