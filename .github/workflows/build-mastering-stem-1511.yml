name: Build Dennis AI Mastering Lab v0.15.11 Stem-Assisted Stereo Intelligence TEST

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-mastering-stem-1511.yml'
      - 'tools/v01511-stereo-intelligence.patch'

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Restore verified v0.15.10 source checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p restored project
          gh run download 38188818882 --repo dennisp5-alt/Mastering-app --name DennisAiMasteringLab-v0.15.10-Source --dir restored
          test -f restored/DennisAiMasteringLab-v0.15.10-GitHubBuildSource.zip
          unzip -q restored/DennisAiMasteringLab-v0.15.10-GitHubBuildSource.zip -d project
          grep -q "versionName '0.15.10'" project/app/build.gradle
          printf '%s  %s\\n' '9c95b16d88a3d27365b14ef86533e81319ba50871a8f519d04654f467d65fb56' 'project/app/src/main/java/com/dennis/aimasteringlab/FullAiMasteringEngine.java' | sha256sum -c -

      - name: Apply guarded v0.15.11 stem-assisted stereo intelligence
        run: |
          patch --batch --fuzz=0 -p1 -d project < tools/v01511-stereo-intelligence.patch
          grep -q "versionName '0.15.11'" project/app/build.gradle
          grep -q 'com.dennis.aimasteringlab.test1511' project/app/build.gradle
          grep -q 'NO_RENDER_OR_SELECTION' project/app/src/main/java/com/dennis/aimasteringlab/StemAssistedStereoIntelligence.java
          printf '%s  %s\\n' '9c95b16d88a3d27365b14ef86533e81319ba50871a8f519d04654f467d65fb56' 'project/app/src/main/java/com/dennis/aimasteringlab/FullAiMasteringEngine.java' | sha256sum -c -

      - name: Run focused host regressions
        run: |
          rm -rf host-classes host-test-work
          mkdir -p host-classes host-test-work
          javac -encoding UTF-8 -d host-classes \
            -sourcepath project/app/src/main/java:project/tests \
            project/app/src/main/java/com/dennis/aimasteringlab/FullAiMasteringEngine.java \
            project/app/src/main/java/com/dennis/aimasteringlab/AdaptiveDynamicsPreservation.java \
            project/app/src/main/java/com/dennis/aimasteringlab/DemandAwareObjectiveGate.java \
            project/app/src/main/java/com/dennis/aimasteringlab/StudioQcReporting.java \
            project/app/src/main/java/com/dennis/aimasteringlab/StudioAudio.java \
            project/app/src/main/java/com/dennis/aimasteringlab/StudioPerformance.java \
            project/app/src/main/java/com/dennis/aimasteringlab/SincResampler.java \
            project/app/src/main/java/com/dennis/aimasteringlab/AdaptiveBroadMastering.java \
            project/app/src/main/java/com/dennis/aimasteringlab/PassagePreservation.java \
            project/tests/V0149CandidateEfficiencyHarness.java \
            project/tests/V0150SparseVocalHarness.java \
            project/tests/BuildConfig.java \
            project/tests/LegacyAutonomousMasteringRenderer.java \
            project/tests/V0156EarlySparseHarness.java \
            project/tests/V0155SparsePeakHarness.java \
            project/tests/V0154TonalTransientHarness.java \
            project/tests/V0153PeakFallbackHarness.java \
            project/tests/V0152RenderBypassHarness.java \
            project/tests/V0151ExactHotLoopHarness.java \
            project/tests/LegacyTruePeakMeter.java \
            project/tests/LegacyLookaheadLimiter.java \
            project/tests/V0150QcReportingHarness.java \
            project/tests/V0148StudioPassthroughHarness.java \
            project/tests/V0148TimingHarness.java \
            project/tests/V0146DemandAwareObjectiveHarness.java \
            project/tests/V0145DynamicsPreservationHarness.java \
            project/tests/V0145PassageEnvelopeHarness.java \
            project/tests/V0145AdaptiveAnchorHarness.java \
            project/tests/V0144AdaptiveLadderHarness.java \
            project/tests/V0144AdaptiveSelectionHarness.java \
            project/tests/V0143BroadMasteringNeedHarness.java \
            project/tests/V0143BroadAnchorHarness.java \
            project/tests/V0143BroadRetentionHarness.java \
            project/tests/org/json/*.java
          java -cp host-classes com.dennis.aimasteringlab.V0149CandidateEfficiencyHarness
          java -cp host-classes com.dennis.aimasteringlab.V0150SparseVocalHarness
          java -cp host-classes com.dennis.aimasteringlab.V0156EarlySparseHarness
          java -cp host-classes com.dennis.aimasteringlab.V0155SparsePeakHarness
          java -cp host-classes com.dennis.aimasteringlab.V0154TonalTransientHarness
          java -cp host-classes com.dennis.aimasteringlab.V0153PeakFallbackHarness host-test-work/peak-recovery
          java -cp host-classes com.dennis.aimasteringlab.V0152RenderBypassHarness host-test-work/v0152
          java -cp host-classes com.dennis.aimasteringlab.V0151ExactHotLoopHarness
          java -cp host-classes com.dennis.aimasteringlab.V0150QcReportingHarness
          java -cp host-classes com.dennis.aimasteringlab.V0148StudioPassthroughHarness host-test-work
          java -cp host-classes com.dennis.aimasteringlab.V0148TimingHarness
          java -cp host-classes com.dennis.aimasteringlab.V0146DemandAwareObjectiveHarness host-test-work/demand-gate
          java -cp host-classes com.dennis.aimasteringlab.V0145DynamicsPreservationHarness
          java -cp host-classes com.dennis.aimasteringlab.V0145PassageEnvelopeHarness
          java -cp host-classes com.dennis.aimasteringlab.V0145AdaptiveAnchorHarness host-test-work/adaptive-anchor
          java -cp host-classes com.dennis.aimasteringlab.V0144AdaptiveLadderHarness
          java -cp host-classes com.dennis.aimasteringlab.V0144AdaptiveSelectionHarness
          java -cp host-classes com.dennis.aimasteringlab.V0143BroadMasteringNeedHarness
          java -cp host-classes com.dennis.aimasteringlab.V0143BroadAnchorHarness host-test-work/broad-anchor
          java -cp host-classes com.dennis.aimasteringlab.V0143BroadRetentionHarness host-test-work/broad-retention


      - name: Run guarded stem diagnostics regression
        run: |
          javac -encoding UTF-8 -cp host-classes -d host-classes \
            -sourcepath project/app/src/main/java:project/tests \
            project/tests/StemFixtureGenerator.java \
            project/tests/V01510StemDiagnosticsHarness.java \
            project/app/src/main/java/com/dennis/aimasteringlab/StemAlignmentValidator.java \
            project/app/src/main/java/com/dennis/aimasteringlab/StemDurationDiagnostics.java \
            project/app/src/main/java/com/dennis/aimasteringlab/StemInventory.java
          mkdir -p host-test-work/stem1510-fixtures
          java -cp host-classes com.dennis.aimasteringlab.StemFixtureGenerator host-test-work/stem1510-fixtures
          java -cp host-classes com.dennis.aimasteringlab.V01510StemDiagnosticsHarness host-test-work/stem1510-fixtures
          javac -encoding UTF-8 -cp host-classes -d host-classes \
            -sourcepath project/app/src/main/java:project/tests \
            project/tests/V01511StemGuidanceHarness.java \
            project/app/src/main/java/com/dennis/aimasteringlab/StudioStemInspection.java \
            project/app/src/main/java/com/dennis/aimasteringlab/StemAssistedStereoIntelligence.java
          java -cp host-classes com.dennis.aimasteringlab.V01511StemGuidanceHarness host-test-work/stem1510-fixtures

      - name: Package source checkpoint
        run: |
          (cd project && zip -qr ../DennisAiMasteringLab-v0.15.11-GitHubBuildSource.zip . -x '.gradle/*' 'build/*' 'app/build/*' '*.keystore' '*.jks' '*.apk')
          sha256sum DennisAiMasteringLab-v0.15.11-GitHubBuildSource.zip > DennisAiMasteringLab-v0.15.11-CHECKSUMS.sha256

      - name: Build side-by-side test APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and package APK
        run: |
          test -f project/app/build/outputs/apk/debug/app-debug.apk
          cp project/app/build/outputs/apk/debug/app-debug.apk DennisAiMasteringLab-v0.15.11-StemStereoIntelligence-TEST.apk
          unzip -tq DennisAiMasteringLab-v0.15.11-StemStereoIntelligence-TEST.apk
          sha256sum DennisAiMasteringLab-v0.15.11-StemStereoIntelligence-TEST.apk >> DennisAiMasteringLab-v0.15.11-CHECKSUMS.sha256

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: DennisAiMasteringLab-v0.15.11-StemStereoIntelligence-TEST
          path: DennisAiMasteringLab-v0.15.11-StemStereoIntelligence-TEST.apk
          retention-days: 30

      - name: Upload reproducible source
        uses: actions/upload-artifact@v4
        with:
          name: DennisAiMasteringLab-v0.15.11-Source
          path: |
            DennisAiMasteringLab-v0.15.11-GitHubBuildSource.zip
            DennisAiMasteringLab-v0.15.11-CHECKSUMS.sha256
          retention-days: 30

      - name: Publish verifiable build status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        run: |
          status="failure"
          if [ "$OUTCOME" = "success" ]; then status="success"; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$status" \
            -f context="Dennis Mastering Stem Stereo Intelligence v0.15.11" \
            -f description="Android build and regression suite: $OUTCOME" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
