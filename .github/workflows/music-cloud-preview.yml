name: Dennis Music Cloud v0.3 Android APK
on:
  push:
    branches: [dennis-ai-music-cloud-preview]
    paths:
      - 'music-cloud-preview/**'
      - '.github/workflows/music-cloud-preview.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER" || exit 1
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify REST contract and build cloud client APK
        run: gradle --no-daemon -p music-cloud-preview :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Dennis-Music-Cloud-v0.3-APK
          path: music-cloud-preview/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
