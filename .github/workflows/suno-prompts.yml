name: Suno Prompts APK
on:
  push:
    branches: [main]
    paths:
      - "SunoPrompts/**"
      - ".github/workflows/suno-prompts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install required Android platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble standalone debug APK
        working-directory: SunoPrompts
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify package and prepare raw APK
        run: |
          mkdir -p dist
          cp SunoPrompts/app/build/outputs/apk/debug/app-debug.apk dist/SunoPrompts-v0.1.0-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/SunoPrompts-v0.1.0-debug.apk | head -n 8
          unzip -t dist/SunoPrompts-v0.1.0-debug.apk | tail -n 2
          sha256sum dist/SunoPrompts-v0.1.0-debug.apk > dist/SunoPrompts-v0.1.0-debug.apk.sha256
      - name: Publish installable artifact
        uses: actions/upload-artifact@v4
        with:
          name: suno-prompts-apk-v0.1.0
          path: dist/*
          retention-days: 30
      - name: Release standalone APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view suno-prompts-v0.1.0 >/dev/null 2>&1; then
            gh release create suno-prompts-v0.1.0 --title "Suno Prompts v0.1.0" --notes "Standalone Suno production-prompt research app: artist folders, source links, offline storage, optional OpenAI generation."
          fi
          gh release upload suno-prompts-v0.1.0 dist/SunoPrompts-v0.1.0-debug.apk dist/SunoPrompts-v0.1.0-debug.apk.sha256 --clobber
      - name: Record successfully published APK
        if: success() && github.ref == 'refs/heads/main'
        run: |
          APK_SHA="$(sha256sum dist/SunoPrompts-v0.1.0-debug.apk | cut -d ' ' -f1)"
          cat > SunoPrompts/BUILD_STATUS.json <<EOF
          {
            "status": "success",
            "version": "0.1.0",
            "apk": "SunoPrompts-v0.1.0-debug.apk",
            "sha256": "$APK_SHA",
            "built_from": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "release_url": "https://github.com/dennisp5-alt/Mastering-app/releases/tag/suno-prompts-v0.1.0"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SunoPrompts/BUILD_STATUS.json
          git commit -m "Record successful Suno Prompts build" || true
          git push origin HEAD:main
