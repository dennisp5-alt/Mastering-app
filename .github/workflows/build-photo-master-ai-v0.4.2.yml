name: Build Photo Master AI v0.4.2 Neural Runtime Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-photo-master-ai-v0.4.2.yml'

permissions:
  contents: read

jobs:
  build:
    name: Photo Master AI v0.4.2 Neural Runtime Recovery
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract v0.4.1 and patch neural runtime
        id: source
        shell: bash
        run: |
          set -euo pipefail

          test -f PhotoMasterAI-v0.4.1-Source.zip || {
            echo "::error::PhotoMasterAI-v0.4.1-Source.zip missing"
            exit 1
          }

          rm -rf photomaster-v042-build
          mkdir photomaster-v042-build
          unzip -q PhotoMasterAI-v0.4.1-Source.zip -d photomaster-v042-build

          SETTINGS="$(find photomaster-v042-build -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)"

          test -n "$SETTINGS" || {
            echo "::error::settings.gradle not found"
            exit 1
          }

          PROJECT="$(dirname "$SETTINGS")"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          export PROJECT

          python3 - <<'PY'
          from pathlib import Path
          import os

          project = Path(os.environ["PROJECT"])

          # -----------------------------
          # Version bump
          # -----------------------------
          build_file = project / "app/build.gradle"
          s = build_file.read_text()

          if "versionCode 10" not in s:
              raise RuntimeError("versionCode 10 not found")

          if "versionName '0.4.1'" not in s:
              raise RuntimeError("versionName 0.4.1 not found")

          s = s.replace(
              "versionCode 10",
              "versionCode 11",
              1
          )

          s = s.replace(
              "versionName '0.4.1'",
              "versionName '0.4.2'",
              1
          )

          build_file.write_text(s)

          # -----------------------------
          # Neural runtime recovery
          # -----------------------------
          neural = project / (
              "app/src/main/java/com/dennis/"
              "photomasterai/NeuralDenoiser.java"
          )

          if not neural.exists():
              raise RuntimeError(
                  "NeuralDenoiser.java not found"
              )

          s = neural.read_text()

          # Add performance guards.
          marker = (
              "    private static final int PLANE = TILE * TILE;"
          )

          if marker not in s:
              raise RuntimeError(
                  "PLANE constant not found"
              )

          s = s.replace(
              marker,
              marker + """

    // v0.4.2 neural runtime recovery.
    // Never turn a failed GPU neural pass into a minutes-long CPU pass.
    private static final long MAX_SELF_TEST_MS = 12_000L;
    private static final long MAX_TILE_MS = 8_000L;
    private static final long MAX_TOTAL_NEURAL_MS = 75_000L;""",
              1
          )

          # -------------------------------------------------
          # Replace GPU self-test + CPU fallback.
          #
          # v0.4.1 moved the complete photo to CPU NAFNet
          # whenever GPU self-test/output validation failed.
          # That is the regression which made noisy photos
          # appear to hang.
          # -------------------------------------------------

          start_marker = """            try {
                runtime = new NeuralDenoiserRuntime(context, false);"""

          end_marker = """
            int[] tilePixels = new int[PLANE];"""

          start = s.find(start_marker)

          if start < 0:
              raise RuntimeError(
                  "GPU self-test block start not found"
              )

          end = s.find(end_marker, start)

          if end < 0:
              raise RuntimeError(
                  "GPU self-test block end not found"
              )

          replacement = """            long selfTestStart =
                    System.nanoTime();

            runtime =
                    new NeuralDenoiserRuntime(
                            context,
                            false);

            runtime.selfTest();

            accelerator =
                    runtime.getAcceleratorLabel();

            long selfTestMs =
                    Math.max(
                            1L,
                            Math.round(
                                    (
                                            System.nanoTime()
                                                    - selfTestStart
                                    )
                                            / 1_000_000.0));

            if (selfTestMs > MAX_SELF_TEST_MS) {
                throw new IllegalStateException(
                        "GPU self-test exceeded "
                                + "performance guard: "
                                + selfTestMs
                                + " ms");
            }

"""

          s = (
              s[:start]
              + replacement
              + s[end:]
          )

          # -------------------------------------------------
          # Replace per-tile GPU -> CPU retry.
          #
          # If GPU inference/output validation fails now,
          # neural processing is aborted immediately.
          #
          # Existing outer catch:
          # - recycles the neural candidate
          # - retains the original photo
          # - returns to deterministic v0.3.3 repair
          # -------------------------------------------------

          start_marker = """                    float[] restored;"""

          end_marker = """                    renderCentral("""

          start = s.find(start_marker)

          if start < 0:
              raise RuntimeError(
                  "Per-tile runtime block start not found"
              )

          end = s.find(end_marker, start)

          if end < 0:
              raise RuntimeError(
                  "Per-tile runtime block end not found"
              )

          replacement = """                    long elapsedBeforeTileMs =
                            Math.max(
                                    1L,
                                    Math.round(
                                            (
                                                    System.nanoTime()
                                                            - start
                                            )
                                                    / 1_000_000.0));

                    if (
                            tiles > 0
                                    && elapsedBeforeTileMs
                                    > MAX_TOTAL_NEURAL_MS
                    ) {
                        throw new IllegalStateException(
                                "GPU neural pass exceeded "
                                        + "total performance guard "
                                        + "after "
                                        + tiles
                                        + " tiles: "
                                        + elapsedBeforeTileMs
                                        + " ms");
                    }

                    long tileStart =
                            System.nanoTime();

                    float[] restored =
                            runtime.run(input);

                    long tileMs =
                            Math.max(
                                    1L,
                                    Math.round(
                                            (
                                                    System.nanoTime()
                                                            - tileStart
                                            )
                                                    / 1_000_000.0));

                    if (tileMs > MAX_TILE_MS) {
                        throw new IllegalStateException(
                                "GPU tile exceeded "
                                        + "performance guard: "
                                        + tileMs
                                        + " ms");
                    }

"""

          s = (
              s[:start]
              + replacement
              + s[end:]
          )

          # CPU NAFNet must not remain reachable.
          if (
              "new NeuralDenoiserRuntime(context, true)"
              in s
          ):
              raise RuntimeError(
                  "CPU NAFNet fallback still present"
              )

          # gpuFallback is no longer used.
          s = s.replace(
              "        boolean gpuFallback = false;\n",
              ""
          )

          # Reporting no longer needs CPU fallback wording.
          s = s.replace(
              '''                accelerator, gpuFallback ? " (GPU output sanity fallback)" : "",''',
              '''                accelerator, "",'''
          )

          neural.write_text(s)

          print(
              "Photo Master AI v0.4.2 "
              "runtime recovery patch applied"
          )

          print(
              "Full-image CPU NAFNet fallback: REMOVED"
          )

          print(
              "Per-tile CPU retry: REMOVED"
          )

          print(
              "GPU output validation: RETAINED"
          )

          print(
              "Existing neural rollback: RETAINED"
          )
          PY

          grep -q \
            "versionCode 11" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "versionName '0.4.2'" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "MAX_TOTAL_NEURAL_MS = 75_000L" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          if grep -q \
            "new NeuralDenoiserRuntime(context, true)" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"
          then
            echo "::error::CPU NAFNet fallback still present"
            exit 1
          fi

          echo "v0.4.2 runtime guard verified"

      - name: Fetch pinned NAFNet-SIDD model
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"
          ASSETS="$PROJECT/app/src/main/assets"
          MODEL="$ASSETS/nafnet_sidd_width32_fp16.tflite"

          mkdir -p "$ASSETS"

          URL='https://huggingface.co/litert-community/NAFNet-SIDD-width32-LiteRT/resolve/main/nafnet_sidd_width32_fp16.tflite?download=true'

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --output "$MODEL.tmp" \
            "$URL"

          mv "$MODEL.tmp" "$MODEL"

          test "$(stat -c%s "$MODEL")" -eq 62454048 || {
            echo "::error::Unexpected NAFNet model size"
            exit 1
          }

          echo \
          'f8fbaa422411683c53e802cf7cc7cf9be0a0de00886ad4af057232e26b172a0c  '"$MODEL" \
          | sha256sum -c -

          echo "Pinned NAFNet model verified"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run restoration safety checks
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf host-checks
          mkdir host-checks

          javac -d host-checks \
            app/src/main/java/com/dennis/photomasterai/DeepPixelRepair.java \
            app/src/main/java/com/dennis/photomasterai/RepairSafetyPolicy.java \
            app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java \
            app/src/main/java/com/dennis/photomasterai/SocialSourcePolicy.java \
            tools/DeepPixelRepairHostChecks.java \
            tools/RepairSafetyPolicyHostChecks.java \
            tools/NeuralDenoisePolicyHostChecks.java \
            tools/SocialSourcePolicyHostChecks.java

          java -cp host-checks \
            com.dennis.photomasterai.DeepPixelRepairHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.RepairSafetyPolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.NeuralDenoisePolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.SocialSourcePolicyHostChecks

      - name: Restore stable Photo Master signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photo-master-ai-debug-keystore-v1

      - name: Create signing key if needed
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Photo Master AI,O=Dennis Photo Master,C=AU" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$SDK/cmdline-tools" \
                -type f \
                -name sdkmanager \
                | sort -V \
                | tail -n 1
            )"
          fi

          test -n "$SDKMANAGER" || {
            echo "::error::sdkmanager not found"
            exit 1
          }

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build v0.4.2 APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace

      - name: Verify and collect APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "::error::APK not found"
            exit 1
          }

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK/build-tools/35.0.0/aapt"

          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -q "package: name='com.dennis.photomasterai'"

          echo "$BADGING" \
            | grep -q "versionCode='11'"

          echo "$BADGING" \
            | grep -q "versionName='0.4.2'"

          unzip -l "$APK" \
            | grep -q \
            'assets/nafnet_sidd_width32_fp16.tflite'

          rm -rf artifact
          mkdir artifact

          OUT="artifact/PhotoMasterAI-v0.4.2-NEURAL-RUNTIME-RECOVERY.apk"

          cp "$APK" "$OUT"

          sha256sum "$OUT" \
            > "artifact/PhotoMasterAI-v0.4.2-NEURAL-RUNTIME-RECOVERY-SHA256.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMasterAI-v0.4.2-NEURAL-RUNTIME-RECOVERY
          path: |
            artifact/PhotoMasterAI-v0.4.2-NEURAL-RUNTIME-RECOVERY.apk
            artifact/PhotoMasterAI-v0.4.2-NEURAL-RUNTIME-RECOVERY-SHA256.txt
          if-no-files-found: error
          retention-days: 30
