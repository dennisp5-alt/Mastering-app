name: Build Photo Master AI v0.4.3 GPU Runtime A-B

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-photo-master-ai-v0.4.3.yml'

permissions:
  contents: read

jobs:
  build:
    name: Photo Master AI v0.4.3 GPU Runtime A-B
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract v0.4.1 and apply v0.4.3 runtime experiment
        id: source
        shell: bash
        run: |
          set -euo pipefail

          test -f PhotoMasterAI-v0.4.1-Source.zip || {
            echo "::error::PhotoMasterAI-v0.4.1-Source.zip missing"
            exit 1
          }

          rm -rf photomaster-v043-build
          mkdir photomaster-v043-build

          unzip -q \
            PhotoMasterAI-v0.4.1-Source.zip \
            -d photomaster-v043-build

          SETTINGS="$(find photomaster-v043-build -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)"

          test -n "$SETTINGS" || {
            echo "::error::settings.gradle not found"
            exit 1
          }

          PROJECT="$(dirname "$SETTINGS")"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          export PROJECT

          python3 - <<'PY'
          from pathlib import Path
          import os

          project = Path(os.environ["PROJECT"])

          # =====================================================
          # VERSION
          # =====================================================

          build_file = project / "app/build.gradle"
          build = build_file.read_text()

          if "versionCode 10" not in build:
              raise RuntimeError("versionCode 10 not found")

          if "versionName '0.4.1'" not in build:
              raise RuntimeError("versionName 0.4.1 not found")

          build = build.replace(
              "versionCode 10",
              "versionCode 12",
              1
          )

          build = build.replace(
              "versionName '0.4.1'",
              "versionName '0.4.3'",
              1
          )

          build_file.write_text(build)

          # =====================================================
          # v0.4.3 NAFNet RUNTIME
          #
          # Experiment:
          # restore the older v0.4.0 asset + Environment loading
          # route while keeping v0.4.1 output validation.
          #
          # GPU ONLY.
          # No full-photo CPU fallback.
          # =====================================================

          runtime_file = project / (
              "app/src/main/java/com/dennis/"
              "photomasterai/NeuralDenoiserRuntime.kt"
          )

          runtime_lines = [
              "package com.dennis.photomasterai",
              "",
              "import android.content.Context",
              "import com.google.ai.edge.litert.Accelerator",
              "import com.google.ai.edge.litert.CompiledModel",
              "import com.google.ai.edge.litert.Environment",
              "import com.google.ai.edge.litert.TensorBuffer",
              "import kotlin.math.sqrt",
              "",
              "/**",
              " * Photo Master AI v0.4.3 NAFNet GPU runtime experiment.",
              " *",
              " * Restores the v0.4.0 LiteRT model-loading route:",
              " * Context assets -> Environment -> GPU CompiledModel.",
              " *",
              " * NCHW Float32 RGB [1,3,256,256] is retained.",
              " * Output sanity checking is retained.",
              " * Full-photo CPU fallback is intentionally disabled.",
              " */",
              "class NeuralDenoiserRuntime(",
              "    context: Context,",
              "    private val cpuOnly: Boolean = false",
              ") : AutoCloseable {",
              "",
              "    init {",
              "        require(!cpuOnly) {",
              "            \"CPU NAFNet is disabled in v0.4.3 performance-safe mode\"",
              "        }",
              "    }",
              "",
              "    private val env: Environment = Environment.create(context)",
              "",
              "    private val model: CompiledModel = CompiledModel.create(",
              "        context.assets,",
              "        MODEL_NAME,",
              "        CompiledModel.Options(Accelerator.GPU),",
              "        env",
              "    )",
              "",
              "    private val inputs: List<TensorBuffer> =",
              "        model.createInputBuffers()",
              "",
              "    private val outputs: List<TensorBuffer> =",
              "        model.createOutputBuffers()",
              "",
              "    val acceleratorLabel: String =",
              "        \"LiteRT GPU / asset-Environment path\"",
              "",
              "    fun run(input: FloatArray): FloatArray {",
              "        require(input.size == ELEMENTS) {",
              "            \"NAFNet input must contain $ELEMENTS floats\"",
              "        }",
              "",
              "        inputs[0].writeFloat(input)",
              "",
              "        model.run(inputs, outputs)",
              "",
              "        val out = outputs[0].readFloat()",
              "",
              "        require(out.size >= ELEMENTS) {",
              "            \"NAFNet output had ${out.size} floats\"",
              "        }",
              "",
              "        validateOutput(input, out)",
              "",
              "        return out",
              "    }",
              "",
              "    /**",
              "     * One synthetic inference before full-photo tiling.",
              "     *",
              "     * This catches invalid GPU output before hundreds",
              "     * of photo tiles are attempted.",
              "     */",
              "    fun selfTest() {",
              "        val probe = FloatArray(ELEMENTS)",
              "",
              "        val hw = TILE * TILE",
              "",
              "        for (y in 0 until TILE) {",
              "            for (x in 0 until TILE) {",
              "                val i = y * TILE + x",
              "",
              "                val gx = x / (TILE - 1f)",
              "                val gy = y / (TILE - 1f)",
              "",
              "                probe[i] =",
              "                    (0.08f + 0.78f * gx)",
              "                        .coerceIn(0f, 1f)",
              "",
              "                probe[hw + i] =",
              "                    (0.10f + 0.72f * gy)",
              "                        .coerceIn(0f, 1f)",
              "",
              "                probe[2 * hw + i] =",
              "                    (",
              "                        0.12f",
              "                            + 0.55f",
              "                            * (0.5f * gx + 0.5f * gy)",
              "                    ).coerceIn(0f, 1f)",
              "            }",
              "        }",
              "",
              "        run(probe)",
              "    }",
              "",
              "    private fun validateOutput(",
              "        input: FloatArray,",
              "        out: FloatArray",
              "    ) {",
              "",
              "        var inSum = 0.0",
              "        var inSum2 = 0.0",
              "",
              "        var outSum = 0.0",
              "        var outSum2 = 0.0",
              "",
              "        var inMin = Float.POSITIVE_INFINITY",
              "        var inMax = Float.NEGATIVE_INFINITY",
              "",
              "        var outMin = Float.POSITIVE_INFINITY",
              "        var outMax = Float.NEGATIVE_INFINITY",
              "",
              "        var finiteCount = 0",
              "        var nanCount = 0",
              "        var positiveInfinityCount = 0",
              "        var negativeInfinityCount = 0",
              "",
              "        for (i in 0 until ELEMENTS) {",
              "            val a = input[i]",
              "            val b = out[i]",
              "",
              "            inSum += a",
              "            inSum2 += a * a",
              "",
              "            if (a < inMin) inMin = a",
              "            if (a > inMax) inMax = a",
              "",
              "            if (b.isNaN()) {",
              "                nanCount++",
              "                continue",
              "            }",
              "",
              "            if (b == Float.POSITIVE_INFINITY) {",
              "                positiveInfinityCount++",
              "                continue",
              "            }",
              "",
              "            if (b == Float.NEGATIVE_INFINITY) {",
              "                negativeInfinityCount++",
              "                continue",
              "            }",
              "",
              "            finiteCount++",
              "",
              "            outSum += b",
              "            outSum2 += b * b",
              "",
              "            if (b < outMin) outMin = b",
              "            if (b > outMax) outMax = b",
              "        }",
              "",
              "        val nonFinite =",
              "            nanCount",
              "                + positiveInfinityCount",
              "                + negativeInfinityCount",
              "",
              "        if (nonFinite > 0) {",
              "",
              "            val finiteMean =",
              "                if (finiteCount > 0)",
              "                    outSum / finiteCount.toDouble()",
              "                else",
              "                    Double.NaN",
              "",
              "            throw IllegalStateException(",
              "                \"NAFNet non-finite output \"",
              "                    + \"(NaN=$nanCount, \"",
              "                    + \"+Inf=$positiveInfinityCount, \"",
              "                    + \"-Inf=$negativeInfinityCount, \"",
              "                    + \"finite=$finiteCount/$ELEMENTS, \"",
              "                    + \"finiteMin=$outMin, \"",
              "                    + \"finiteMax=$outMax, \"",
              "                    + \"finiteMean=$finiteMean)\"",
              "            )",
              "        }",
              "",
              "        if (finiteCount != ELEMENTS) {",
              "            throw IllegalStateException(",
              "                \"NAFNet output finite-count mismatch: \"",
              "                    + \"$finiteCount/$ELEMENTS\"",
              "            )",
              "        }",
              "",
              "        val n = ELEMENTS.toDouble()",
              "",
              "        val inMean = inSum / n",
              "        val outMean = outSum / n",
              "",
              "        val inVar =",
              "            (inSum2 / n - inMean * inMean)",
              "                .coerceAtLeast(0.0)",
              "",
              "        val outVar =",
              "            (outSum2 / n - outMean * outMean)",
              "                .coerceAtLeast(0.0)",
              "",
              "        val inStd = sqrt(inVar)",
              "        val outStd = sqrt(outVar)",
              "",
              "        val inRange =",
              "            (inMax - inMin).toDouble()",
              "",
              "        val outRange =",
              "            (outMax - outMin).toDouble()",
              "",
              "        val collapsedRange =",
              "            inRange > 0.08",
              "                && outRange < 0.015",
              "",
              "        val collapsedStd =",
              "            inStd > 0.015",
              "                && outStd < 0.0025",
              "                && outStd < inStd * 0.08",
              "",
              "        val collapsedMean =",
              "            inMean > 0.045",
              "                && outMean < 0.0045",
              "",
              "        if (",
              "            collapsedRange",
              "                || collapsedStd",
              "                || collapsedMean",
              "        ) {",
              "            throw IllegalStateException(",
              "                \"NAFNet output collapsed \"",
              "                    + \"(in mean %.4f std %.4f range %.4f; \"",
              "                    + \"out mean %.4f std %.4f range %.4f)\"",
              "                        .format(",
              "                            inMean,",
              "                            inStd,",
              "                            inRange,",
              "                            outMean,",
              "                            outStd,",
              "                            outRange",
              "                        )",
              "            )",
              "        }",
              "    }",
              "",
              "    override fun close() {",
              "        inputs.forEach {",
              "            it.close()",
              "        }",
              "",
              "        outputs.forEach {",
              "            it.close()",
              "        }",
              "",
              "        model.close()",
              "        env.close()",
              "    }",
              "",
              "    companion object {",
              "        const val MODEL_NAME =",
              "            \"nafnet_sidd_width32_fp16.tflite\"",
              "",
              "        const val TILE = 256",
              "",
              "        const val ELEMENTS =",
              "            TILE * TILE * 3",
              "    }",
              "}",
          ]

          runtime_file.write_text(
              "\n".join(runtime_lines) + "\n"
          )

          # =====================================================
          # v0.4.2 PERFORMANCE-SAFE NEURAL CONTROLLER
          #
          # Re-apply the successful v0.4.2 behaviour:
          # GPU only.
          # No CPU whole-photo fallback.
          # No per-tile CPU retry.
          # =====================================================

          neural = project / (
              "app/src/main/java/com/dennis/"
              "photomasterai/NeuralDenoiser.java"
          )

          if not neural.exists():
              raise RuntimeError(
                  "NeuralDenoiser.java not found"
              )

          s = neural.read_text()

          marker = (
              "    private static final int PLANE = TILE * TILE;"
          )

          if marker not in s:
              raise RuntimeError(
                  "PLANE constant not found"
              )

          guards = (
              marker
              + "\n\n"
              + "    // v0.4.3 neural performance guards.\n"
              + "    private static final long "
              + "MAX_SELF_TEST_MS = 12_000L;\n"
              + "    private static final long "
              + "MAX_TILE_MS = 8_000L;\n"
              + "    private static final long "
              + "MAX_TOTAL_NEURAL_MS = 75_000L;"
          )

          s = s.replace(
              marker,
              guards,
              1
          )

          # =====================================================
          # Remove GPU -> CPU startup fallback.
          # =====================================================

          start_marker = (
              "            try {\n"
              "                runtime = "
              "new NeuralDenoiserRuntime(context, false);"
          )

          end_marker = (
              "\n"
              "            int[] tilePixels = "
              "new int[PLANE];"
          )

          start = s.find(start_marker)

          if start < 0:
              raise RuntimeError(
                  "GPU startup fallback block start not found"
              )

          end = s.find(
              end_marker,
              start
          )

          if end < 0:
              raise RuntimeError(
                  "GPU startup fallback block end not found"
              )

          gpu_startup = (
              "            long selfTestStart = "
              "System.nanoTime();\n"
              "\n"
              "            runtime = "
              "new NeuralDenoiserRuntime(context, false);\n"
              "\n"
              "            runtime.selfTest();\n"
              "\n"
              "            accelerator = "
              "runtime.getAcceleratorLabel();\n"
              "\n"
              "            long selfTestMs = "
              "Math.max(\n"
              "                    1L,\n"
              "                    Math.round(\n"
              "                            "
              "(System.nanoTime() - selfTestStart)\n"
              "                                    "
              "/ 1_000_000.0));\n"
              "\n"
              "            if "
              "(selfTestMs > MAX_SELF_TEST_MS) {\n"
              "                throw "
              "new IllegalStateException(\n"
              "                        "
              "\"GPU self-test exceeded "
              "performance guard: \"\n"
              "                                "
              "+ selfTestMs + \" ms\");\n"
              "            }\n"
          )

          s = (
              s[:start]
              + gpu_startup
              + s[end:]
          )

          # =====================================================
          # Remove per-tile CPU retry.
          # =====================================================

          tile_start_marker = (
              "                    float[] restored;"
          )

          tile_end_marker = (
              "                    renderCentral("
          )

          start = s.find(
              tile_start_marker
          )

          if start < 0:
              raise RuntimeError(
                  "Per-tile fallback block start not found"
              )

          end = s.find(
              tile_end_marker,
              start
          )

          if end < 0:
              raise RuntimeError(
                  "Per-tile fallback block end not found"
              )

          gpu_tile = (
              "                    "
              "long elapsedBeforeTileMs = Math.max(\n"
              "                            1L,\n"
              "                            Math.round(\n"
              "                                    "
              "(System.nanoTime() - start)\n"
              "                                            "
              "/ 1_000_000.0));\n"
              "\n"
              "                    if "
              "(tiles > 0\n"
              "                            && "
              "elapsedBeforeTileMs "
              "> MAX_TOTAL_NEURAL_MS) {\n"
              "                        throw "
              "new IllegalStateException(\n"
              "                                "
              "\"GPU neural pass exceeded total "
              "performance guard after \"\n"
              "                                        "
              "+ tiles + \" tiles: \"\n"
              "                                        "
              "+ elapsedBeforeTileMs + \" ms\");\n"
              "                    }\n"
              "\n"
              "                    long tileStart = "
              "System.nanoTime();\n"
              "\n"
              "                    float[] restored = "
              "runtime.run(input);\n"
              "\n"
              "                    long tileMs = "
              "Math.max(\n"
              "                            1L,\n"
              "                            Math.round(\n"
              "                                    "
              "(System.nanoTime() - tileStart)\n"
              "                                            "
              "/ 1_000_000.0));\n"
              "\n"
              "                    if "
              "(tileMs > MAX_TILE_MS) {\n"
              "                        throw "
              "new IllegalStateException(\n"
              "                                "
              "\"GPU tile exceeded performance guard: \"\n"
              "                                        "
              "+ tileMs + \" ms\");\n"
              "                    }\n"
          )

          s = (
              s[:start]
              + gpu_tile
              + s[end:]
          )

          # Remove no-longer-used fallback flag.
          s = s.replace(
              "        boolean gpuFallback = false;\n",
              ""
          )

          # Remove fallback wording from normal report.
          s = s.replace(
              '                accelerator, '
              'gpuFallback ? '
              '" (GPU output sanity fallback)" : "",',
              '                accelerator, "",'
          )

          if (
              "new NeuralDenoiserRuntime(context, true)"
              in s
          ):
              raise RuntimeError(
                  "CPU NAFNet fallback still present"
              )

          neural.write_text(s)

          # =====================================================
          # VERIFY PATCH CONTENT
          # =====================================================

          runtime_check = runtime_file.read_text()
          neural_check = neural.read_text()

          required_runtime = [
              "Environment.create(context)",
              "context.assets",
              "Accelerator.GPU",
              "NAFNet non-finite output",
              "nanCount",
              "positiveInfinityCount",
              "negativeInfinityCount",
          ]

          for item in required_runtime:
              if item not in runtime_check:
                  raise RuntimeError(
                      "Missing runtime component: "
                      + item
                  )

          if (
              "new NeuralDenoiserRuntime(context, true)"
              in neural_check
          ):
              raise RuntimeError(
                  "Unsafe CPU neural fallback detected"
              )

          print(
              "Photo Master AI v0.4.3 patch applied"
          )

          print(
              "Runtime path: "
              "assets -> Environment -> GPU CompiledModel"
          )

          print(
              "NCHW validation retained"
          )

          print(
              "NaN/+Inf/-Inf diagnostics enabled"
          )

          print(
              "Full-photo CPU fallback disabled"
          )

          print(
              "Per-tile CPU retry disabled"
          )

          print(
              "Performance guards retained"
          )
          PY

          grep -q \
            "versionCode 12" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "versionName '0.4.3'" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "Environment.create(context)" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiserRuntime.kt"

          grep -q \
            "NAFNet non-finite output" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiserRuntime.kt"

          grep -q \
            "MAX_TOTAL_NEURAL_MS = 75_000L" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          if grep -q \
            "new NeuralDenoiserRuntime(context, true)" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"
          then
            echo "::error::CPU NAFNet fallback still exists"
            exit 1
          fi

          echo "v0.4.3 source verification passed"

      - name: Fetch pinned NAFNet-SIDD model
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"

          ASSETS="$PROJECT/app/src/main/assets"

          MODEL="$ASSETS/nafnet_sidd_width32_fp16.tflite"

          mkdir -p "$ASSETS"

          URL='https://huggingface.co/litert-community/NAFNet-SIDD-width32-LiteRT/resolve/main/nafnet_sidd_width32_fp16.tflite?download=true'

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --output "$MODEL.tmp" \
            "$URL"

          mv \
            "$MODEL.tmp" \
            "$MODEL"

          test "$(stat -c%s "$MODEL")" -eq 62454048 || {
            echo "::error::Unexpected NAFNet model size"
            exit 1
          }

          echo \
          'f8fbaa422411683c53e802cf7cc7cf9be0a0de00886ad4af057232e26b172a0c  '"$MODEL" \
          | sha256sum -c -

          echo "Pinned NAFNet-SIDD model verified"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run restoration safety host checks
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf host-checks
          mkdir host-checks

          javac -d host-checks \
            app/src/main/java/com/dennis/photomasterai/DeepPixelRepair.java \
            app/src/main/java/com/dennis/photomasterai/RepairSafetyPolicy.java \
            app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java \
            app/src/main/java/com/dennis/photomasterai/SocialSourcePolicy.java \
            tools/DeepPixelRepairHostChecks.java \
            tools/RepairSafetyPolicyHostChecks.java \
            tools/NeuralDenoisePolicyHostChecks.java \
            tools/SocialSourcePolicyHostChecks.java

          java -cp host-checks \
            com.dennis.photomasterai.DeepPixelRepairHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.RepairSafetyPolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.NeuralDenoisePolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.SocialSourcePolicyHostChecks

      - name: Restore stable Photo Master debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photo-master-ai-debug-keystore-v1

      - name: Create signing key on first build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Photo Master AI,O=Dennis Photo Master,C=AU" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$SDK/cmdline-tools" \
                -type f \
                -name sdkmanager \
                | sort -V \
                | tail -n 1
            )"
          fi

          test -n "$SDKMANAGER" || {
            echo "::error::sdkmanager not found"
            exit 1
          }

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build v0.4.3 APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:assembleDebug \
            --stacktrace

      - name: Verify package and collect APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "::error::APK not found"
            exit 1
          }

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          AAPT="$SDK/build-tools/35.0.0/aapt"

          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -q \
            "package: name='com.dennis.photomasterai'"

          echo "$BADGING" \
            | grep -q \
            "versionCode='12'"

          echo "$BADGING" \
            | grep -q \
            "versionName='0.4.3'"

          unzip -l "$APK" \
            | grep -q \
            'assets/nafnet_sidd_width32_fp16.tflite'

          rm -rf artifact
          mkdir artifact

          OUT="artifact/PhotoMasterAI-v0.4.3-GPU-RUNTIME-AB.apk"

          cp \
            "$APK" \
            "$OUT"

          sha256sum "$OUT" \
            > "artifact/PhotoMasterAI-v0.4.3-GPU-RUNTIME-AB-SHA256.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMasterAI-v0.4.3-GPU-RUNTIME-AB
          path: |
            artifact/PhotoMasterAI-v0.4.3-GPU-RUNTIME-AB.apk
            artifact/PhotoMasterAI-v0.4.3-GPU-RUNTIME-AB-SHA256.txt
          if-no-files-found: error
          retention-days: 30
