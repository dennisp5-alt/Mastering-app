name: Publish Photo Master AI v0.4.33 Raw APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-photo-master-ai-v0.4.33-raw-apk.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Validate and publish raw v0.4.33 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SOURCE_RUN_ID: '37659980012'
      SOURCE_ARTIFACT: 'PhotoMasterAI-v0.4.33-NIGHT-LIGHT-QC-ACCOUNTING'
      RELEASE_TAG: 'photo-master-ai-v0.4.33-r1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download successful v0.4.33 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf release-input
          mkdir -p release-input

          gh run download "$SOURCE_RUN_ID"             --repo "${{ github.repository }}"             --name "$SOURCE_ARTIFACT"             --dir release-input

          echo "Downloaded files:"
          find release-input -maxdepth 2 -type f -printf '%p  %s bytes\n'

          APK="$(find release-input -type f -name '*.apk' | head -n 1)"

          test -n "$APK" || {
            echo "::error::APK not found in downloaded artifact"
            exit 1
          }

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Validate APK container integrity
        run: |
          set -euo pipefail

          echo "Testing APK ZIP structure"
          unzip -t "$APK"

          echo "APK SHA-256"
          sha256sum "$APK" | tee /tmp/apk-sha256.txt

          test "$(stat -c%s "$APK")" -gt 100000000 || {
            echo "::error::APK unexpectedly small"
            exit 1
          }

      - name: Configure Android SDK build tools
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi

          test -x "$SDKMANAGER" || {
            echo "::error::sdkmanager not found"
            exit 1
          }

          "$SDKMANAGER" "build-tools;35.0.0" "platform-tools"

      - name: Verify package, alignment and APK signature
        run: |
          set -euo pipefail

          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"

          "$BT/aapt" dump badging "$APK" | head -n 3

          "$BT/aapt" dump badging "$APK"             | head -n 1             | grep -q "package: name='com.dennis.photomasterai'"

          "$BT/aapt" dump badging "$APK"             | head -n 1             | grep -q "versionCode='42'"

          "$BT/aapt" dump badging "$APK"             | head -n 1             | grep -q "versionName='0.4.33'"

          "$BT/zipalign" -c -v 4 "$APK"

          "$BT/apksigner" verify             --verbose             --print-certs             "$APK"

          echo "APK structure, package metadata, alignment and signature all verified"

      - name: Prepare raw release asset
        run: |
          set -euo pipefail

          OUT="PhotoMasterAI-v0.4.33-NIGHT-LIGHT-QC-ACCOUNTING.apk"
          cp "$APK" "$OUT"

          sha256sum "$OUT" > "PhotoMasterAI-v0.4.33-SHA256.txt"

          cat > PhotoMasterAI-v0.4.33-RELEASE-NOTES.txt <<'EOF'
          Photo Master AI v0.4.33
          Night Light QC Accounting

          This is the raw APK release asset, provided directly instead of
          requiring extraction from the GitHub Actions artifact ZIP.

          Verified before release:
          - APK ZIP/container integrity
          - package com.dennis.photomasterai
          - versionCode 42
          - versionName 0.4.33
          - ZIP alignment
          - APK signing certificate/signature

          If Android reports that the app cannot be installed over an older
          build, uninstall the older Photo Master AI build first. That would
          indicate a signing-certificate mismatch with an older installation,
          not a corrupt APK.
          EOF

      - name: Publish raw APK GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG"             --repo "${{ github.repository }}" >/dev/null 2>&1
          then
            gh release upload "$RELEASE_TAG"               --repo "${{ github.repository }}"               --clobber               PhotoMasterAI-v0.4.33-NIGHT-LIGHT-QC-ACCOUNTING.apk               PhotoMasterAI-v0.4.33-SHA256.txt               PhotoMasterAI-v0.4.33-RELEASE-NOTES.txt
          else
            gh release create "$RELEASE_TAG"               --repo "${{ github.repository }}"               --title "Photo Master AI v0.4.33"               --notes-file PhotoMasterAI-v0.4.33-RELEASE-NOTES.txt               PhotoMasterAI-v0.4.33-NIGHT-LIGHT-QC-ACCOUNTING.apk               PhotoMasterAI-v0.4.33-SHA256.txt               PhotoMasterAI-v0.4.33-RELEASE-NOTES.txt
          fi

          echo "Raw APK release published"

# trigger raw APK validation/release
