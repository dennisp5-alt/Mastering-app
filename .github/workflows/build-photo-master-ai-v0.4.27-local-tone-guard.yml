name: Build Photo Master AI v0.4.27 Local Tone Guard

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-photo-master-ai-v0.4.27-local-tone-guard.yml'

permissions:
  contents: read

jobs:
  build:
    name: Photo Master AI v0.4.27 Local Tone Guard
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover exact successful v0.4.26 source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          V0426_COMMIT="9f53d9ee326b1ba3698217bde64faf28195f1483"

          git cat-file -e "${V0426_COMMIT}^{commit}" || {
            echo "::error::Successful v0.4.26 commit unavailable"
            exit 1
          }

          git show \
            "${V0426_COMMIT}:.github/workflows/build-photo-master-ai-v0.4.26-local-tone.yml" \
            > /tmp/v0426.yml

          python3 - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/v0426.yml').read_text().splitlines()

          def extract_step(name, destination):
              step = None
              for i, line in enumerate(lines):
                  if line.strip() == '- name: ' + name:
                      step = i
                      break
              if step is None:
                  raise RuntimeError('Workflow step not found: ' + name)

              run = None
              for i in range(step, len(lines)):
                  if lines[i].strip() == 'run: |':
                      run = i
                      break
                  if i > step and lines[i].startswith('      - name:'):
                      break
              if run is None:
                  raise RuntimeError('Run block not found: ' + name)

              body = []
              for line in lines[run + 1:]:
                  if line.startswith('      - name:'):
                      break
                  if not line.strip():
                      body.append('')
                  elif line.startswith('          '):
                      body.append(line[10:])
                  else:
                      raise RuntimeError(
                          'Unexpected indentation while extracting: ' + name
                      )

              Path(destination).write_text('\n'.join(body) + '\n')

          extract_step(
              'Recover exact successful v0.4.25 source',
              '/tmp/recover-v0425.sh'
          )
          extract_step(
              'Apply v0.4.26 Local Tone Intelligence',
              '/tmp/apply-v0426.sh'
          )
          PY

          bash /tmp/recover-v0425.sh

          PROJECT="$(
            find photomaster-v044-build \
              -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -printf '%h\n' \
              | head -n 1
          )"

          test -n "$PROJECT" || {
            echo "::error::Recovered project not found"
            exit 1
          }

          export PROJECT
          bash /tmp/apply-v0426.sh

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          grep -q "versionCode 35" "$PROJECT/app/build.gradle"
          grep -q "versionName '0.4.26'" "$PROJECT/app/build.gradle"
          grep -q "class LocalTonePolicy" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/LocalTonePolicy.java"
          grep -q "class LocalToneIntelligence" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/LocalToneIntelligence.java"
          grep -q "symmetricOpposingOverride" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/GeometryPolicy.java"

          echo "Exact successful v0.4.26 source recovered"

      - name: Apply v0.4.27 Local Tone safeguard refinement
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          project = Path(os.environ['PROJECT'])

          # VERSION
          build_file = project / 'app/build.gradle'
          build = build_file.read_text()

          if 'versionCode 35' not in build:
              raise RuntimeError('v0.4.26 versionCode not found')
          if "versionName '0.4.26'" not in build:
              raise RuntimeError('v0.4.26 versionName not found')

          build = build.replace('versionCode 35', 'versionCode 36', 1)
          build = build.replace(
              "versionName '0.4.26'",
              "versionName '0.4.27'",
              1
          )
          build_file.write_text(build)

          # -------------------------------------------------------------
          # LOCAL TONE POLICY
          # - retain all v0.4.26 thresholds except max edge delta
          # - tighten edge ceiling 0.055 -> 0.050
          # - expose exact QC failure reasons
          # -------------------------------------------------------------
          policy_file = project / (
              'app/src/main/java/com/dennis/photomasterai/'
              'LocalTonePolicy.java'
          )

          policy_file.write_text(r'''package com.dennis.photomasterai;

          import java.util.Locale;

          public final class LocalTonePolicy {

              private LocalTonePolicy() {
              }

              public static final class Plan {
                  public final boolean apply;
                  public final double shadowEv;
                  public final double highlightEv;
                  public final boolean brightSubjectDarkBackground;
                  public final String reason;

                  Plan(
                          boolean apply,
                          double shadowEv,
                          double highlightEv,
                          boolean brightSubjectDarkBackground,
                          String reason) {
                      this.apply = apply;
                      this.shadowEv = shadowEv;
                      this.highlightEv = highlightEv;
                      this.brightSubjectDarkBackground =
                              brightSubjectDarkBackground;
                      this.reason = reason;
                  }
              }

              public static final class QcResult {
                  public final boolean accepted;
                  public final String reason;

                  QcResult(
                          boolean accepted,
                          String reason) {
                      this.accepted = accepted;
                      this.reason = reason;
                  }
              }

              public static Plan plan(
                      double median,
                      double p10,
                      double p90,
                      double darkFraction,
                      double brightFraction,
                      double highlightFraction,
                      int recoverableShadowZones,
                      int protectedHighlightZones,
                      boolean hasSky,
                      boolean hasPerson,
                      boolean hasPlant) {

                  double dynamicRange =
                          Math.max(
                                  0.0,
                                  p90 - p10);

                  boolean brightSubjectDarkBackground =
                          median < 0.30
                                  && brightFraction >= 0.10
                                  && p90 >= 0.78;

                  double shadowEv = 0.0;
                  double highlightEv = 0.0;

                  if (recoverableShadowZones > 0) {
                      if (brightSubjectDarkBackground) {
                          shadowEv = 0.06;
                      } else if (median < 0.42
                              && dynamicRange >= 0.45) {
                          shadowEv = 0.14;
                      } else if (median < 0.58) {
                          shadowEv = 0.10;
                      } else {
                          shadowEv = 0.06;
                      }

                      if (hasSky) {
                          shadowEv =
                                  Math.min(
                                          shadowEv,
                                          0.12);
                      }

                      if (hasPerson) {
                          shadowEv =
                                  Math.min(
                                          shadowEv,
                                          0.12);
                      }

                      if (hasPlant
                              && brightSubjectDarkBackground) {
                          shadowEv =
                                  Math.min(
                                          shadowEv,
                                          0.06);
                      }
                  }

                  if (protectedHighlightZones > 0
                          || highlightFraction >= 0.004) {
                      highlightEv =
                              highlightFraction >= 0.015
                                      ? -0.08
                                      : -0.05;

                      if (brightSubjectDarkBackground) {
                          highlightEv =
                                  Math.min(
                                          highlightEv,
                                          -0.07);
                      }
                  }

                  shadowEv =
                          clamp(
                                  shadowEv,
                                  0.0,
                                  0.16);

                  highlightEv =
                          clamp(
                                  highlightEv,
                                  -0.10,
                                  0.0);

                  boolean apply =
                          shadowEv > 0.0
                                  || highlightEv < 0.0;

                  String reason;
                  if (!apply) {
                      reason =
                              "no recoverable local tone imbalance measured";
                  } else if (brightSubjectDarkBackground) {
                      reason =
                              "bright-subject/dark-background protection";
                  } else if (shadowEv > 0.0
                          && highlightEv < 0.0) {
                      reason =
                              "local shadow recovery plus highlight containment";
                  } else if (shadowEv > 0.0) {
                      reason =
                              "local shadow recovery";
                  } else {
                      reason =
                              "local highlight containment";
                  }

                  return new Plan(
                          apply,
                          shadowEv,
                          highlightEv,
                          brightSubjectDarkBackground,
                          reason);
              }

              public static QcResult evaluateCandidate(
                      double beforeDetail,
                      double afterDetail,
                      double beforeNoise,
                      double afterNoise,
                      double beforeChroma,
                      double afterChroma,
                      double beforeRinging,
                      double afterRinging,
                      double beforeMedian,
                      double afterMedian,
                      double beforeSat,
                      double afterSat,
                      double beforeShadowClip,
                      double afterShadowClip,
                      double beforeHighlightClip,
                      double afterHighlightClip,
                      double shadowTargetGain,
                      double highlightTargetGain,
                      double meanAbsoluteToneDelta,
                      double maxAbsoluteToneDelta,
                      double maxEdgeToneDelta) {

                  double detailRetention =
                          afterDetail
                                  / Math.max(
                                          1.0e-9,
                                          beforeDetail);

                  StringBuilder failures =
                          new StringBuilder();

                  boolean measurableBenefit =
                          shadowTargetGain >= 0.0025
                                  || highlightTargetGain >= 0.0015;

                  if (!measurableBenefit) {
                      appendFailure(
                              failures,
                              String.format(
                                      Locale.US,
                                      "target benefit too small "
                                              + "(shadow %.4f, highlight %.4f)",
                                      shadowTargetGain,
                                      highlightTargetGain));
                  }

                  if (detailRetention < 0.94) {
                      appendFailure(
                              failures,
                              String.format(
                                      Locale.US,
                                      "detail retention %.3f < 0.940",
                                      detailRetention));
                  }

                  if (afterNoise
                          > beforeNoise + 0.0015) {
                      appendFailure(
                              failures,
                              String.format(
                                      Locale.US,
                                      "noise %.4f -> %.4f exceeds +0.0015",
                                      beforeNoise,
                                      afterNoise));
                  }

                  if (afterChroma
                          > beforeChroma + 0.0015) {
                      appendFailure(
                              failures,
                              String.format(
                                      Locale.US,
                                      "chroma %.4f -> %.4f exceeds +0.0015",
                                      beforeChroma,
                                      afterChroma));
                  }

                  if (afterRinging
                          > Math.min(
                                  1.0,
                                  beforeRinging + 0.012)) {
                      appendFailure(
                              failures,
                              String.format(
                                      Locale.US,
                                      "ringing %.4f -> %.4f exceeds allowance",
                                      beforeRinging,
                                      afterRinging));
                  }

                  if (Math.abs(
                          afterMedian - beforeMedian)
                          > 0.035) {
                      appendFailure(
                              failures,
                              String.format(
                                      Locale.US,
                                      "median delta %.4f > 0.0350",
                                      Math.abs(
                                              afterMedian
                                                      - beforeMedian)));
                  }

                  if (Math.abs(
                          afterSat - beforeSat)
                          > 0.015) {
                      appendFailure(
                              failures,
                              String.format(
                                      Locale.US,
                                      "saturation delta %.4f > 0.0150",
                                      Math.abs(
                                              afterSat - beforeSat)));
                  }

                  if (afterShadowClip
                          > beforeShadowClip + 0.002) {
                      appendFailure(
                              failures,
                              String.format(
                                      Locale.US,
                                      "shadow clip %.4f -> %.4f exceeds +0.0020",
                                      beforeShadowClip,
                                      afterShadowClip));
                  }

                  if (afterHighlightClip
                          > beforeHighlightClip + 0.002) {
                      appendFailure(
                              failures,
                              String.format(
                                      Locale.US,
                                      "highlight clip %.4f -> %.4f exceeds +0.0020",
                                      beforeHighlightClip,
                                      afterHighlightClip));
                  }

                  if (meanAbsoluteToneDelta
                          > 0.035) {
                      appendFailure(
                              failures,
                              String.format(
                                      Locale.US,
                                      "mean tone delta %.4f > 0.0350",
                                      meanAbsoluteToneDelta));
                  }

                  if (maxAbsoluteToneDelta
                          > 0.075) {
                      appendFailure(
                              failures,
                              String.format(
                                      Locale.US,
                                      "max tone delta %.4f > 0.0750",
                                      maxAbsoluteToneDelta));
                  }

                  if (maxEdgeToneDelta
                          > 0.050) {
                      appendFailure(
                              failures,
                              String.format(
                                      Locale.US,
                                      "edge tone delta %.4f > 0.0500",
                                      maxEdgeToneDelta));
                  }

                  if (failures.length() == 0) {
                      return new QcResult(
                              true,
                              "all local tone QC limits passed");
                  }

                  return new QcResult(
                          false,
                          failures.toString());
              }

              public static boolean safeCandidate(
                      double beforeDetail,
                      double afterDetail,
                      double beforeNoise,
                      double afterNoise,
                      double beforeChroma,
                      double afterChroma,
                      double beforeRinging,
                      double afterRinging,
                      double beforeMedian,
                      double afterMedian,
                      double beforeSat,
                      double afterSat,
                      double beforeShadowClip,
                      double afterShadowClip,
                      double beforeHighlightClip,
                      double afterHighlightClip,
                      double shadowTargetGain,
                      double highlightTargetGain,
                      double meanAbsoluteToneDelta,
                      double maxAbsoluteToneDelta,
                      double maxEdgeToneDelta) {

                  return evaluateCandidate(
                          beforeDetail,
                          afterDetail,
                          beforeNoise,
                          afterNoise,
                          beforeChroma,
                          afterChroma,
                          beforeRinging,
                          afterRinging,
                          beforeMedian,
                          afterMedian,
                          beforeSat,
                          afterSat,
                          beforeShadowClip,
                          afterShadowClip,
                          beforeHighlightClip,
                          afterHighlightClip,
                          shadowTargetGain,
                          highlightTargetGain,
                          meanAbsoluteToneDelta,
                          maxAbsoluteToneDelta,
                          maxEdgeToneDelta)
                          .accepted;
              }

              private static void appendFailure(
                      StringBuilder failures,
                      String failure) {

                  if (failures.length() > 0) {
                      failures.append("; ");
                  }

                  failures.append(failure);
              }

              private static double clamp(
                      double value,
                      double minimum,
                      double maximum) {
                  return Math.max(
                          minimum,
                          Math.min(
                                  maximum,
                                  value));
              }
          }
          ''')

          # -------------------------------------------------------------
          # LOCAL TONE ENGINE REFINEMENT
          #
          # IMPORTANT:
          # v0.4.26 intentionally writes compact Java. Match that exact
          # successful source shape rather than assuming pretty formatting.
          # -------------------------------------------------------------
          engine_file = project / (
              'app/src/main/java/com/dennis/photomasterai/'
              'LocalToneIntelligence.java'
          )
          engine = engine_file.read_text()

          # Existing successful v0.4.26 source:
          # boolean sky=tags.contains("sky"), person=..., plant=...;
          sky_old = (
              'boolean sky=tags.contains("sky"), '
              'person=tags.contains("person"), '
              'plant=tags.contains("plant")'
              '||tags.contains("flower")'
              '||tags.contains("field")'
              '||tags.contains("foliage");'
          )

          sky_new = (
              'boolean sky=tags.contains("sky")'
              '||(sourceReport!=null'
              '&&sourceReport.toLowerCase(Locale.US).contains("sky-rich")), '
              'person=tags.contains("person"), '
              'plant=tags.contains("plant")'
              '||tags.contains("flower")'
              '||tags.contains("field")'
              '||tags.contains("foliage");'
          )

          if sky_old not in engine:
              raise RuntimeError(
                  'Exact successful v0.4.26 compact sky line not found'
              )

          engine = engine.replace(
              sky_old,
              sky_new,
              1
          )

          # Replace compact boolean safeCandidate(...) with diagnostic QcResult.
          safe_pattern = re.compile(
              r'boolean safe=LocalTonePolicy\.safeCandidate\(([^;]+)\);'
          )

          safe_match = safe_pattern.search(engine)

          if safe_match is None:
              raise RuntimeError(
                  'Exact successful v0.4.26 safeCandidate call not found'
              )

          safe_args = safe_match.group(1)

          engine = (
              engine[:safe_match.start()]
              + 'LocalTonePolicy.QcResult qc='
              + 'LocalTonePolicy.evaluateCandidate('
              + safe_args
              + ');'
              + engine[safe_match.end():]
          )

          rollback_old = (
              'if(!safe){ if(!cand.isRecycled())cand.recycle(); '
              'r.append("• Local tone ROLLED BACK — '
              'improvement/safety QC did not confirm a safe benefit\\n"); '
              'return new Outcome(mastered,before,false,r.toString()); }'
          )

          rollback_new = (
              'if(!qc.accepted){ '
              'if(!cand.isRecycled())cand.recycle(); '
              'r.append("• Local tone ROLLED BACK — QC rejected: ")'
              '.append(qc.reason).append("\\n"); '
              'return new Outcome(mastered,before,false,r.toString()); }'
          )

          if rollback_old not in engine:
              raise RuntimeError(
                  'Exact successful v0.4.26 rollback branch not found'
              )

          engine = engine.replace(
              rollback_old,
              rollback_new,
              1
          )

          # v0.4.26 compact EV line.
          ev_old = (
              'double sev=p.shadowEv*sw*edge, '
              'hev=p.highlightEv*hw*edge, '
              'ev=clamp(sev+hev,-0.10,0.16), '
              'ratio=Math.pow(2.0,ev);'
          )

          ev_new = (
              'double sev=p.shadowEv*sw*edge, '
              'hev=p.highlightEv*hw*edge; '
              'double ev=clamp(sev+hev,-0.10,0.16); '
              'ev=capEdgeToneDelta(lum,ev,grad); '
              'double ratio=Math.pow(2.0,ev);'
          )

          if ev_old not in engine:
              raise RuntimeError(
                  'Exact successful v0.4.26 compact EV line not found'
              )

          engine = engine.replace(
              ev_old,
              ev_new,
              1
          )

          helper_anchor = (
              'private static String extractTags(String report){'
          )

          if helper_anchor not in engine:
              raise RuntimeError(
                  'Exact successful v0.4.26 extractTags anchor not found'
              )

          edge_helper = r'''private static double capEdgeToneDelta(double lum,double ev,double grad){
                  if(grad<0.08||Math.abs(ev)<1.0e-9||lum<=1.0e-6)return ev;
                  final double maxEdgeLumaDelta=0.045;
                  if(ev>0.0){
                      double target=Math.min(0.995,lum+maxEdgeLumaDelta);
                      double maxEv=Math.log(target/lum)/Math.log(2.0);
                      return Math.min(ev,maxEv);
                  }
                  double target=Math.max(0.001,lum-maxEdgeLumaDelta);
                  double minEv=Math.log(target/lum)/Math.log(2.0);
                  return Math.max(ev,minEv);
              }
              '''

          engine = engine.replace(
              helper_anchor,
              edge_helper + helper_anchor,
              1
          )

          engine_file.write_text(engine)

          # -------------------------------------------------------------
          # POLICY HOST CHECKS
          # -------------------------------------------------------------
          host_file = project / (
              'tools/LocalTonePolicyHostChecks.java'
          )

          host_file.write_text(r'''package com.dennis.photomasterai;

          public final class LocalTonePolicyHostChecks {

              public static void main(
                      String[] args) {

                  LocalTonePolicy.Plan flower =
                          LocalTonePolicy.plan(
                                  0.17,
                                  0.03,
                                  0.94,
                                  0.58,
                                  0.20,
                                  0.02,
                                  44,
                                  18,
                                  false,
                                  false,
                                  true);

                  require(
                          flower.apply,
                          "flower pattern should create a tone candidate");

                  require(
                          flower.brightSubjectDarkBackground,
                          "flower pattern should trigger bright-subject protection");

                  require(
                          flower.shadowEv <= 0.06 + 1.0e-9,
                          "bright-subject pattern must cap shadow lift");

                  require(
                          flower.highlightEv <= -0.07,
                          "bright-subject pattern should contain highlights");

                  LocalTonePolicy.Plan sky =
                          LocalTonePolicy.plan(
                                  0.56,
                                  0.22,
                                  0.92,
                                  0.07,
                                  0.37,
                                  0.05,
                                  26,
                                  38,
                                  true,
                                  false,
                                  false);

                  require(
                          sky.shadowEv <= 0.12 + 1.0e-9,
                          "sky-aware plan must keep shadow lift conservative");

                  LocalTonePolicy.Plan empty =
                          LocalTonePolicy.plan(
                                  0.52,
                                  0.30,
                                  0.70,
                                  0.03,
                                  0.03,
                                  0.0,
                                  0,
                                  0,
                                  false,
                                  false,
                                  false);

                  require(
                          !empty.apply,
                          "balanced image with no eligible zones must be unchanged");

                  LocalTonePolicy.QcResult accepted =
                          LocalTonePolicy.evaluateCandidate(
                                  0.050,
                                  0.049,
                                  0.010,
                                  0.0105,
                                  0.020,
                                  0.0205,
                                  0.72,
                                  0.73,
                                  0.45,
                                  0.462,
                                  0.25,
                                  0.252,
                                  0.002,
                                  0.002,
                                  0.003,
                                  0.003,
                                  0.008,
                                  0.003,
                                  0.012,
                                  0.035,
                                  0.048);

                  require(
                          accepted.accepted,
                          "safe candidate below new edge ceiling should pass");

                  LocalTonePolicy.QcResult edgeRejected =
                          LocalTonePolicy.evaluateCandidate(
                                  0.050,
                                  0.050,
                                  0.010,
                                  0.010,
                                  0.020,
                                  0.020,
                                  0.72,
                                  0.72,
                                  0.45,
                                  0.46,
                                  0.25,
                                  0.25,
                                  0.002,
                                  0.002,
                                  0.003,
                                  0.003,
                                  0.008,
                                  0.003,
                                  0.010,
                                  0.040,
                                  0.0501);

                  require(
                          !edgeRejected.accepted,
                          "edge delta above 0.050 must fail");

                  require(
                          edgeRejected.reason.contains(
                                  "edge tone delta"),
                          "edge rejection must name exact failed criterion");

                  LocalTonePolicy.QcResult noiseRejected =
                          LocalTonePolicy.evaluateCandidate(
                                  0.050,
                                  0.050,
                                  0.010,
                                  0.013,
                                  0.020,
                                  0.020,
                                  0.72,
                                  0.72,
                                  0.45,
                                  0.46,
                                  0.25,
                                  0.25,
                                  0.002,
                                  0.002,
                                  0.003,
                                  0.003,
                                  0.008,
                                  0.003,
                                  0.010,
                                  0.030,
                                  0.025);

                  require(
                          !noiseRejected.accepted,
                          "noise regression must fail");

                  require(
                          noiseRejected.reason.contains(
                                  "noise"),
                          "noise rejection must name exact failed criterion");

                  System.out.println(
                          "LocalTonePolicyHostChecks passed");
              }

              private static void require(
                      boolean condition,
                      String message) {

                  if (!condition) {
                      throw new AssertionError(
                              message);
                  }
              }
          }
          ''')

          print(
              'v0.4.27 Local Tone safeguard refinement applied')
          print(
              'Edge QC ceiling tightened: 0.055 -> 0.050')
          print(
              'Edge transform movement capped at 0.045 before RGB quantisation')
          print(
              'sky-rich scene descriptor now activates Local Tone sky protection')
          print(
              'QC rollback now reports each failed criterion and measured value')
          print(
              'v0.4.26 tone strengths retained')
          print(
              'v0.4.25 geometry and all previous safety systems retained')
          PY

          grep -q "versionCode 36" "$PROJECT/app/build.gradle"
          grep -q "versionName '0.4.27'" "$PROJECT/app/build.gradle"
          grep -q "edge tone delta" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/LocalTonePolicy.java"
          grep -q "0.0500" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/LocalTonePolicy.java"
          grep -q "capEdgeToneDelta" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/LocalToneIntelligence.java"
          grep -q "maxEdgeLumaDelta=0.045" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/LocalToneIntelligence.java"
          grep -q "sky-rich" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/LocalToneIntelligence.java"
          grep -q "QC rejected:" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/LocalToneIntelligence.java"
          grep -q "symmetricOpposingOverride" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/GeometryPolicy.java"

      - name: Fetch pinned NAFNet-SIDD model
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.source.outputs.project }}"
          ASSETS="$PROJECT/app/src/main/assets"
          MODEL="$ASSETS/nafnet_sidd_width32_fp16.tflite"
          mkdir -p "$ASSETS"
          URL='https://huggingface.co/litert-community/NAFNet-SIDD-width32-LiteRT/resolve/main/nafnet_sidd_width32_fp16.tflite?download=true'
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 \
            --output "$MODEL.tmp" \
            "$URL"
          mv "$MODEL.tmp" "$MODEL"
          test "$(stat -c%s "$MODEL")" -eq 62454048 || {
            echo "::error::Unexpected NAFNet model size"
            exit 1
          }
          echo 'f8fbaa422411683c53e802cf7cc7cf9be0a0de00886ad4af057232e26b172a0c  '"$MODEL" \
            | sha256sum -c -

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run all safety host checks
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf host-checks
          mkdir host-checks
          javac -d host-checks \
            app/src/main/java/com/dennis/photomasterai/DeepPixelRepair.java \
            app/src/main/java/com/dennis/photomasterai/RepairSafetyPolicy.java \
            app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java \
            app/src/main/java/com/dennis/photomasterai/SocialSourcePolicy.java \
            app/src/main/java/com/dennis/photomasterai/NeuralIntegrityPolicy.java \
            app/src/main/java/com/dennis/photomasterai/OpticalFringePolicy.java \
            app/src/main/java/com/dennis/photomasterai/VignettingPolicy.java \
            app/src/main/java/com/dennis/photomasterai/PersonEvidencePolicy.java \
            app/src/main/java/com/dennis/photomasterai/HighRingFinishingPolicy.java \
            app/src/main/java/com/dennis/photomasterai/GeometryPolicy.java \
            app/src/main/java/com/dennis/photomasterai/LocalTonePolicy.java \
            tools/DeepPixelRepairHostChecks.java \
            tools/RepairSafetyPolicyHostChecks.java \
            tools/NeuralDenoisePolicyHostChecks.java \
            tools/SocialSourcePolicyHostChecks.java \
            tools/SmoothSurfaceGuardHostChecks.java \
            tools/NeuralIntegrityPolicyHostChecks.java \
            tools/OpticalFringePolicyHostChecks.java \
            tools/VignettingPolicyHostChecks.java \
            tools/PersonEvidencePolicyHostChecks.java \
            tools/HighBlendDetailGuardHostChecks.java \
            tools/HighRingFinishingPolicyHostChecks.java \
            tools/GeometryPolicyHostChecks.java \
            tools/LocalTonePolicyHostChecks.java
          java -cp host-checks com.dennis.photomasterai.DeepPixelRepairHostChecks
          java -cp host-checks com.dennis.photomasterai.RepairSafetyPolicyHostChecks
          java -cp host-checks com.dennis.photomasterai.NeuralDenoisePolicyHostChecks
          java -cp host-checks com.dennis.photomasterai.SocialSourcePolicyHostChecks
          java -cp host-checks com.dennis.photomasterai.SmoothSurfaceGuardHostChecks
          java -cp host-checks com.dennis.photomasterai.NeuralIntegrityPolicyHostChecks
          java -cp host-checks com.dennis.photomasterai.OpticalFringePolicyHostChecks
          java -cp host-checks com.dennis.photomasterai.VignettingPolicyHostChecks
          java -cp host-checks com.dennis.photomasterai.PersonEvidencePolicyHostChecks
          java -cp host-checks com.dennis.photomasterai.HighBlendDetailGuardHostChecks
          java -cp host-checks com.dennis.photomasterai.HighRingFinishingPolicyHostChecks
          java -cp host-checks com.dennis.photomasterai.GeometryPolicyHostChecks
          java -cp host-checks com.dennis.photomasterai.LocalTonePolicyHostChecks

      - name: Restore stable Photo Master debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photo-master-ai-debug-keystore-v1

      - name: Create signing key on first build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Photo Master AI,O=Dennis Photo Master,C=AU" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$SDK/cmdline-tools" \
                -type f \
                -name 'sdkmanager' \
                | sort -V \
                | tail -n 1
            )"
          fi
          test -n "$SDKMANAGER" || {
            echo "::error::sdkmanager not found"
            exit 1
          }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build v0.4.27 APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace

      - name: Verify package and prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.source.outputs.project }}"
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || {
            echo "::error::APK not found"
            exit 1
          }

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK/build-tools/35.0.0/aapt"

          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='com.dennis.photomasterai'"
          echo "$BADGING" | grep -q "versionCode='36'"
          echo "$BADGING" | grep -q "versionName='0.4.27'"

          unzip -l "$APK" \
            | grep -q 'assets/nafnet_sidd_width32_fp16.tflite'

          rm -rf artifact
          mkdir artifact

          OUT="artifact/PhotoMasterAI-v0.4.27-LOCAL-TONE-GUARD.apk"
          cp "$APK" "$OUT"

          sha256sum "$OUT" \
            > "artifact/PhotoMasterAI-v0.4.27-LOCAL-TONE-GUARD-SHA256.txt"

          cat > "artifact/PhotoMasterAI-v0.4.27-Notes.txt" <<'EOF'
          Photo Master AI — v0.4.27 Local Tone Safeguard Refinement

          Version: 0.4.27
          versionCode: 36

          BASELINE
          Exact successful v0.4.26 source / run 37591792545.

          VALIDATED v0.4.26 LOCAL TONE CASES
          - aircraft: useful local tone candidate accepted
          - night scooter: candidate correctly rolled back
          - bright white flower / dark foliage:
            bright-subject protection worked and candidate accepted
          - indoor room: restrained local tone candidate accepted

          NEW
          - Local Tone edge QC ceiling tightened from 0.055 to 0.050
          - hard-edge luminance movement capped at 0.045 before RGB
            quantisation so useful candidates can be restrained rather than
            merely rejected at the tighter QC limit
          - existing SCENE "sky-rich" classification now activates sky
            protection even when the AI label list only says vehicle/building
          - Local Tone rollback report now names every failed QC criterion
            with measured values
          - v0.4.26 tone strengths otherwise unchanged

          RETAINED
          - bright-subject/dark-background protection
          - deep-black protection
          - foliage protection
          - warm/skin-like protection when person evidence exists
          - preserve-source sRGB / Display P3 handling
          - validated v0.4.25 Geometry Intelligence
          - high-ring finishing guard
          - NAFNet-SIDD / OpenCL neural denoise safeguards
          - optics / vignetting / final shadow-integrity safeguards
          - background and screen-off processing
          - JPEG quality 100

          FIRST TESTS
          1. Aircraft:
             sky protection should now say ACTIVE.
             Max edge delta should be <= 0.050.
          2. Flower:
             bright-subject protection and foliage protection should remain.
          3. Night scooter:
             candidate may still roll back; report must give exact reason.
          4. Indoor room:
             mild accepted correction should remain natural.
          5. Chinchilla building:
             v0.4.25 keystone correction must remain unchanged.
          EOF

      - name: Upload APK and continuation notes
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMasterAI-v0.4.27-LOCAL-TONE-GUARD
          path: |
            artifact/PhotoMasterAI-v0.4.27-LOCAL-TONE-GUARD.apk
            artifact/PhotoMasterAI-v0.4.27-LOCAL-TONE-GUARD-SHA256.txt
            artifact/PhotoMasterAI-v0.4.27-Notes.txt
          if-no-files-found: error
          retention-days: 30
