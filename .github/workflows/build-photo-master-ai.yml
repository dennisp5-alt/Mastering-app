name: Build Photo Master AI v0.1.0 EXPERIMENTAL

on:
  workflow_dispatch:
  push:
    paths:
      - 'PhotoMasterAI-v0.1.0-EXPERIMENTAL-GitHubBuildSource.zip'
      - '.github/workflows/build-photo-master-ai.yml'

permissions:
  contents: read

jobs:
  build:
    name: Photo Master AI v0.1.0 EXPERIMENTAL
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="PhotoMasterAI-v0.1.0-EXPERIMENTAL-GitHubBuildSource.zip"
          test -f "$ZIP" || { echo "::error::Missing $ZIP"; exit 1; }
          unzip -t "$ZIP"
          rm -rf photo-master-build
          mkdir photo-master-build
          unzip -q "$ZIP" -d photo-master-build
          SETTINGS="$(find photo-master-build -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1 || true)"
          test -n "$SETTINGS" || { echo "::error::settings.gradle not found"; exit 1; }
          PROJECT="$(dirname "$SETTINGS")"
          test -f "$PROJECT/app/build.gradle" || { echo "::error::app/build.gradle not found"; exit 1; }
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable Photo Master debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photo-master-ai-debug-keystore-v1

      - name: Create signing key on first build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Photo Master AI,O=Dennis Experimental,C=AU" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1 || true)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo "::error::sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace

      - name: Verify package and collect APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.source.outputs.project }}"
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "::error::APK not found"; exit 1; }
          AAPT="${ANDROID_SDK_ROOT}/build-tools/34.0.0/aapt"
          BADGING="$($AAPT dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='com.dennis.photomasterai'" || { echo "::error::Unexpected package"; exit 1; }
          echo "$BADGING" | grep -q "versionName='0.1.0'" || { echo "::error::Unexpected version"; exit 1; }
          rm -rf artifact
          mkdir artifact
          cp "$APK" artifact/PhotoMasterAI-v0.1.0-EXPERIMENTAL.apk
          sha256sum artifact/PhotoMasterAI-v0.1.0-EXPERIMENTAL.apk > artifact/PhotoMasterAI-v0.1.0-EXPERIMENTAL-SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMasterAI-v0.1.0-EXPERIMENTAL
          path: |
            artifact/PhotoMasterAI-v0.1.0-EXPERIMENTAL.apk
            artifact/PhotoMasterAI-v0.1.0-EXPERIMENTAL-SHA256.txt
          if-no-files-found: error
          retention-days: 30
