name: Dennis AI Music Studio v0.2.1 Android APK
on:
  push:
    branches: [dennis-ai-music-v0]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER" || { echo 'Android SDK command-line tools missing'; exit 1; }
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test trained model and synthesiser
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build experimental APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Dennis-AI-Music-Studio-v0.2.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
