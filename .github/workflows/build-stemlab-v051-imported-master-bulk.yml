name: Stem Lab v0.5.1 Imported Master Trial B BULK TEST (isolated)

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/stemlab-v051-imported-master-bulk
    paths:
      - .github/workflows/build-stemlab-v051-imported-master-bulk.yml
      - experiments/dennis-stem-lab-v051-trialb-only/**
      - experiments/dennis-stemlab-imported-trialb/**

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated experiment
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 34
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Restore pinned v0.15.7 engine + exact v0.5.0 integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p restored project
          gh run download 37899462151 --repo dennisp5-alt/Mastering-app --name DennisAiMasteringLab-v0.15.7-Source --dir restored
          printf '%s  %s\n' '0bc7390fba6db3fa746d3a554555bbba9e7745068276929b529924426080eede' 'restored/DennisAiMasteringLab-v0.15.7-GitHubBuildSource.zip' | sha256sum -c -
          unzip -q restored/DennisAiMasteringLab-v0.15.7-GitHubBuildSource.zip -d project
          grep -q "versionName '0.15.7'" project/app/build.gradle
          base64 --decode experiments/dennis-stem-lab-modern-v050/v050-modern.patch.gz.b64 | gzip -dc > /tmp/v050.patch
          printf '%s  %s\n' '4f3a83cc2ce4c45daf4d2adde4b07d7ea1eb18afd81f41d1cf768e86c519b8fd' '/tmp/v050.patch' | sha256sum -c -
          src=project/app/src/main/java/com/dennis/aimasteringlab
          find "$src" -maxdepth 1 -name '*.java' ! -name 'StudioActivity.java' -type f | sort | xargs sha256sum > /tmp/trusted-v157-engine.sha256
          patch --batch --fuzz=0 -p1 -d project < /tmp/v050.patch
          sha256sum -c /tmp/trusted-v157-engine.sha256
          grep -q "versionName '0.5.0-dev'" project/app/build.gradle
      - name: Apply isolated v0.5.1 bulk experiment patch
        run: |
          base64 --decode experiments/dennis-stem-lab-bulk-qc-v051/v051-source.patch.gz.b64 | gzip -dc > /tmp/v051.patch
          printf '%s  %s\n' 'd1e813c049cff960f6ef41ccd59e9a7ada45ea289155c5b768db1c7c2e01af9c' '/tmp/v051.patch' | sha256sum -c -
          patch --batch --fuzz=0 -p1 -d project < /tmp/v051.patch
          grep -q "versionName '0.5.1-dev'" project/app/build.gradle
          test -f project/app/src/main/java/com/dennis/aimasteringlab/StudioBulkExperiment.java
          # Only the dedicated v0.5.1 experiment may touch the new post-master edits/UI.
          ! grep -q '^+++ .*MasterRenderer.java' /tmp/v051.patch
          ! grep -q '^+++ .*FullAiMasteringEngine.java' /tmp/v051.patch
          ! grep -q '^+++ .*StudioPipeline.java' /tmp/v051.patch
      - name: Keep the exact v0.5.1 delivery engine and allow only Trial B
        run: |
          python3 experiments/dennis-stem-lab-v051-trialb-only/apply_b_only.py project
          sha256sum -c /tmp/trusted-v157-engine.sha256
          python3 - <<'PY'
          from pathlib import Path
          s=Path('project/app/src/main/java/com/dennis/aimasteringlab/StudioBulkExperiment.java').read_text()
          ui=Path('project/app/src/main/java/com/dennis/aimasteringlab/StudioActivity.java').read_text()
          assert 'PRESENCE_CONTROL' not in s, 'Original Trial A generator should not exist'
          assert s.count('{"LOW_MID_CONTROL", "Trial B"')==1
          assert 'edit("DYNAMIC_EQ", 260, 0.95, -0.55, -24' in s
          assert 'edit("DYNAMIC_EQ", 3500, 1.2, -0.45, -30' in s
          assert 'trial_original_title' in s
          assert 'CREATE TRIAL B FOR SELECTED SONGS' in ui
          assert 'SAVE TRIAL B WAV' in ui
          assert 'title+"_TrialB_24bit-48kHz.wav"' in ui
          assert 'CREATE TWO TEST VERSIONS' not in ui
          print('TRIAL_B_ONLY_APP_CONFIG_PASS')
          PY
          sed -i "s/versionName '0.5.1-dev'/versionName '0.5.1-trialb-only'/" project/app/build.gradle
          grep -q "versionName '0.5.1-trialb-only'" project/app/build.gradle
      - name: Preserve installed v0.5.0 with independent trial package
        run: |
          sed -i "s/applicationId 'com.dennis.stemlab.modern'/applicationId 'com.dennis.stemlab.trialbonly051'/" project/app/build.gradle
          sed -i 's/android:label="Dennis Stem Lab Modern DEV"/android:label="Stem Lab Trial B 5.1"/' project/app/src/main/AndroidManifest.xml
          grep -q "applicationId 'com.dennis.stemlab.trialbonly051'" project/app/build.gradle
          grep -q 'android:label="Stem Lab Trial B 5.1"' project/app/src/main/AndroidManifest.xml
      - name: Add isolated import-master finishing path without modifying locked DSP
        run: |
          python3 experiments/dennis-stemlab-imported-trialb/apply_import_mode.py project
          sha256sum -c /tmp/trusted-v157-engine.sha256
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('project/app/src/main/java/com/dennis/aimasteringlab')
          new=(root/'ImportedMasterTrialB.java').read_text()
          ui=(root/'StudioActivity.java').read_text()
          original=(root/'StudioBulkExperiment.java').read_text()
          assert 'StudioPipeline.master(' not in new and 'StudioPipeline.finish(' not in new
          assert 'StudioAudio.edit(source, a, r, edited, progress)' in new
          assert 'MasterRenderer.renderAttempt(' in new
          assert 'gain, false,' in new, 'No additional limiter permitted'
          assert all(s in new for s in ['band(260, .95, -.55, -24', 'band(3500, 1.2, -.45, -30'])
          assert 'trial_b_no_limiter' in new and 'source_hash' in new
          assert 'source_meters' in new and 'master_hash' in new
          assert 'no_second_mastering' in new
          assert 'IMPORTED MASTER → TRIAL B (TEST)' in ui
          assert 'IMPORTED_MASTER_TRIAL_B' not in original
          assert 'CREATE TRIAL B FOR SELECTED SONGS' in ui
          assert 'PRESENCE_CONTROL' not in original
          assert 'trial_original_title' in ui
          assert "applicationId 'com.dennis.stemlab.importtrialb051'" in Path('project/app/build.gradle').read_text()
          print('PASS: isolated imported-final WAV path; original project-based Trial B preserved')
          PY
      - name: Enable bulk imported-master Trial B and selected project controls
        run: |
          base64 --decode experiments/dennis-stemlab-imported-trialb/apply_bulk_mode.py.gz.b64 | gzip -dc > /tmp/apply_bulk_mode.py
          printf '%s  %s\n' '895675611254a1f4f6ce1d6be9e3a7bc38e2591402984d7fb76d750171b10660' '/tmp/apply_bulk_mode.py' | sha256sum -c -
          python3 /tmp/apply_bulk_mode.py project
          sha256sum -c /tmp/trusted-v157-engine.sha256
          python3 - <<'PY'
          from pathlib import Path
          src=Path("project/app/src/main/java/com/dennis/aimasteringlab")
          ui=(src/"StudioActivity.java").read_text()
          queue=(src/"StudioQueue.java").read_text()
          imported=(src/"ImportedMasterTrialB.java").read_text()
          selected=(src/"StudioSelectedProjects.java").read_text()
          original=(src/"StudioBulkExperiment.java").read_text()
          assert "BULK IMPORT MASTERED WAVS" in ui and "CLEAR SELECTED PROJECTS" in ui
          assert "StudioSelectedProjects.exportMasters" in ui and "StudioSelectedProjects.delete" in ui
          assert "ImportedMasterTrialB.renderStaged(p,progress)" in queue
          assert "return;" in queue.split("ImportedMasterTrialB.renderStaged(p,progress)",1)[1].split("}",1)[0]
          assert "StudioPipeline.master(" not in imported and "StudioPipeline.finish(" not in imported
          assert "StudioAudio.edit(source, a, r, edited, progress)" in imported
          assert all(x in imported for x in ['band(260, .95, -.55, -24', 'band(3500, 1.2, -.45, -30'])
          assert "validFile(\"source\", \"source_hash\")" in imported
          assert "validFile(\"master\",\"master_hash\")" in selected
          assert "PRESENCE_CONTROL" not in original
          print("BULK_TRIAL_B_SAFETY_SOURCE_PASS")
          PY
          sed -i "s/versionCode 6/versionCode 7/; s/versionName '0.5.1-trialb-import-test'/versionName '0.5.1-trialb-import-bulk-test'/" project/app/build.gradle
          grep -q "applicationId 'com.dennis.stemlab.importtrialb051'" project/app/build.gradle
          grep -q "versionName '0.5.1-trialb-import-bulk-test'" project/app/build.gradle
          sed -i 's/Stem Lab Trial B Import TEST/Stem Lab Trial B Bulk TEST/' project/app/src/main/AndroidManifest.xml
          grep -q "Stem Lab Trial B Bulk TEST" project/app/src/main/AndroidManifest.xml
      - name: Run original v0.5.1 Trial B-only host regressions
        run: |
          mkdir -p host-classes
          javac -encoding UTF-8 -d host-classes \
            -sourcepath project/app/src/main/java:experiments/dennis-stem-lab-bulk-qc-v051/host_tests:project/tests \
            project/app/src/main/java/com/dennis/aimasteringlab/StudioBulkExperiment.java \
            project/app/src/main/java/com/dennis/aimasteringlab/StudioProject.java \
            project/app/src/main/java/com/dennis/aimasteringlab/StudioRecipe.java \
            project/app/src/main/java/com/dennis/aimasteringlab/Hashing.java \
            experiments/dennis-stem-lab-bulk-qc-v051/host_tests/com/dennis/aimasteringlab/StudioAudio.java \
            experiments/dennis-stem-lab-v051-trialb-only/TrialBOnlyRecoveryHarness.java \
            project/tests/org/json/*.java
          java -cp host-classes com.dennis.aimasteringlab.TrialBOnlyRecoveryHarness
      - name: Generate original stem import safety fixtures
        run: |
          mkdir -p host-fixtures host-v050
          python3 - <<'PY'
          import array, math, pathlib, sys, wave, zipfile
          base=pathlib.Path('host-fixtures')
          sr=48000
          for name,freq,level in [('Vocals.wav',231,0.16),('Instrumental.wav',110,0.22)]:
              buf=array.array('h')
              for k in range(sr*18):
                  v=int(32767*level*math.sin((2*math.pi*freq*k)/sr))
                  buf.extend([v,v])
              if sys.byteorder!='little': buf.byteswap()
              with wave.open(str(base/name),'wb') as wav:
                  wav.setnchannels(2);wav.setsampwidth(2);wav.setframerate(sr);wav.writeframes(buf.tobytes())
          with zipfile.ZipFile(base/'safe.zip','w',compression=zipfile.ZIP_DEFLATED) as z:
              for name in ('Vocals.wav','Instrumental.wav'): z.write(base/name,name)
          with zipfile.ZipFile(base/'unsafe.zip','w',compression=zipfile.ZIP_DEFLATED) as z:
              z.write(base/'Vocals.wav','../Vocals.wav')
          PY
      - name: Verify original two-stem import tests
        run: |
          mkdir -p host-v050
          javac -encoding UTF-8 -d host-v050 \
            -sourcepath project/app/src/main/java:project/tests \
            project/app/src/main/java/com/dennis/aimasteringlab/StemOnlyImport.java \
            project/app/src/main/java/com/dennis/aimasteringlab/StemPremixBuilder.java \
            project/app/src/main/java/com/dennis/aimasteringlab/StemStudioPreflight.java \
            project/tests/V050StemOnlyIntegrationHarness.java \
            project/tests/BuildConfig.java project/tests/org/json/*.java
          java -cp host-v050 com.dennis.aimasteringlab.V050StemOnlyIntegrationHarness host-fixtures/safe.zip host-fixtures/unsafe.zip
      - name: Build isolated Android Trial B only APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug
      - name: Package checksum-verified APK and source
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk StemLab-v0.5.1-ImportedMaster-TrialB-BULK-TEST.apk
          unzip -tq StemLab-v0.5.1-ImportedMaster-TrialB-BULK-TEST.apk
          (cd project && zip -qr ../StemLab-v0.5.1-ImportedMaster-TrialB-BULK-TEST-Source.zip . -x '.gradle/*' 'build/*' 'app/build/*' '*.jks' '*.keystore' '*.apk')
          sha256sum StemLab-v0.5.1-ImportedMaster-TrialB-BULK-TEST.apk StemLab-v0.5.1-ImportedMaster-TrialB-BULK-TEST-Source.zip > StemLab-v0.5.1-ImportedMaster-TrialB-BULK-TEST-SHA256.txt
      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: StemLab-v0.5.1-ImportedMaster-TrialB-BULK-TEST-APK
          path: |
            StemLab-v0.5.1-ImportedMaster-TrialB-BULK-TEST.apk
            StemLab-v0.5.1-ImportedMaster-TrialB-BULK-TEST-SHA256.txt
          retention-days: 30
      - name: Upload recoverable source
        uses: actions/upload-artifact@v4
        with:
          name: StemLab-v0.5.1-ImportedMaster-TrialB-BULK-TEST-Source
          path: |
            StemLab-v0.5.1-ImportedMaster-TrialB-BULK-TEST-Source.zip
            StemLab-v0.5.1-ImportedMaster-TrialB-BULK-TEST-SHA256.txt
          retention-days: 30
