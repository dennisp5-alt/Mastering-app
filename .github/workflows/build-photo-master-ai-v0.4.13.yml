name: Photo Master AI v0.4.13 Patch Source

on:
  workflow_dispatch:

jobs:
  patch-source:
    if: ${{ false }}
    runs-on: ubuntu-latest

    steps:
      - name: Apply v0.4.13 terminal guard
        shell: bash
        env:
          PROJECT: patch-source-only
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os

          project = Path(os.environ["PROJECT"])

          # VERSION
          build_file = project / "app/build.gradle"
          build = build_file.read_text()

          if "versionCode 21" not in build:
              raise RuntimeError("v0.4.12 versionCode not found")

          if "versionName '0.4.12'" not in build:
              raise RuntimeError("v0.4.12 versionName not found")

          build = build.replace(
              "versionCode 21",
              "versionCode 22",
              1
          )

          build = build.replace(
              "versionName '0.4.12'",
              "versionName '0.4.13'",
              1
          )

          build_file.write_text(build)

          # =====================================================
          # STOP USELESS LOWER-BLEND TRIALS AT METRIC FLOOR
          # =====================================================

          neural_file = project / (
              "app/src/main/java/com/dennis/"
              "photomasterai/NeuralDenoiser.java"
          )

          neural = neural_file.read_text()

          old_loop = "\n".join([
              "            double[] adaptiveScales = {",
              "                    0.80, 0.65, 0.50, 0.38,",
              "                    0.30, 0.24, 0.20, 0.16",
              "            };",
              "",
              "            for (double scale : adaptiveScales) {",
          ])

          new_loop = "\n".join([
              "            double[] adaptiveScales = {",
              "                    0.80, 0.65, 0.50, 0.38,",
              "                    0.30, 0.24, 0.20, 0.16",
              "            };",
              "",
              "            double previousTrialNoise = after.noise;",
              "            double previousTrialChroma = after.flatChromaNoise;",
              "            double previousTrialDetail = after.detail;",
              "            double previousTrialRinging = after.ringing;",
              "",
              "            for (double scale : adaptiveScales) {",
          ])

          if old_loop not in neural:
              raise RuntimeError(
                  "Adaptive loop anchor not found"
              )

          neural = neural.replace(
              old_loop,
              new_loop,
              1
          )

          loop_pos = neural.find(
              "            for (double scale : adaptiveScales) {"
          )

          recycle_pos = neural.find(
              "                trial.recycle();",
              loop_pos
          )

          if loop_pos < 0 or recycle_pos < 0:
              raise RuntimeError(
                  "Adaptive trial recycle anchor not found"
              )

          floor_guard = "\n".join([
              "                boolean smoothMetricFloor =",
              "                        NeuralDenoisePolicy.isSmoothSurfaceDecision(decision)",
              "                                && !trialQuality.accepted",
              "                                && Math.abs(trialAfter.noise - previousTrialNoise) <= 0.00010",
              "                                && Math.abs(trialAfter.flatChromaNoise - previousTrialChroma) <= 0.00010",
              "                                && Math.abs(trialAfter.detail - previousTrialDetail) <= 0.00010",
              "                                && Math.abs(trialAfter.ringing - previousTrialRinging) <= 0.0015;",
              "",
              "                if (smoothMetricFloor) {",
              "                    adaptiveTrace.append(",
              "                            \" -> smooth metric floor; lower blends skipped\");",
              "                    trial.recycle();",
              "                    break;",
              "                }",
              "",
              "                previousTrialNoise = trialAfter.noise;",
              "                previousTrialChroma = trialAfter.flatChromaNoise;",
              "                previousTrialDetail = trialAfter.detail;",
              "                previousTrialRinging = trialAfter.ringing;",
              "",
          ])

          neural = (
              neural[:recycle_pos]
              + floor_guard
              + neural[recycle_pos:]
          )

          neural_file.write_text(neural)

          # =====================================================
          # TERMINAL SMOOTH-SCENE STATE
          # =====================================================

          engine_file = project / (
              "app/src/main/java/com/dennis/"
              "photomasterai/PhotoMasterEngine.java"
          )

          engine = engine_file.read_text()

          old_fields = "\n".join([
              "        boolean smoothSurfaceProtection;",
              "        boolean conservativeOutputRetained;",
              "",
              "        double postNeuralRingAllowance;",
          ])

          new_fields = "\n".join([
              "        boolean smoothSurfaceProtection;",
              "        boolean conservativeOutputRetained;",
              "        boolean smoothSurfaceTerminalGuard;",
              "",
              "        double postNeuralRingAllowance;",
          ])

          if old_fields not in engine:
              raise RuntimeError(
                  "Terminal field anchor not found"
              )

          engine = engine.replace(
              old_fields,
              new_fields,
              1
          )

          old_default = "\n".join([
              "        return master(",
              "                source,",
              "                a,",
              "                mode,",
              "                ai,",
              "                social,",
              "                a,",
              "                false);",
          ])

          new_default = "\n".join([
              "        return master(",
              "                source,",
              "                a,",
              "                mode,",
              "                ai,",
              "                social,",
              "                a,",
              "                false,",
              "                false);",
          ])

          if old_default not in engine:
              raise RuntimeError(
                  "Default master wrapper not found"
              )

          engine = engine.replace(
              old_default,
              new_default,
              1
          )

          old_extended = "\n".join([
              "    public static Result master(Bitmap source, PhotoAnalysis a, Mode mode,",
              "                                AiVisionAnalyzer.Result ai,",
              "                                SocialSourceAnalyzer.Result social,",
              "                                PhotoAnalysis originalBaseline,",
              "                                boolean neuralAccepted) {",
              "        Params p = buildParams(a, mode,",
              "                ai == null ? AiVisionAnalyzer.Result.none() : ai,",
              "                social == null ? SocialSourceAnalyzer.Result.none() : social);",
          ])

          new_extended = "\n".join([
              "    public static Result master(Bitmap source, PhotoAnalysis a, Mode mode,",
              "                                AiVisionAnalyzer.Result ai,",
              "                                SocialSourceAnalyzer.Result social,",
              "                                PhotoAnalysis originalBaseline,",
              "                                boolean neuralAccepted) {",
              "        return master(",
              "                source, a, mode, ai, social, originalBaseline,",
              "                neuralAccepted, false);",
              "    }",
              "",
              "    public static Result master(Bitmap source, PhotoAnalysis a, Mode mode,",
              "                                AiVisionAnalyzer.Result ai,",
              "                                SocialSourceAnalyzer.Result social,",
              "                                PhotoAnalysis originalBaseline,",
              "                                boolean neuralAccepted,",
              "                                boolean neuralQcRejected) {",
              "        Params p = buildParams(a, mode,",
              "                ai == null ? AiVisionAnalyzer.Result.none() : ai,",
              "                social == null ? SocialSourceAnalyzer.Result.none() : social);",
          ])

          if old_extended not in engine:
              raise RuntimeError(
                  "Extended master method not found"
              )

          engine = engine.replace(
              old_extended,
              new_extended,
              1
          )

          old_call = "\n".join([
              "        configurePostNeuralCoordination(",
              "                p,",
              "                a,",
              "                originalBaseline,",
              "                neuralAccepted);",
          ])

          new_call = "\n".join([
              "        configurePostNeuralCoordination(",
              "                p,",
              "                a,",
              "                originalBaseline,",
              "                neuralAccepted,",
              "                neuralQcRejected);",
          ])

          if old_call not in engine:
              raise RuntimeError(
                  "Coordination call not found"
              )

          engine = engine.replace(
              old_call,
              new_call,
              1
          )

          old_sig = "\n".join([
              "    private static void configurePostNeuralCoordination(",
              "            Params p,",
              "            PhotoAnalysis checkpoint,",
              "            PhotoAnalysis originalBaseline,",
              "            boolean neuralAccepted) {",
          ])

          new_sig = "\n".join([
              "    private static void configurePostNeuralCoordination(",
              "            Params p,",
              "            PhotoAnalysis checkpoint,",
              "            PhotoAnalysis originalBaseline,",
              "            boolean neuralAccepted,",
              "            boolean neuralQcRejected) {",
          ])

          if old_sig not in engine:
              raise RuntimeError(
                  "Coordination signature not found"
              )

          engine = engine.replace(
              old_sig,
              new_sig,
              1
          )

          config_pos = engine.find(
              "    private static void configurePostNeuralCoordination("
          )

          old_return = "\n".join([
              "        if (!neuralAccepted) {",
              "            return;",
              "        }",
          ])

          return_pos = engine.find(
              old_return,
              config_pos
          )

          if return_pos < 0:
              raise RuntimeError(
                  "Terminal insertion point not found"
              )

          terminal = "\n".join([
              "        if (p.smoothSurfaceProtection",
              "                && neuralQcRejected) {",
              "",
              "            p.smoothSurfaceTerminalGuard = true;",
              "",
              "            p.repairLuma = 0.0;",
              "            p.repairChroma = 0.0;",
              "            p.repairDeblock = 0.0;",
              "            p.repairDetail = 0.0;",
              "",
              "            p.denoise = 0.0;",
              "            p.sharpen = 0.0;",
              "            p.microContrast = 0.0;",
              "            p.aiSubjectSharpen = 0.0;",
              "",
              "            p.exposureEv = 0.0;",
              "            p.shadowLift = 0.0;",
              "            p.highlightProtect = 0.0;",
              "            p.contrast = 1.0;",
              "            p.gamma = 1.0;",
              "",
              "            p.saturation = 1.0;",
              "            p.vibrance = 0.0;",
              "            p.greenControl = 1.0;",
              "            p.blueControl = 1.0;",
              "",
              "            p.wbR = 1.0;",
              "            p.wbG = 1.0;",
              "            p.wbB = 1.0;",
              "",
              "            p.aiSubjectLiftEv = 0.0;",
              "            p.aiBackgroundDepthEv = 0.0;",
              "",
              "            p.exposureActive = false;",
              "            p.wbActive = false;",
              "            p.toneActive = false;",
              "            p.denoiseActive = false;",
              "            p.sharpenActive = false;",
              "            p.colourActive = false;",
              "",
              "            return;",
              "        }",
              "",
              "        if (!neuralAccepted) {",
              "            return;",
              "        }",
          ])

          engine = (
              engine[:return_pos]
              + terminal
              + engine[return_pos + len(old_return):]
          )

          old_report = "\n".join([
              "        if (p.smoothSurfaceProtection) {",
              '            sb.append("Smooth-surface preservation: ACTIVE — water/sky/low-texture safe mode\\n");',
              "        }",
          ])

          new_report = "\n".join([
              "        if (p.smoothSurfaceProtection) {",
              '            sb.append("Smooth-surface preservation: ACTIVE — water/sky/low-texture safe mode\\n");',
              "        }",
              "",
              "        if (p.smoothSurfaceTerminalGuard) {",
              '            sb.append("Smooth-scene terminal protection: ORIGINAL RETAINED — no safe measurable improvement\\n");',
              "        }",
          ])

          if old_report not in engine:
              raise RuntimeError(
                  "Terminal report point not found"
              )

          engine = engine.replace(
              old_report,
              new_report,
              1
          )

          old_change = "\n".join([
              "            if (p.smoothSurfaceProtection) {",
              '                sb.append("• Smooth-surface finishing limited to preserve natural low-texture areas\\n");',
              "            }",
          ])

          new_change = "\n".join([
              "            if (p.smoothSurfaceProtection) {",
              '                sb.append("• Smooth-surface finishing limited to preserve natural low-texture areas\\n");',
              "            }",
              "",
              "            if (p.smoothSurfaceTerminalGuard) {",
              '                sb.append("• Terminal smooth-scene guard bypassed tone, colour and detail finishing; original pixels retained\\n");',
              "            }",
          ])

          if old_change not in engine:
              raise RuntimeError(
                  "Terminal Change Guard point not found"
              )

          engine = engine.replace(
              old_change,
              new_change,
              1
          )

          engine_file.write_text(engine)

          # =====================================================
          # PASS NEURAL-QC-ROLLBACK SIGNAL INTO MASTER ENGINE
          # =====================================================

          main_file = project / (
              "app/src/main/java/com/dennis/"
              "photomasterai/MainActivity.java"
          )

          main = main_file.read_text()

          main_old = "\n".join([
              "                    result = PhotoMasterEngine.master(",
              "                            processingBitmap,",
              "                            processingAnalysis,",
              "                            mode,",
              "                            ai,",
              "                            social,",
              "                            originalAnalysis,",
              "                            neuralResult != null",
              "                                    && neuralResult.accepted);",
          ])

          main_new = "\n".join([
              "                    result = PhotoMasterEngine.master(",
              "                            processingBitmap,",
              "                            processingAnalysis,",
              "                            mode,",
              "                            ai,",
              "                            social,",
              "                            originalAnalysis,",
              "                            neuralResult != null",
              "                                    && neuralResult.accepted,",
              "                            neuralResult != null",
              "                                    && neuralResult.attempted",
              "                                    && !neuralResult.accepted",
              "                                    && neuralResult.report != null",
              '                                    && neuralResult.report.contains("Neural rollback:"));',
          ])

          if main_old not in main:
              raise RuntimeError(
                  "MainActivity master call not found"
              )

          main = main.replace(
              main_old,
              main_new,
              1
          )

          main_file.write_text(main)

          print(
              "v0.4.13 smooth-scene terminal guard applied"
          )
          PY

          grep -q \
            "versionCode 22" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "versionName '0.4.13'" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "smooth metric floor; lower blends skipped" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "smoothSurfaceTerminalGuard" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/PhotoMasterEngine.java"

          grep -q \
            "Smooth-scene terminal protection: ORIGINAL RETAINED" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/PhotoMasterEngine.java"

          grep -q \
            'report.contains("Neural rollback:")' \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

          grep -q \
            "GpuBackend.OPENCL" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiserRuntime.kt"

          if grep -q \
            "new NeuralDenoiserRuntime(context, true)" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"
          then
            echo "::error::CPU neural fallback detected"
            exit 1
          fi

          echo "v0.4.13 source verification passed"
