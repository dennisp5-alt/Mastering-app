name: Build Photo Master AI v0.4.24 Geometry Intelligence

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-photo-master-ai-v0.4.24-geometry.yml'

permissions:
  contents: read

jobs:
  build:
    name: Photo Master AI v0.4.24 Geometry Intelligence
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover exact successful v0.4.23 source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          V0423_COMMIT="dfaeddf716181d0b899c620d133ad5578565da44"

          git cat-file -e "${V0423_COMMIT}^{commit}" || {
            echo "::error::Successful v0.4.23 commit unavailable"
            exit 1
          }

          git show             "${V0423_COMMIT}:.github/workflows/build-photo-master-ai-v0.4.23-colour-guard.yml"             > /tmp/v0423.yml

          python3 - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/v0423.yml').read_text().splitlines()

          def extract_step(name, destination):
              step = None
              for i, line in enumerate(lines):
                  if line.strip() == '- name: ' + name:
                      step = i
                      break
              if step is None:
                  raise RuntimeError('Workflow step not found: ' + name)

              run = None
              for i in range(step, len(lines)):
                  if lines[i].strip() == 'run: |':
                      run = i
                      break
                  if i > step and lines[i].startswith('      - name:'):
                      break
              if run is None:
                  raise RuntimeError('Run block not found: ' + name)

              body = []
              for line in lines[run + 1:]:
                  if line.startswith('      - name:'):
                      break
                  if not line.strip():
                      body.append('')
                  elif line.startswith('          '):
                      body.append(line[10:])
                  else:
                      raise RuntimeError(
                          'Unexpected indentation while extracting: ' + name
                      )

              Path(destination).write_text('\n'.join(body) + '\n')

          extract_step(
              'Recover exact successful v0.4.21 source',
              '/tmp/recover-v0421.sh'
          )
          extract_step(
              'Apply v0.4.22 person evidence and high-blend detail guards',
              '/tmp/apply-v0422.sh'
          )
          extract_step(
              'Apply v0.4.23 colour-space compatibility and high-ring finishing guard',
              '/tmp/apply-v0423.sh'
          )
          PY

          bash /tmp/recover-v0421.sh

          PROJECT="$(
            find photomaster-v044-build               -type f               \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \)               -printf '%h\n'               | head -n 1
          )"

          test -n "$PROJECT" || {
            echo "::error::Recovered project not found"
            exit 1
          }

          export PROJECT
          bash /tmp/apply-v0422.sh
          bash /tmp/apply-v0423.sh

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          grep -q "versionCode 32" "$PROJECT/app/build.gradle"
          grep -q "versionName '0.4.23'" "$PROJECT/app/build.gradle"
          grep -q "class ColorSpaceGuard"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/ColorSpaceGuard.java"
          grep -q "class HighRingFinishingPolicy"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/HighRingFinishingPolicy.java"
          grep -q "class PersonEvidencePolicy"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/PersonEvidencePolicy.java"
          grep -q "class VignettingPolicy"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/VignettingPolicy.java"
          grep -q "class ProcessingKeepAliveService"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/ProcessingKeepAliveService.java"

          echo "Exact successful v0.4.23 source recovered"

      - name: Apply v0.4.24 Geometry Intelligence
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          
          project = Path(os.environ['PROJECT'])
          
          # VERSION
          build_file = project / 'app/build.gradle'
          build = build_file.read_text()
          if 'versionCode 32' not in build:
              raise RuntimeError('v0.4.23 versionCode not found')
          if "versionName '0.4.23'" not in build:
              raise RuntimeError('v0.4.23 versionName not found')
          build = build.replace('versionCode 32', 'versionCode 33', 1)
          build = build.replace("versionName '0.4.23'", "versionName '0.4.24'", 1)
          build_file.write_text(build)
          
          # GEOMETRY POLICY
          policy_file = project / 'app/src/main/java/com/dennis/photomasterai/GeometryPolicy.java'
          policy_file.write_text(r'''package com.dennis.photomasterai;
          
          public final class GeometryPolicy {
              private GeometryPolicy() {
              }
          
              public static final class HorizonDecision {
                  public final boolean apply;
                  public final String reason;
          
                  HorizonDecision(boolean apply, String reason) {
                      this.apply = apply;
                      this.reason = reason;
                  }
              }
          
              public static final class KeystoneDecision {
                  public final boolean apply;
                  public final boolean topNarrow;
                  public final String reason;
          
                  KeystoneDecision(boolean apply, boolean topNarrow, String reason) {
                      this.apply = apply;
                      this.topNarrow = topNarrow;
                      this.reason = reason;
                  }
              }
          
              public static final class DistortionDecision {
                  public final boolean apply;
                  public final String reason;
          
                  DistortionDecision(boolean apply, String reason) {
                      this.apply = apply;
                      this.reason = reason;
                  }
              }
          
              public static HorizonDecision horizon(
                      double angleDeg,
                      double peakShare,
                      int xCoverage,
                      double leftRightDiffDeg,
                      double cropFraction) {
          
                  double a = Math.abs(angleDeg);
          
                  if (a < 0.35) {
                      return new HorizonDecision(false, "already level / below correction threshold");
                  }
                  if (a > 1.50) {
                      return new HorizonDecision(false, "tilt exceeds conservative auto-level range");
                  }
                  if (peakShare < 0.16) {
                      return new HorizonDecision(false, "horizontal-line confidence too low");
                  }
                  if (xCoverage < 6) {
                      return new HorizonDecision(false, "horizontal evidence does not span enough of frame");
                  }
                  if (leftRightDiffDeg > 0.55) {
                      return new HorizonDecision(false, "left/right line angle disagreement");
                  }
                  if (cropFraction > 0.07) {
                      return new HorizonDecision(false, "required crop exceeds 7% safety ceiling");
                  }
          
                  return new HorizonDecision(true, "strong global horizon/level evidence");
              }
          
              public static KeystoneDecision keystone(
                      double leftDeviationDeg,
                      double rightDeviationDeg,
                      double leftPeakShare,
                      double rightPeakShare,
                      int leftYCoverage,
                      int rightYCoverage,
                      double insetFraction) {
          
                  if (leftDeviationDeg * rightDeviationDeg >= 0.0) {
                      return new KeystoneDecision(
                              false,
                              false,
                              "vertical-line evidence does not show opposing convergence");
                  }
          
                  double leftAbs = Math.abs(leftDeviationDeg);
                  double rightAbs = Math.abs(rightDeviationDeg);
                  double strength = 0.5 * (leftAbs + rightAbs);
          
                  if (strength < 0.75) {
                      return new KeystoneDecision(false, false, "keystone below correction threshold");
                  }
                  if (strength > 3.00) {
                      return new KeystoneDecision(false, false, "keystone exceeds conservative auto-correction range");
                  }
                  if (leftPeakShare < 0.18 || rightPeakShare < 0.18) {
                      return new KeystoneDecision(false, false, "vertical-line confidence too low");
                  }
                  if (leftYCoverage < 4 || rightYCoverage < 4) {
                      return new KeystoneDecision(false, false, "vertical evidence does not span enough image height");
                  }
          
                  double smaller = Math.max(0.001, Math.min(leftAbs, rightAbs));
                  double larger = Math.max(leftAbs, rightAbs);
                  if (larger / smaller > 2.0) {
                      return new KeystoneDecision(false, false, "left/right convergence is too asymmetric");
                  }
          
                  if (insetFraction < 0.004) {
                      return new KeystoneDecision(false, false, "perspective correction would be negligible");
                  }
                  if (insetFraction > 0.022) {
                      return new KeystoneDecision(false, false, "perspective crop exceeds 2.2% edge ceiling");
                  }
          
                  boolean topNarrow =
                          leftDeviationDeg < 0.0 && rightDeviationDeg > 0.0;
          
                  return new KeystoneDecision(
                          true,
                          topNarrow,
                          "strong opposing vertical-line convergence");
              }
          
              public static DistortionDecision distortion(
                      double estimatedK,
                      double confidence,
                      int horizontalQuadrants,
                      int verticalQuadrants,
                      boolean orthogonalAgreement) {
          
                  if (!orthogonalAgreement) {
                      return new DistortionDecision(
                              false,
                              "horizontal/vertical curvature evidence does not agree");
                  }
                  if (horizontalQuadrants < 4 || verticalQuadrants < 4) {
                      return new DistortionDecision(
                              false,
                              "radial curvature does not cover all quadrants");
                  }
                  if (confidence < 0.55) {
                      return new DistortionDecision(
                              false,
                              "radial curvature confidence too low");
                  }
          
                  double k = Math.abs(estimatedK);
                  if (k < 0.004) {
                      return new DistortionDecision(
                              false,
                              "radial distortion below correction threshold");
                  }
                  if (k > 0.018) {
                      return new DistortionDecision(
                              false,
                              "radial correction exceeds conservative strength ceiling");
                  }
          
                  return new DistortionDecision(
                          true,
                          "orthogonal straight-line curvature consensus");
              }
          
              public static boolean safeCandidate(
                      double beforeDetail,
                      double afterDetail,
                      double beforeNoise,
                      double afterNoise,
                      double beforeChroma,
                      double afterChroma,
                      double beforeRinging,
                      double afterRinging,
                      double beforeMedian,
                      double afterMedian,
                      double beforeSat,
                      double afterSat,
                      double beforeShadowClip,
                      double afterShadowClip,
                      double beforeHighlightClip,
                      double afterHighlightClip,
                      double cumulativeCropFraction) {
          
                  double detailRetention =
                          afterDetail / Math.max(1.0e-9, beforeDetail);
          
                  return detailRetention >= 0.90
                          && afterNoise <= beforeNoise + 0.0025
                          && afterChroma <= beforeChroma + 0.0035
                          && afterRinging <= beforeRinging + 0.020
                          && Math.abs(afterMedian - beforeMedian) <= 0.050
                          && Math.abs(afterSat - beforeSat) <= 0.050
                          && afterShadowClip <= beforeShadowClip + 0.020
                          && afterHighlightClip <= beforeHighlightClip + 0.010
                          && cumulativeCropFraction <= 0.080;
              }
          }
          ''')
          
          # GEOMETRY ENGINE
          geometry_file = project / 'app/src/main/java/com/dennis/photomasterai/GeometryIntelligence.java'
          geometry_file.write_text(r'''package com.dennis.photomasterai;
          
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Matrix;
          import android.graphics.Paint;
          
          import java.util.Locale;
          
          public final class GeometryIntelligence {
          
              private static final int MAX_ANALYSIS_EDGE = 640;
              private static final int SAMPLE_STEP = 2;
              private static final double EDGE_MIN = 150.0;
          
              private GeometryIntelligence() {
              }
          
              public static final class Outcome {
                  public final Bitmap bitmap;
                  public final PhotoAnalysis analysis;
                  public final boolean changed;
                  public final String report;
          
                  Outcome(
                          Bitmap bitmap,
                          PhotoAnalysis analysis,
                          boolean changed,
                          String report) {
                      this.bitmap = bitmap;
                      this.analysis = analysis;
                      this.changed = changed;
                      this.report = report;
                  }
              }
          
              private static final class Sample {
                  final int width;
                  final int height;
                  final int[] luma;
          
                  Sample(int width, int height, int[] luma) {
                      this.width = width;
                      this.height = height;
                      this.luma = luma;
                  }
          
                  int at(int x, int y) {
                      return luma[y * width + x];
                  }
              }
          
              private static final class HorizonMetrics {
                  double angleDeg;
                  double peakShare;
                  int xCoverage;
                  double leftRightDiffDeg;
              }
          
              private static final class KeystoneMetrics {
                  double leftDeviationDeg;
                  double rightDeviationDeg;
                  double leftPeakShare;
                  double rightPeakShare;
                  int leftYCoverage;
                  int rightYCoverage;
                  double insetFraction;
              }
          
              private static final class CurvatureAxis {
                  double scoreRad;
                  double meanAbsXY;
                  double confidence;
                  int quadrants;
                  int totalSamples;
                  boolean agreement;
              }
          
              private static final class DistortionMetrics {
                  double estimatedK;
                  double confidence;
                  int horizontalQuadrants;
                  int verticalQuadrants;
                  boolean orthogonalAgreement;
              }
          
              public static Outcome process(
                      Bitmap mastered,
                      Bitmap authoritativeOriginal) {
          
                  if (mastered == null
                          || mastered.isRecycled()
                          || authoritativeOriginal == null
                          || authoritativeOriginal.isRecycled()) {
                      return new Outcome(
                              mastered,
                              mastered == null || mastered.isRecycled()
                                      ? null
                                      : PhotoAnalysis.analyse(mastered),
                              false,
                              "• Geometry stage skipped — invalid bitmap input");
                  }
          
                  Sample sample = makeSample(authoritativeOriginal);
          
                  Bitmap current = mastered;
                  PhotoAnalysis currentAnalysis = PhotoAnalysis.analyse(current);
                  boolean changed = false;
                  double cumulativeCrop = 0.0;
          
                  StringBuilder report = new StringBuilder();
          
                  // ---------------------------------------------------------
                  // HORIZON / LEVEL
                  // ---------------------------------------------------------
          
                  HorizonMetrics horizon = detectHorizon(sample);
                  double rotationCrop = rotationCropFraction(
                          current.getWidth(),
                          current.getHeight(),
                          horizon.angleDeg);
          
                  GeometryPolicy.HorizonDecision horizonDecision =
                          GeometryPolicy.horizon(
                                  horizon.angleDeg,
                                  horizon.peakShare,
                                  horizon.xCoverage,
                                  horizon.leftRightDiffDeg,
                                  rotationCrop);
          
                  report.append(String.format(
                          Locale.US,
                          "• Horizon scan %.2f° | confidence %.0f%% | span %d/8 | L/R diff %.2f°\n",
                          horizon.angleDeg,
                          horizon.peakShare * 100.0,
                          horizon.xCoverage,
                          horizon.leftRightDiffDeg));
          
                  if (horizonDecision.apply) {
                      Bitmap trial = rotateAndCover(
                              current,
                              -horizon.angleDeg);
          
                      PhotoAnalysis trialAnalysis = PhotoAnalysis.analyse(trial);
                      double proposedCrop = combineCrop(
                              cumulativeCrop,
                              rotationCrop);
          
                      if (safe(
                              currentAnalysis,
                              trialAnalysis,
                              proposedCrop)) {
          
                          Bitmap previous = current;
                          current = trial;
                          currentAnalysis = trialAnalysis;
                          cumulativeCrop = proposedCrop;
                          changed = true;
          
                          if (previous != mastered
                                  && !previous.isRecycled()) {
                              previous.recycle();
                          }
          
                          report.append(String.format(
                                  Locale.US,
                                  "• Auto level APPLIED %.2f° | estimated crop %.1f%% | geometry QC ACCEPTED\n",
                                  -horizon.angleDeg,
                                  rotationCrop * 100.0));
                      } else {
                          if (!trial.isRecycled()) {
                              trial.recycle();
                          }
                          report.append(
                                  "• Auto level ROLLED BACK — geometry QC did not preserve enough image quality\n");
                      }
                  } else {
                      report.append("• Auto level withheld — ")
                              .append(horizonDecision.reason)
                              .append("\n");
                  }
          
                  // ---------------------------------------------------------
                  // PERSPECTIVE / KEYSTONE
                  // ---------------------------------------------------------
          
                  KeystoneMetrics keystone = detectKeystone(sample);
          
                  GeometryPolicy.KeystoneDecision keystoneDecision =
                          GeometryPolicy.keystone(
                                  keystone.leftDeviationDeg,
                                  keystone.rightDeviationDeg,
                                  keystone.leftPeakShare,
                                  keystone.rightPeakShare,
                                  keystone.leftYCoverage,
                                  keystone.rightYCoverage,
                                  keystone.insetFraction);
          
                  report.append(String.format(
                          Locale.US,
                          "• Perspective scan left %.2f° / right %.2f° | confidence %.0f%% / %.0f%% | vertical span %d/6 / %d/6\n",
                          keystone.leftDeviationDeg,
                          keystone.rightDeviationDeg,
                          keystone.leftPeakShare * 100.0,
                          keystone.rightPeakShare * 100.0,
                          keystone.leftYCoverage,
                          keystone.rightYCoverage));
          
                  if (keystoneDecision.apply
                          && combineCrop(
                                  cumulativeCrop,
                                  keystone.insetFraction) <= 0.080) {
          
                      Bitmap trial = applyKeystone(
                              current,
                              keystoneDecision.topNarrow,
                              keystone.insetFraction);
          
                      PhotoAnalysis trialAnalysis = PhotoAnalysis.analyse(trial);
                      double proposedCrop = combineCrop(
                              cumulativeCrop,
                              keystone.insetFraction);
          
                      if (safe(
                              currentAnalysis,
                              trialAnalysis,
                              proposedCrop)) {
          
                          Bitmap previous = current;
                          current = trial;
                          currentAnalysis = trialAnalysis;
                          cumulativeCrop = proposedCrop;
                          changed = true;
          
                          if (previous != mastered
                                  && !previous.isRecycled()) {
                              previous.recycle();
                          }
          
                          report.append(String.format(
                                  Locale.US,
                                  "• Keystone correction APPLIED | %s edge expansion %.1f%% | geometry QC ACCEPTED\n",
                                  keystoneDecision.topNarrow ? "top" : "bottom",
                                  keystone.insetFraction * 100.0));
                      } else {
                          if (!trial.isRecycled()) {
                              trial.recycle();
                          }
                          report.append(
                                  "• Keystone correction ROLLED BACK — geometry QC did not preserve enough image quality\n");
                      }
                  } else {
                      report.append("• Keystone correction withheld — ")
                              .append(
                                      keystoneDecision.apply
                                              ? "combined geometry crop would exceed 8% ceiling"
                                              : keystoneDecision.reason)
                              .append("\n");
                  }
          
                  // ---------------------------------------------------------
                  // RADIAL LENS DISTORTION
                  // ---------------------------------------------------------
          
                  DistortionMetrics distortion = detectDistortion(sample);
          
                  GeometryPolicy.DistortionDecision distortionDecision =
                          GeometryPolicy.distortion(
                                  distortion.estimatedK,
                                  distortion.confidence,
                                  distortion.horizontalQuadrants,
                                  distortion.verticalQuadrants,
                                  distortion.orthogonalAgreement);
          
                  String distortionType =
                          distortion.estimatedK > 0.0
                                  ? "pincushion-type"
                                  : distortion.estimatedK < 0.0
                                          ? "barrel-type"
                                          : "neutral";
          
                  report.append(String.format(
                          Locale.US,
                          "• Lens-distortion scan %s k=%+.4f | confidence %.0f%% | H/V quadrant consensus %d/4 / %d/4\n",
                          distortionType,
                          distortion.estimatedK,
                          distortion.confidence * 100.0,
                          distortion.horizontalQuadrants,
                          distortion.verticalQuadrants));
          
                  double distortionCrop =
                          Math.min(
                                  0.050,
                                  Math.abs(distortion.estimatedK) * 2.2);
          
                  if (distortionDecision.apply
                          && combineCrop(
                                  cumulativeCrop,
                                  distortionCrop) <= 0.080) {
          
                      Bitmap trial = applyRadialCorrection(
                              current,
                              distortion.estimatedK);
          
                      PhotoAnalysis trialAnalysis = PhotoAnalysis.analyse(trial);
                      double proposedCrop = combineCrop(
                              cumulativeCrop,
                              distortionCrop);
          
                      if (safe(
                              currentAnalysis,
                              trialAnalysis,
                              proposedCrop)) {
          
                          Bitmap previous = current;
                          current = trial;
                          currentAnalysis = trialAnalysis;
                          cumulativeCrop = proposedCrop;
                          changed = true;
          
                          if (previous != mastered
                                  && !previous.isRecycled()) {
                              previous.recycle();
                          }
          
                          report.append(String.format(
                                  Locale.US,
                                  "• Radial lens correction APPLIED k=%+.4f | geometry QC ACCEPTED\n",
                                  distortion.estimatedK));
                      } else {
                          if (!trial.isRecycled()) {
                              trial.recycle();
                          }
                          report.append(
                                  "• Radial lens correction ROLLED BACK — geometry QC did not preserve enough image quality\n");
                      }
                  } else {
                      report.append("• Radial lens correction withheld — ")
                              .append(
                                      distortionDecision.apply
                                              ? "combined geometry crop would exceed 8% ceiling"
                                              : distortionDecision.reason)
                              .append("\n");
                  }
          
                  report.append(String.format(
                          Locale.US,
                          "• Final geometry crop estimate %.1f%% | colour-space-aware render path retained",
                          cumulativeCrop * 100.0));
          
                  return new Outcome(
                          current,
                          currentAnalysis,
                          changed,
                          report.toString());
              }
          
              private static boolean safe(
                      PhotoAnalysis before,
                      PhotoAnalysis after,
                      double cropFraction) {
          
                  if (before == null || after == null) {
                      return false;
                  }
          
                  return GeometryPolicy.safeCandidate(
                          before.detail,
                          after.detail,
                          before.noise,
                          after.noise,
                          before.flatChromaNoise,
                          after.flatChromaNoise,
                          before.ringing,
                          after.ringing,
                          before.medianLum,
                          after.medianLum,
                          before.avgSat,
                          after.avgSat,
                          before.shadowClip,
                          after.shadowClip,
                          before.highlightClip,
                          after.highlightClip,
                          cropFraction);
              }
          
              private static Sample makeSample(Bitmap source) {
                  int srcW = source.getWidth();
                  int srcH = source.getHeight();
          
                  int max = Math.max(srcW, srcH);
                  Bitmap working = source;
                  boolean recycle = false;
          
                  if (max > MAX_ANALYSIS_EDGE) {
                      double scale = MAX_ANALYSIS_EDGE / (double) max;
                      int w = Math.max(64, (int) Math.round(srcW * scale));
                      int h = Math.max(64, (int) Math.round(srcH * scale));
                      working = Bitmap.createScaledBitmap(
                              source,
                              w,
                              h,
                              true);
                      recycle = true;
                  }
          
                  int w = working.getWidth();
                  int h = working.getHeight();
                  int[] pixels = new int[w * h];
                  working.getPixels(
                          pixels,
                          0,
                          w,
                          0,
                          0,
                          w,
                          h);
          
                  int[] luma = new int[pixels.length];
                  for (int i = 0; i < pixels.length; i++) {
                      int c = pixels[i];
                      int r = (c >>> 16) & 0xff;
                      int g = (c >>> 8) & 0xff;
                      int b = c & 0xff;
                      luma[i] =
                              (54 * r + 183 * g + 19 * b) >> 8;
                  }
          
                  if (recycle && !working.isRecycled()) {
                      working.recycle();
                  }
          
                  return new Sample(w, h, luma);
              }
          
              private static int gx(Sample s, int x, int y) {
                  return -s.at(x - 1, y - 1)
                          - 2 * s.at(x - 1, y)
                          - s.at(x - 1, y + 1)
                          + s.at(x + 1, y - 1)
                          + 2 * s.at(x + 1, y)
                          + s.at(x + 1, y + 1);
              }
          
              private static int gy(Sample s, int x, int y) {
                  return -s.at(x - 1, y - 1)
                          - 2 * s.at(x, y - 1)
                          - s.at(x + 1, y - 1)
                          + s.at(x - 1, y + 1)
                          + 2 * s.at(x, y + 1)
                          + s.at(x + 1, y + 1);
              }
          
              private static double horizontalAngleDeg(
                      int gx,
                      int gy) {
          
                  double tx = -gy;
                  double ty = gx;
          
                  if (Math.abs(tx) < 1.0e-9) {
                      return 90.0;
                  }
          
                  return Math.toDegrees(
                          Math.atan(ty / tx));
              }
          
              private static double verticalDeviationDeg(
                      int gx,
                      int gy) {
          
                  double tx = -gy;
                  double ty = gx;
          
                  if (Math.abs(ty) < 1.0e-9) {
                      return 90.0;
                  }
          
                  return Math.toDegrees(
                          Math.atan(tx / ty));
              }
          
              private static HorizonMetrics detectHorizon(Sample s) {
                  final double min = -5.0;
                  final double step = 0.25;
                  final int bins = 41;
          
                  double[] hist = new double[bins];
                  double total = 0.0;
          
                  int y0 = Math.max(1, (int) (s.height * 0.08));
                  int y1 = Math.min(
                          s.height - 2,
                          (int) (s.height * 0.90));
          
                  for (int y = y0; y <= y1; y += SAMPLE_STEP) {
                      for (int x = 1; x < s.width - 1; x += SAMPLE_STEP) {
                          int dx = gx(s, x, y);
                          int dy = gy(s, x, y);
                          double mag = Math.abs(dx) + Math.abs(dy);
          
                          if (mag < EDGE_MIN) {
                              continue;
                          }
          
                          double angle = horizontalAngleDeg(dx, dy);
                          if (Math.abs(angle) > 5.0) {
                              continue;
                          }
          
                          int bin = (int) Math.round(
                                  (angle - min) / step);
          
                          if (bin < 0 || bin >= bins) {
                              continue;
                          }
          
                          hist[bin] += mag;
                          total += mag;
                      }
                  }
          
                  int peak = 0;
                  for (int i = 1; i < bins; i++) {
                      if (hist[i] > hist[peak]) {
                          peak = i;
                      }
                  }
          
                  double peakAngle =
                          min + peak * step;
          
                  double[] xWeight = new double[8];
                  double selectedWeight = 0.0;
                  double weightedAngle = 0.0;
          
                  double leftW = 0.0;
                  double rightW = 0.0;
                  double leftAngle = 0.0;
                  double rightAngle = 0.0;
          
                  for (int y = y0; y <= y1; y += SAMPLE_STEP) {
                      for (int x = 1; x < s.width - 1; x += SAMPLE_STEP) {
                          int dx = gx(s, x, y);
                          int dy = gy(s, x, y);
                          double mag = Math.abs(dx) + Math.abs(dy);
          
                          if (mag < EDGE_MIN) {
                              continue;
                          }
          
                          double angle = horizontalAngleDeg(dx, dy);
                          if (Math.abs(angle - peakAngle) > 0.65) {
                              continue;
                          }
          
                          selectedWeight += mag;
                          weightedAngle += angle * mag;
          
                          int xb = Math.min(
                                  7,
                                  Math.max(
                                          0,
                                          (int) (8.0 * x / s.width)));
          
                          xWeight[xb] += mag;
          
                          if (x < s.width / 2) {
                              leftW += mag;
                              leftAngle += angle * mag;
                          } else {
                              rightW += mag;
                              rightAngle += angle * mag;
                          }
                      }
                  }
          
                  double refined =
                          selectedWeight > 0.0
                                  ? weightedAngle / selectedWeight
                                  : peakAngle;
          
                  int coverage = 0;
                  double perBinThreshold =
                          selectedWeight * 0.035;
          
                  for (double weight : xWeight) {
                      if (weight >= perBinThreshold
                              && weight > 0.0) {
                          coverage++;
                      }
                  }
          
                  double l =
                          leftW > 0.0
                                  ? leftAngle / leftW
                                  : refined;
                  double r =
                          rightW > 0.0
                                  ? rightAngle / rightW
                                  : refined;
          
                  HorizonMetrics out =
                          new HorizonMetrics();
          
                  out.angleDeg = refined;
                  out.peakShare =
                          total > 0.0
                                  ? hist[peak] / total
                                  : 0.0;
                  out.xCoverage = coverage;
                  out.leftRightDiffDeg =
                          Math.abs(l - r);
          
                  return out;
              }
          
              private static KeystoneMetrics detectKeystone(Sample s) {
                  final double min = -8.0;
                  final double step = 0.5;
                  final int bins = 33;
          
                  double[] leftHist = new double[bins];
                  double[] rightHist = new double[bins];
          
                  double leftTotal = 0.0;
                  double rightTotal = 0.0;
          
                  for (int y = 1; y < s.height - 1; y += SAMPLE_STEP) {
                      for (int x = 1; x < s.width - 1; x += SAMPLE_STEP) {
                          int dx = gx(s, x, y);
                          int dy = gy(s, x, y);
                          double mag = Math.abs(dx) + Math.abs(dy);
          
                          if (mag < EDGE_MIN) {
                              continue;
                          }
          
                          double dev =
                                  verticalDeviationDeg(dx, dy);
          
                          if (Math.abs(dev) > 8.0) {
                              continue;
                          }
          
                          int bin = (int) Math.round(
                                  (dev - min) / step);
          
                          if (bin < 0 || bin >= bins) {
                              continue;
                          }
          
                          if (x < s.width * 0.48) {
                              leftHist[bin] += mag;
                              leftTotal += mag;
                          } else if (x > s.width * 0.52) {
                              rightHist[bin] += mag;
                              rightTotal += mag;
                          }
                      }
                  }
          
                  int leftPeak = peak(leftHist);
                  int rightPeak = peak(rightHist);
          
                  double leftPeakAngle =
                          min + leftPeak * step;
                  double rightPeakAngle =
                          min + rightPeak * step;
          
                  double[] leftY = new double[6];
                  double[] rightY = new double[6];
          
                  double leftW = 0.0;
                  double rightW = 0.0;
                  double leftAngle = 0.0;
                  double rightAngle = 0.0;
          
                  for (int y = 1; y < s.height - 1; y += SAMPLE_STEP) {
                      for (int x = 1; x < s.width - 1; x += SAMPLE_STEP) {
                          int dx = gx(s, x, y);
                          int dy = gy(s, x, y);
                          double mag = Math.abs(dx) + Math.abs(dy);
          
                          if (mag < EDGE_MIN) {
                              continue;
                          }
          
                          double dev =
                                  verticalDeviationDeg(dx, dy);
          
                          int yb = Math.min(
                                  5,
                                  Math.max(
                                          0,
                                          (int) (6.0 * y / s.height)));
          
                          if (x < s.width * 0.48
                                  && Math.abs(dev - leftPeakAngle) <= 0.80) {
                              leftW += mag;
                              leftAngle += dev * mag;
                              leftY[yb] += mag;
                          } else if (x > s.width * 0.52
                                  && Math.abs(dev - rightPeakAngle) <= 0.80) {
                              rightW += mag;
                              rightAngle += dev * mag;
                              rightY[yb] += mag;
                          }
                      }
                  }
          
                  double leftRefined =
                          leftW > 0.0
                                  ? leftAngle / leftW
                                  : leftPeakAngle;
          
                  double rightRefined =
                          rightW > 0.0
                                  ? rightAngle / rightW
                                  : rightPeakAngle;
          
                  KeystoneMetrics out =
                          new KeystoneMetrics();
          
                  out.leftDeviationDeg = leftRefined;
                  out.rightDeviationDeg = rightRefined;
          
                  out.leftPeakShare =
                          leftTotal > 0.0
                                  ? leftHist[leftPeak] / leftTotal
                                  : 0.0;
          
                  out.rightPeakShare =
                          rightTotal > 0.0
                                  ? rightHist[rightPeak] / rightTotal
                                  : 0.0;
          
                  out.leftYCoverage =
                          coverageCount(
                                  leftY,
                                  leftW * 0.045);
          
                  out.rightYCoverage =
                          coverageCount(
                                  rightY,
                                  rightW * 0.045);
          
                  double strength =
                          0.5 * (
                                  Math.abs(leftRefined)
                                          + Math.abs(rightRefined));
          
                  out.insetFraction =
                          Math.min(
                                  0.022,
                                  0.55
                                          * Math.tan(
                                                  Math.toRadians(strength))
                                          * s.height
                                          / Math.max(
                                                  1.0,
                                                  s.width));
          
                  return out;
              }
          
              private static DistortionMetrics detectDistortion(Sample s) {
                  CurvatureAxis horizontal =
                          detectCurvatureAxis(
                                  s,
                                  true);
          
                  CurvatureAxis vertical =
                          detectCurvatureAxis(
                                  s,
                                  false);
          
                  DistortionMetrics out =
                          new DistortionMetrics();
          
                  out.horizontalQuadrants =
                          horizontal.quadrants;
                  out.verticalQuadrants =
                          vertical.quadrants;
          
                  out.orthogonalAgreement =
                          horizontal.agreement
                                  && vertical.agreement
                                  && horizontal.scoreRad
                                          * vertical.scoreRad > 0.0;
          
                  double score =
                          0.5 * (
                                  horizontal.scoreRad
                                          + vertical.scoreRad);
          
                  double meanAbsXY =
                          0.5 * (
                                  horizontal.meanAbsXY
                                          + vertical.meanAbsXY);
          
                  if (meanAbsXY > 1.0e-6) {
                      out.estimatedK =
                              score
                                      / (2.0 * meanAbsXY);
                  } else {
                      out.estimatedK = 0.0;
                  }
          
                  out.confidence =
                          Math.min(
                                  horizontal.confidence,
                                  vertical.confidence);
          
                  return out;
              }
          
              private static CurvatureAxis detectCurvatureAxis(
                      Sample s,
                      boolean horizontal) {
          
                  double[] qSum = new double[4];
                  double[] xySum = new double[4];
                  double[] weight = new double[4];
                  int[] count = new int[4];
          
                  for (int y = 1; y < s.height - 1; y += SAMPLE_STEP) {
                      for (int x = 1; x < s.width - 1; x += SAMPLE_STEP) {
                          int dx = gx(s, x, y);
                          int dy = gy(s, x, y);
                          double mag = Math.abs(dx) + Math.abs(dy);
          
                          if (mag < EDGE_MIN) {
                              continue;
                          }
          
                          double xn =
                                  (x - 0.5 * s.width)
                                          / (0.5 * s.width);
          
                          double yn =
                                  (y - 0.5 * s.height)
                                          / (0.5 * s.height);
          
                          if (Math.abs(xn) < 0.25
                                  || Math.abs(yn) < 0.20
                                  || Math.abs(xn) > 0.96
                                  || Math.abs(yn) > 0.96) {
                              continue;
                          }
          
                          double angle =
                                  horizontal
                                          ? horizontalAngleDeg(dx, dy)
                                          : verticalDeviationDeg(dx, dy);
          
                          if (Math.abs(angle) > 8.0) {
                              continue;
                          }
          
                          int quadrant =
                                  (yn >= 0.0 ? 2 : 0)
                                          + (xn >= 0.0 ? 1 : 0);
          
                          double sign =
                                  xn * yn >= 0.0
                                          ? 1.0
                                          : -1.0;
          
                          double q =
                                  Math.toRadians(angle)
                                          * sign;
          
                          qSum[quadrant] += q * mag;
                          xySum[quadrant] +=
                                  Math.abs(xn * yn) * mag;
                          weight[quadrant] += mag;
                          count[quadrant]++;
                      }
                  }
          
                  CurvatureAxis out =
                          new CurvatureAxis();
          
                  double[] qMean = new double[4];
                  double[] xyMean = new double[4];
          
                  int quadrants = 0;
                  int sign = 0;
                  boolean sameSign = true;
                  double avg = 0.0;
                  double avgXY = 0.0;
                  int totalSamples = 0;
          
                  for (int i = 0; i < 4; i++) {
                      if (weight[i] > 0.0
                              && count[i] >= 12) {
                          qMean[i] =
                                  qSum[i] / weight[i];
                          xyMean[i] =
                                  xySum[i] / weight[i];
          
                          quadrants++;
                          totalSamples += count[i];
                          avg += qMean[i];
                          avgXY += xyMean[i];
          
                          int thisSign =
                                  qMean[i] > 0.0
                                          ? 1
                                          : qMean[i] < 0.0
                                                  ? -1
                                                  : 0;
          
                          if (thisSign != 0) {
                              if (sign == 0) {
                                  sign = thisSign;
                              } else if (sign != thisSign) {
                                  sameSign = false;
                              }
                          }
                      }
                  }
          
                  out.quadrants = quadrants;
                  out.totalSamples = totalSamples;
          
                  if (quadrants == 0) {
                      return out;
                  }
          
                  avg /= quadrants;
                  avgXY /= quadrants;
          
                  double variance = 0.0;
                  for (int i = 0; i < 4; i++) {
                      if (weight[i] > 0.0
                              && count[i] >= 12) {
                          double d = qMean[i] - avg;
                          variance += d * d;
                      }
                  }
          
                  variance /= quadrants;
                  double std = Math.sqrt(variance);
          
                  double floor =
                          Math.toRadians(0.25);
          
                  double confidence =
                          1.0
                                  - std
                                          / (
                                                  Math.abs(avg)
                                                          + floor);
          
                  confidence =
                          Math.max(
                                  0.0,
                                  Math.min(
                                          1.0,
                                          confidence));
          
                  boolean enoughMagnitude =
                          Math.abs(
                                  Math.toDegrees(avg)) >= 0.35;
          
                  out.scoreRad = avg;
                  out.meanAbsXY = avgXY;
                  out.confidence = confidence;
                  out.agreement =
                          quadrants == 4
                                  && sameSign
                                  && enoughMagnitude
                                  && totalSamples >= 80;
          
                  return out;
              }
          
              private static int peak(double[] values) {
                  int p = 0;
                  for (int i = 1; i < values.length; i++) {
                      if (values[i] > values[p]) {
                          p = i;
                      }
                  }
                  return p;
              }
          
              private static int coverageCount(
                      double[] weights,
                      double threshold) {
          
                  int count = 0;
                  for (double w : weights) {
                      if (w >= threshold
                              && w > 0.0) {
                          count++;
                      }
                  }
                  return count;
              }
          
              private static double rotationCropFraction(
                      int width,
                      int height,
                      double angleDeg) {
          
                  double halfW =
                          Math.max(
                                  1.0,
                                  width * 0.5);
          
                  double halfH =
                          Math.max(
                                  1.0,
                                  height * 0.5);
          
                  double rad =
                          Math.toRadians(angleDeg);
          
                  double c = Math.cos(rad);
                  double s = Math.sin(rad);
          
                  double required = 1.0;
          
                  double[] xs = {-halfW, halfW};
                  double[] ys = {-halfH, halfH};
          
                  for (double ox : xs) {
                      for (double oy : ys) {
                          double ix =
                                  c * ox
                                          + s * oy;
          
                          double iy =
                                  -s * ox
                                          + c * oy;
          
                          required =
                                  Math.max(
                                          required,
                                          Math.abs(ix) / halfW);
          
                          required =
                                  Math.max(
                                          required,
                                          Math.abs(iy) / halfH);
                      }
                  }
          
                  required *= 1.002;
          
                  return Math.max(
                          0.0,
                          1.0
                                  - 1.0
                                          / (
                                                  required
                                                          * required));
              }
          
              private static Bitmap rotateAndCover(
                      Bitmap source,
                      double angleDeg) {
          
                  int w = source.getWidth();
                  int h = source.getHeight();
          
                  Bitmap out =
                          ColorSpaceGuard.createLike(
                                  source,
                                  w,
                                  h);
          
                  Canvas canvas =
                          new Canvas(out);
          
                  Paint paint =
                          geometryPaint();
          
                  float cx = w * 0.5f;
                  float cy = h * 0.5f;
          
                  double crop =
                          rotationCropFraction(
                                  w,
                                  h,
                                  angleDeg);
          
                  double scale =
                          1.0
                                  / Math.sqrt(
                                          Math.max(
                                                  1.0e-9,
                                                  1.0 - crop));
          
                  canvas.save();
                  canvas.scale(
                          (float) scale,
                          (float) scale,
                          cx,
                          cy);
                  canvas.rotate(
                          (float) angleDeg,
                          cx,
                          cy);
                  canvas.drawBitmap(
                          source,
                          0.0f,
                          0.0f,
                          paint);
                  canvas.restore();
          
                  return out;
              }
          
              private static Bitmap applyKeystone(
                      Bitmap source,
                      boolean topNarrow,
                      double insetFraction) {
          
                  int w = source.getWidth();
                  int h = source.getHeight();
          
                  float inset =
                          (float) (
                                  insetFraction
                                          * w);
          
                  float[] src;
                  if (topNarrow) {
                      src = new float[] {
                              inset, 0.0f,
                              w - inset, 0.0f,
                              w, h,
                              0.0f, h
                      };
                  } else {
                      src = new float[] {
                              0.0f, 0.0f,
                              w, 0.0f,
                              w - inset, h,
                              inset, h
                      };
                  }
          
                  float[] dst = new float[] {
                          0.0f, 0.0f,
                          w, 0.0f,
                          w, h,
                          0.0f, h
                  };
          
                  Matrix matrix =
                          new Matrix();
          
                  boolean ok =
                          matrix.setPolyToPoly(
                                  src,
                                  0,
                                  dst,
                                  0,
                                  4);
          
                  if (!ok) {
                      return ColorSpaceGuard.ensureLike(
                              source,
                              source.copy(
                                      Bitmap.Config.ARGB_8888,
                                      false));
                  }
          
                  Bitmap out =
                          ColorSpaceGuard.createLike(
                                  source,
                                  w,
                                  h);
          
                  Canvas canvas =
                          new Canvas(out);
          
                  canvas.drawBitmap(
                          source,
                          matrix,
                          geometryPaint());
          
                  return out;
              }
          
              private static Bitmap applyRadialCorrection(
                      Bitmap source,
                      double k) {
          
                  int w = source.getWidth();
                  int h = source.getHeight();
          
                  int meshW =
                          w >= h
                                  ? 32
                                  : 24;
          
                  int meshH =
                          w >= h
                                  ? 24
                                  : 32;
          
                  int count =
                          (meshW + 1)
                                  * (meshH + 1);
          
                  float[] verts =
                          new float[count * 2];
          
                  double cx = w * 0.5;
                  double cy = h * 0.5;
          
                  double coverScale =
                          k > 0.0
                                  ? Math.min(
                                          1.05,
                                          1.0 + 2.0 * k)
                                  : 1.0;
          
                  int p = 0;
          
                  for (int j = 0; j <= meshH; j++) {
                      double sy =
                              h * (
                                      j / (double) meshH);
          
                      double yn =
                              (sy - cy)
                                      / Math.max(
                                              1.0,
                                              cy);
          
                      for (int i = 0; i <= meshW; i++) {
                          double sx =
                                  w * (
                                          i / (double) meshW);
          
                          double xn =
                                  (sx - cx)
                                          / Math.max(
                                                  1.0,
                                                  cx);
          
                          double r2 =
                                  xn * xn
                                          + yn * yn;
          
                          double denom =
                                  1.0
                                          + k * r2;
          
                          if (Math.abs(denom) < 0.85) {
                              denom =
                                      denom < 0.0
                                              ? -0.85
                                              : 0.85;
                          }
          
                          double factor =
                                  coverScale
                                          / denom;
          
                          verts[p++] =
                                  (float) (
                                          cx
                                                  + (sx - cx)
                                                          * factor);
          
                          verts[p++] =
                                  (float) (
                                          cy
                                                  + (sy - cy)
                                                          * factor);
                      }
                  }
          
                  Bitmap out =
                          ColorSpaceGuard.createLike(
                                  source,
                                  w,
                                  h);
          
                  Canvas canvas =
                          new Canvas(out);
          
                  canvas.drawBitmapMesh(
                          source,
                          meshW,
                          meshH,
                          verts,
                          0,
                          null,
                          0,
                          geometryPaint());
          
                  return out;
              }
          
              private static Paint geometryPaint() {
                  Paint paint =
                          new Paint(
                                  Paint.ANTI_ALIAS_FLAG
                                          | Paint.FILTER_BITMAP_FLAG
                                          | Paint.DITHER_FLAG);
          
                  paint.setFilterBitmap(true);
                  paint.setDither(true);
          
                  return paint;
              }
          
              private static double combineCrop(
                      double current,
                      double additional) {
          
                  current =
                          Math.max(
                                  0.0,
                                  Math.min(
                                          0.99,
                                          current));
          
                  additional =
                          Math.max(
                                  0.0,
                                  Math.min(
                                          0.99,
                                          additional));
          
                  return 1.0
                          - (1.0 - current)
                                  * (1.0 - additional);
              }
