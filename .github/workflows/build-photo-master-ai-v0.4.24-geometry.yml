          host_file.write_text(r'''package com.dennis.photomasterai;
          
          public final class GeometryPolicyHostChecks {
              public static void main(String[] args) {
                  require(!GeometryPolicy.horizon(
                          0.18, 0.30, 8, 0.10, 0.01).apply,
                          "already-level image must not rotate");
          
                  require(GeometryPolicy.horizon(
                          0.82, 0.27, 7, 0.18, 0.04).apply,
                          "strong sub-degree horizon evidence should apply");
          
                  require(!GeometryPolicy.horizon(
                          1.80, 0.40, 8, 0.10, 0.08).apply,
                          "large crop/tilt must be withheld");
          
                  GeometryPolicy.KeystoneDecision k =
                          GeometryPolicy.keystone(
                                  -1.35, 1.20,
                                  0.31, 0.28,
                                  5, 5,
                                  0.012);
                  require(k.apply && k.topNarrow,
                          "strong top-narrow keystone should apply");
          
                  require(!GeometryPolicy.keystone(
                          1.10, 1.20,
                          0.35, 0.35,
                          5, 5,
                          0.012).apply,
                          "same-direction vertical lean is not keystone");
          
                  require(GeometryPolicy.distortion(
                          0.011, 0.74, 4, 4, true).apply,
                          "safe orthogonal radial consensus should apply");
          
                  require(!GeometryPolicy.distortion(
                          0.030, 0.90, 4, 4, true).apply,
                          "strong radial correction must be withheld");
          
                  require(GeometryPolicy.safeCandidate(
                          0.050, 0.048,
                          0.010, 0.0105,
                          0.020, 0.0205,
                          0.70, 0.71,
                          0.50, 0.50,
                          0.25, 0.25,
                          0.002, 0.003,
                          0.001, 0.002,
                          0.04),
                          "safe geometry candidate should pass");
          
                  require(!GeometryPolicy.safeCandidate(
                          0.050, 0.040,
                          0.010, 0.010,
                          0.020, 0.020,
                          0.70, 0.70,
                          0.50, 0.50,
                          0.25, 0.25,
                          0.002, 0.002,
                          0.001, 0.001,
                          0.04),
                          "material detail loss must fail geometry QC");
          
                  System.out.println("GeometryPolicyHostChecks passed");
              }
          
              private static void require(boolean condition, String message) {
                  if (!condition) {
                      throw new AssertionError(message);
                  }
              }
          }
          ''')
          
          print('v0.4.24 Geometry Intelligence applied')
          print('Conservative horizon levelling enabled')
          print('Perspective/keystone correction enabled only on opposing vertical-line consensus')
          print('Radial lens correction enabled only on orthogonal four-quadrant curvature consensus')
          print('All geometry candidates require rollback QC')
          print('v0.4.23 colour/neural/person/optics/vignetting/background protections retained')
          PY

          grep -q "versionCode 33" "$PROJECT/app/build.gradle"
          grep -q "versionName '0.4.24'" "$PROJECT/app/build.gradle"
          grep -q "class GeometryPolicy"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/GeometryPolicy.java"
          grep -q "class GeometryIntelligence"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/GeometryIntelligence.java"
          grep -q "applyGeometryIntelligence"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"
          grep -q "GEOMETRY INTELLIGENCE"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"
          grep -q "applyColourSpaceGuard"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"
          grep -q "Final shadow-integrity guard: ROLLBACK"             "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

      - name: Fetch pinned NAFNet-SIDD model
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.source.outputs.project }}"
          ASSETS="$PROJECT/app/src/main/assets"
          MODEL="$ASSETS/nafnet_sidd_width32_fp16.tflite"
          mkdir -p "$ASSETS"
          URL='https://huggingface.co/litert-community/NAFNet-SIDD-width32-LiteRT/resolve/main/nafnet_sidd_width32_fp16.tflite?download=true'
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --output "$MODEL.tmp" "$URL"
          mv "$MODEL.tmp" "$MODEL"
          test "$(stat -c%s "$MODEL")" -eq 62454048 || {
            echo "::error::Unexpected NAFNet model size"
            exit 1
          }
          echo 'f8fbaa422411683c53e802cf7cc7cf9be0a0de00886ad4af057232e26b172a0c  '"$MODEL" | sha256sum -c -

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run all safety host checks
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf host-checks
          mkdir host-checks
          javac -d host-checks             app/src/main/java/com/dennis/photomasterai/DeepPixelRepair.java             app/src/main/java/com/dennis/photomasterai/RepairSafetyPolicy.java             app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java             app/src/main/java/com/dennis/photomasterai/SocialSourcePolicy.java             app/src/main/java/com/dennis/photomasterai/NeuralIntegrityPolicy.java             app/src/main/java/com/dennis/photomasterai/OpticalFringePolicy.java             app/src/main/java/com/dennis/photomasterai/VignettingPolicy.java             app/src/main/java/com/dennis/photomasterai/PersonEvidencePolicy.java             app/src/main/java/com/dennis/photomasterai/HighRingFinishingPolicy.java             app/src/main/java/com/dennis/photomasterai/GeometryPolicy.java             tools/DeepPixelRepairHostChecks.java             tools/RepairSafetyPolicyHostChecks.java             tools/NeuralDenoisePolicyHostChecks.java             tools/SocialSourcePolicyHostChecks.java             tools/SmoothSurfaceGuardHostChecks.java             tools/NeuralIntegrityPolicyHostChecks.java             tools/OpticalFringePolicyHostChecks.java             tools/VignettingPolicyHostChecks.java             tools/PersonEvidencePolicyHostChecks.java             tools/HighBlendDetailGuardHostChecks.java             tools/HighRingFinishingPolicyHostChecks.java             tools/GeometryPolicyHostChecks.java
          java -cp host-checks com.dennis.photomasterai.DeepPixelRepairHostChecks
          java -cp host-checks com.dennis.photomasterai.RepairSafetyPolicyHostChecks
          java -cp host-checks com.dennis.photomasterai.NeuralDenoisePolicyHostChecks
          java -cp host-checks com.dennis.photomasterai.SocialSourcePolicyHostChecks
          java -cp host-checks com.dennis.photomasterai.SmoothSurfaceGuardHostChecks
          java -cp host-checks com.dennis.photomasterai.NeuralIntegrityPolicyHostChecks
          java -cp host-checks com.dennis.photomasterai.OpticalFringePolicyHostChecks
          java -cp host-checks com.dennis.photomasterai.VignettingPolicyHostChecks
          java -cp host-checks com.dennis.photomasterai.PersonEvidencePolicyHostChecks
          java -cp host-checks com.dennis.photomasterai.HighBlendDetailGuardHostChecks
          java -cp host-checks com.dennis.photomasterai.HighRingFinishingPolicyHostChecks
          java -cp host-checks com.dennis.photomasterai.GeometryPolicyHostChecks

      - name: Restore stable Photo Master debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photo-master-ai-debug-keystore-v1

      - name: Create signing key on first build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=Photo Master AI,O=Dennis Photo Master,C=AU"               -keyalg RSA               -keysize 2048               -validity 10000               -noprompt
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name 'sdkmanager' | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER" || {
            echo "::error::sdkmanager not found"
            exit 1
          }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

      - name: Build v0.4.24 APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace

      - name: Verify package and prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.source.outputs.project }}"
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || {
            echo "::error::APK not found"
            exit 1
          }

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK/build-tools/35.0.0/aapt"

          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='com.dennis.photomasterai'"
          echo "$BADGING" | grep -q "versionCode='33'"
          echo "$BADGING" | grep -q "versionName='0.4.24'"

          unzip -l "$APK" | grep -q             'assets/nafnet_sidd_width32_fp16.tflite'

          rm -rf artifact
          mkdir artifact

          OUT="artifact/PhotoMasterAI-v0.4.24-GEOMETRY-INTELLIGENCE.apk"
          cp "$APK" "$OUT"

          sha256sum "$OUT"             > "artifact/PhotoMasterAI-v0.4.24-GEOMETRY-INTELLIGENCE-SHA256.txt"

          cat > "artifact/PhotoMasterAI-v0.4.24-Notes.txt" <<'EOF'
          Photo Master AI — v0.4.24 Geometry Intelligence

          Version: 0.4.24
          versionCode: 33

          BASELINE
          Exact successful v0.4.23 source / run 37579163692.

          RETAINED UNCHANGED
          - sRGB / Display P3 preserve-source colour management
          - wide-gamut preview path
          - high-ring finishing guard
          - NAFNet-SIDD width32 / Classic LiteRT OpenCL GPU / FP32
          - adaptive neural blend recovery
          - person evidence guard
          - smooth-surface protection
          - local neural integrity guard
          - final shadow-integrity rollback
          - CA/fringe QC and rollback
          - measured vignetting intelligence
          - background and screen-off processing
          - full-resolution JPEG quality 100

          NEW — GEOMETRY INTELLIGENCE v1
          1. Horizon / level analysis
             - dominant near-horizontal edge voting
             - left/right agreement check
             - broad 8-zone horizontal span requirement
             - automatic correction limited to 0.35–1.50 degrees
             - maximum estimated crop 7%

          2. Perspective / keystone intelligence
             - independent left/right vertical-line convergence analysis
             - opposing convergence required
             - broad vertical-span evidence required
             - correction limited to <=2.2% edge expansion
             - same-direction lean is not treated as keystone

          3. Radial lens-distortion intelligence
             - horizontal and vertical straight-line curvature measured separately
             - all four quadrants required
             - orthogonal evidence must agree
             - correction limited to |k| <= 0.018
             - colour-space-aware bitmap-mesh correction

          4. Geometry rollback QC
             Every correction candidate is rejected if it causes unsafe:
             - detail loss
             - noise/chroma increase
             - ringing increase
             - tone/saturation shift
             - shadow/highlight clipping increase
             - cumulative crop above 8%

          IMPORTANT
          Geometry is deliberately conservative.
          A report saying WITHHELD is a correct result when the evidence is not
          strong enough. No geometry correction is preferable to false correction.

          FIRST TESTS
          - already-level landscape: should WITHHOLD horizon correction
          - slightly tilted horizon (~0.5–1.0 degree): should correct if line span agrees
          - building/playground: test vertical convergence
          - portrait/person: should usually leave geometry alone unless strong global evidence
          - flower/high-contrast subject: should not mistake subject brightness for geometry
          - Display P3 and sRGB sources: colour space must remain preserved
          EOF

      - name: Upload APK and continuation notes
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMasterAI-v0.4.24-GEOMETRY-INTELLIGENCE
          path: |
            artifact/PhotoMasterAI-v0.4.24-GEOMETRY-INTELLIGENCE.apk
            artifact/PhotoMasterAI-v0.4.24-GEOMETRY-INTELLIGENCE-SHA256.txt
            artifact/PhotoMasterAI-v0.4.24-Notes.txt
          if-no-files-found: error
          retention-days: 30
