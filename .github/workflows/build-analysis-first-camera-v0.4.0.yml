name: Build S23U Analysis-First Camera v0.4.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'S23U-Analysis-First-Camera-v0.4.1-GitHubBuildSource*.zip'
      - '.github/workflows/build-analysis-first-camera-v0.4.1.yml'

permissions:
  contents: read

jobs:
  build:
    name: S23U Analysis-First Camera v0.4.1 Clean Camera UI
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'S23U-Analysis-First-Camera-v0.4.1-GitHubBuildSource*.zip' -printf '%f\n' | sort -V | tail -n 1 || true)"
          test -n "$ZIP" || { echo "::error::No v0.4.1 source ZIP found"; exit 1; }
          echo "Using source ZIP: $ZIP"
          unzip -t "$ZIP"
          rm -rf analysis-first-build
          mkdir analysis-first-build
          unzip -q "$ZIP" -d analysis-first-build
          SETTINGS="$(find analysis-first-build -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1 || true)"
          test -n "$SETTINGS" || { echo "::error::settings.gradle not found"; exit 1; }
          PROJECT="$(dirname "$SETTINGS")"
          test -f "$PROJECT/app/build.gradle" || test -f "$PROJECT/app/build.gradle.kts" || {
            echo "::error::app/build.gradle not found"
            exit 1
          }
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1 || true)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo "::error::sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Run host checks
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf host-checks host-stubs
          mkdir -p host-checks host-stubs/android/os host-stubs/android/content

          cat > host-stubs/android/os/SystemClock.java <<'STUB'
          package android.os;
          public final class SystemClock {
              public static long elapsedRealtime() { return 0L; }
          }
          STUB

          cat > host-stubs/android/content/Context.java <<'STUB'
          package android.content;
          public class Context {
              public static final int MODE_PRIVATE = 0;
              public SharedPreferences getSharedPreferences(String name, int mode) { return null; }
          }
          STUB

          cat > host-stubs/android/content/SharedPreferences.java <<'STUB'
          package android.content;
          public interface SharedPreferences {
              int getInt(String key, int defValue);
              long getLong(String key, long defValue);
              Editor edit();
              interface Editor {
                  Editor putInt(String key, int value);
                  Editor putLong(String key, long value);
                  void apply();
              }
          }
          STUB

          javac -d host-checks \
            host-stubs/android/os/SystemClock.java \
            host-stubs/android/content/Context.java \
            host-stubs/android/content/SharedPreferences.java \
            app/src/main/java/com/s23u/procamera/DeviceGate.java \
            app/src/main/java/com/s23u/procamera/LensClassifier.java \
            app/src/main/java/com/s23u/procamera/ZoomRouting.java \
            app/src/main/java/com/s23u/procamera/OutputResolution.java \
            app/src/main/java/com/s23u/procamera/OpticalVerification.java \
            app/src/main/java/com/s23u/procamera/PortraitGeometry.java \
            app/src/main/java/com/s23u/procamera/StabilityPolicy.java \
            app/src/main/java/com/s23u/procamera/SceneStats.java \
            app/src/main/java/com/s23u/procamera/SmartAutoEngine.java \
            app/src/main/java/com/s23u/procamera/CoordinateMapper.java \
            app/src/main/java/com/s23u/procamera/ColourStats.java \
            app/src/main/java/com/s23u/procamera/LensColourProfile.java \
            app/src/main/java/com/s23u/procamera/LensCalibrationStore.java \
            app/src/main/java/com/s23u/procamera/NaturalTonality.java \
            app/src/main/java/com/s23u/procamera/DetailNoiseProfile.java \
            app/src/main/java/com/s23u/procamera/TrueColourDecision.java \
            tools/HostChecks.java
          java -cp host-checks com.s23u.procamera.HostChecks

      - name: Build signed release APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Verify package and collect APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.source.outputs.project }}"
          APK="$PROJECT/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "::error::Release APK not found at $APK"; exit 1; }

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK/build-tools/34.0.0/aapt"
          APKSIGNER="$SDK/build-tools/34.0.0/apksigner"
          BADGING="$($AAPT dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='com.dennis.analysisfirstcamera'" || exit 1
          echo "$BADGING" | grep -q "versionCode='7'" || { echo "::error::APK versionCode is not 7"; exit 1; }
          echo "$BADGING" | grep -q "versionName='0.4.1'" || { echo "::error::APK versionName is not 0.4.1"; exit 1; }
          "$APKSIGNER" verify --verbose "$APK"

          rm -rf artifact
          mkdir artifact
          OUT="artifact/S23U-Analysis-First-Camera-v0.4.1-CLEAN-CAMERA-UI.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "artifact/S23U-Analysis-First-Camera-v0.4.1-CLEAN-CAMERA-UI-SHA256.txt"
          ls -lh artifact

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S23U-Analysis-First-Camera-v0.4.1-CLEAN-CAMERA-UI
          path: |
            artifact/S23U-Analysis-First-Camera-v0.4.1-CLEAN-CAMERA-UI.apk
            artifact/S23U-Analysis-First-Camera-v0.4.1-CLEAN-CAMERA-UI-SHA256.txt
          if-no-files-found: error
          retention-days: 30
