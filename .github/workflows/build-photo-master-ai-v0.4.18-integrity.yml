      - name: Restore stable Photo Master debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photo-master-ai-debug-keystore-v1

      - name: Create signing key on first build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Photo Master AI,O=Dennis Photo Master,C=AU" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$SDK/cmdline-tools" \
                -type f \
                -name 'sdkmanager' \
                | sort -V \
                | tail -n 1
            )"
          fi

          test -n "$SDKMANAGER" || {
            echo "::error::sdkmanager not found"
            exit 1
          }

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build v0.4.18 APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:assembleDebug \
            --stacktrace

      - name: Verify package and prepare artifact
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "::error::APK not found"
            exit 1
          }

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK/build-tools/35.0.0/aapt"

          BADGING="$(
            "$AAPT" dump badging "$APK" \
              | head -n 1
          )"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -q "package: name='com.dennis.photomasterai'"

          echo "$BADGING" \
            | grep -q "versionCode='27'"

          echo "$BADGING" \
            | grep -q "versionName='0.4.18'"

          unzip -l "$APK" \
            | grep -q 'assets/nafnet_sidd_width32_fp16.tflite'

          rm -rf artifact
          mkdir artifact

          OUT="artifact/PhotoMasterAI-v0.4.18-NEURAL-INTEGRITY-GUARD.apk"

