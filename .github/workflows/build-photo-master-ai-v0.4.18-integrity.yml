name: Build Photo Master AI v0.4.18 Integrity Guard Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-photo-master-ai-v0.4.18-integrity.yml'

permissions:
  contents: read

jobs:
  build:
    name: Photo Master AI v0.4.18 Neural Integrity Guard
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover intended v0.4.18 source and fix compile accessor
        id: source
        shell: bash
        run: |
          set -euo pipefail

          FAILED_COMMIT="c5d57e5193906ef4a0354c25dcdd2f25995ef5fd"

          git cat-file -e "${FAILED_COMMIT}^{commit}" || {
            echo "::error::Pinned v0.4.18 integrity commit unavailable"
            exit 1
          }

          git show \
            "${FAILED_COMMIT}:.github/workflows/build-photo-master-ai-v0.4.18-integrity.yml" \
            > /tmp/v0418-integrity.yml

          python3 - <<'PY'
          from pathlib import Path

          lines = Path(
              "/tmp/v0418-integrity.yml"
          ).read_text().splitlines()

          def extract_step(name, destination):
              step = None

              for i, line in enumerate(lines):
                  if line.strip() == "- name: " + name:
                      step = i
                      break

              if step is None:
                  raise RuntimeError(
                      "Workflow step not found: " + name
                  )

              run = None

              for i in range(step, len(lines)):
                  if lines[i].strip() == "run: |":
                      run = i
                      break

                  if (
                      i > step
                      and lines[i].startswith("      - name:")
                  ):
                      break

              if run is None:
                  raise RuntimeError(
                      "Run block not found: " + name
                  )

              body = []

              for line in lines[run + 1:]:
                  if line.startswith("      - name:"):
                      break

                  if not line.strip():
                      body.append("")

                  elif line.startswith("          "):
                      body.append(line[10:])

                  else:
                      raise RuntimeError(
                          "Unexpected indentation while extracting: "
                          + name
                      )

              Path(destination).write_text(
                  "\n".join(body) + "\n"
              )

          extract_step(
              "Recover exact successful v0.4.17 source",
              "/tmp/recover-v0417-source.sh"
          )

          extract_step(
              "Apply v0.4.18 neural integrity guard",
              "/tmp/apply-v0418-integrity.sh"
          )

          print(
              "Extracted intended v0.4.18 integrity construction"
          )
          PY

          bash /tmp/recover-v0417-source.sh

          PROJECT="$(
            find photomaster-v044-build \
              -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -printf '%h\n' \
              | head -n 1
          )"

          test -n "$PROJECT" || {
            echo "::error::Recovered project not found"
            exit 1
          }

          export PROJECT

          bash /tmp/apply-v0418-integrity.sh

          python3 - <<'PY'
          from pathlib import Path
          import os

          project = Path(os.environ["PROJECT"])

          main_file = project / (
              "app/src/main/java/com/dennis/"
              "photomasterai/MainActivity.java"
          )

          main = main_file.read_text()

          old_guard = "\n".join([
              "        if (result == null",
              "                || result.bitmap == null",
              "                || result.analysis == null",
              "                || checkpointBitmap == null",
              "                || checkpointBitmap.isRecycled()",
              "                || checkpointAnalysis == null) {",
          ])

          new_guard = "\n".join([
              "        if (result == null",
              "                || result.bitmap == null",
              "                || result.bitmap.isRecycled()",
              "                || checkpointBitmap == null",
              "                || checkpointBitmap.isRecycled()",
              "                || checkpointAnalysis == null) {",
          ])

          if old_guard not in main:
              raise RuntimeError(
                  "v0.4.18 bad Result.analysis guard not found"
              )

          main = main.replace(
              old_guard,
              new_guard,
              1
          )

          analysis_anchor = "\n".join([
              "        boolean shadowUnsafe =",
              "                NeuralIntegrityPolicy.finalShadowCollapseUnsafe(",
          ])

          analysis_replacement = "\n".join([
              "        PhotoAnalysis outputAnalysis =",
              "                PhotoAnalysis.analyse(",
              "                        result.bitmap);",
              "",
              "        boolean shadowUnsafe =",
              "                NeuralIntegrityPolicy.finalShadowCollapseUnsafe(",
          ])

          if analysis_anchor not in main:
              raise RuntimeError(
                  "Final shadow-analysis insertion anchor not found"
              )

          main = main.replace(
              analysis_anchor,
              analysis_replacement,
              1
          )

          main = main.replace(
              "result.analysis.shadowClip",
              "outputAnalysis.shadowClip"
          )

          main = main.replace(
              "result.analysis.blackFraction",
              "outputAnalysis.blackFraction"
          )

          if "result.analysis" in main:
              raise RuntimeError(
                  "Unsupported PhotoMasterEngine.Result.analysis "
                  "reference remains"
              )

          main_file.write_text(main)

          print(
              "Compile accessor fixed: final output is re-analysed "
              "directly from result.bitmap"
          )
          PY

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          grep -q \
            "versionCode 27" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "versionName '0.4.18'" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "class NeuralIntegrityPolicy" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralIntegrityPolicy.java"

          grep -q \
            "class NeuralIntegrityGuard" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralIntegrityGuard.java"

          grep -q \
            "PhotoAnalysis outputAnalysis" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

          if grep -q \
            "result.analysis" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"
          then
            echo "::error::Unsupported result.analysis accessor still present"
            exit 1
          fi

          grep -q \
            "localized tile/shadow integrity failure" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

          grep -q \
            "Final shadow-integrity guard: ROLLBACK" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

          grep -q \
            "ring allowance +0.025" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "SOFT_TOTAL_NEURAL_MS = 90_000L" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "MAX_TOTAL_NEURAL_MS = 240_000L" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "MAX_TILE_MS = 8_000L" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "Authoritative-original checkpoint: VERIFIED" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

          grep -q \
            "GpuBackend.OPENCL" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiserRuntime.kt"

          if grep -q \
            "new NeuralDenoiserRuntime(context, true)" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"
          then
            echo "::error::CPU neural fallback detected"
            exit 1
          fi

          echo "Corrected v0.4.18 integrity source verified"

      - name: Fetch pinned NAFNet-SIDD model
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"
          ASSETS="$PROJECT/app/src/main/assets"
          MODEL="$ASSETS/nafnet_sidd_width32_fp16.tflite"

          mkdir -p "$ASSETS"

          URL='https://huggingface.co/litert-community/NAFNet-SIDD-width32-LiteRT/resolve/main/nafnet_sidd_width32_fp16.tflite?download=true'

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --output "$MODEL.tmp" \
            "$URL"

          mv "$MODEL.tmp" "$MODEL"

          test "$(stat -c%s "$MODEL")" -eq 62454048 || {
            echo "::error::Unexpected NAFNet model size"
            exit 1
          }

          echo \
          'f8fbaa422411683c53e802cf7cc7cf9be0a0de00886ad4af057232e26b172a0c  '"$MODEL" \
          | sha256sum -c -

          echo "Pinned NAFNet-SIDD model verified"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run all safety host checks
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf host-checks
          mkdir host-checks

          javac -d host-checks \
            app/src/main/java/com/dennis/photomasterai/DeepPixelRepair.java \
            app/src/main/java/com/dennis/photomasterai/RepairSafetyPolicy.java \
            app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java \
            app/src/main/java/com/dennis/photomasterai/SocialSourcePolicy.java \
            app/src/main/java/com/dennis/photomasterai/NeuralIntegrityPolicy.java \
            tools/DeepPixelRepairHostChecks.java \
            tools/RepairSafetyPolicyHostChecks.java \
            tools/NeuralDenoisePolicyHostChecks.java \
            tools/SocialSourcePolicyHostChecks.java \
            tools/SmoothSurfaceGuardHostChecks.java \
            tools/NeuralIntegrityPolicyHostChecks.java

          java -cp host-checks \
            com.dennis.photomasterai.DeepPixelRepairHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.RepairSafetyPolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.NeuralDenoisePolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.SocialSourcePolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.SmoothSurfaceGuardHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.NeuralIntegrityPolicyHostChecks

      - name: Restore stable Photo Master debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photo-master-ai-debug-keystore-v1

      - name: Create signing key on first build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Photo Master AI,O=Dennis Photo Master,C=AU" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$SDK/cmdline-tools" \
                -type f \
                -name 'sdkmanager' \
                | sort -V \
                | tail -n 1
            )"
          fi

          test -n "$SDKMANAGER" || {
            echo "::error::sdkmanager not found"
            exit 1
          }

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build v0.4.18 APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:assembleDebug \
            --stacktrace

      - name: Verify package and prepare artifact
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "::error::APK not found"
            exit 1
          }

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK/build-tools/35.0.0/aapt"

          BADGING="$(
            "$AAPT" dump badging "$APK" \
              | head -n 1
          )"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -q "package: name='com.dennis.photomasterai'"

          echo "$BADGING" \
            | grep -q "versionCode='27'"

          echo "$BADGING" \
            | grep -q "versionName='0.4.18'"

          unzip -l "$APK" \
            | grep -q 'assets/nafnet_sidd_width32_fp16.tflite'

          rm -rf artifact
          mkdir artifact

          OUT="artifact/PhotoMasterAI-v0.4.18-NEURAL-INTEGRITY-GUARD.apk"

          cp "$APK" "$OUT"

          sha256sum "$OUT" \
            > "artifact/PhotoMasterAI-v0.4.18-NEURAL-INTEGRITY-GUARD-SHA256.txt"

          cat > "artifact/PhotoMasterAI-v0.4.18-Notes.txt" <<EOF
          Photo Master AI — v0.4.18 Continuation Notes

          Version:
          v0.4.18

          versionCode:
          27

          BASELINE
          Exact successful v0.4.17 source.

          v0.4.17 commit:
          e8ce236742228236b9e113163a527498fcf0f15e

          INTEGRITY PATCH SOURCE
          c5d57e5193906ef4a0354c25dcdd2f25995ef5fd

          FIRST v0.4.18 BUILD FAILURE
          All source generation and host checks passed.

          APK compilation failed because PhotoMasterEngine.Result
          does not expose a public analysis field.

          FIX
          Final-output integrity now analyses result.bitmap directly:

          PhotoAnalysis outputAnalysis =
              PhotoAnalysis.analyse(result.bitmap);

          Shadow clipping and black-fraction checks use this measured
          outputAnalysis.

          Integrity thresholds are unchanged.

          FAILED OPTICS BUILD
          NOT included.

          FROZEN v0.4.17 NEURAL BASELINE
          - NAFNet-SIDD width32
          - Classic LiteRT OpenCL GPU
          - FP32
          - NCHW FLOAT32 [1,3,256,256]
          - no CPU neural fallback
          - 8-second per-tile hard guard
          - 90-second soft total warning
          - 240-second hard total ceiling
          - smooth 5% high-ring blend cap
          - smooth ring allowance +0.025
          - adaptive recovery
          - authoritative-original checkpoint

          v0.4.18 GUARD 1
          Neural Local Integrity Guard.

          It compares the original source against an accepted neural
          result in 128x128 regions.

          It looks for:
          - abnormal local tone changes;
          - localized shadow collapse;
          - catastrophic blocks;
          - neighbouring block/tile discontinuities.

          v0.4.18 GUARD 2
          Final Shadow Integrity Guard.

          It compares final PhotoMaster output with the exact
          pre-finishing checkpoint.

          Severe increases in shadow clipping or black coverage
          restore the checkpoint.

          WATERFALL REFERENCE
          neural checkpoint:
          shadow clip approximately 0.07%
          black approximately 2.4%

          bad final:
          shadow clip approximately 1.76%
          black approximately 8.1%

          This condition must trigger rollback.

          FIRST DEVICE TESTS
          1. Exact waterfall failure photo.
          2. Exact duck success photo.
          3. Clean person photo.
          4. Clean daylight landscape.

          Optics remains postponed until integrity testing passes.
          EOF

          echo "v0.4.18 APK and continuation notes prepared"

      - name: Upload APK and continuation notes
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMasterAI-v0.4.18-NEURAL-INTEGRITY-GUARD
          path: |
            artifact/PhotoMasterAI-v0.4.18-NEURAL-INTEGRITY-GUARD.apk
            artifact/PhotoMasterAI-v0.4.18-NEURAL-INTEGRITY-GUARD-SHA256.txt
            artifact/PhotoMasterAI-v0.4.18-Notes.txt
          if-no-files-found: error
          retention-days: 30
