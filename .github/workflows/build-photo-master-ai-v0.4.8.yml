name: Build Photo Master AI v0.4.8 Adaptive QC Diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-photo-master-ai-v0.4.8.yml'

permissions:
  contents: read

jobs:
  build:
    name: Photo Master AI v0.4.8 Adaptive QC Diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild exact v0.4.7 source baseline
        id: source
        shell: bash
        run: |
          set -euo pipefail

          BASE=".github/workflows/build-photo-master-ai-v0.4.7.yml"

          test -f "$BASE" || {
            echo "::error::Known-good v0.4.7 workflow missing"
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path

          source = Path(
              ".github/workflows/build-photo-master-ai-v0.4.7.yml"
          )

          lines = source.read_text().splitlines()

          def extract_step(name, destination):
              step = None

              for i, line in enumerate(lines):
                  if line.strip() == "- name: " + name:
                      step = i
                      break

              if step is None:
                  raise RuntimeError(
                      "Workflow step not found: " + name
                  )

              run = None

              for i in range(step, len(lines)):
                  if lines[i].strip() == "run: |":
                      run = i
                      break

                  if (
                      i > step
                      and lines[i].startswith("      - name:")
                  ):
                      break

              if run is None:
                  raise RuntimeError(
                      "Run block not found: " + name
                  )

              body = []

              for line in lines[run + 1:]:
                  if line.startswith("      - name:"):
                      break

                  if not line.strip():
                      body.append("")
                  elif line.startswith("          "):
                      body.append(line[10:])
                  else:
                      raise RuntimeError(
                          "Unexpected indentation in: " + name
                      )

              Path(destination).write_text(
                  "\n".join(body) + "\n"
              )

          extract_step(
              "Build v0.4.5 baseline and apply v0.4.6 stability fixes",
              "/tmp/v046-source.sh"
          )

          extract_step(
              "Apply v0.4.7 low-detail QC and classifier hotfix",
              "/tmp/v047-patch.sh"
          )

          print("Extracted exact v0.4.7 construction steps")
          PY

          bash /tmp/v046-source.sh

          SETTINGS="$(
            find photomaster-v044-build \
              -type f \
              -name 'settings.gradle' \
              | head -n 1
          )"

          if [ -z "$SETTINGS" ]; then
            SETTINGS="$(
              find photomaster-v044-build \
                -type f \
                -name 'settings.gradle.kts' \
                | head -n 1
            )"
          fi

          test -n "$SETTINGS" || {
            echo "::error::Generated project not found"
            exit 1
          }

          PROJECT="$(dirname "$SETTINGS")"

          export PROJECT

          bash /tmp/v047-patch.sh

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          grep -q \
            "versionCode 16" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "versionName '0.4.7'" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "lowDetailRecoverySafe" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java"

          grep -q \
            "Adaptive blend recovery" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "GpuBackend.OPENCL" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiserRuntime.kt"

          echo "Exact v0.4.7 source baseline reconstructed"

      - name: Apply v0.4.8 adaptive QC diagnostics
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os

          project = Path(os.environ["PROJECT"])

          # =====================================================
          # VERSION
          # =====================================================

          build_file = project / "app/build.gradle"
          build = build_file.read_text()

          if "versionCode 16" not in build:
              raise RuntimeError(
                  "v0.4.7 versionCode 16 not found"
              )

          if "versionName '0.4.7'" not in build:
              raise RuntimeError(
                  "v0.4.7 versionName not found"
              )

          build = build.replace(
              "versionCode 16",
              "versionCode 17",
              1
          )

          build = build.replace(
              "versionName '0.4.7'",
              "versionName '0.4.8'",
              1
          )

          build_file.write_text(build)

          # =====================================================
          # ADAPTIVE QC DIAGNOSTICS ONLY
          #
          # NO QC THRESHOLDS OR IMAGE PROCESSING ARE CHANGED.
          # =====================================================

          neural_file = project / (
              "app/src/main/java/com/dennis/"
              "photomasterai/NeuralDenoiser.java"
          )

          neural = neural_file.read_text()

          # Replace initial failed-candidate trace.

          old_initial = """            adaptiveTrace.append(String.format(
                    Locale.US,
                    "%.0f%% failed (%s)",
                    decision.blend * 100.0,
                    quality.reason));"""

          new_initial = """            appendAdaptiveDiagnostic(
                    adaptiveTrace,
                    decision.blend,
                    before,
                    after,
                    quality);"""

          if old_initial not in neural:
              raise RuntimeError(
                  "Initial adaptive trace block not found"
              )

          neural = neural.replace(
              old_initial,
              new_initial,
              1
          )

          # Replace each adaptive trial's simple accepted/failed
          # message with full diagnostic information.

          old_trial = """                adaptiveTrace.append(String.format(
                        Locale.US,
                        " -> %.0f%% %s",
                        trialBlend * 100.0,
                        trialQuality.accepted
                                ? "accepted"
                                : "failed"));"""

          new_trial = """                appendAdaptiveDiagnostic(
                        adaptiveTrace,
                        trialBlend,
                        before,
                        trialAfter,
                        trialQuality);"""

          if old_trial not in neural:
              raise RuntimeError(
                  "Adaptive trial trace block not found"
              )

          neural = neural.replace(
              old_trial,
              new_trial,
              1
          )

          # Insert diagnostics helper immediately before
          # blendCandidate(). It reads measurements only.

          anchor = (
              "    private static Bitmap blendCandidate("
          )

          if anchor not in neural:
              raise RuntimeError(
                  "blendCandidate insertion anchor not found"
              )

          helper = r'''    private static void appendAdaptiveDiagnostic(
            StringBuilder trace,
            double blend,
            PhotoAnalysis before,
            PhotoAnalysis after,
            NeuralDenoisePolicy.Quality quality) {

        double beforeNoise =
                Math.max(1.0e-9, before.noise);

        double beforeChroma =
                Math.max(1.0e-9, before.flatChromaNoise);

        double beforeDetail =
                Math.max(1.0e-9, before.detail);

        double noiseBenefit =
                (before.noise - after.noise)
                        / beforeNoise
                        * 100.0;

        double chromaBenefit =
                (before.flatChromaNoise
                        - after.flatChromaNoise)
                        / beforeChroma
                        * 100.0;

        double detailLoss =
                Math.max(
                        0.0,
                        before.detail - after.detail);

        double detailRatio =
                after.detail
                        / beforeDetail
                        * 100.0;

        double beforeDr =
                before.p95 - before.p05;

        double afterDr =
                after.p95 - after.p05;

        double ringDelta =
                after.ringing - before.ringing;

        double medianDelta =
                after.medianLum - before.medianLum;

        double drDelta =
                afterDr - beforeDr;

        double satDelta =
                after.avgSat - before.avgSat;

        double shadowClipDelta =
                after.shadowClip - before.shadowClip;

        double highlightClipDelta =
                after.highlightClip - before.highlightClip;

        if (trace.length() > 0) {
            trace.append("\n  ↳ ");
        }

        trace.append(String.format(
                Locale.US,
                "%.0f%% %s"
                        + " | noise %.4f→%.4f (%+.1f%%)"
                        + " | chroma %.4f→%.4f (%+.1f%%)"
                        + " | detail %.4f→%.4f"
                        + " loss %.4f"
                        + " ratio %.1f%%"
                        + " | ring %.3f→%.3f Δ%+.3f"
                        + " | median Δ%+.4f"
                        + " | DR Δ%+.4f"
                        + " | sat Δ%+.4f"
                        + " | clip S Δ%+.4f"
                        + " / H Δ%+.4f"
                        + " | reason: %s",
                blend * 100.0,
                quality.accepted
                        ? "ACCEPTED"
                        : "FAILED",
                before.noise,
                after.noise,
                noiseBenefit,
                before.flatChromaNoise,
                after.flatChromaNoise,
                chromaBenefit,
                before.detail,
                after.detail,
                detailLoss,
                detailRatio,
                before.ringing,
                after.ringing,
                ringDelta,
                medianDelta,
                drDelta,
                satDelta,
                shadowClipDelta,
                highlightClipDelta,
                quality.reason));
    }

'''

          neural = neural.replace(
              anchor,
              helper + anchor,
              1
          )

          neural_file.write_text(neural)

          print("v0.4.8 adaptive QC diagnostics applied")
          print("No image-processing decisions changed")
          print("No NAFNet settings changed")
          print("No QC thresholds changed")
          print("No adaptive blend strengths changed")
          PY

          grep -q \
            "versionCode 17" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "versionName '0.4.8'" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "appendAdaptiveDiagnostic" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "detail %.4f" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "reason: %s" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "lowDetailRecoverySafe" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java"

          grep -q \
            "MAX_TOTAL_NEURAL_MS = 90_000L" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "GpuBackend.OPENCL" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiserRuntime.kt"

          if grep -q \
            "new NeuralDenoiserRuntime(context, true)" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"
          then
            echo "::error::CPU neural fallback detected"
            exit 1
          fi

          echo "v0.4.8 source verification passed"

      - name: Fetch pinned NAFNet-SIDD model
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"

          ASSETS="$PROJECT/app/src/main/assets"

          MODEL="$ASSETS/nafnet_sidd_width32_fp16.tflite"

          mkdir -p "$ASSETS"

          URL='https://huggingface.co/litert-community/NAFNet-SIDD-width32-LiteRT/resolve/main/nafnet_sidd_width32_fp16.tflite?download=true'

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --output "$MODEL.tmp" \
            "$URL"

          mv "$MODEL.tmp" "$MODEL"

          test "$(stat -c%s "$MODEL")" -eq 62454048 || {
            echo "::error::Unexpected NAFNet model size"
            exit 1
          }

          echo \
          'f8fbaa422411683c53e802cf7cc7cf9be0a0de00886ad4af057232e26b172a0c  '"$MODEL" \
          | sha256sum -c -

          echo "Pinned NAFNet-SIDD model verified"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run restoration safety host checks
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf host-checks
          mkdir host-checks

          javac -d host-checks \
            app/src/main/java/com/dennis/photomasterai/DeepPixelRepair.java \
            app/src/main/java/com/dennis/photomasterai/RepairSafetyPolicy.java \
            app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java \
            app/src/main/java/com/dennis/photomasterai/SocialSourcePolicy.java \
            tools/DeepPixelRepairHostChecks.java \
            tools/RepairSafetyPolicyHostChecks.java \
            tools/NeuralDenoisePolicyHostChecks.java \
            tools/SocialSourcePolicyHostChecks.java

          java -cp host-checks \
            com.dennis.photomasterai.DeepPixelRepairHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.RepairSafetyPolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.NeuralDenoisePolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.SocialSourcePolicyHostChecks

      - name: Restore stable Photo Master debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photo-master-ai-debug-keystore-v1

      - name: Create signing key on first build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Photo Master AI,O=Dennis Photo Master,C=AU" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$SDK/cmdline-tools" \
                -type f \
                -name 'sdkmanager' \
                | sort -V \
                | tail -n 1
            )"
          fi

          test -n "$SDKMANAGER" || {
            echo "::error::sdkmanager not found"
            exit 1
          }

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build v0.4.8 APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:assembleDebug \
            --stacktrace

      - name: Verify package and collect APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "::error::APK not found"
            exit 1
          }

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          AAPT="$SDK/build-tools/35.0.0/aapt"

          BADGING="$(
            "$AAPT" dump badging "$APK" \
              | head -n 1
          )"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -q \
            "package: name='com.dennis.photomasterai'"

          echo "$BADGING" \
            | grep -q \
            "versionCode='17'"

          echo "$BADGING" \
            | grep -q \
            "versionName='0.4.8'"

          unzip -l "$APK" \
            | grep -q \
            'assets/nafnet_sidd_width32_fp16.tflite'

          rm -rf artifact
          mkdir artifact

          OUT="artifact/PhotoMasterAI-v0.4.8-ADAPTIVE-QC-DIAGNOSTICS.apk"

          cp "$APK" "$OUT"

          sha256sum "$OUT" \
            > "artifact/PhotoMasterAI-v0.4.8-ADAPTIVE-QC-DIAGNOSTICS-SHA256.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMasterAI-v0.4.8-ADAPTIVE-QC-DIAGNOSTICS
          path: |
            artifact/PhotoMasterAI-v0.4.8-ADAPTIVE-QC-DIAGNOSTICS.apk
            artifact/PhotoMasterAI-v0.4.8-ADAPTIVE-QC-DIAGNOSTICS-SHA256.txt
          if-no-files-found: error
          retention-days: 30
