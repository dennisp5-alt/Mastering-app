name: Build Photo Master AI v0.4.13 Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-photo-master-ai-v0.4.13-recovery.yml'

permissions:
  contents: read

jobs:
  build:
    name: Photo Master AI v0.4.13 Smooth-Surface Terminal Guard
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover exact v0.4.12 source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          V0412_RECOVERY_COMMIT="785d5ed5e056faf53a5682ccdea539a0fae7f003"

          git cat-file -e "${V0412_RECOVERY_COMMIT}^{commit}" || {
            echo "::error::Known-good v0.4.12 recovery commit unavailable"
            exit 1
          }

          git show \
            "${V0412_RECOVERY_COMMIT}:.github/workflows/build-photo-master-ai-v0.4.12-recovery.yml" \
            > /tmp/v0412-recovery.yml

          python3 - <<'PY'
          from pathlib import Path

          lines = Path(
              "/tmp/v0412-recovery.yml"
          ).read_text().splitlines()

          target = "Recover and build exact v0.4.12 source"

          step = None

          for i, line in enumerate(lines):
              if line.strip() == "- name: " + target:
                  step = i
                  break

          if step is None:
              raise RuntimeError(
                  "Known-good v0.4.12 recovery source step not found"
              )

          run = None

          for i in range(step, len(lines)):
              if lines[i].strip() == "run: |":
                  run = i
                  break

              if (
                  i > step
                  and lines[i].startswith("      - name:")
              ):
                  break

          if run is None:
              raise RuntimeError(
                  "Known-good v0.4.12 recovery run block not found"
              )

          body = []

          for line in lines[run + 1:]:
              if line.startswith("      - name:"):
                  break

              if not line.strip():
                  body.append("")

              elif line.startswith("          "):
                  body.append(line[10:])

              else:
                  raise RuntimeError(
                      "Unexpected indentation while recovering v0.4.12"
                  )

          Path("/tmp/recover-v0412.sh").write_text(
              "\n".join(body) + "\n"
          )
          PY

          bash /tmp/recover-v0412.sh

          PROJECT="$(
            find photomaster-v044-build \
              -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -printf '%h\n' \
              | head -n 1
          )"

          test -n "$PROJECT" || {
            echo "::error::Recovered v0.4.12 project not found"
            exit 1
          }

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          grep -q \
            "versionCode 21" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "versionName '0.4.12'" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "smoothSurfaceProtection" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/PhotoMasterEngine.java"

          grep -q \
            "applySmoothSurfaceGuard" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java"

          grep -q \
            "GpuBackend.OPENCL" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiserRuntime.kt"

          if grep -q \
            "new NeuralDenoiserRuntime(context, true)" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"
          then
            echo "::error::CPU neural fallback detected in recovered v0.4.12"
            exit 1
          fi

          echo "Exact known-good v0.4.12 source recovered"

      - name: Apply known-good v0.4.13 patch
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail

          V0413_PATCH_COMMIT="e8e11d4b5f9ba23c102061808fb2a6c12ed0cb55"

          git cat-file -e "${V0413_PATCH_COMMIT}^{commit}" || {
            echo "::error::Known-good v0.4.13 patch commit unavailable"
            exit 1
          }

          git show \
            "${V0413_PATCH_COMMIT}:.github/workflows/build-photo-master-ai-v0.4.13.yml" \
            > /tmp/v0413-patch-source.yml

          python3 - <<'PY'
          from pathlib import Path

          lines = Path(
              "/tmp/v0413-patch-source.yml"
          ).read_text().splitlines()

          target = "Apply v0.4.13 terminal guard"

          step = None

          for i, line in enumerate(lines):
              if line.strip() == "- name: " + target:
                  step = i
                  break

          if step is None:
              raise RuntimeError(
                  "Known-good v0.4.13 patch step not found"
              )

          run = None

          for i in range(step, len(lines)):
              if lines[i].strip() == "run: |":
                  run = i
                  break

              if (
                  i > step
                  and lines[i].startswith("      - name:")
              ):
                  break

          if run is None:
              raise RuntimeError(
                  "Known-good v0.4.13 patch run block not found"
              )

          body = []

          for line in lines[run + 1:]:
              if line.startswith("      - name:"):
                  break

              if not line.strip():
                  body.append("")

              elif line.startswith("          "):
                  body.append(line[10:])

              else:
                  raise RuntimeError(
                      "Unexpected indentation in known-good v0.4.13 patch"
                  )

          Path("/tmp/apply-v0413.sh").write_text(
              "\n".join(body) + "\n"
          )
          PY

          bash /tmp/apply-v0413.sh

          grep -q \
            "versionCode 22" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "versionName '0.4.13'" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "smoothSurfaceTerminalGuard" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/PhotoMasterEngine.java"

          grep -q \
            "smooth metric floor; lower blends skipped" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            'report.contains("Neural rollback:")' \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

          echo "Known-good v0.4.13 terminal patch applied"

      - name: Enforce exact original-pixel terminal output
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os

          project = Path(os.environ["PROJECT"])

          engine_file = project / (
              "app/src/main/java/com/dennis/"
              "photomasterai/PhotoMasterEngine.java"
          )

          s = engine_file.read_text()

          old = "\n".join([
              "        Bitmap out = Bitmap.createBitmap(source.getWidth(), source.getHeight(), Bitmap.Config.ARGB_8888);",
              "        renderChunked(source, out, p);",
          ])

          new = "\n".join([
              "        Bitmap out;",
              "",
              "        if (p.smoothSurfaceTerminalGuard) {",
              "            out = source.copy(",
              "                    Bitmap.Config.ARGB_8888,",
              "                    false);",
              "",
              "            if (out == null) {",
              "                throw new IllegalStateException(",
              "                        \"Unable to retain terminal original pixels\");",
              "            }",
              "",
              "        } else {",
              "            out = Bitmap.createBitmap(",
              "                    source.getWidth(),",
              "                    source.getHeight(),",
              "                    Bitmap.Config.ARGB_8888);",
              "",
              "            renderChunked(source, out, p);",
              "        }",
          ])

          if old not in s:
              raise RuntimeError(
                  "Correct one-line master render anchor not found"
              )

          s = s.replace(
              old,
              new,
              1
          )

          engine_file.write_text(s)

          print(
              "Terminal smooth scenes now copy authoritative original pixels exactly"
          )
          PY

          grep -q \
            "if (p.smoothSurfaceTerminalGuard)" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/PhotoMasterEngine.java"

          grep -q \
            "Unable to retain terminal original pixels" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/PhotoMasterEngine.java"

          grep -q \
            "Smooth-scene terminal protection: ORIGINAL RETAINED" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/PhotoMasterEngine.java"

          grep -q \
            "GpuBackend.OPENCL" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiserRuntime.kt"

          if grep -q \
            "new NeuralDenoiserRuntime(context, true)" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"
          then
            echo "::error::CPU neural fallback detected"
            exit 1
          fi

          echo "v0.4.13 exact terminal path verification passed"

      - name: Fetch pinned NAFNet-SIDD model
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"

          ASSETS="$PROJECT/app/src/main/assets"
          MODEL="$ASSETS/nafnet_sidd_width32_fp16.tflite"

          mkdir -p "$ASSETS"

          URL='https://huggingface.co/litert-community/NAFNet-SIDD-width32-LiteRT/resolve/main/nafnet_sidd_width32_fp16.tflite?download=true'

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --output "$MODEL.tmp" \
            "$URL"

          mv "$MODEL.tmp" "$MODEL"

          test "$(stat -c%s "$MODEL")" -eq 62454048 || {
            echo "::error::Unexpected NAFNet model size"
            exit 1
          }

          echo \
          'f8fbaa422411683c53e802cf7cc7cf9be0a0de00886ad4af057232e26b172a0c  '"$MODEL" \
          | sha256sum -c -

          echo "Pinned NAFNet-SIDD model verified"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run all safety host checks
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf host-checks
          mkdir host-checks

          javac -d host-checks \
            app/src/main/java/com/dennis/photomasterai/DeepPixelRepair.java \
            app/src/main/java/com/dennis/photomasterai/RepairSafetyPolicy.java \
            app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java \
            app/src/main/java/com/dennis/photomasterai/SocialSourcePolicy.java \
            tools/DeepPixelRepairHostChecks.java \
            tools/RepairSafetyPolicyHostChecks.java \
            tools/NeuralDenoisePolicyHostChecks.java \
            tools/SocialSourcePolicyHostChecks.java \
            tools/SmoothSurfaceGuardHostChecks.java

          java -cp host-checks \
            com.dennis.photomasterai.DeepPixelRepairHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.RepairSafetyPolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.NeuralDenoisePolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.SocialSourcePolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.SmoothSurfaceGuardHostChecks

      - name: Restore stable Photo Master debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photo-master-ai-debug-keystore-v1

      - name: Create signing key on first build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Photo Master AI,O=Dennis Photo Master,C=AU" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$SDK/cmdline-tools" \
                -type f \
                -name 'sdkmanager' \
                | sort -V \
                | tail -n 1
            )"
          fi

          test -n "$SDKMANAGER" || {
            echo "::error::sdkmanager not found"
            exit 1
          }

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build v0.4.13 APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:assembleDebug \
            --stacktrace

      - name: Verify package and prepare artifact
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "::error::APK not found"
            exit 1
          }

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK/build-tools/35.0.0/aapt"

          BADGING="$(
            "$AAPT" dump badging "$APK" \
              | head -n 1
          )"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -q \
            "package: name='com.dennis.photomasterai'"

          echo "$BADGING" \
            | grep -q \
            "versionCode='22'"

          echo "$BADGING" \
            | grep -q \
            "versionName='0.4.13'"

          unzip -l "$APK" \
            | grep -q \
            'assets/nafnet_sidd_width32_fp16.tflite'

          rm -rf artifact
          mkdir artifact

          OUT="artifact/PhotoMasterAI-v0.4.13-SMOOTH-SURFACE-TERMINAL-GUARD.apk"

          cp "$APK" "$OUT"

          sha256sum "$OUT" \
            > "artifact/PhotoMasterAI-v0.4.13-SMOOTH-SURFACE-TERMINAL-GUARD-SHA256.txt"

          cat > "artifact/PhotoMasterAI-v0.4.13-Notes.txt" <<EOF
          Photo Master AI — v0.4.13 Continuation Notes

          Version: v0.4.13
          versionCode: 22

          BASELINE
          Exact successful v0.4.12 recovery source.

          FROZEN NEURAL CORE
          - NAFNet-SIDD width32
          - Classic LiteRT / TFLite Interpreter
          - OpenCL GPU
          - FP32 behaviour
          - NCHW [1,3,256,256]
          - No CPU neural fallback
          - Normal-scene neural QC unchanged
          - Smooth-scene +0.015 ringing allowance unchanged

          v0.4.13 SMOOTH-SURFACE TERMINAL GUARD
          - High-ring smooth scenes retain the v0.4.12 5% neural cap.
          - Lower adaptive blends stop when measurements hit the same floor.
          - Neural QC rejection is passed into PhotoMasterEngine.
          - Protected smooth-scene QC rejection becomes terminal.
          - Deep Pixel Repair is bypassed.
          - Denoise, sharpening and micro-contrast are bypassed.
          - Exposure/tone/highlight finishing are bypassed.
          - WB, saturation and vibrance finishing are bypassed.
          - AI relighting is bypassed.
          - Original working pixels are copied directly to output.

          EXPECTED DUCK
          - Initial neural blend approximately 5%.
          - +0.015 ring limit remains authoritative.
          - Around 4% may be tested once.
          - If metrics are effectively unchanged:
            smooth metric floor; lower blends skipped
          - Neural rollback restores original pixels.
          - Final report:
            Smooth-scene terminal protection: ORIGINAL RETAINED —
            no safe measurable improvement
          - Final OUTPUT QC should be essentially the original source.

          NEXT REGRESSION TESTS
          1. Duck
          2. Portrait
          3. Flower
          4. Detailed landscape

          IMPORTANT
          Do not return to CompiledModel GPU.
          Do not add CPU NAFNet fallback.
          Do not change NCHW packing.
          Do not loosen general neural QC.
          EOF

          echo "v0.4.13 artifact and continuation notes prepared"

      - name: Upload APK and continuation notes
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMasterAI-v0.4.13-SMOOTH-SURFACE-TERMINAL-GUARD
          path: |
            artifact/PhotoMasterAI-v0.4.13-SMOOTH-SURFACE-TERMINAL-GUARD.apk
            artifact/PhotoMasterAI-v0.4.13-SMOOTH-SURFACE-TERMINAL-GUARD-SHA256.txt
            artifact/PhotoMasterAI-v0.4.13-Notes.txt
          if-no-files-found: error
          retention-days: 30
