name: Build S23U Analysis-First Camera v0.1.0

on:
  workflow_dispatch:
  push:
    paths:
      - 'S23U-Analysis-First-Camera-v0.1.0-GitHubBuildSource.zip'
      - 'S23U-Analysis-First-Camera-v0.1.0-FIX1-GitHubBuildSource.zip'
      - '.github/workflows/build-analysis-first-camera-v0.1.0.yml'

permissions:
  contents: read

jobs:
  build:
    name: S23U Analysis-First Camera v0.1.0
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="S23U-Analysis-First-Camera-v0.1.0-FIX1-GitHubBuildSource.zip"
          test -f "$ZIP" || { echo "::error::Missing $ZIP"; exit 1; }
          unzip -t "$ZIP"
          rm -rf analysis-first-build
          mkdir analysis-first-build
          unzip -q "$ZIP" -d analysis-first-build
          SETTINGS="$(find analysis-first-build -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1 || true)"
          test -n "$SETTINGS" || { echo "::error::settings.gradle not found"; exit 1; }
          PROJECT="$(dirname "$SETTINGS")"
          test -f "$PROJECT/app/build.gradle" || test -f "$PROJECT/app/build.gradle.kts" || {
            echo "::error::app/build.gradle not found"
            exit 1
          }
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1 || true)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo "::error::sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build signed release APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Verify package and collect APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.source.outputs.project }}"
          APK="$PROJECT/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "::error::Release APK not found at $APK"; exit 1; }

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK/build-tools/34.0.0/aapt"
          APKSIGNER="$SDK/build-tools/34.0.0/apksigner"
          test -x "$AAPT" || { echo "::error::aapt not found"; exit 1; }
          test -x "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }

          BADGING="$($AAPT dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='com.dennis.analysisfirstcamera'" || {
            echo "::error::Unexpected package name"
            exit 1
          }
          echo "$BADGING" | grep -q "versionCode='1'" || {
            echo "::error::APK versionCode is not 1"
            exit 1
          }
          echo "$BADGING" | grep -q "versionName='0.1.0'" || {
            echo "::error::APK versionName is not 0.1.0"
            exit 1
          }
          "$APKSIGNER" verify --verbose "$APK"

          rm -rf artifact
          mkdir artifact
          OUT="artifact/S23U-Analysis-First-Camera-v0.1.0.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "artifact/S23U-Analysis-First-Camera-v0.1.0-SHA256.txt"
          ls -lh artifact

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S23U-Analysis-First-Camera-v0.1.0
          path: |
            artifact/S23U-Analysis-First-Camera-v0.1.0.apk
            artifact/S23U-Analysis-First-Camera-v0.1.0-SHA256.txt
          if-no-files-found: error
          retention-days: 30
