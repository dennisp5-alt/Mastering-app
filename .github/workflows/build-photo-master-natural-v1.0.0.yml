name: Build Photo Master Natural v1.0.0

on:
  workflow_dispatch:
  push:
    paths:
      - 'PhotoMasterNatural-v1.0.0*.zip'
      - '.github/workflows/build-photo-master-natural-v1.0.0.yml'

permissions:
  contents: read

jobs:
  build:
    name: Photo Master Natural v1.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'PhotoMasterNatural-v1.0.0*.zip' -printf '%f\n' | sort -V | tail -n 1 || true)"
          test -n "$ZIP" || { echo "::error::No Photo Master Natural v1.0.0 source ZIP found in repository root"; exit 1; }
          echo "Using source ZIP: $ZIP"
          unzip -t "$ZIP"

          rm -rf natural-build
          mkdir natural-build
          unzip -q "$ZIP" -d natural-build

          SETTINGS="$(find natural-build -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1 || true)"
          test -n "$SETTINGS" || { echo "::error::settings.gradle not found"; exit 1; }
          PROJECT="$(dirname "$SETTINGS")"
          BUILD_FILE="$PROJECT/app/build.gradle"

          test -f "$BUILD_FILE" || { echo "::error::app/build.gradle missing"; exit 1; }
          grep -q "applicationId 'com.dennis.photomasternatural'" "$BUILD_FILE" || { echo "::error::Standalone package id missing"; exit 1; }
          grep -q "versionCode 1" "$BUILD_FILE" || { echo "::error::versionCode 1 missing"; exit 1; }
          grep -q "versionName '1.0.0'" "$BUILD_FILE" || { echo "::error::versionName 1.0.0 missing"; exit 1; }
          test -f "$PROJECT/app/src/main/java/com/dennis/photomasterai/NaturalCastPolicy.java" || exit 1
          test -f "$PROJECT/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" || exit 1

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run natural cast-policy host checks
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf host-checks
          mkdir host-checks
          javac -d host-checks \
            app/src/main/java/com/dennis/photomasterai/NaturalCastPolicy.java \
            tools/NaturalCastPolicyHostChecks.java
          java -cp host-checks com.dennis.photomasterai.NaturalCastPolicyHostChecks

      - name: Restore stable Natural signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/photo-master-natural.keystore
          key: photo-master-natural-debug-keystore-v1

      - name: Create signing key on first build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          KEY="$HOME/.android/photo-master-natural.keystore"
          if [ ! -f "$KEY" ]; then
            keytool -genkeypair \
              -keystore "$KEY" \
              -storepass android \
              -alias naturaldebugkey \
              -keypass android \
              -dname "CN=Photo Master Natural,O=Dennis Photo Master,C=AU" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1 || true)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo "::error::sdkmanager not found"; exit 1; }

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure standalone signing
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          cat >> gradle.properties <<EOF
          NATURAL_STORE_FILE=$HOME/.android/photo-master-natural.keystore
          NATURAL_STORE_PASSWORD=android
          NATURAL_KEY_ALIAS=naturaldebugkey
          NATURAL_KEY_PASSWORD=android
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle")
          s=p.read_text()
          marker="android {"
          inject="""android {
              signingConfigs {
                  naturalDebug {
                      storeFile file(System.getenv("HOME") + "/.android/photo-master-natural.keystore")
                      storePassword "android"
                      keyAlias "naturaldebugkey"
                      keyPassword "android"
                  }
              }
          """
          if marker not in s:
              raise SystemExit("android block not found")
          s=s.replace(marker, inject, 1)
          s=s.replace("buildTypes {\n        release {", "buildTypes {\n        debug {\n            signingConfig signingConfigs.naturalDebug\n        }\n        release {", 1)
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace

      - name: Verify and collect APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.source.outputs.project }}"
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "::error::APK not found"; exit 1; }

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK/build-tools/35.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$BADGING"

          echo "$BADGING" | grep -q "package: name='com.dennis.photomasternatural'" || exit 1
          echo "$BADGING" | grep -q "versionCode='1'" || exit 1
          echo "$BADGING" | grep -q "versionName='1.0.0'" || exit 1

          rm -rf artifact
          mkdir artifact
          OUT="artifact/PhotoMasterNatural-v1.0.0.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "artifact/PhotoMasterNatural-v1.0.0-SHA256.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMasterNatural-v1.0.0
          path: |
            artifact/PhotoMasterNatural-v1.0.0.apk
            artifact/PhotoMasterNatural-v1.0.0-SHA256.txt
          if-no-files-found: error
          retention-days: 30
