name: Build S23U Auto+ AI Camera

on:
  workflow_dispatch:
  push:
    paths:
      - 'S23U_AI_Camera_v0.1.0*.zip'
      - '.github/workflows/build-s23u-ai-camera.yml'

permissions:
  contents: read

jobs:
  build:
    name: S23U Auto+ AI Camera
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select and extract highest-suffix source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'S23U_AI_Camera_v0.1.0*.zip' -printf '%f\n' | sort -V | tail -n 1 || true)"
          test -n "$ZIP" || { echo "::error::No S23U_AI_Camera_v0.1.0 source ZIP found"; exit 1; }
          echo "Using: $ZIP"
          # v0.2.0 was committed through the Git data API one trailing NUL short.
          # Repair only that exact known case, then verify against the original local SHA-256.
          if [ "$ZIP" = "S23U_AI_Camera_v0.1.0-12.zip" ] && [ "$(stat -c%s "$ZIP")" = "33627" ]; then
            printf '\0' >> "$ZIP"
            echo "Repaired one trailing byte in v0.2.0 source ZIP."
          fi
          if [ "$ZIP" = "S23U_AI_Camera_v0.1.0-12.zip" ]; then
            echo "3421713b8ff7aa2d5cb48d32f407bf831cf120d6d68e70d802faeef335115497  $ZIP" | sha256sum -c -
          fi
          unzip -t "$ZIP"
          rm -rf s23u-ai-build
          mkdir s23u-ai-build
          unzip -q "$ZIP" -d s23u-ai-build
          SETTINGS="$(find s23u-ai-build -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1 || true)"
          test -n "$SETTINGS" || { echo "::error::settings.gradle not found"; exit 1; }
          PROJECT="$(dirname "$SETTINGS")"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT"

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.source.outputs.project }}"
          BUILD_FILE="$PROJECT/app/build.gradle"
          if [ ! -f "$BUILD_FILE" ]; then
            BUILD_FILE="$PROJECT/app/build.gradle.kts"
          fi
          test -f "$BUILD_FILE" || { echo "::error::App build.gradle not found"; exit 1; }

          VERSION_NAME="$(grep -E 'versionName[[:space:]]*[= ]' "$BUILD_FILE" | head -n1 | sed -E 's/.*versionName[[:space:]]*[= ]+["\x27]([^"\x27]+)["\x27].*/\1/' || true)"
          if [ -z "$VERSION_NAME" ] || [ "$VERSION_NAME" = "$(grep -E 'versionName[[:space:]]*[= ]' "$BUILD_FILE" | head -n1 || true)" ]; then
            VERSION_NAME="0.1.0"
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION_NAME"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable AI-camera debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: s23u-ai-camera-debug-keystore-v1

      - name: Create signing key on first stable build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=AutoPlus AI Camera,C=AU" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
            echo "Created persistent debug signing key."
          else
            echo "Restored persistent debug signing key."
          fi
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | grep -E 'SHA256:|Valid from:' || true

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1 || true)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo "::error::sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK with stable signer
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace

      - name: Collect APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.source.outputs.project }}"
          VERSION="${{ steps.version.outputs.version_name }}"
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "::error::APK not found"; exit 1; }
          rm -rf artifact
          mkdir artifact
          OUT="artifact/S23U-AutoPlus-AI-Camera-v${VERSION}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "artifact/S23U-AutoPlus-AI-Camera-v${VERSION}-SHA256.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S23U-AutoPlus-AI-Camera-v${{ steps.version.outputs.version_name }}
          path: |
            artifact/S23U-AutoPlus-AI-Camera-v${{ steps.version.outputs.version_name }}.apk
            artifact/S23U-AutoPlus-AI-Camera-v${{ steps.version.outputs.version_name }}-SHA256.txt
          if-no-files-found: error
          retention-days: 30
