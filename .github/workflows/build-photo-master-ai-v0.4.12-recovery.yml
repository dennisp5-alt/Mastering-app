name: Build Photo Master AI v0.4.12 Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-photo-master-ai-v0.4.12-recovery.yml'

permissions:
  contents: read

jobs:
  build:
    name: Photo Master AI v0.4.12 Low-Detail Smooth-Surface Guard
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover and build exact v0.4.12 source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          V0412_COMMIT="27aeafb1e34f0becb7e909a559b42bedba6333a6"

          git cat-file -e "${V0412_COMMIT}^{commit}" || {
            echo "::error::Original v0.4.12 commit is unavailable"
            exit 1
          }

          git show \
            "${V0412_COMMIT}:.github/workflows/build-photo-master-ai-v0.4.12.yml" \
            > /tmp/v0412-original.yml

          python3 - <<'PY'
          from pathlib import Path

          source = Path("/tmp/v0412-original.yml")
          lines = source.read_text().splitlines()

          def extract_step(name, destination, lenient=False):
              step = None

              for i, line in enumerate(lines):
                  if line.strip() == "- name: " + name:
                      step = i
                      break

              if step is None:
                  raise RuntimeError(
                      "Workflow step not found: " + name
                  )

              run = None

              for i in range(step, len(lines)):
                  if lines[i].strip() == "run: |":
                      run = i
                      break

                  if (
                      i > step
                      and lines[i].startswith("      - name:")
                  ):
                      break

              if run is None:
                  raise RuntimeError(
                      "Run block not found: " + name
                  )

              body = []

              for line in lines[run + 1:]:
                  if line.startswith("      - name:"):
                      break

                  if not line.strip():
                      body.append("")

                  elif line.startswith("          "):
                      body.append(line[10:])

                  elif lenient:
                      # The original v0.4.12 YAML became invalid because
                      # embedded Java inside a Python triple string lost
                      # YAML indentation. As a shell/Python script those
                      # raw lines are valid, so retain them verbatim.
                      body.append(line)

                  else:
                      raise RuntimeError(
                          "Unexpected indentation in: " + name
                      )

              Path(destination).write_text(
                  "\n".join(body) + "\n"
              )

          extract_step(
              "Rebuild exact v0.4.11 source baseline",
              "/tmp/v0411-source.sh",
              False
          )

          extract_step(
              "Apply v0.4.12 low-detail smooth-surface guard",
              "/tmp/v0412-patch.sh",
              True
          )

          print("Recovered original v0.4.12 source scripts")
          PY

          bash /tmp/v0411-source.sh

          SETTINGS="$(
            find photomaster-v044-build \
              -type f \
              -name 'settings.gradle' \
              | head -n 1
          )"

          if [ -z "$SETTINGS" ]; then
            SETTINGS="$(
              find photomaster-v044-build \
                -type f \
                -name 'settings.gradle.kts' \
                | head -n 1
            )"
          fi

          test -n "$SETTINGS" || {
            echo "::error::Generated project not found"
            exit 1
          }

          PROJECT="$(dirname "$SETTINGS")"

          export PROJECT

          bash /tmp/v0412-patch.sh

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          echo "Checking reconstructed v0.4.12 source..."

          grep -q \
            "versionCode 21" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "versionName '0.4.12'" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "applySmoothSurfaceGuard" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java"

          grep -q \
            "high-ring-risk 5% blend cap" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java"

          grep -q \
            "ringingAllowance" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java"

          grep -q \
            "Smooth-surface preservation" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "smoothSurfaceProtection" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/PhotoMasterEngine.java"

          grep -q \
            "0.30, 0.24, 0.20, 0.16" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "MAX_TOTAL_NEURAL_MS = 90_000L" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "GpuBackend.OPENCL" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiserRuntime.kt"

          if grep -q \
            "new NeuralDenoiserRuntime(context, true)" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"
          then
            echo "::error::CPU neural fallback detected"
            exit 1
          fi

          echo "v0.4.12 reconstruction passed"

      - name: Fetch pinned NAFNet-SIDD model
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"

          ASSETS="$PROJECT/app/src/main/assets"
          MODEL="$ASSETS/nafnet_sidd_width32_fp16.tflite"

          mkdir -p "$ASSETS"

          URL='https://huggingface.co/litert-community/NAFNet-SIDD-width32-LiteRT/resolve/main/nafnet_sidd_width32_fp16.tflite?download=true'

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --output "$MODEL.tmp" \
            "$URL"

          mv "$MODEL.tmp" "$MODEL"

          test "$(stat -c%s "$MODEL")" -eq 62454048 || {
            echo "::error::Unexpected NAFNet model size"
            exit 1
          }

          echo \
          'f8fbaa422411683c53e802cf7cc7cf9be0a0de00886ad4af057232e26b172a0c  '"$MODEL" \
          | sha256sum -c -

          echo "Pinned NAFNet model verified"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run all safety host checks
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf host-checks
          mkdir host-checks

          javac -d host-checks \
            app/src/main/java/com/dennis/photomasterai/DeepPixelRepair.java \
            app/src/main/java/com/dennis/photomasterai/RepairSafetyPolicy.java \
            app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java \
            app/src/main/java/com/dennis/photomasterai/SocialSourcePolicy.java \
            tools/DeepPixelRepairHostChecks.java \
            tools/RepairSafetyPolicyHostChecks.java \
            tools/NeuralDenoisePolicyHostChecks.java \
            tools/SocialSourcePolicyHostChecks.java \
            tools/SmoothSurfaceGuardHostChecks.java

          java -cp host-checks \
            com.dennis.photomasterai.DeepPixelRepairHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.RepairSafetyPolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.NeuralDenoisePolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.SocialSourcePolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.SmoothSurfaceGuardHostChecks

      - name: Restore stable Photo Master debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photo-master-ai-debug-keystore-v1

      - name: Create signing key on first build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Photo Master AI,O=Dennis Photo Master,C=AU" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$SDK/cmdline-tools" \
                -type f \
                -name 'sdkmanager' \
                | sort -V \
                | tail -n 1
            )"
          fi

          test -n "$SDKMANAGER" || {
            echo "::error::sdkmanager not found"
            exit 1
          }

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build v0.4.12 APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:assembleDebug \
            --stacktrace

      - name: Verify package and prepare artifact
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "::error::APK not found"
            exit 1
          }

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK/build-tools/35.0.0/aapt"

          BADGING="$(
            "$AAPT" dump badging "$APK" \
              | head -n 1
          )"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -q \
            "package: name='com.dennis.photomasterai'"

          echo "$BADGING" \
            | grep -q \
            "versionCode='21'"

          echo "$BADGING" \
            | grep -q \
            "versionName='0.4.12'"

          unzip -l "$APK" \
            | grep -q \
            'assets/nafnet_sidd_width32_fp16.tflite'

          rm -rf artifact
          mkdir artifact

          OUT="artifact/PhotoMasterAI-v0.4.12-LOW-DETAIL-SMOOTH-SURFACE-GUARD.apk"

          cp "$APK" "$OUT"

          sha256sum "$OUT" \
            > "artifact/PhotoMasterAI-v0.4.12-LOW-DETAIL-SMOOTH-SURFACE-GUARD-SHA256.txt"

          cat > "artifact/PhotoMasterAI-v0.4.12-Notes.txt" <<EOF
          Photo Master AI — v0.4.12 Continuation Notes

          Version: v0.4.12
          versionCode: 21

          GitHub run:
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          BASELINE
          Exact v0.4.11 post-neural coordination baseline.

          FROZEN NEURAL CORE
          - NAFNet-SIDD width32
          - Classic LiteRT/TFLite Interpreter
          - OpenCL GPU
          - FP32 behaviour
          - NCHW [1,3,256,256]
          - No CPU neural fallback
          - Existing adaptive recovery ladder retained

          v0.4.12 LOW-DETAIL / SMOOTH-SURFACE GUARD
          - Genuine low-detail water/sky/smooth scenes receive extra protection.
          - High-ring smooth scenes cap initial neural blend at 5%.
          - Other smooth scenes cap at 10%.
          - Extremely-low-detail already-clean smooth scenes may skip neural.
          - Smooth-scene neural ringing allowance tightened to +0.015.
          - Deep Pixel Repair/detail recovery suppressed for protected smooth scenes.
          - Sharpening and micro-contrast heavily suppressed.
          - Neural denoise gains receive stronger downstream protection.
          - Marginal-benefit cases prefer transparent/conservative output.
          - Portrait/person scenes are excluded from smooth-scene restriction.
          - Detailed scenes are excluded from smooth-scene restriction.

          REFERENCE DUCK
          v0.4.11 previously accepted 10%:
          noise 0.0145 -> 0.0118
          chroma 0.0260 -> 0.0223
          detail retained 94.7%
          ringing 0.731 -> 0.755

          EXPECTED v0.4.12 DUCK BEHAVIOUR
          - Low-detail protection ACTIVE.
          - Water/sky smooth-surface safe mode ACTIVE.
          - Initial neural blend approximately 5%, not 64%.
          - Ring allowance +0.015.
          - Deep Pixel Repair/detail finishing withheld.
          - If tiny neural processing is not worthwhile, conservative output is correct.

          NEXT TESTS
          1. Duck.
          2. Portrait.
          3. Flower.
          4. Detailed landscape.

          IMPORTANT
          Do not return to CompiledModel GPU.
          Do not add CPU NAFNet fallback.
          Do not change NCHW packing.
          Do not loosen general neural QC.
          EOF

      - name: Upload APK and continuation notes
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMasterAI-v0.4.12-LOW-DETAIL-SMOOTH-SURFACE-GUARD
          path: |
            artifact/PhotoMasterAI-v0.4.12-LOW-DETAIL-SMOOTH-SURFACE-GUARD.apk
            artifact/PhotoMasterAI-v0.4.12-LOW-DETAIL-SMOOTH-SURFACE-GUARD-SHA256.txt
            artifact/PhotoMasterAI-v0.4.12-Notes.txt
          if-no-files-found: error
          retention-days: 30
