name: Build Photo Master AI v0.4.5 Adaptive Neural Blend

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-photo-master-ai-v0.4.5.yml'

permissions:
  contents: read

jobs:
  build:
    name: Photo Master AI v0.4.5 Adaptive Neural Blend
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reuse v0.4.4 OpenCL runtime and add adaptive blend recovery
        id: source
        shell: bash
        run: |
          set -euo pipefail

          BASE_WORKFLOW=".github/workflows/build-photo-master-ai-v0.4.4.yml"

          test -f "$BASE_WORKFLOW" || {
            echo "::error::v0.4.4 workflow missing"
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/build-photo-master-ai-v0.4.4.yml"
          ).read_text()

          lines = workflow.splitlines()

          step_index = None
          for i, line in enumerate(lines):
              if (
                  "Extract v0.4.1 and apply v0.4.4 classic GPU runtime"
                  in line
              ):
                  step_index = i
                  break

          if step_index is None:
              raise RuntimeError(
                  "Could not find v0.4.4 source-patch step"
              )

          run_index = None
          for i in range(step_index, len(lines)):
              if lines[i].strip() == "run: |":
                  run_index = i
                  break

          if run_index is None:
              raise RuntimeError(
                  "Could not find v0.4.4 source-patch run block"
              )

          body = []

          for line in lines[run_index + 1:]:
              if line.startswith("      - name:"):
                  break

              if line.startswith("          "):
                  body.append(line[10:])
              elif line.strip() == "":
                  body.append("")
              else:
                  raise RuntimeError(
                      "Unexpected indentation while reading "
                      "v0.4.4 run block: " + line
                  )

          script = "\n".join(body) + "\n"

          # Start from the exact proven v0.4.4 OpenCL build.
          script = script.replace(
              "v0.4.4",
              "v0.4.5"
          )

          script = script.replace(
              "v044",
              "v045"
          )

          script = script.replace(
              "versionCode 13",
              "versionCode 14"
          )

          # 70-second real-world passes need more safety headroom.
          script = script.replace(
              "MAX_TOTAL_NEURAL_MS = 75_000L",
              "MAX_TOTAL_NEURAL_MS = 90_000L"
          )

          needle = '''if (
              "new NeuralDenoiserRuntime(context, true)"
              in s
          ):
              raise RuntimeError(
                  "CPU NAFNet fallback still present"
              )

          neural.write_text(s)'''

          if needle not in script:
              raise RuntimeError(
                  "Could not find neural write point "
                  "in v0.4.4 patch"
              )

          replacement = r'''if (
              "new NeuralDenoiserRuntime(context, true)"
              in s
          ):
              raise RuntimeError(
                  "CPU NAFNet fallback still present"
              )

          # =====================================================
          # v0.4.5 ADAPTIVE NEURAL BLEND RECOVERY
          #
          # NAFNet runs only once.
          #
          # If the normal candidate fails QC, weaker blends are
          # reconstructed from source + the already-rendered
          # candidate. No second neural inference is required.
          # =====================================================

          adaptive_start = s.find(
              "        String metrics = "
              "String.format(Locale.US,"
          )

          adaptive_end = s.find(
              "    private static void readTile",
              adaptive_start
          )

          if adaptive_start < 0 or adaptive_end < 0:
              raise RuntimeError(
                  "Neural QC/report block not found "
                  "for adaptive patch"
              )

          adaptive_java = r"""        double finalBlend = decision.blend;
        boolean adaptiveAttempted = false;
        boolean adaptiveAccepted = false;
        StringBuilder adaptiveTrace = new StringBuilder();

        if (!quality.accepted
                && !quality.reason.contains(
                        "did not produce a meaningful measured noise benefit")) {

            adaptiveAttempted = true;

            adaptiveTrace.append(
                    String.format(
                            Locale.US,
                            "%.0f%% failed (%s)",
                            decision.blend * 100.0,
                            quality.reason));

            double[] adaptiveScales = {
                    0.80,
                    0.65,
                    0.50,
                    0.38
            };

            for (double scale : adaptiveScales) {

                double trialBlend =
                        decision.blend * scale;

                Bitmap trial =
                        blendCandidate(
                                source,
                                candidate,
                                scale);

                PhotoAnalysis trialAfter =
                        PhotoAnalysis.analyse(trial);

                double trialDr =
                        trialAfter.p95
                                - trialAfter.p05;

                NeuralDenoisePolicy.Quality trialQuality =
                        NeuralDenoisePolicy.evaluate(
                                before.noise,
                                before.flatChromaNoise,
                                before.detail,
                                before.ringing,
                                before.medianLum,
                                beforeDr,
                                before.avgSat,
                                before.shadowClip,
                                before.highlightClip,

                                trialAfter.noise,
                                trialAfter.flatChromaNoise,
                                trialAfter.detail,
                                trialAfter.ringing,
                                trialAfter.medianLum,
                                trialDr,
                                trialAfter.avgSat,
                                trialAfter.shadowClip,
                                trialAfter.highlightClip,

                                decision);

                adaptiveTrace.append(
                        String.format(
                                Locale.US,
                                " -> %.0f%% %s",
                                trialBlend * 100.0,
                                trialQuality.accepted
                                        ? "accepted"
                                        : "failed"));

                if (trialQuality.accepted) {

                    candidate.recycle();

                    candidate = trial;
                    after = trialAfter;
                    quality = trialQuality;

                    finalBlend = trialBlend;
                    adaptiveAccepted = true;

                    break;
                }

                trial.recycle();
            }
        }

        String metrics =
                String.format(
                        Locale.US,
                        "• %s • %d tiles • %.1fs GPU pass\n"
                                + "• Neural blend %.0f%% "
                                + "| gate confidence %.0f%%\n"
                                + "• Noise %.3f -> %.3f "
                                + "| flat chroma %.3f -> %.3f\n"
                                + "• Detail %.3f -> %.3f "
                                + "| ring %.2f -> %.2f",

                        accelerator,
                        tiles,
                        elapsedMs / 1000.0,

                        finalBlend * 100.0,
                        decision.confidence * 100.0,

                        before.noise,
                        after.noise,

                        before.flatChromaNoise,
                        after.flatChromaNoise,

                        before.detail,
                        after.detail,

                        before.ringing,
                        after.ringing);

        String adaptiveLine;

        if (adaptiveAccepted) {

            adaptiveLine =
                    "• Adaptive blend recovery: "
                            + adaptiveTrace
                            + " (no extra NAFNet pass)";

        } else if (adaptiveAttempted) {

            adaptiveLine =
                    "• Adaptive blend recovery exhausted: "
                            + adaptiveTrace
                            + " (no extra NAFNet pass)";

        } else if (quality.accepted) {

            adaptiveLine =
                    "• Adaptive blend recovery: not needed";

        } else {

            adaptiveLine =
                    "• Adaptive blend recovery: not attempted — "
                            + "no meaningful neural benefit";
        }

        if (!quality.accepted) {

            candidate.recycle();

            return new Result(
                    null,
                    before,
                    true,
                    false,

                    "REAL NEURAL DENOISE\n"
                            + "• NAFNet-SIDD width32 — "
                            + "true on-device neural denoise\n"
                            + metrics + "\n"
                            + adaptiveLine + "\n"
                            + "• Neural rollback: "
                            + quality.reason + "\n"
                            + "• Original pixels restored "
                            + "before v0.3.3 finishing");
        }

        return new Result(
                candidate,
                after,
                true,
                true,

                "REAL NEURAL DENOISE\n"
                        + "• NAFNet-SIDD width32 — "
                        + "true on-device neural denoise\n"
                        + metrics + "\n"
                        + adaptiveLine + "\n"
                        + "• Neural QC: ACCEPTED — "
                        + quality.reason + "\n"
                        + "• Edge + person-aware blend "
                        + "protection active");
    }

    private static Bitmap blendCandidate(
            Bitmap source,
            Bitmap stronger,
            double scale) {

        int w = source.getWidth();
        int h = source.getHeight();

        Bitmap out =
                Bitmap.createBitmap(
                        w,
                        h,
                        Bitmap.Config.ARGB_8888);

        int[] srcRow = new int[w];
        int[] neuralRow = new int[w];
        int[] outRow = new int[w];

        double s =
                clamp(
                        scale,
                        0.0,
                        1.0);

        for (int y = 0; y < h; y++) {

            source.getPixels(
                    srcRow,
                    0,
                    w,
                    0,
                    y,
                    w,
                    1);

            stronger.getPixels(
                    neuralRow,
                    0,
                    w,
                    0,
                    y,
                    w,
                    1);

            for (int x = 0; x < w; x++) {

                int a = srcRow[x];
                int b = neuralRow[x];

                int rr =
                        clamp255(
                                Color.red(a)
                                        + (
                                        Color.red(b)
                                                - Color.red(a)
                                ) * s);

                int gg =
                        clamp255(
                                Color.green(a)
                                        + (
                                        Color.green(b)
                                                - Color.green(a)
                                ) * s);

                int bb =
                        clamp255(
                                Color.blue(a)
                                        + (
                                        Color.blue(b)
                                                - Color.blue(a)
                                ) * s);

                outRow[x] =
                        Color.argb(
                                Color.alpha(a),
                                rr,
                                gg,
                                bb);
            }

            out.setPixels(
                    outRow,
                    0,
                    w,
                    0,
                    y,
                    w,
                    1);
        }

        return out;
    }

"""

          s = (
              s[:adaptive_start]
              + adaptive_java
              + s[adaptive_end:]
          )

          if "Adaptive blend recovery" not in s:
              raise RuntimeError(
                  "Adaptive neural blend patch "
                  "was not applied"
              )

          neural.write_text(s)'''

          script = script.replace(
              needle,
              replacement
          )

          Path(
              "/tmp/v045-source-patch.sh"
          ).write_text(script)

          print(
              "Prepared v0.4.5 from proven "
              "v0.4.4 OpenCL runtime"
          )
          PY

          bash /tmp/v045-source-patch.sh

          SETTINGS="$(find photomaster-v045-build -type f -name 'settings.gradle' | head -n 1)"

          if [ -z "$SETTINGS" ]; then
            SETTINGS="$(find photomaster-v045-build -type f -name 'settings.gradle.kts' | head -n 1)"
          fi

          test -n "$SETTINGS" || {
            echo "::error::v0.4.5 project not found"
            exit 1
          }

          PROJECT="$(dirname "$SETTINGS")"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          grep -q \
            "versionCode 14" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "versionName '0.4.5'" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "MAX_TOTAL_NEURAL_MS = 90_000L" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "double\[\] adaptiveScales" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "0.80" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "0.65" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "0.50" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "0.38" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "Adaptive blend recovery" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "GpuBackend.OPENCL" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiserRuntime.kt"

          if grep -q \
            "new NeuralDenoiserRuntime(context, true)" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"
          then
            echo "::error::CPU NAFNet fallback detected"
            exit 1
          fi

          echo "v0.4.5 adaptive source verification passed"

      - name: Fetch pinned NAFNet-SIDD model
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"

          ASSETS="$PROJECT/app/src/main/assets"
          MODEL="$ASSETS/nafnet_sidd_width32_fp16.tflite"

          mkdir -p "$ASSETS"

          URL='https://huggingface.co/litert-community/NAFNet-SIDD-width32-LiteRT/resolve/main/nafnet_sidd_width32_fp16.tflite?download=true'

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --output "$MODEL.tmp" \
            "$URL"

          mv "$MODEL.tmp" "$MODEL"

          test "$(stat -c%s "$MODEL")" -eq 62454048 || {
            echo "::error::Unexpected NAFNet model size"
            exit 1
          }

          echo \
          'f8fbaa422411683c53e802cf7cc7cf9be0a0de00886ad4af057232e26b172a0c  '"$MODEL" \
          | sha256sum -c -

          echo "Pinned NAFNet-SIDD model verified"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run restoration safety host checks
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf host-checks
          mkdir host-checks

          javac -d host-checks \
            app/src/main/java/com/dennis/photomasterai/DeepPixelRepair.java \
            app/src/main/java/com/dennis/photomasterai/RepairSafetyPolicy.java \
            app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java \
            app/src/main/java/com/dennis/photomasterai/SocialSourcePolicy.java \
            tools/DeepPixelRepairHostChecks.java \
            tools/RepairSafetyPolicyHostChecks.java \
            tools/NeuralDenoisePolicyHostChecks.java \
            tools/SocialSourcePolicyHostChecks.java

          java -cp host-checks \
            com.dennis.photomasterai.DeepPixelRepairHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.RepairSafetyPolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.NeuralDenoisePolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.SocialSourcePolicyHostChecks

      - name: Restore stable Photo Master debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photo-master-ai-debug-keystore-v1

      - name: Create signing key on first build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Photo Master AI,O=Dennis Photo Master,C=AU" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$SDK/cmdline-tools" -type f -name 'sdkmanager' \
                | sort -V \
                | tail -n 1
            )"
          fi

          test -n "$SDKMANAGER" || {
            echo "::error::sdkmanager not found"
            exit 1
          }

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build v0.4.5 APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:assembleDebug \
            --stacktrace

      - name: Verify package and collect APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "::error::APK not found"
            exit 1
          }

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK/build-tools/35.0.0/aapt"

          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -q \
            "package: name='com.dennis.photomasterai'"

          echo "$BADGING" \
            | grep -q \
            "versionCode='14'"

          echo "$BADGING" \
            | grep -q \
            "versionName='0.4.5'"

          unzip -l "$APK" \
            | grep -q \
            'assets/nafnet_sidd_width32_fp16.tflite'

          rm -rf artifact
          mkdir artifact

          OUT="artifact/PhotoMasterAI-v0.4.5-ADAPTIVE-NEURAL-BLEND.apk"

          cp "$APK" "$OUT"

          sha256sum "$OUT" \
            > "artifact/PhotoMasterAI-v0.4.5-ADAPTIVE-NEURAL-BLEND-SHA256.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMasterAI-v0.4.5-ADAPTIVE-NEURAL-BLEND
          path: |
            artifact/PhotoMasterAI-v0.4.5-ADAPTIVE-NEURAL-BLEND.apk
            artifact/PhotoMasterAI-v0.4.5-ADAPTIVE-NEURAL-BLEND-SHA256.txt
          if-no-files-found: error
          retention-days: 30
