name: Build Photo Master AI v0.4.4 Classic OpenCL GPU

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-photo-master-ai-v0.4.4.yml'

permissions:
  contents: read

jobs:
  build:
    name: Photo Master AI v0.4.4 Classic OpenCL GPU
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract v0.4.1 and apply v0.4.4 classic GPU runtime
        id: source
        shell: bash
        run: |
          set -euo pipefail

          test -f PhotoMasterAI-v0.4.1-Source.zip || {
            echo "::error::PhotoMasterAI-v0.4.1-Source.zip missing"
            exit 1
          }

          rm -rf photomaster-v044-build
          mkdir photomaster-v044-build

          unzip -q \
            PhotoMasterAI-v0.4.1-Source.zip \
            -d photomaster-v044-build

          SETTINGS="$(find photomaster-v044-build -type f -name 'settings.gradle' | head -n 1)"

          if [ -z "$SETTINGS" ]; then
            SETTINGS="$(find photomaster-v044-build -type f -name 'settings.gradle.kts' | head -n 1)"
          fi

          test -n "$SETTINGS" || {
            echo "::error::settings.gradle not found"
            exit 1
          }

          PROJECT="$(dirname "$SETTINGS")"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          export PROJECT

          python3 - <<'PY'
          from pathlib import Path
          import os

          project = Path(os.environ["PROJECT"])

          # =====================================================
          # VERSION AND DEPENDENCIES
          # =====================================================

          build_file = project / "app/build.gradle"
          build = build_file.read_text()

          if "versionCode 10" not in build:
              raise RuntimeError("versionCode 10 not found")

          if "versionName '0.4.1'" not in build:
              raise RuntimeError("versionName 0.4.1 not found")

          build = build.replace(
              "versionCode 10",
              "versionCode 13",
              1
          )

          build = build.replace(
              "versionName '0.4.1'",
              "versionName '0.4.4'",
              1
          )

          old_dep = (
              "    implementation "
              "'com.google.ai.edge.litert:litert:2.2.0'"
          )

          new_deps = (
              "    // v0.4.4 classic LiteRT Interpreter GPU backend.\n"
              "    implementation "
              "'com.google.ai.edge.litert:litert:1.4.2'\n"
              "    implementation "
              "'com.google.ai.edge.litert:litert-gpu:1.4.2'\n"
              "    implementation "
              "'com.google.ai.edge.litert:litert-gpu-api:1.4.2'"
          )

          if old_dep not in build:
              raise RuntimeError(
                  "Original LiteRT 2.2.0 dependency not found"
              )

          build = build.replace(
              old_dep,
              new_deps,
              1
          )

          build_file.write_text(build)

          # =====================================================
          # OPENCL VISIBILITY
          # =====================================================

          manifest_file = project / (
              "app/src/main/AndroidManifest.xml"
          )

          manifest = manifest_file.read_text()

          if "libOpenCL.so" not in manifest:
              app_start = manifest.find("<application")

              if app_start < 0:
                  raise RuntimeError(
                      "application element not found in manifest"
                  )

              app_tag_end = manifest.find(">", app_start)

              if app_tag_end < 0:
                  raise RuntimeError(
                      "application start tag malformed"
                  )

              native_libs = (
                  "\n"
                  "        <uses-native-library "
                  "android:name=\"libOpenCL.so\" "
                  "android:required=\"false\" />\n"
                  "        <uses-native-library "
                  "android:name=\"libvndksupport.so\" "
                  "android:required=\"false\" />"
              )

              manifest = (
                  manifest[:app_tag_end + 1]
                  + native_libs
                  + manifest[app_tag_end + 1:]
              )

              manifest_file.write_text(manifest)

          # =====================================================
          # CLASSIC LITERT INTERPRETER + OPENCL GPU
          # =====================================================

          runtime_file = project / (
              "app/src/main/java/com/dennis/"
              "photomasterai/NeuralDenoiserRuntime.kt"
          )

          runtime_lines = [
              "package com.dennis.photomasterai",
              "",
              "import android.content.Context",
              "import org.tensorflow.lite.DataType",
              "import org.tensorflow.lite.Interpreter",
              "import org.tensorflow.lite.gpu.GpuDelegate",
              "import org.tensorflow.lite.gpu.GpuDelegateFactory",
              "import java.io.FileInputStream",
              "import java.nio.ByteBuffer",
              "import java.nio.ByteOrder",
              "import java.nio.MappedByteBuffer",
              "import java.nio.channels.FileChannel",
              "import kotlin.math.sqrt",
              "",
              "/**",
              " * Photo Master AI v0.4.4 NAFNet runtime.",
              " *",
              " * Classic LiteRT Interpreter + TfLiteGpuDelegateV2.",
              " * Forced OpenCL backend.",
              " * Precision loss disabled.",
              " * CPU neural fallback disabled.",
              " *",
              " * Tensor contract:",
              " * [1,3,256,256] Float32 RGB NCHW [0,1].",
              " */",
              "class NeuralDenoiserRuntime(",
              "    context: Context,",
              "    private val cpuOnly: Boolean = false",
              ") : AutoCloseable {",
              "",
              "    private val ownerThreadId = Thread.currentThread().id",
              "",
              "    init {",
              "        require(!cpuOnly) {",
              "            \"CPU NAFNet disabled in v0.4.4\"",
              "        }",
              "    }",
              "",
              "    private val modelBuffer: MappedByteBuffer = loadModel(context)",
              "",
              "    private val delegateOptions =",
              "        GpuDelegateFactory.Options()",
              "            .setForceBackend(",
              "                GpuDelegateFactory.Options.GpuBackend.OPENCL",
              "            )",
              "            .setInferencePreference(",
              "                GpuDelegateFactory.Options.INFERENCE_PREFERENCE_SUSTAINED_SPEED",
              "            )",
              "            .setPrecisionLossAllowed(false)",
              "",
              "    private val gpuDelegate = GpuDelegate(delegateOptions)",
              "",
              "    private val interpreterOptions =",
              "        Interpreter.Options().apply {",
              "            addDelegate(gpuDelegate)",
              "        }",
              "",
              "    private val interpreter =",
              "        Interpreter(",
              "            modelBuffer,",
              "            interpreterOptions",
              "        )",
              "",
              "    private val inputBuffer =",
              "        ByteBuffer.allocateDirect(BYTES)",
              "            .order(ByteOrder.nativeOrder())",
              "",
              "    private val outputBuffer =",
              "        ByteBuffer.allocateDirect(BYTES)",
              "            .order(ByteOrder.nativeOrder())",
              "",
              "    val acceleratorLabel: String =",
              "        \"Classic LiteRT GPU / OpenCL / FP32\"",
              "",
              "    init {",
              "        verifyTensorContract()",
              "    }",
              "",
              "    fun run(input: FloatArray): FloatArray {",
              "        checkThread()",
              "",
              "        require(input.size == ELEMENTS) {",
              "            \"NAFNet input must contain $ELEMENTS floats\"",
              "        }",
              "",
              "        inputBuffer.clear()",
              "        inputBuffer.asFloatBuffer().put(input)",
              "        inputBuffer.rewind()",
              "",
              "        outputBuffer.clear()",
              "",
              "        interpreter.run(",
              "            inputBuffer,",
              "            outputBuffer",
              "        )",
              "",
              "        outputBuffer.rewind()",
              "",
              "        val out = FloatArray(ELEMENTS)",
              "        outputBuffer.asFloatBuffer().get(out)",
              "",
              "        validateOutput(input, out)",
              "",
              "        return out",
              "    }",
              "",
              "    fun selfTest() {",
              "        checkThread()",
              "",
              "        val probe = FloatArray(ELEMENTS)",
              "        val hw = TILE * TILE",
              "",
              "        for (y in 0 until TILE) {",
              "            for (x in 0 until TILE) {",
              "                val i = y * TILE + x",
              "",
              "                val gx = x / (TILE - 1f)",
              "                val gy = y / (TILE - 1f)",
              "",
              "                probe[i] =",
              "                    (0.08f + 0.78f * gx)",
              "                        .coerceIn(0f, 1f)",
              "",
              "                probe[hw + i] =",
              "                    (0.10f + 0.72f * gy)",
              "                        .coerceIn(0f, 1f)",
              "",
              "                probe[2 * hw + i] =",
              "                    (",
              "                        0.12f + 0.55f *",
              "                            (0.5f * gx + 0.5f * gy)",
              "                    ).coerceIn(0f, 1f)",
              "            }",
              "        }",
              "",
              "        run(probe)",
              "    }",
              "",
              "    private fun verifyTensorContract() {",
              "        checkThread()",
              "",
              "        check(interpreter.inputTensorCount == 1) {",
              "            \"Expected one NAFNet input tensor; got ${interpreter.inputTensorCount}\"",
              "        }",
              "",
              "        check(interpreter.outputTensorCount == 1) {",
              "            \"Expected one NAFNet output tensor; got ${interpreter.outputTensorCount}\"",
              "        }",
              "",
              "        val inputTensor = interpreter.getInputTensor(0)",
              "        val outputTensor = interpreter.getOutputTensor(0)",
              "",
              "        val expected = intArrayOf(1, 3, TILE, TILE)",
              "",
              "        check(inputTensor.shape().contentEquals(expected)) {",
              "            \"Unexpected NAFNet input shape: ${inputTensor.shape().contentToString()}\"",
              "        }",
              "",
              "        check(outputTensor.shape().contentEquals(expected)) {",
              "            \"Unexpected NAFNet output shape: ${outputTensor.shape().contentToString()}\"",
              "        }",
              "",
              "        check(inputTensor.dataType() == DataType.FLOAT32) {",
              "            \"Unexpected NAFNet input datatype: ${inputTensor.dataType()}\"",
              "        }",
              "",
              "        check(outputTensor.dataType() == DataType.FLOAT32) {",
              "            \"Unexpected NAFNet output datatype: ${outputTensor.dataType()}\"",
              "        }",
              "    }",
              "",
              "    private fun validateOutput(",
              "        input: FloatArray,",
              "        out: FloatArray",
              "    ) {",
              "        var inSum = 0.0",
              "        var inSum2 = 0.0",
              "",
              "        var outSum = 0.0",
              "        var outSum2 = 0.0",
              "",
              "        var inMin = Float.POSITIVE_INFINITY",
              "        var inMax = Float.NEGATIVE_INFINITY",
              "",
              "        var outMin = Float.POSITIVE_INFINITY",
              "        var outMax = Float.NEGATIVE_INFINITY",
              "",
              "        var finiteCount = 0",
              "        var nanCount = 0",
              "        var positiveInfinityCount = 0",
              "        var negativeInfinityCount = 0",
              "",
              "        for (i in 0 until ELEMENTS) {",
              "            val a = input[i]",
              "            val b = out[i]",
              "",
              "            inSum += a",
              "            inSum2 += a * a",
              "",
              "            if (a < inMin) inMin = a",
              "            if (a > inMax) inMax = a",
              "",
              "            if (b.isNaN()) {",
              "                nanCount++",
              "                continue",
              "            }",
              "",
              "            if (b == Float.POSITIVE_INFINITY) {",
              "                positiveInfinityCount++",
              "                continue",
              "            }",
              "",
              "            if (b == Float.NEGATIVE_INFINITY) {",
              "                negativeInfinityCount++",
              "                continue",
              "            }",
              "",
              "            finiteCount++",
              "            outSum += b",
              "            outSum2 += b * b",
              "",
              "            if (b < outMin) outMin = b",
              "            if (b > outMax) outMax = b",
              "        }",
              "",
              "        val nonFinite =",
              "            nanCount +",
              "                positiveInfinityCount +",
              "                negativeInfinityCount",
              "",
              "        if (nonFinite > 0) {",
              "            val finiteMean =",
              "                if (finiteCount > 0) {",
              "                    outSum / finiteCount.toDouble()",
              "                } else {",
              "                    Double.NaN",
              "                }",
              "",
              "            throw IllegalStateException(",
              "                \"NAFNet classic GPU non-finite output (NaN=$nanCount, +Inf=$positiveInfinityCount, -Inf=$negativeInfinityCount, finite=$finiteCount/$ELEMENTS, finiteMin=$outMin, finiteMax=$outMax, finiteMean=$finiteMean)\"",
              "            )",
              "        }",
              "",
              "        val n = ELEMENTS.toDouble()",
              "",
              "        val inMean = inSum / n",
              "        val outMean = outSum / n",
              "",
              "        val inVar =",
              "            (inSum2 / n - inMean * inMean)",
              "                .coerceAtLeast(0.0)",
              "",
              "        val outVar =",
              "            (outSum2 / n - outMean * outMean)",
              "                .coerceAtLeast(0.0)",
              "",
              "        val inStd = sqrt(inVar)",
              "        val outStd = sqrt(outVar)",
              "",
              "        val inRange =",
              "            (inMax - inMin).toDouble()",
              "",
              "        val outRange =",
              "            (outMax - outMin).toDouble()",
              "",
              "        val collapsedRange =",
              "            inRange > 0.08 && outRange < 0.015",
              "",
              "        val collapsedStd =",
              "            inStd > 0.015 &&",
              "                outStd < 0.0025 &&",
              "                outStd < inStd * 0.08",
              "",
              "        val collapsedMean =",
              "            inMean > 0.045 && outMean < 0.0045",
              "",
              "        if (",
              "            collapsedRange ||",
              "                collapsedStd ||",
              "                collapsedMean",
              "        ) {",
              "            val message =",
              "                \"NAFNet classic GPU output collapsed \" +",
              "                    \"(in mean %.4f std %.4f range %.4f; out mean %.4f std %.4f range %.4f)\"",
              "",
              "            throw IllegalStateException(",
              "                message.format(",
              "                    inMean,",
              "                    inStd,",
              "                    inRange,",
              "                    outMean,",
              "                    outStd,",
              "                    outRange",
              "                )",
              "            )",
              "        }",
              "    }",
              "",
              "    private fun checkThread() {",
              "        check(Thread.currentThread().id == ownerThreadId) {",
              "            \"GPU delegate must run on its creation thread\"",
              "        }",
              "    }",
              "",
              "    override fun close() {",
              "        checkThread()",
              "",
              "        try {",
              "            interpreter.close()",
              "        } finally {",
              "            gpuDelegate.close()",
              "        }",
              "    }",
              "",
              "    companion object {",
              "        const val MODEL_NAME =",
              "            \"nafnet_sidd_width32_fp16.tflite\"",
              "",
              "        const val TILE = 256",
              "",
              "        const val ELEMENTS =",
              "            TILE * TILE * 3",
              "",
              "        const val BYTES =",
              "            ELEMENTS * 4",
              "",
              "        private fun loadModel(",
              "            context: Context",
              "        ): MappedByteBuffer {",
              "            context.assets",
              "                .openFd(MODEL_NAME)",
              "                .use { afd ->",
              "                    FileInputStream(",
              "                        afd.fileDescriptor",
              "                    ).channel.use { channel ->",
              "                        return channel.map(",
              "                            FileChannel.MapMode.READ_ONLY,",
              "                            afd.startOffset,",
              "                            afd.declaredLength",
              "                        )",
              "                    }",
              "                }",
              "        }",
              "    }",
              "}",
          ]

          runtime_file.write_text(
              "\n".join(runtime_lines) + "\n"
          )

          # =====================================================
          # NEURAL CONTROLLER
          # =====================================================

          neural = project / (
              "app/src/main/java/com/dennis/"
              "photomasterai/NeuralDenoiser.java"
          )

          if not neural.exists():
              raise RuntimeError(
                  "NeuralDenoiser.java not found"
              )

          s = neural.read_text()

          marker = (
              "    private static final int PLANE = TILE * TILE;"
          )

          if marker not in s:
              raise RuntimeError(
                  "PLANE constant not found"
              )

          guards = (
              marker
              + "\n\n"
              + "    // v0.4.4 neural performance guards.\n"
              + "    private static final long "
              + "MAX_SELF_TEST_MS = 12_000L;\n"
              + "    private static final long "
              + "MAX_TILE_MS = 8_000L;\n"
              + "    private static final long "
              + "MAX_TOTAL_NEURAL_MS = 75_000L;"
          )

          s = s.replace(
              marker,
              guards,
              1
          )

          # =====================================================
          # REMOVE STARTUP CPU FALLBACK
          # =====================================================

          start_marker = (
              "            try {\n"
              "                runtime = "
              "new NeuralDenoiserRuntime(context, false);"
          )

          end_marker = (
              "\n"
              "            int[] tilePixels = "
              "new int[PLANE];"
          )

          start = s.find(start_marker)

          if start < 0:
              raise RuntimeError(
                  "GPU startup fallback block start not found"
              )

          end = s.find(
              end_marker,
              start
          )

          if end < 0:
              raise RuntimeError(
                  "GPU startup fallback block end not found"
              )

          gpu_startup = (
              "            long selfTestStart = "
              "System.nanoTime();\n"
              "\n"
              "            runtime = "
              "new NeuralDenoiserRuntime(context, false);\n"
              "\n"
              "            runtime.selfTest();\n"
              "\n"
              "            accelerator = "
              "runtime.getAcceleratorLabel();\n"
              "\n"
              "            long selfTestMs = Math.max(\n"
              "                    1L,\n"
              "                    Math.round(\n"
              "                            "
              "(System.nanoTime() - selfTestStart)\n"
              "                                    "
              "/ 1_000_000.0));\n"
              "\n"
              "            if "
              "(selfTestMs > MAX_SELF_TEST_MS) {\n"
              "                throw "
              "new IllegalStateException(\n"
              "                        "
              "\"Classic GPU self-test exceeded "
              "performance guard: \"\n"
              "                                "
              "+ selfTestMs + \" ms\");\n"
              "            }\n"
          )

          s = (
              s[:start]
              + gpu_startup
              + s[end:]
          )

          # =====================================================
          # REMOVE PER-TILE CPU RETRY
          # =====================================================

          tile_start_marker = (
              "                    float[] restored;"
          )

          tile_end_marker = (
              "                    renderCentral("
          )

          start = s.find(
              tile_start_marker
          )

          if start < 0:
              raise RuntimeError(
                  "Per-tile fallback block start not found"
              )

          end = s.find(
              tile_end_marker,
              start
          )

          if end < 0:
              raise RuntimeError(
                  "Per-tile fallback block end not found"
              )

          gpu_tile = (
              "                    "
              "long elapsedBeforeTileMs = Math.max(\n"
              "                            1L,\n"
              "                            Math.round(\n"
              "                                    "
              "(System.nanoTime() - start)\n"
              "                                            "
              "/ 1_000_000.0));\n"
              "\n"
              "                    if "
              "(tiles > 0\n"
              "                            && "
              "elapsedBeforeTileMs "
              "> MAX_TOTAL_NEURAL_MS) {\n"
              "                        throw "
              "new IllegalStateException(\n"
              "                                "
              "\"Classic GPU neural pass exceeded "
              "total performance guard after \"\n"
              "                                        "
              "+ tiles + \" tiles: \"\n"
              "                                        "
              "+ elapsedBeforeTileMs + \" ms\");\n"
              "                    }\n"
              "\n"
              "                    long tileStart = "
              "System.nanoTime();\n"
              "\n"
              "                    float[] restored = "
              "runtime.run(input);\n"
              "\n"
              "                    long tileMs = Math.max(\n"
              "                            1L,\n"
              "                            Math.round(\n"
              "                                    "
              "(System.nanoTime() - tileStart)\n"
              "                                            "
              "/ 1_000_000.0));\n"
              "\n"
              "                    if "
              "(tileMs > MAX_TILE_MS) {\n"
              "                        throw "
              "new IllegalStateException(\n"
              "                                "
              "\"Classic GPU tile exceeded "
              "performance guard: \"\n"
              "                                        "
              "+ tileMs + \" ms\");\n"
              "                    }\n"
          )

          s = (
              s[:start]
              + gpu_tile
              + s[end:]
          )

          s = s.replace(
              "        boolean gpuFallback = false;\n",
              ""
          )

          s = s.replace(
              '                accelerator, '
              'gpuFallback ? '
              '" (GPU output sanity fallback)" : "",',
              '                accelerator, "",'
          )

          s = s.replace(
              "NAFNet-SIDD width32 / LiteRT 2.2",
              "NAFNet-SIDD width32 / classic OpenCL GPU"
          )

          if (
              "new NeuralDenoiserRuntime(context, true)"
              in s
          ):
              raise RuntimeError(
                  "CPU NAFNet fallback still present"
              )

          neural.write_text(s)

          # =====================================================
          # VERIFY SOURCE
          # =====================================================

          runtime_check = runtime_file.read_text()
          build_check = build_file.read_text()
          manifest_check = manifest_file.read_text()
          neural_check = neural.read_text()

          required_runtime = [
              "org.tensorflow.lite.Interpreter",
              "org.tensorflow.lite.gpu.GpuDelegate",
              "GpuDelegateFactory.Options",
              "GpuBackend.OPENCL",
              "setPrecisionLossAllowed(false)",
              "GPU delegate must run on its creation thread",
              "NAFNet classic GPU non-finite output",
          ]

          for item in required_runtime:
              if item not in runtime_check:
                  raise RuntimeError(
                      "Missing runtime component: "
                      + item
                  )

          required_build = [
              "litert:1.4.2",
              "litert-gpu:1.4.2",
              "litert-gpu-api:1.4.2",
          ]

          for item in required_build:
              if item not in build_check:
                  raise RuntimeError(
                      "Missing Gradle dependency: "
                      + item
                  )

          if "libOpenCL.so" not in manifest_check:
              raise RuntimeError(
                  "OpenCL manifest entry missing"
              )

          if (
              "new NeuralDenoiserRuntime(context, true)"
              in neural_check
          ):
              raise RuntimeError(
                  "Unsafe CPU neural fallback detected"
              )

          print(
              "Photo Master AI v0.4.4 patch applied"
          )

          print(
              "Classic LiteRT Interpreter enabled"
          )

          print(
              "OpenCL GPU forced"
          )

          print(
              "Precision loss disabled"
          )

          print(
              "CPU neural fallback disabled"
          )

          print(
              "NCHW validation retained"
          )

          print(
              "NaN and Infinity diagnostics retained"
          )

          print(
              "Performance guards retained"
          )
          PY

          grep -q \
            "versionCode 13" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "versionName '0.4.4'" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "litert-gpu-api:1.4.2" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "GpuBackend.OPENCL" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiserRuntime.kt"

          grep -q \
            "setPrecisionLossAllowed(false)" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiserRuntime.kt"

          grep -q \
            "MAX_TOTAL_NEURAL_MS = 75_000L" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          if grep -q \
            "new NeuralDenoiserRuntime(context, true)" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"
          then
            echo "::error::CPU NAFNet fallback still exists"
            exit 1
          fi

          echo "v0.4.4 source verification passed"

      - name: Fetch pinned NAFNet-SIDD model
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"

          ASSETS="$PROJECT/app/src/main/assets"

          MODEL="$ASSETS/nafnet_sidd_width32_fp16.tflite"

          mkdir -p "$ASSETS"

          URL='https://huggingface.co/litert-community/NAFNet-SIDD-width32-LiteRT/resolve/main/nafnet_sidd_width32_fp16.tflite?download=true'

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --output "$MODEL.tmp" \
            "$URL"

          mv "$MODEL.tmp" "$MODEL"

          test "$(stat -c%s "$MODEL")" -eq 62454048 || {
            echo "::error::Unexpected NAFNet model size"
            exit 1
          }

          echo \
          'f8fbaa422411683c53e802cf7cc7cf9be0a0de00886ad4af057232e26b172a0c  '"$MODEL" \
          | sha256sum -c -

          echo "Pinned NAFNet-SIDD model verified"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run restoration safety host checks
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf host-checks
          mkdir host-checks

          javac -d host-checks \
            app/src/main/java/com/dennis/photomasterai/DeepPixelRepair.java \
            app/src/main/java/com/dennis/photomasterai/RepairSafetyPolicy.java \
            app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java \
            app/src/main/java/com/dennis/photomasterai/SocialSourcePolicy.java \
            tools/DeepPixelRepairHostChecks.java \
            tools/RepairSafetyPolicyHostChecks.java \
            tools/NeuralDenoisePolicyHostChecks.java \
            tools/SocialSourcePolicyHostChecks.java

          java -cp host-checks \
            com.dennis.photomasterai.DeepPixelRepairHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.RepairSafetyPolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.NeuralDenoisePolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.SocialSourcePolicyHostChecks

      - name: Restore stable Photo Master debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photo-master-ai-debug-keystore-v1

      - name: Create signing key on first build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Photo Master AI,O=Dennis Photo Master,C=AU" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$SDK/cmdline-tools" -type f -name 'sdkmanager' \
                | sort -V \
                | tail -n 1
            )"
          fi

          test -n "$SDKMANAGER" || {
            echo "::error::sdkmanager not found"
            exit 1
          }

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build v0.4.4 APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:assembleDebug \
            --stacktrace

      - name: Verify package and collect APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "::error::APK not found"
            exit 1
          }

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          AAPT="$SDK/build-tools/35.0.0/aapt"

          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -q \
            "package: name='com.dennis.photomasterai'"

          echo "$BADGING" \
            | grep -q \
            "versionCode='13'"

          echo "$BADGING" \
            | grep -q \
            "versionName='0.4.4'"

          unzip -l "$APK" \
            | grep -q \
            'assets/nafnet_sidd_width32_fp16.tflite'

          rm -rf artifact
          mkdir artifact

          OUT="artifact/PhotoMasterAI-v0.4.4-CLASSIC-OPENCL-GPU.apk"

          cp "$APK" "$OUT"

          sha256sum "$OUT" \
            > "artifact/PhotoMasterAI-v0.4.4-CLASSIC-OPENCL-GPU-SHA256.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoMasterAI-v0.4.4-CLASSIC-OPENCL-GPU
          path: |
            artifact/PhotoMasterAI-v0.4.4-CLASSIC-OPENCL-GPU.apk
            artifact/PhotoMasterAI-v0.4.4-CLASSIC-OPENCL-GPU-SHA256.txt
          if-no-files-found: error
          retention-days: 30
