name: Build Photo Master AI v0.4.17 Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-photo-master-ai-v0.4.17-recovery.yml'

permissions:
  contents: read

jobs:
  build:
    name: Photo Master AI v0.4.17 Smooth Ring Calibration
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover exact successful v0.4.16 source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          V0416_COMMIT="ce53bdb2d4719db0a5aa2214f13e88a087481564"

          git cat-file -e "${V0416_COMMIT}^{commit}" || {
            echo "::error::Successful v0.4.16 commit unavailable"
            exit 1
          }

          git show \
            "${V0416_COMMIT}:.github/workflows/build-photo-master-ai-v0.4.16-recovery.yml" \
            > /tmp/v0416-recovery.yml

          python3 - <<'PY'
          from pathlib import Path

          lines = Path(
              "/tmp/v0416-recovery.yml"
          ).read_text().splitlines()

          def extract_step(name, destination):
              step = None

              for i, line in enumerate(lines):
                  if line.strip() == "- name: " + name:
                      step = i
                      break

              if step is None:
                  raise RuntimeError(
                      "Workflow step not found: " + name
                  )

              run = None

              for i in range(step, len(lines)):
                  if lines[i].strip() == "run: |":
                      run = i
                      break

                  if (
                      i > step
                      and lines[i].startswith("      - name:")
                  ):
                      break

              if run is None:
                  raise RuntimeError(
                      "Run block not found: " + name
                  )

              body = []

              for line in lines[run + 1:]:
                  if line.startswith("      - name:"):
                      break

                  if not line.strip():
                      body.append("")

                  elif line.startswith("          "):
                      body.append(line[10:])

                  else:
                      raise RuntimeError(
                          "Unexpected indentation while extracting: "
                          + name
                      )

              Path(destination).write_text(
                  "\n".join(body) + "\n"
              )

          extract_step(
              "Recover exact successful v0.4.15 source",
              "/tmp/recover-v0415-source.sh"
          )

          extract_step(
              "Apply v0.4.16 checkpoint fidelity guard",
              "/tmp/apply-v0416-checkpoint.sh"
          )

          print(
              "Extracted successful v0.4.16 source construction"
          )
          PY

          bash /tmp/recover-v0415-source.sh

          PROJECT="$(
            find photomaster-v044-build \
              -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -printf '%h\n' \
              | head -n 1
          )"

          test -n "$PROJECT" || {
            echo "::error::Recovered project not found"
            exit 1
          }

          export PROJECT

          bash /tmp/apply-v0416-checkpoint.sh

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

          grep -q \
            "versionCode 25" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "versionName '0.4.16'" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "SOFT_TOTAL_NEURAL_MS = 90_000L" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "MAX_TOTAL_NEURAL_MS = 240_000L" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "MAX_TILE_MS = 8_000L" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "Authoritative-original checkpoint: VERIFIED" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

          grep -q \
            "GpuBackend.OPENCL" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiserRuntime.kt"

          if grep -q \
            "new NeuralDenoiserRuntime(context, true)" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"
          then
            echo "::error::CPU neural fallback detected"
            exit 1
          fi

          echo "Exact successful v0.4.16 source recovered"

      - name: Apply v0.4.17 smooth ring calibration
        shell: bash
        env:
          PROJECT: ${{ steps.source.outputs.project }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os

          project = Path(os.environ["PROJECT"])

          # =====================================================
          # VERSION
          # =====================================================

          build_file = project / "app/build.gradle"
          build = build_file.read_text()

          if "versionCode 25" not in build:
              raise RuntimeError(
                  "v0.4.16 versionCode not found"
              )

          if "versionName '0.4.16'" not in build:
              raise RuntimeError(
                  "v0.4.16 versionName not found"
              )

          build = build.replace(
              "versionCode 25",
              "versionCode 26",
              1
          )

          build = build.replace(
              "versionName '0.4.16'",
              "versionName '0.4.17'",
              1
          )

          build_file.write_text(build)

          # =====================================================
          # INITIAL NEURAL QC
          #
          # Smooth scene ring allowance:
          # +0.015 -> +0.025
          #
          # Normal scenes remain +0.025.
          # 5% high-ring smooth blend cap remains unchanged.
          # =====================================================

          policy_file = project / (
              "app/src/main/java/com/dennis/"
              "photomasterai/NeuralDenoisePolicy.java"
          )

          policy = policy_file.read_text()

          old_policy = "\n".join([
              "        double ringingAllowance =",
              "                isSmoothSurfaceDecision(decision)",
              "                        ? 0.015",
              "                        : 0.025;",
          ])

          new_policy = "\n".join([
              "        double ringingAllowance =",
              "                isSmoothSurfaceDecision(decision)",
              "                        ? 0.025",
              "                        : 0.025;",
          ])

          if old_policy not in policy:
              raise RuntimeError(
                  "Smooth neural ring allowance anchor not found"
              )

          policy = policy.replace(
              old_policy,
              new_policy,
              1
          )

          policy_file.write_text(policy)

          # =====================================================
          # NEURAL REPORT TEXT
          # =====================================================

          neural_file = project / (
              "app/src/main/java/com/dennis/"
              "photomasterai/NeuralDenoiser.java"
          )

          neural = neural_file.read_text()

          old_report = (
              "Smooth-scene neural blend cap %.0f%% | "
              "ring allowance +0.015"
          )

          new_report = (
              "Smooth-scene neural blend cap %.0f%% | "
              "ring allowance +0.025"
          )

          if old_report not in neural:
              raise RuntimeError(
                  "Smooth neural report allowance not found"
              )

          neural = neural.replace(
              old_report,
              new_report,
              1
          )

          neural_file.write_text(neural)

          # =====================================================
          # POST-NEURAL CHECKPOINT
          #
          # Must use same +0.025 ring allowance as initial QC.
          # =====================================================

          engine_file = project / (
              "app/src/main/java/com/dennis/"
              "photomasterai/PhotoMasterEngine.java"
          )

          engine = engine_file.read_text()

          old_engine = "\n".join([
              "        p.postNeuralRingAllowance =",
              "                p.smoothSurfaceProtection",
              "                        ? 0.015",
              "                        : 0.025;",
          ])

          new_engine = "\n".join([
              "        p.postNeuralRingAllowance =",
              "                p.smoothSurfaceProtection",
              "                        ? 0.025",
              "                        : 0.025;",
          ])

          if old_engine not in engine:
              raise RuntimeError(
                  "Post-neural smooth ring allowance anchor not found"
              )

          engine = engine.replace(
              old_engine,
              new_engine,
              1
          )

          engine_file.write_text(engine)

          # =====================================================
          # REPLACE COMPLETE SMOOTH-SURFACE HOST CHECK
          #
          # Avoid fragile edits against reconstructed old source.
          #
          # Tests:
          # - Duck remains capped to 5%.
          # - Very clean ultra-low-detail can still be withheld.
          # - Person scenes remain uncapped.
          # - Detailed landscapes remain uncapped.
          # - Real duck-like +0.022 ring change ACCEPTED.
          # - +0.027 ring change REJECTED.
          # =====================================================

          host_file = project / (
              "tools/SmoothSurfaceGuardHostChecks.java"
          )

          host_file.write_text(
              "\n".join([
                  "package com.dennis.photomasterai;",
                  "",
                  "public final class SmoothSurfaceGuardHostChecks {",
                  "",
                  "    public static void main(String[] args) {",
                  "",
                  "        NeuralDenoisePolicy.Decision duckBase =",
                  "                NeuralDenoisePolicy.decide(",
                  "                        0.0145,",
                  "                        0.0260,",
                  "                        0.0142,",
                  "                        12_000_000L,",
                  "                        true,",
                  "                        false,",
                  "                        false,",
                  "                        false);",
                  "",
                  "        NeuralDenoisePolicy.Decision duck =",
                  "                NeuralDenoisePolicy.applySmoothSurfaceGuard(",
                  "                        duckBase,",
                  "                        0.0145,",
                  "                        0.0260,",
                  "                        0.0142,",
                  "                        0.731,",
                  "                        0.68,",
                  "                        0.00,",
                  "                        true,",
                  "                        false,",
                  "                        false,",
                  "                        false);",
                  "",
                  "        require(",
                  "                duck.active,",
                  "                \"duck guard unexpectedly disabled neural\");",
                  "",
                  "        require(",
                  "                duck.blend <= 0.0500001,",
                  "                \"high-ring duck was not capped at 5%\");",
                  "",
                  "        require(",
                  "                NeuralDenoisePolicy.isSmoothSurfaceDecision(duck),",
                  "                \"duck smooth-surface decision not tagged\");",
                  "",
                  "        NeuralDenoisePolicy.Decision cleanBase =",
                  "                NeuralDenoisePolicy.decide(",
                  "                        0.0138,",
                  "                        0.0218,",
                  "                        0.0070,",
                  "                        12_000_000L,",
                  "                        true,",
                  "                        false,",
                  "                        false,",
                  "                        false);",
                  "",
                  "        NeuralDenoisePolicy.Decision clean =",
                  "                NeuralDenoisePolicy.applySmoothSurfaceGuard(",
                  "                        cleanBase,",
                  "                        0.0138,",
                  "                        0.0218,",
                  "                        0.0070,",
                  "                        0.40,",
                  "                        0.62,",
                  "                        0.00,",
                  "                        true,",
                  "                        false,",
                  "                        false,",
                  "                        false);",
                  "",
                  "        if (cleanBase.active) {",
                  "            require(",
                  "                    !clean.active,",
                  "                    \"already-clean extremely-low-detail scene should be withheld\");",
                  "        }",
                  "",
                  "        NeuralDenoisePolicy.Decision portraitBase =",
                  "                NeuralDenoisePolicy.decide(",
                  "                        0.017,",
                  "                        0.027,",
                  "                        0.018,",
                  "                        12_000_000L,",
                  "                        true,",
                  "                        true,",
                  "                        false,",
                  "                        false);",
                  "",
                  "        NeuralDenoisePolicy.Decision portrait =",
                  "                NeuralDenoisePolicy.applySmoothSurfaceGuard(",
                  "                        portraitBase,",
                  "                        0.017,",
                  "                        0.027,",
                  "                        0.018,",
                  "                        0.60,",
                  "                        0.58,",
                  "                        0.00,",
                  "                        false,",
                  "                        false,",
                  "                        true,",
                  "                        false);",
                  "",
                  "        require(",
                  "                Math.abs(",
                  "                        portrait.blend",
                  "                                - portraitBase.blend)",
                  "                        < 1.0e-9,",
                  "                \"person scene was incorrectly smooth-surface capped\");",
                  "",
                  "        NeuralDenoisePolicy.Decision landscapeBase =",
                  "                NeuralDenoisePolicy.decide(",
                  "                        0.017,",
                  "                        0.028,",
                  "                        0.090,",
                  "                        12_000_000L,",
                  "                        true,",
                  "                        false,",
                  "                        false,",
                  "                        false);",
                  "",
                  "        NeuralDenoisePolicy.Decision landscape =",
                  "                NeuralDenoisePolicy.applySmoothSurfaceGuard(",
                  "                        landscapeBase,",
                  "                        0.017,",
                  "                        0.028,",
                  "                        0.090,",
                  "                        0.30,",
                  "                        0.55,",
                  "                        0.00,",
                  "                        false,",
                  "                        true,",
                  "                        false,",
                  "                        false);",
                  "",
                  "        require(",
                  "                Math.abs(",
                  "                        landscape.blend",
                  "                                - landscapeBase.blend)",
                  "                        < 1.0e-9,",
                  "                \"detailed landscape was incorrectly smooth-surface capped\");",
                  "",
                  "        NeuralDenoisePolicy.Quality withinBudget =",
                  "                NeuralDenoisePolicy.evaluate(",
                  "                        0.0145,",
                  "                        0.0260,",
                  "                        0.0142,",
                  "                        0.731,",
                  "                        0.68,",
                  "                        0.57,",
                  "                        0.06,",
                  "                        0.0,",
                  "                        0.0,",
                  "                        0.0124,",
                  "                        0.0233,",
                  "                        0.0136,",
                  "                        0.753,",
                  "                        0.6761,",
                  "                        0.57,",
                  "                        0.0587,",
                  "                        0.0,",
                  "                        0.0,",
                  "                        duck);",
                  "",
                  "        require(",
                  "                withinBudget.accepted,",
                  "                \"+0.022 duck calibration candidate was not accepted\");",
                  "",
                  "        NeuralDenoisePolicy.Quality outsideBudget =",
                  "                NeuralDenoisePolicy.evaluate(",
                  "                        0.0145,",
                  "                        0.0260,",
                  "                        0.0142,",
                  "                        0.731,",
                  "                        0.68,",
                  "                        0.57,",
                  "                        0.06,",
                  "                        0.0,",
                  "                        0.0,",
                  "                        0.0124,",
                  "                        0.0233,",
                  "                        0.0136,",
                  "                        0.758,",
                  "                        0.6761,",
                  "                        0.57,",
                  "                        0.0587,",
                  "                        0.0,",
                  "                        0.0,",
                  "                        duck);",
                  "",
                  "        require(",
                  "                !outsideBudget.accepted,",
                  "                \"+0.027 smooth ringing candidate was not rejected\");",
                  "",
                  "        require(",
                  "                outsideBudget.reason.contains(\"ringing\"),",
                  "                \"smooth-surface ring rejection reason missing\");",
                  "",
                  "        System.out.println(",
                  "                \"SmoothSurfaceGuardHostChecks PASSED\");",
                  "    }",
                  "",
                  "    private static void require(",
                  "            boolean condition,",
                  "            String message) {",
                  "",
                  "        if (!condition) {",
                  "            throw new AssertionError(message);",
                  "        }",
                  "    }",
                  "}",
                  "",
              ])
          )

          print(
              "v0.4.17 smooth ring calibration applied"
          )

          print(
              "Smooth neural QC allowance: +0.025"
          )

          print(
              "Smooth post-neural allowance: +0.025"
          )

          print(
              "5% high-ring blend cap unchanged"
          )

          print(
              "Host test: +0.022 ACCEPT / +0.027 REJECT"
          )

          print(
              "Runtime/checkpoint architecture unchanged"
          )
          PY

          grep -q \
            "versionCode 26" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "versionName '0.4.17'" \
            "$PROJECT/app/build.gradle"

          grep -q \
            "? 0.025" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java"

          grep -q \
            "ring allowance +0.025" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "? 0.025" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/PhotoMasterEngine.java"

          grep -q \
            "0.753" \
            "$PROJECT/tools/SmoothSurfaceGuardHostChecks.java"

          grep -q \
            "0.758" \
            "$PROJECT/tools/SmoothSurfaceGuardHostChecks.java"

          grep -q \
            "duck calibration candidate was not accepted" \
            "$PROJECT/tools/SmoothSurfaceGuardHostChecks.java"

          grep -q \
            "SOFT_TOTAL_NEURAL_MS = 90_000L" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "MAX_TOTAL_NEURAL_MS = 240_000L" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "MAX_TILE_MS = 8_000L" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"

          grep -q \
            "high-ring-risk 5% blend cap" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java"

          grep -q \
            "Authoritative-original checkpoint: VERIFIED" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/MainActivity.java"

          grep -q \
            "GpuBackend.OPENCL" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiserRuntime.kt"

          if grep -q \
            "new NeuralDenoiserRuntime(context, true)" \
            "$PROJECT/app/src/main/java/com/dennis/photomasterai/NeuralDenoiser.java"
          then
            echo "::error::CPU neural fallback detected"
            exit 1
          fi

          echo "v0.4.17 source verification passed"

      - name: Fetch pinned NAFNet-SIDD model
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"
          ASSETS="$PROJECT/app/src/main/assets"
          MODEL="$ASSETS/nafnet_sidd_width32_fp16.tflite"

          mkdir -p "$ASSETS"

          URL='https://huggingface.co/litert-community/NAFNet-SIDD-width32-LiteRT/resolve/main/nafnet_sidd_width32_fp16.tflite?download=true'

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --output "$MODEL.tmp" \
            "$URL"

          mv "$MODEL.tmp" "$MODEL"

          test "$(stat -c%s "$MODEL")" -eq 62454048 || {
            echo "::error::Unexpected NAFNet model size"
            exit 1
          }

          echo \
          'f8fbaa422411683c53e802cf7cc7cf9be0a0de00886ad4af057232e26b172a0c  '"$MODEL" \
          | sha256sum -c -

          echo "Pinned NAFNet-SIDD model verified"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run all safety host checks
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf host-checks
          mkdir host-checks

          javac -d host-checks \
            app/src/main/java/com/dennis/photomasterai/DeepPixelRepair.java \
            app/src/main/java/com/dennis/photomasterai/RepairSafetyPolicy.java \
            app/src/main/java/com/dennis/photomasterai/NeuralDenoisePolicy.java \
            app/src/main/java/com/dennis/photomasterai/SocialSourcePolicy.java \
            tools/DeepPixelRepairHostChecks.java \
            tools/RepairSafetyPolicyHostChecks.java \
            tools/NeuralDenoisePolicyHostChecks.java \
            tools/SocialSourcePolicyHostChecks.java \
            tools/SmoothSurfaceGuardHostChecks.java

          java -cp host-checks \
            com.dennis.photomasterai.DeepPixelRepairHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.RepairSafetyPolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.NeuralDenoisePolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.SocialSourcePolicyHostChecks

          java -cp host-checks \
            com.dennis.photomasterai.SmoothSurfaceGuardHostChecks

      - name: Restore stable Photo Master debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: photo-master-ai-debug-keystore-v1

      - name: Create signing key on first build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Photo Master AI,O=Dennis Photo Master,C=AU" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$SDK/cmdline-tools" \
                -type f \
                -name 'sdkmanager' \
                | sort -V \
                | tail -n 1
            )"
          fi

          test -n "$SDKMANAGER" || {
            echo "::error::sdkmanager not found"
            exit 1
          }

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build v0.4.17 APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:assembleDebug \
            --stacktrace

      - name: Verify package and prepare artifact
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "::error::APK not found"
            exit 1
          }

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK/build-tools/35.0.0/aapt"

          BADGING="$(
            "$AAPT" dump badging "$APK" \
              | head -n 1
          )"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -q "package: name='com.dennis.photomasterai'"

          echo "$BADGING" \
            | grep -q "versionCode='26'"

          echo "$BADGING" \
            | grep -q "versionName='0.4.17'"

          unzip -l "$APK" \
            | grep -q 'assets/nafnet_sidd_width32_fp16.tflite'

          rm -rf artifact
          mkdir artifact

          OUT="artifact/PhotoMasterAI-v0.4.17-SMOOTH-RING-CALIBRATION.apk"

          cp "$APK" "$OUT"

          sha256sum "$OUT" \
            > "artifact/PhotoMasterAI-v0.4.17-SMOOTH-RING-CALIBRATION-SHA256.txt"

          cat > "artifact/PhotoMasterAI-v0.4.17-Notes.txt" <<EOF
          Photo Master AI — v0.4.17 Continuation Notes

          Version:
          v0.4.17

          versionCode:
          26

          BASELINE
          Exact successful v0.4.16 source.
          Commit:
          ce53bdb2d4719db0a5aa2214f13e88a087481564

          PURPOSE
          Final smooth-scene neural ringing calibration.

          VERIFIED v0.4.16 DUCK RESULT
          - NAFNet-SIDD width32
          - OpenCL / FP32
          - 252 tiles
